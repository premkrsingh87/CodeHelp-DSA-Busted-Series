/* ─────────── CALENDAR ─────────── */
/* The publishing schedule of the whole niche, month by month. Every other view
   answers "which video", this one answers "which DAY" — when the niche floods,
   when it goes quiet, and which dates actually earned their uploads. Pick a day
   and it drills straight into that day's uploads, or hands the whole app that
   date as its range. */
/* The day panel shows board cards, so it gets the board's own sort and size
   controls — but on its own state, not the board's. Two reasons. Sorting a
   single day is a different question from sorting the whole shelf ("Newest"
   across one day is a timeline; across six months it is a different view
   entirely), and reaching into S.filters.boardSort from here would silently
   re-sort the Thumbnail Board the next time it was opened.

   Size INHERITS from the board until the calendar is given one of its own, which
   is exactly how this panel already behaved — it read S.filters.boardSize
   directly — so nothing moves for anyone who never touches these buttons. */
/* The range at the top is the master control, and the calendar was ignoring it:
   asking the app for six months and getting a three-month grid meant three
   months of uploads simply were not on screen, with nothing to say so. The
   window now FOLLOWS the range — six months of range draws six months of
   calendar — and the window buttons still narrow it, with that choice remembered
   against the range it was made for. Switch range and the calendar re-fits;
   switch back and your narrower window is still there.

   calMonthsFor is empty on every profile that predates this, which reads as
   "never picked one" and therefore auto-fits — which is the behaviour anyone
   hitting this wanted in the first place. */
const RANGE_MONTHS = {'1':1,'3':1,'7':1,'30':1,'90':3,'180':6,'365':12,'all':12};
const rangeSig = () => S.range==='custom'
  ? 'custom:'+(CFG.rangeFrom||'')+':'+(CFG.rangeTo||'') : String(S.range);
/* Which button lights up: the range's own length, so the calendar and the bar at
   the top always read the same. */
function calFitSel(){
  if(S.range!=='custom') return RANGE_MONTHS[S.range] || 3;
  const {from,to} = rangeBounds('custom');
  const a = new Date(from || Date.now());
  const b = new Date(isFinite(to) ? to : Date.now());
  const span = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + 1;
  return CAL_WINDOWS.map(w=>w[0]).find(n=>n>=span) || 12;
}
const calWindowSel = () =>
  CFG.calMonthsFor===rangeSig() ? (CFG.calMonths || calFitSel()) : calFitSel();
/* How many months of grid to actually draw. Months, unlike ranges, do not divide
   evenly: 180 days back from today lands in the middle of a month, so a six-month
   range genuinely covers seven calendar months and drawing only six clips the
   oldest one — the same "my uploads are not on the calendar" bug in miniature.
   An auto-fitted window therefore stretches to cover every month the range
   reaches. A window you picked by hand means exactly what you picked. */
function calDataSpan(idx){
  if(!idx || !idx.size) return 1;
  const keys=[...idx.keys()].sort();
  const a=keys[0], b=keys[keys.length-1];
  return (+b.slice(0,4)-+a.slice(0,4))*12 + (+b.slice(5,7)-+a.slice(5,7)) + 1;
}
/* No ceiling on the auto fit. Lifetime means lifetime: capping it at twelve
   months was the same silent truncation, just further out — a profile with two
   years of scraped history simply lost the older half with nothing on screen to
   say so. The grid only ever spans as far as there is data, the empty tail is
   trimmed below, and anyone who finds a long calendar unwieldy has four window
   buttons that mean exactly what they say. */
const calGridMonths = (idx, sel) =>
  CFG.calMonthsFor===rangeSig() ? sel : Math.max(sel, calDataSpan(idx));
const calSortKey = () => S.filters.calSort || 'outlier';
const calSizeKey = () => S.filters.calSize || S.filters.boardSize || BOARD_DEFAULT_SIZE;
const CAL_WINDOWS = [[1,'1 month'],[3,'3 months'],[6,'6 months'],[12,'12 months']];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayTs = k => +new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10));
function vCalendar(){
  if(!CFG.ytKey) return setupCard();
  const idx = calendarIndex();
  const M = calMetric();
  const winSel = calWindowSel();
  const months = calGridMonths(idx, winSel);
  /* The summary is a function of what is ON SCREEN, so it is built after the
     window is known rather than before it. Reading the whole index here was the
     bug: narrowing to one month left the chips describing days from months you
     could no longer see — and clicking one selected a day that was not in the
     grid. It also never moved when you changed metric, which made the entire
     control row look dead. */
  const controls = headline => `
  <div class="panel" style="margin-bottom:14px"><div class="pad row wrapf" style="gap:10px">
    <div class="seg plain">${CAL_WINDOWS.map(([n,l])=>
      `<button class="${winSel===n?'on':''}" data-calmonths="${n}">${l}</button>`).join('')}</div>
    <div class="seg plain">${CAL_METRICS.map(m=>
      `<button class="${M.k===m.k?'on':''}" data-calmetric="${m.k}" title="Show ${m.word} on every day">${m.l}</button>`).join('')}</div>
    <div class="grow"></div>
    ${headline}
  </div></div>`;

  if(!idx.size) return controls('') + `<div class="panel"><div class="pad">${emptyState('cal',
    'No uploads land in this range','Widen the date range above, clear the channel filter, or run a sync. The calendar only ever shows what the rest of the app is showing.')}</div></div>`;

  const keys = [...idx.keys()].sort();
  const newest = keys[keys.length-1];
  const anchor = new Date(+newest.slice(0,4), +newest.slice(5,7)-1, 1);
  const grid = [];
  for(let i=0;i<months;i++) grid.push(new Date(anchor.getFullYear(), anchor.getMonth()-i, 1));
  /* Drop empty months off the far end. A 12-month window on a profile holding
     two months of uploads used to draw ten blank grids, which reads as broken
     rather than as "there is nothing there". Only the tail is trimmed: a quiet
     month BETWEEN two busy ones is the signal this whole view exists to show. */
  const withData = new Set([...idx.keys()].map(k=>k.slice(0,7)));
  const moKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  while(grid.length>1 && !withData.has(moKey(grid[grid.length-1]))) grid.pop();

  /* Colour scale spans only the months actually on screen, so narrowing to one
     month re-reads that month at full contrast instead of against a year's peak. */
  const lo = +new Date(grid[grid.length-1].getFullYear(), grid[grid.length-1].getMonth(), 1);
  const hi = +new Date(anchor.getFullYear(), anchor.getMonth()+1, 0, 23, 59, 59);
  const win = [];
  idx.forEach(d=>{ const t = dayTs(d.k); if(t>=lo && t<=hi) win.push(d); });
  const max = Math.max(...win.map(d=>M.get(d)||0), 1);
  const todayK = dayKey(Date.now());

  /* Order matters here. Clicking a day is the whole point of the view, so what
     that day published sits immediately under the grid you clicked in — not
     three analysis panels further down where you have to go looking for it. The
     analysis describes the whole window rather than the selected day, so it
     reads perfectly well underneath. */
  return `${controls(calHeadline(win, M))}
  <div class="calgrid" style="margin-bottom:14px">
    ${grid.map(mo=>calMonth(mo, idx, M, max, todayK)).join('')}
  </div>
  ${calDayPanel(idx)}
  ${calWeekdayStrip(win)}
  ${calInsights(win, months)}`;
}
/* ─── What the schedule is actually telling you to publish ───
   The grid above answers "when did they post". These three answer "so what",
   which is the only reason to look at a publishing calendar at all:

     SATURATION  does a day the whole niche floods perform worse than a quiet
                 one? This is the single most actionable thing in the view — if
                 crowded days underperform, the calendar just told you which
                 dates to aim at.
     VOLUME      week-by-week output across the months shown, so you can see the
                 niche accelerating or going off the boil before the numbers do.
     WINDOWS     the best weekday-and-hour pockets by median outlier, which is
                 the resolution you actually schedule an upload at.

   All three read the day index that is already built and memoised for the grid,
   so the whole block costs one pass over the days on screen. */
function calInsights(win, months){
  if(win.length < 10) return '';
  const vids = [];
  for(const d of win) vids.push(...d.vids);
  if(vids.length < 40) return '';

  // ── saturation: group DAYS by how many uploads landed on them ──
  const BANDS = [[1,2,'1–2 uploads'],[3,5,'3–5'],[6,9,'6–9'],[10,14,'10–14'],[15,Infinity,'15+']];
  const bands = BANDS.map(([lo,hi,label])=>{
    const days = win.filter(d=>d.n>=lo && d.n<=hi);
    const outs = days.flatMap(d=>d.outs);
    return {label, days:days.length, videos:outs.length,
      med: outs.length? +median(outs).toFixed(2) : 0,
      medViews: days.length? Math.round(median(days.flatMap(d=>d.vids.map(v=>v.views)))) : 0};
  }).filter(b=>b.days>=2 && b.videos>=5);
  let verdict = '';
  if(bands.length>=2){
    const best = bands.reduce((a,b)=>b.med>a.med?b:a);
    const worst = bands.reduce((a,b)=>b.med<a.med?b:a);
    const spread = worst.med? best.med/worst.med : 1;
    verdict = spread>=1.25
      ? `Days with <b style="color:var(--t1)">${esc(best.label)}</b> outperform <b style="color:var(--t1)">${esc(worst.label)}</b> days by ${spread.toFixed(2)}× on median outlier. Aim at that band.`
      : `Upload volume on a day barely moves performance here (${spread.toFixed(2)}× spread) — <b style="color:var(--t1)">what you publish matters more than when</b> in this niche.`;
  }

  /* Buckets follow the window. Weeks are the right grain for one to four
     months; past that a 14-week cap meant the 6- and 12-month views drew the
     identical chart, so a long window silently told you nothing new. */
  const byMonth = months >= 6;
  const weeks = new Map();
  for(const d of win){
    let wk;
    if(byMonth) wk = d.k.slice(0,7)+'-01';
    else { const dt = new Date(dayTs(d.k)); dt.setDate(dt.getDate()-dt.getDay()); wk = dayKey(+dt); }
    let e = weeks.get(wk);
    if(!e){ e={wk, n:0, outs:[]}; weeks.set(wk,e); }
    e.n += d.n; e.outs.push(...d.outs);
  }
  const wl = [...weeks.values()].sort((a,b)=> a.wk<b.wk?-1:1).slice(byMonth? -12 : -14);
  const half = Math.floor(wl.length/2);
  const early = wl.slice(0,half).reduce((a,w)=>a+w.n,0)/Math.max(1,half);
  const late  = wl.slice(half).reduce((a,w)=>a+w.n,0)/Math.max(1,wl.length-half);
  const trend = early? late/early : 1;

  // ── best weekday+hour pockets ──
  const cells = new Map();
  for(const v of vids){
    const k = v.pubDow+'|'+v.pubHour;
    let e = cells.get(k);
    if(!e){ e={dow:v.pubDow, hour:v.pubHour, outs:[], views:[]}; cells.set(k,e); }
    e.outs.push(v.outlier); e.views.push(v.views);
  }
  /* The floor scales with how much data is in the window. A fixed "4 uploads"
     let a single lucky cell out of 168 top the table at 10x on a catalogue where
     the average cell holds fifty — which is advice, confidently given, from
     noise. Roughly a third of an average cell, never below four. */
  const minN = Math.max(4, Math.round(vids.length/168/3));
  const pockets = [...cells.values()].filter(c=>c.outs.length>=minN)
    .map(c=>({...c, med:+median(c.outs).toFixed(2), medViews:Math.round(median(c.views)), n:c.outs.length}))
    .sort((a,b)=>b.med-a.med).slice(0,6);
  const overall = median(vids.map(v=>v.outlier))||1;

  return `<div class="grid2" style="margin-bottom:14px">
    <div class="panel"><div class="phead">${ic('layers')}Does a crowded day hurt?
      <span class="right dim" style="font-size:var(--f-2xs);font-weight:600">days grouped by how many uploads landed on them</span></div>
      ${bands.length<2? `<div class="pad">${emptyState('layers','Not enough days yet','Widen the month window and this fills in.')}</div>`
      : `<div class="pad">
        ${barList(bands.map(b=>({label:b.label, value:b.med,
          sub:`${b.days} day${b.days===1?'':'s'} · ${nfull(b.videos)} videos · ${nf(b.medViews)} median views`})),
          {fmt:n=>n.toFixed(2)+'×'})}
        ${verdict?`<div class="dim" style="font-size:var(--f-xs);line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">${verdict}</div>`:''}
      </div>`}
    </div>
    <div class="panel"><div class="phead">${ic('chart')}Niche output, ${byMonth?'month by month':'week by week'}
      <span class="right">${trend>=1.2? '<span class="badge b-ok">▲ speeding up</span>'
        : trend<=0.8? '<span class="badge b-err">▼ slowing down</span>' : '<span class="badge b-grey">— steady</span>'}</span></div>
      <div class="pad">
        ${barList(wl.map(w=>({label:(byMonth?FMT.mon:FMT.dmy).format(new Date(dayTs(w.wk))), value:w.n,
          sub:w.outs.length? `median ${median(w.outs).toFixed(2)}× outlier` : ''})), {fmt:nfull})}
        <div class="dim" style="font-size:var(--f-xs);line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
          ${byMonth?'Calendar month':'Week beginning'}, oldest first. The niche is publishing
          <b style="color:var(--t1)">${trend.toFixed(2)}×</b> as much now as it was at the start of this window${
          trend>=1.3? ' — competition is climbing, so packaging has to work harder' : trend<=0.75? ' — output is thinning out, which is when a consistent uploader takes share' : ''}.
        </div>
      </div>
    </div>
  </div>
  ${pockets.length? `<div class="panel" style="margin-bottom:14px">
    <div class="phead">${ic('clock')}Best publishing windows
      <span class="right dim" style="font-size:var(--f-2xs);font-weight:600">weekday + hour, local time · ${minN}+ uploads each</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Window</th><th class="num">Median outlier</th>
      <th class="num">vs niche median</th><th class="num">Median views</th><th class="num">Uploads</th></tr></thead><tbody>
      ${pockets.map(c=>{ const lift = c.med/overall;
        return `<tr><td><b style="font-size:var(--f-sm)">${DOW_SHORT[c.dow]} ${String(c.hour).padStart(2,'0')}:00</b>
          <div class="dim" style="font-size:var(--f-2xs)">${String(c.hour).padStart(2,'0')}:00–${String((c.hour+1)%24).padStart(2,'0')}:00</div></td>
        <td class="num"><span class="badge ${c.med>=2?'b-ok':c.med>=1.2?'b-acc':'b-grey'}">${c.med}×</span></td>
        <td class="num ${lift>=1.2?'':'dim'}" style="${lift>=1.2?'color:var(--ok);font-weight:700':''}">${lift.toFixed(2)}×</td>
        <td class="num">${nf(c.medViews)}</td>
        <td class="num dim">${c.n}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="pad dim" style="font-size:var(--f-xs);line-height:1.6;border-top:1px solid var(--line)">
      These are the hours your competitors' uploads did best in, not the hours they upload most — the
      <b style="color:var(--t1)">Analytics</b> view has the full 7×24 grid behind this.
    </div>
  </div>`:''}`;
}
/* Ranks only the days in the visible window, by the metric you actually picked,
   so both chips always point at a day you can see and both move the moment you
   change either control. */
function calHeadline(win, M){
  if(!win.length) return '';
  let top=null, best=null;
  const allOut=[];
  for(const d of win){
    if(!top || M.get(d) > M.get(top)) top = d;
    allOut.push(...d.outs);
    if(d.n>=2 && (!best || d.med>best.med)) best = d;
  }
  const overall = median(allOut)||1;
  const fmtK = k => FMT.dmy.format(new Date(dayTs(k)));
  const sameDay = top && best && top.k===best.k;
  return `<span class="row wrapf" style="gap:7px;justify-content:flex-end">
    ${top? `<button class="chip" data-calday="${top.k}"
      title="Highest ${esc(M.word)} of the ${win.length} active days on screen — click to open it">
      ${M.top} <b>${fmtK(top.k)}</b> · ${M.fmt(M.get(top))} ${esc(M.word)}</button>`:''}
    ${best && !sameDay? `<button class="chip on" data-calday="${best.k}"
      title="Highest median outlier of any day on screen with 2+ uploads — click to open it">
      Best day <b>${fmtK(best.k)}</b> · ${(best.med/overall).toFixed(2)}× median</button>`:''}
  </span>`;

function calMonth(mo, idx, M, max, todayK){
  const y = mo.getFullYear(), mi = mo.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const firstDow = new Date(y, mi, 1).getDay();
  const nDays = new Date(y, mi+1, 0).getDate();
  let total=0, views=0;
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<span class="calday void"></span>');
  for(let dd=1; dd<=nDays; dd++){
    const k = `${y}-${pad(mi+1)}-${pad(dd)}`;
    const d = idx.get(k);
    const isToday = k===todayK;
    if(!d){
      cells.push(`<span class="calday void ${isToday?'today':''}"><span class="dn">${dd}</span></span>`);
      continue;
    }
    total += d.n; views += d.views;
    const val = M.get(d)||0;
    /* Capped at 88%, not 100%: the tile is mixed with --panel3, which is dark in
       one theme and light in the other, so the ramp has to stop where var(--t1)
       still clears 5:1 against it on BOTH. Colour is left to CSS entirely —
       the theme button flips data-theme without re-rendering, and anything this
       function decided about text colour would be stale the moment you used it. */
    const a = clamp(val/max, .14, .88);

    cells.push(`<button class="calday has ${on?'on':''} ${isToday?'today':''}" data-calday="${k}"
      style="background:color-mix(in srgb, var(--heat) ${(a*100).toFixed(0)}%, var(--panel3))"
      title="${esc(FMT.full.format(new Date(dayTs(k))))} — ${d.n} upload${d.n===1?'':'s'} from ${d.chans} channel${d.chans===1?'':'s'} · ${nfull(d.views)} combined views · ${nf(d.medViews)} median · ${d.med}× median outlier">
      <span class="dn">${dd}</span><span class="dv">${M.fmt(val)}</span></button>`);

  return `<div class="calmonth ${total?'':'blank'}">
    <div class="calhead">${ic('cal')}<span class="grow">${esc(FMT.mon.format(mo))}</span>
      <span class="dim" style="font-weight:600;font-size:var(--f-2xs)">${total? `${nfull(total)} upload${total===1?'':'s'} · ${nf(views)} views` : 'no uploads'}</span></div>

/* Which weekday actually earns its uploads — the same question the upload clock
   answers for hours, at the resolution you schedule at. */
function calWeekdayStrip(days){
  if(days.length<7) return '';
  const buckets = DOW_SHORT.map(()=>({n:0, views:0, outs:[]}));
  for(const d of days){
    const b = buckets[new Date(dayTs(d.k)).getDay()];
    b.n += d.n; b.views += d.views; b.outs.push(...d.outs);
  }
  const active = buckets.filter(b=>b.n>0);
  if(active.length<3) return '';
  const meds = buckets.map(b=>b.outs.length? median(b.outs) : 0);
  const bestMed = Math.max(...meds);
  return `<div class="panel" style="margin-bottom:14px">
    <div class="phead">${ic('chart')}Which weekday performs
      <span class="right dim" style="font-size:var(--f-2xs);font-weight:600">median outlier · uploads · median views, across the months shown</span></div>
    <div class="pad"><div class="dowbar">
      ${buckets.map((b,i)=>`<div class="dowcell ${b.n&&meds[i]===bestMed?'best':''}">
        <div class="k">${DOW_SHORT[i]}</div>
        <div class="v">${b.n? meds[i].toFixed(2)+'×' : '—'}</div>
        <div class="s">${b.n? `${nfull(b.n)} up · ${nf(Math.round(b.views/Math.max(1,b.n)))}` : 'none'}</div>

/* A five-week strip of the same day index, for the dashboard. Cheap: the index
   is already built and memoised for the Calendar view. */
function miniCalStrip(){
  const idx = calendarIndex();
  const M = calMetric();
  const start = new Date(); start.setHours(0,0,0,0);
  const cells=[]; let max=1, any=0;
  const days=[];
  for(let i=34;i>=0;i--){
    const dt = new Date(+start - i*864e5);
    const k = dayKey(+dt);
    const d = idx.get(k);
    if(d){ max = Math.max(max, M.get(d)||0); any++; }
    days.push({dt,k,d});
  }
  if(!any) return `<div class="pad">${emptyState('cal','No uploads in the last five weeks','Widen the range or run a sync.')}</div>`;
  const todayK = dayKey(Date.now());
  for(const {dt,k,d} of days){
    if(!d){ cells.push(`<span class="calday void ${k===todayK?'today':''}"><span class="dn">${dt.getDate()}</span></span>`); continue; }
    const val = M.get(d)||0;
    const a = clamp(val/max, .14, .88);
    cells.push(`<button class="calday has ${k===todayK?'today':''}" data-calopen="${k}"
      style="background:color-mix(in srgb, var(--heat) ${(a*100).toFixed(0)}%, var(--panel3))"
      title="${esc(FMT.full.format(dt))} — ${d.n} upload${d.n===1?'':'s'} · ${nfull(d.views)} views · ${d.med}× median outlier">
      <span class="dn">${dt.getDate()}</span><span class="dv">${M.fmt(val)}</span></button>`);
  }
  return `<div class="pad"><div class="calbody" style="padding:0">
    ${DOW_SHORT.map(d=>`<span class="caldow">${d}</span>`).join('')}
    ${cells.join('')}
  </div>
  <div class="dim" style="font-size:var(--f-2xs);margin-top:9px">Last five weeks · number and shade = ${esc(M.word)} · click a day to open it in the calendar.</div></div>`;
}

/* ─────────── SWIPE FILE ─────────── */
const SWIPE_SORTS = [['saved','Recently starred'],['outlier','Outlier'],['views','Views'],
  ['published','Published'],['channel','Channel'],['notes','Has a note']];
const SWIPE_VIEWS = [['notes','Notes','note'],['rows','Rows','menu'],['thumbs','Thumbnails','photo']];
/* ── CATEGORIES ──────────────────────────────────────────────
   A swipe file stops being useful at about thirty saves: everything is in one
   pile and the reason you kept each thing is gone. Categories are a flat list
   on the profile (so they export, import and stay per-niche), and an entry
   stores the NAME rather than an id — renaming is then a visible, explicit
   migration rather than a dangling reference, and an entry can never point at a
   category that no longer exists. */
const swipeCats = () => Array.isArray(CFG.swipeCats)? CFG.swipeCats : [];
function setSwipeCats(list){ CFG.swipeCats = list; saveCfg(); }
function catCounts(){
  const m = new Map(); let none = 0;
  for(const e of swipeList()){
    const g = e.g||'';
    if(!g){ none++; continue; }
    m.set(g, (m.get(g)||0)+1);
  }
  return {m, none};
}
/* Categorising a video that isn't saved yet saves it, under that category — the
   two are one intent, and refusing until you had starred it first is a step that
   exists only because of how the data happens to be stored. Returns how many
   were newly saved so the caller can say so. */
function assignCat(ids, cat){
  const have = swipeSet();
  const missing = ids.filter(id=>!have.has(id));
  let list = swipeList();
  if(missing.length){
    const add = missing.map(findVid).filter(Boolean).map(swipeEntry);
    if(add.length) list = [...add, ...list];
  }
  const set = new Set(ids);
  const next = list.map(e=> set.has(e.id)? {...e, g:cat} : e);
  if(cat && !swipeCats().includes(cat)) setSwipeCats([...swipeCats(), cat]);
  setSwipe(next);
  return missing.length;
}
function renameCat(from, to){
  if(!to || from===to) return;
  setSwipe(swipeList().map(e=> e.g===from? {...e, g:to} : e));
  setSwipeCats(swipeCats().map(c=> c===from? to : c));
  if(S.filters.swipeCat===from) S.filters.swipeCat = to;
}
function deleteCat(name){
  setSwipe(swipeList().map(e=> e.g===name? {...e, g:''} : e));
  setSwipeCats(swipeCats().filter(c=>c!==name));
  if(S.filters.swipeCat===name) S.filters.swipeCat = null;
}
/* ── THUMBNAIL SIZE ──────────────────────────────────────────
   The Thumbnails view renders the board's own cards, so it gets the board's own
   S / M / L / XL — on its own slot, falling back to the board's until you touch
   it. Exactly the shape the calendar drill-down already uses, and for the same
   two reasons: sizing your swipe file is a different question from sizing the
   whole shelf, and reaching into S.filters.boardSize from here would silently
   resize the Thumbnail Board the next time you opened it. Anyone who never
   presses these buttons sees precisely what they saw before. */
const swipeSizeKey = () => S.filters.swipeSize || S.filters.boardSize || BOARD_DEFAULT_SIZE;

/* ── K WALKS THE CATEGORIES ──────────────────────────────────
   The ring is the chip row you are looking at, in the order it is drawn — All,
   then each category, then Uncategorised if anything is actually in it — so the
   key and the buttons can never fall out of step. Shift+K walks it backwards.
   Pressed from anywhere else in the app it opens the swipe file first, which
   makes it a single key from any view to the pile you are filing into. */
function swipeCatRing(){
  const {none} = catCounts();
  return [null, ...swipeCats(), ...(none? [''] : [])];
}
function cycleSwipeCat(dir){
  if(S.view!=='swipe'){ nav('swipe'); return; }
  const ring = swipeCatRing();
  if(ring.length<2){ toast('No categories yet — make one with + New in the toolbar','info'); return; }
  const i = ring.findIndex(c=>c===(S.filters.swipeCat===undefined? null : S.filters.swipeCat));
  const next = ring[(((i<0?0:i)+dir)%ring.length+ring.length)%ring.length];
  S.filters.swipeCat = next;
  S.page.swipe = 1;
  renderContentOnly();
  const {m, none} = catCounts();
  const n = next==null? swipeList().length : next===''? none : (m.get(next)||0);
  toast(`${next==null? 'All saved videos' : next===''? 'Uncategorised' : '\u201C'+next+'\u201D'} · ${nfull(n)}`,'info');
}

/* ── THE SWIPE FILE AS ITS OWN SMALL FILE ────────────────────
   A profile pack carries every scraped video, every snapshot and every trending
   row — megabytes, re-exported in full every time you want to keep the handful
   of things you actually chose. The swipe file is the one part you authored
   rather than downloaded, and each entry already holds its own snapshot: the id,
   the title, the channel, the thumbnail URL and the numbers as they stood when
   you starred it. So a pack of them is a few KB, it restores completely on its
   own, and keeping one costs nothing to hold on to.

   Categories travel with it, because a save that arrives without its label is
   half a save. */
function swipePack(shownOnly){
  const ids = shownOnly? new Set(swipeVisible().map(r=>r.id)) : null;
  const items = swipeList().filter(e=>!ids || ids.has(e.id));
  const used = new Set(items.map(e=>e.g||'').filter(Boolean));
  return { _signal:'swipe-pack', version:1, exportedAt:new Date().toISOString(),
    profile: activeProfile().name,
    cats: swipeCats().filter(c=>!shownOnly || used.has(c)),
    items };
}
function exportSwipePack(shownOnly){
  const pack = swipePack(shownOnly);
  if(!pack.items.length){ toast('Nothing to export yet','warn'); return; }
  const json = JSON.stringify(pack);
  dl(`signal-swipe-${slug(activeProfile().name)}${shownOnly?'-shown':''}-${todayPT()}.json`,
     json, 'application/json');
  toast(`${nfull(pack.items.length)} saved video${pack.items.length===1?'':'s'} \u00b7 ${Math.max(1,Math.round(json.length/1024))} KB`,'ok');
}
/* Merging, never replacing. Importing a pack into a profile that already has
   saves must not be able to lose one, so an id that is already here keeps its own
   note and its own category and only fills in a BLANK from the incoming copy.
   Import the same pack twice and the second run is a no-op, which is what makes
   this safe to use as a backup you restore without thinking about it. */
function importSwipePack(j){
  if(!j || j._signal!=='swipe-pack' || !Array.isArray(j.items)) throw new Error('Not a swipe pack');
  const list = swipeList().slice();
  const at = new Map(list.map((e,i)=>[e.id,i]));
  let added = 0, filled = 0;
  for(const raw of j.items){
    if(!raw || !raw.id) continue;
    const e = { id:String(raw.id), t:String(raw.t||''), c:String(raw.c||''), ci:String(raw.ci||''),
      th:String(raw.th||''), v:+raw.v||0, o:+raw.o||0, p:+raw.p||0, du:+raw.du||0,
      s:raw.s?1:0, n:String(raw.n||''), g:String(raw.g||''), at:+raw.at||Date.now() };
    const i = at.get(e.id);
    if(i===undefined){ list.push(e); at.set(e.id, list.length-1); added++; continue; }
    const cur = list[i];
    const next = {...cur};
    let touched = false;
    if(!String(cur.n||'').trim() && e.n.trim()){ next.n = e.n; touched = true; }
    if(!String(cur.g||'') && e.g){ next.g = e.g; touched = true; }
    if(touched){ list[i] = next; filled++; }
  }
  const cats = swipeCats().slice();
  for(const c of [...(j.cats||[]), ...list.map(e=>e.g||'')])
    if(c && !cats.includes(c)) cats.push(c);
  setSwipeCats(cats);
  setSwipe(list);
  S.page.swipe = 1;
  renderSideNav(); render();
  toast(added||filled
    ? `Imported \u00b7 ${nfull(added)} new${filled?`, ${nfull(filled)} filled in`:''}`
    : 'Everything in that pack was already here', added||filled? 'ok':'info');
}
function swipeVisible(){
  const q = (S.filters.q||'').toLowerCase().trim();
  const mv = CFG.minViews||0;
  let rows = swipeList().map(swipeRow);
  const sel = selIds();
  if(sel) rows = rows.filter(r=>sel.includes(r.channelId));
  const cat = S.filters.swipeCat;
  if(cat!=null) rows = rows.filter(r=>(r.cat||'')===cat);
  if(mv) rows = rows.filter(r=>r.views>=mv);
  if(q) rows = rows.filter(r=>r.title.toLowerCase().includes(q)
    || (r.channelTitle||'').toLowerCase().includes(q) || (r.note||'').toLowerCase().includes(q)
    || (r.cat||'').toLowerCase().includes(q));
  /* A column header click wins over the dropdown, so the Rows view sorts like
     every other table in the app; clearing it falls back to your chosen order. */
  if(S.sort.swipe) return sortRows(rows,'swipe');

    saved:     (a,b)=>b.savedAt-a.savedAt,

}

/* The uncached note can be closed. Closing it remembers which saves were
   uncached at that moment (per profile), so it stays hidden until a different
   saved video leaves the cache. */
function staleNoteDue(rows){
  const seen = CFG.swipeStaleSeen;
  if(!Array.isArray(seen) || !seen.length) return true;
  const s = new Set(seen);
  return rows.some(r=>r.stale && !s.has(r.id));
}
/* Refreshes the toolbar alone. A column sort swaps the list through
   fastTableUpdate(), but the toolbar owns the "clear column sort" control and the
   now-disabled dropdown, so it has to be told — without repainting the list it
   just swapped. */
function repaintSwipeBar(){
  const bar = document.getElementById('swipeBar');
  if(!bar) return false;
  const all = swipeList(), rows = swipeVisible();
  bar.innerHTML = swipeToolbar(rows, all, rows.filter(r=>r.stale).length, Math.min(6, rows.length));
  return true;
}
/* One host, three renderers — and the two dense ones are the very same
   videoTable() and boardGrid() the rest of the app uses, so a saved video looks
   and sorts exactly like a live one. */
function swipeBody(rows){
  const view = CFG.swipeView||'notes';
  if(view==='rows')   return `<div class="panel">${videoTable(rows,'swipe')}</div>`;
  if(view==='thumbs') return boardGrid(rows,'swipe',swipeSizeKey());
  return `<div class="grid2">${rows.map(swipeCard).join('')}</div>`;
}
function swipeCard(r){
  const oc = r.outlier>=5?'b-err':r.outlier>=CFG.outlierThreshold?'b-acc':r.outlier>=1.5?'b-ok':'b-grey';
  const drift = (!r.stale && r.savedViews && r.views!==r.savedViews)
    ? `<span class="sep">·</span><span title="Views gained since you starred it" style="color:var(--ok)">+${nf(r.views-r.savedViews)} since saved</span>` : '';
  return `<div class="panel swipecard${isVsel(r.id)?' sel':''}"><div class="pad">
    <div class="row" style="gap:11px;align-items:flex-start">
      ${thumbLink(r)}

        <a href="https://youtube.com/watch?v=${r.id}" target="_blank" rel="noopener" class="tt c2">${esc(r.title)}</a>

          <span class="badge ${oc}">${r.outlier}×</span>
          ${r.isShort?'<span class="tag">SHORT</span>':''}
          ${r.stale?'<span class="tag" title="No longer in the video cache — showing what was saved">SAVED COPY</span>':''}
          <b>${nf(r.views)} views</b>${drift}
        </div>
        <div class="vmeta">
          <span class="c1" style="max-width:150px">${esc(r.channelTitle||'—')}</span><span class="sep">·</span>
          <span>${r.publishedTs?FMT.dmy.format(new Date(r.publishedTs)):'—'}</span><span class="sep">·</span>
          <span>${dur(r.durationSec)}</span><span class="sep">·</span>
          <span class="dim">starred ${r.savedAt?ago(r.savedAt):'—'}</span>
          <span class="right">${videoActs(r)}</span>
        </div>
        <div class="vmeta" style="margin-top:6px">
          <button class="chip ${r.cat?'on':''}" data-swipecat="${esc(r.id)}"
            title="${r.cat?'In “'+esc(r.cat)+'” — click to move':'Put this in a category'}">${
            r.cat? catDot(r.cat)+esc(r.cat) : ic('plus')+'Category'}</button>
        </div>
      </div>
    </div>
    <textarea class="swipenote ${(r.note||'').trim()?'filled':''}" style="margin-top:10px" rows="2"
      data-swipenote="${esc(r.id)}" placeholder="Why did this catch your eye? The hook, the thumbnail move, the angle to steal…">${esc(r.note||'')}</textarea>
  </div></div>`;
}

/* The dashboard used to rank your best outliers and then give you nowhere to go
   with them — you could read that something scored 8.4× and not find out what it
   was. Every ranked row in the app now opens this. */
function showVideo(id){
  const v = findVid(id);
  if(!v){ toast('That video is not in this profile\'s cache any more','warn'); return; }
  const m = momentumOf(v.id);
  const live = !v.stale;
  const b = live? breakoutScore(v) : null;
  const proj = live? projectViews(v) : null;
  const st = isStarred(v.id);
  const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';

  const anat = live? [
    v.tHasNumber&&'number', v.tHasQuestion&&'question', v.tHasExclaim&&'exclaim',
    v.tHasParen&&'parenthetical', v.tHasColon&&'colon', v.tHasDash&&'dash',
    v.tHasQuote&&'quoted', v.tHasEmoji&&'emoji', v.tCapsWords>0&&`${v.tCapsWords} CAPS word${v.tCapsWords===1?'':'s'}`
  ].filter(Boolean) : [];
  document.getElementById('modals').innerHTML = `

    <div class="mhead">${ic('film')}<span class="grow c1">${esc(v.title)}</span>
      <button class="ib mclose" data-close="1" aria-label="Close" title="Close (Esc)">${ic('x')}</button></div>
    <div class="mbody">
      <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardthumb vhero"
         style="border-radius:var(--r3);border:1px solid var(--line)">
        <img loading="lazy" decoding="async" src="${esc(v.thumbHi||v.thumb||thumbUrl(v,true))}" data-vid="${v.id}" data-big="1" alt="">
        ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
        ${v.isShort?'<span class="boardshort">SHORT</span>':''}
      </a>
      <div class="row wrapf" style="gap:6px">
        <span class="badge ${oc}">${v.outlier}× channel median</span>
        ${b&&b.score>1.2?`<span class="badge b-warn">BREAKING OUT · ${b.paceRatio}× pace</span>`:''}
        ${m&&m.accel>1.4?'<span class="badge b-warn">ACCELERATING</span>':''}
        ${v.stale?'<span class="badge b-grey">SAVED COPY — no longer cached</span>':''}
        <span class="tag">${esc(v.channelTitle||'—')}</span>
        ${v.publishedTs?`<span class="tag">${esc(FMT.full.format(new Date(v.publishedTs)))}</span>`:''}
      </div>
      <div class="grid2" style="gap:14px">
        <div>
          ${kv('Views', nfull(v.views))}
          ${live? kv('Views / day', nfull(v.vpd), 'Average since publication') : ''}
          ${live? kv('Channel median', nfull(v.channelMedian)+' <span class="dim" style="font-weight:600">('+esc(v.baselineKind)+')</span>', 'The baseline this outlier score is measured against') : ''}
          ${kv('Likes', nfull(v.likes))}
          ${kv('Comments', nfull(v.comments))}
          ${live? kv('Engagement', v.engage+'%') : ''}
        </div>
        <div>
          ${kv('Length', dur(v.durationSec))}
          ${kv('Age', v.ageDays+' days')}
          ${live? kv('Published', esc(v.pubDay+' '+v.pubTime), 'Local time — the same clock the Analytics timing charts use') : ''}
          ${live&&v.gapDays!=null? kv('Days since their previous upload', v.gapDays) : ''}

}

function applyCat(ids, cat, back, isNew){
  const saved = assignCat(ids, cat);
  if(back) showVideo(back); else document.getElementById('modals').innerHTML='';
  if(S.view==='swipe') renderContentOnly(); else { paintAllStars(); paintCatChips(); }
  const where = cat? `“${cat}”` : 'Uncategorised';
  toast(saved
    ? `${isNew?'Created ':''}${where} — ${saved} newly saved to your swipe file`
    : `${isNew?'Created ':'Moved to '}${where}`, 'ok');
}

async function mineComments(){
  const pid = PID();                       // bound, like syncAll — see the note there
  const raw = document.getElementById('cmIds').value;
  S.filters.cmIds = raw;
  const ids = raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)
    .map(s=>{ const m=s.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:s; })
    .filter(s=>/^[A-Za-z0-9_-]{11}$/.test(s));
  if(!ids.length){ toast('No valid video IDs found','err'); return; }
  const pages = clamp(+document.getElementById('cmPages').value||3,1,5);
  const log=document.getElementById('cmLog'); log.classList.remove('hide'); log.innerHTML='';
  const push=(m,e)=>{ log.innerHTML += `<div class="${e?'e':''}">${esc(m)}</div>`; log.scrollTop=log.scrollHeight; };
  const all=[];
  try{
    for(const id of ids){
      let token=null,p=0,n=0;
      do{
        const par={part:'snippet',videoId:id,order:'relevance',maxResults:100};
        if(token) par.pageToken=token;
        const j = await yt('commentThreads',par,1);
        (j.items||[]).forEach(it=>{ const c=it.snippet.topLevelComment.snippet;
          all.push({videoId:id, text:(c.textDisplay||'').replace(/<[^>]+>/g,'').trim(), likes:+c.likeCount||0, author:c.authorDisplayName}); });
        n+=(j.items||[]).length; token=j.nextPageToken; p++;
        push(`${id}: page ${p} → ${n} comments`);
      } while(token && p<pages);
    }
    const seen=new Set();
    const requests = all.filter(c=>REQ_PAT.some(p=>p.test(c.text))).map(c=>{seen.add(c.text);return c;}).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const questions = all.filter(c=>!seen.has(c.text)&&c.text.includes('?')&&c.text.length>18).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const freq={}; all.forEach(c=>(c.text.match(/\b[A-Z][a-zA-Z'.]+(?:\s[A-Z][a-zA-Z'.]+)?\b/g)||[]).forEach(x=>{ if(x.length>2&&!STOP.has(x.toLowerCase())) freq[x]=(freq[x]||0)+1; }));
    const entities = Object.entries(freq).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]).slice(0,25)
      .map(([n,c])=>({text:n, likes:c, author:c+' mentions'}));
    const reactions = [...all].sort((a,b)=>b.likes-a.likes).slice(0,20);
    const mined = {ts:Date.now(), total:all.length, videoIds:ids, data:{requests,questions,entities,reactions}};
    await idbPut('misc',{k:'comments_'+pid, v:mined});
    if(PID()===pid) S.comments = mined;    // don't write another profile's findings into this one
    push(`▸ Done — ${all.length} comments, ${requests.length} requests, ${questions.length} questions, ${entities.length} entities`);

function buildRows(kind){

      return { channel:c.title, handle:c.handle, channel_id:c.id, subscribers:c.subs,

        lifetime_views:c.totalViews, video_count:c.videoCount, created:c.createdAt, country:c.country,
        age_months:st.ageMonths, views_per_month:st.viewsPerMonth, views_per_sub:st.viewsPerSub,
        videos_in_range:st.count, median_views:st.medViews, mean_views:st.meanViews, best_video_views:st.maxViews,
        uploads_per_month:st.cadence, median_duration_sec:st.medDuration, median_engagement_pct:st.medEngage,
        top3_view_share:+(st.top3Share*100).toFixed(1), shorts_share_pct:+(st.shortsShare*100).toFixed(1),
        last_scraped:c.lastScraped?new Date(c.lastScraped).toISOString():'never',

    case 'momentum': { const byId=Object.fromEntries(S.videos.map(v=>[v.id,v]));

          trend_ratio:t?t.ratio:'', consistency:(()=>{const cv=mu?Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu:0;
            return cv<0.8?'steady':cv<2?'mixed':'spiky';})(),
          best_title:best?best.title:'', best_outlier:best?best.outlier:'',
          best_url:best?'https://youtube.com/watch?v='+best.id:'' };}); }
    case 'topics': return topicStats(vids).slice(0,300).map(t=>({

    case 'thumbs': return applyQ(vids).sort((a,b)=>b.outlier-a.outlier).slice(0,120).map((v,i)=>({

      duration:dur(r.durationSec), duration_sec:r.durationSec, is_short:r.isShort,
      published_date:r.publishedTs? new Date(r.publishedTs).toISOString().slice(0,10):'',
      age_days:r.ageDays,

      const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      });

      selectedChannelObjs().forEach(c=>{ const t=channelTrend(c.id); if(!t) return;
        out.push({metric:'channel_trend', label:c.title, videos:t.n, median_views:t.recent,
          median_outlier:'', lift:t.ratio, in_rest:t.before}); });

/* One brief format for "here is a pile of videos I picked out", used by the

function videoBrief(rows, heading, withNotes){
  const line = v => `- "${v.title}" | ${v.channelTitle||'—'} | ${nfull(v.views)} views | ${v.outlier}x channel median | ${dur(v.durationSec)}`
    + (v.publishedTs? ` | ${new Date(v.publishedTs).toISOString().slice(0,10)}` : '')
    + ` | https://youtube.com/watch?v=${v.id}`
    + (withNotes && (v.cat||'')? ` | category: ${v.cat}` : '')
    + (withNotes && (v.note||'').trim()? `\n    MY NOTE: ${v.note.replace(/\s+/g,' ').trim()}` : '');
  const outs = rows.map(v=>+v.outlier||0);
  return `${heading} — ${new Date().toLocaleString()}

the target, not as a sample. Work out (1) what the titles have structurally in common —
promise, specificity, tension, length; (2) what the thumbnails are likely doing, inferred
from the titles and the numbers; (3) which of these formats is repeatable for me and which
depended on a one-off story; (4) ten concepts I could publish next that use the same
mechanics on different subject matter.${withNotes? ' Weigh MY NOTE lines heavily — that is why I saved each one.' : ''}
Follow these title patterns where they fit:
${CFG.titlePatterns}`;

/* A click that STARTED inside the dialog and finished on the backdrop is a text
   selection that ran past the edge, not a dismissal — closing on that would
   throw away what you were reading mid-drag. So the backdrop only counts when
   the press began there too. */
let _mbgDown = false;
document.addEventListener('mousedown', e=>{
  _mbgDown = !!(e.target.classList && e.target.classList.contains('mbg'));
}, true);
document.addEventListener('click', async e=>{
  if(_mbgDown && e.target.classList && e.target.classList.contains('mbg')){
    _mbgDown = false;
    document.getElementById('modals').innerHTML='';
    return;
  }
  _mbgDown = false;
  /* Pull-down menus: the trigger toggles; a click anywhere else closes the menu
     and still reaches its target — which is how a menu item's own data-export
     or data-act is handled by exactly the code below, with nothing duplicated. */
  const popT = e.target.closest('[data-pop]');
  if(popT){ if(_popOpen && _popOpen.btn===popT) closePop(); else openPop(popT); return; }
  if(_popOpen) closePop();
  // profile dropdown: toggle on its button, close on any outside click
  const pt = e.target.closest('#profToggle');
  if(pt){ profMenuOpen=!profMenuOpen; renderProfBar(); return; }
  if(profMenuOpen && !e.target.closest('#profMenu')){ profMenuOpen=false; renderProfBar(); }
  /* Clicking away closes the channel picker — but the click must still reach its
     target. Swallowing it meant the first click on anything after opening the
     picker did nothing, which felt broken. */
  let closedPicker=false;
  if(chPickOpen && !e.target.closest('.mpick')){ chPickOpen=false; closedPicker=true; }

  const t = e.target.closest('[data-nav],[data-act],[data-range],[data-thr],[data-toggle],[data-sort],[data-export],[data-cat],[data-chopen],[data-chback],[data-close],[data-brief],[data-copy-brief],[data-dl-brief],[data-pswitch],[data-pact],[data-trendmode],[data-chtab],[data-chexport],[data-chfilter-clear],[data-boardsort],[data-boardsize],[data-tdur],[data-twin],[data-expscope],[data-expthr],[data-minviews],[data-page],[data-perpage],[data-opptab],[data-oppsearch],[data-mpick],[data-chsel],[data-pastemode],[data-restorebak],[data-chpicksort],[data-textsize],[data-vstar],[data-vsel],[data-vopen],[data-vcopy],[data-chdrill],[data-calday],[data-calsort],[data-calsize],[data-calmetric],[data-calmonths],[data-calfeed],[data-calopen],[data-feedview],[data-swipeview],[data-swipesize],[data-swipefilt],[data-swipecat],[data-catset],[data-catnew],[data-catrename],[data-catdel],[data-catfrom],[data-appearance]');
  if(!t){ if(closedPicker) render(); return; }
  const d = t.dataset;
  if(d.appearance){ setTheme(d.appearance); return; }
  if(d.page){ const [k,n]=d.page.split('|'); S.page[k]=+n;
    // no scrollIntoView — changing page keeps you exactly where you were reading
    if(!fastTableUpdate(k)) render();
    return; }
  if(d.perpage){ CFG.perPage=+d.perpage; S.page={}; saveCfg();
    if(!fastTableUpdate(S.view)) render();
    return; }
  if(d.restorebak) return restoreBackup(d.restorebak);
  if(d.pswitch) return switchProfile(d.pswitch);
  if(d.pact) return profileAction(d.pact);
  if(d.trendmode){ CFG.trendMode=d.trendmode; saveCfg(); render(); return; }
  if(d.chtab){ S.filters.chTab=d.chtab; render(); return; }
  if(d.mpick!==undefined){ chPickOpen=!chPickOpen; render();
    /* Opens ready to type into: the filter has focus the moment the menu does. */
    if(chPickOpen)
      requestAnimationFrame(()=>{ const q=document.getElementById('chPickQ'); if(q) q.focus({preventScroll:true}); });
    return; }
  if(d.textsize){ CFG.textSize=d.textsize; document.documentElement.dataset.text=d.textsize;
    saveCfg(); render(); return; }
  if(d.chpicksort){ S.filters.chPickSort=d.chpicksort; renderContentOnly(); positionChPick();
    document.getElementById('subrow').innerHTML = subrow(); positionChPick(); return; }
  if(d.chsel!==undefined){ toggleChSel(d.chsel); return; }
  if(d.opptab){ S.filters.oppTab=d.opptab; render(); return; }
  if(d.oppsearch){ S.filters.q=d.oppsearch; S.page={}; nav('feed'); return; }
  /* Both of these only change the grid. Repainting the toolbar, the subrow and
     the pager as well threw the scroll position away and re-decoded every
     thumbnail — the jitter you feel when flicking between sizes. */
  if(d.calsort){ S.filters.calSort=d.calsort; S.page.calday=1; repaintCalDay(); return; }
  if(d.calsize){ S.filters.calSize=d.calsize; repaintCalDay(); return; }
  if(d.boardsort){ S.filters.boardSort=d.boardsort; S.page={}; repaintBoard(); return; }
  if(d.boardsize){ S.filters.boardSize=d.boardsize; repaintBoard(); return; }
  if(d.tdur!==undefined){ const [mn,mx]=d.tdur.split('|').map(Number);
    CFG.trendDurMin=mn; CFG.trendDurMax=mx; saveCfg(); render(); return; }
  if(d.expscope!==undefined){ toggleChSel(d.expscope||'__none'); return; }
  if(d.expthr){ CFG.outlierThreshold=+d.expthr; saveCfg(); render(); return; }
  if(d.minviews!==undefined){ CFG.minViews=+d.minviews; S.page={}; saveCfg(); render(); return; }
  if(d.chfilterClear!==undefined){ S.filters.chSel=null; S.page={}; render(); return; }
  if(d.chexport){
    const st = channelStats(S.filters.channel, S.range);
    const prev = S.filters.chSel;
    S.filters.chSel = [S.filters.channel];          // scope the export to this channel
    doExport('feed', d.chexport);
    S.filters.chSel = prev; return;
  }
  /* ─── swipe file / selection / drill-downs ───
     Starring and ticking patch the DOM in place. Re-rendering to flip one
     checkbox would re-decode every thumbnail on screen, which is the exact cost
     repaintBoard() and syncPickerDom() exist to avoid. */
  if(d.vstar!==undefined){
    const id = d.vstar;
    /* Un-starring used to be a one-way door: the entry, its note and its
       category went the instant you clicked. It is still one click — and the
       toast can now put back exactly what was there, in the same position. */
    const before = swipeList(), at = before.findIndex(x=>x.id===id), was = at>=0? before[at] : null;
    const added = starVideo(id);
    if(S.view==='swipe') renderContentOnly(); else { paintStar(id); paintCatChips(); }
    if(d.modalstar) showVideo(id);
    renderSelBar();
    if(added) toast('Saved to your swipe file','ok');
    else toast('Removed from your swipe file','info', was? {action:'Undo', onAction:()=>{
      restoreSwipe([{e:was, i:at}]);
      if(d.modalstar && document.querySelector('#modals .modal')) showVideo(id); }} : {});
    return; }
  if(d.vsel!==undefined){ toggleVsel(d.vsel); return; }
  if(d.vopen!==undefined){ return showVideo(d.vopen); }
  if(d.vcopy!==undefined){ return copyTxt('https://youtube.com/watch?v='+d.vcopy); }
  /* One target for "show me this channel", wherever it is clicked from — the
     dashboard bars, the gone-quiet list, the channel picker, the video modal.
     nav() preserves S.filters.channel when the destination IS the channels view. */
  if(d.chdrill!==undefined){
    chPickOpen=false;
    document.getElementById('modals').innerHTML='';
    S.filters.channel=d.chdrill; S.filters.chTab='top';
    nav('channels'); window.scrollTo(0,0); return; }
  /* ─── calendar ─── */
  if(d.calmonths){ CFG.calMonths=+d.calmonths; CFG.calMonthsFor=rangeSig(); saveCfg(); renderContentOnly(); return; }
  if(d.calmetric){ CFG.calMetric=d.calmetric; saveCfg(); renderContentOnly(); return; }
  if(d.calday!==undefined){
    S.filters.calDay = (S.filters.calDay===d.calday)? null : d.calday;
    S.page.calday=1; renderContentOnly(); return; }
  if(d.calopen!==undefined){ S.filters.calDay=d.calopen; S.page.calday=1; nav('calendar'); return; }
  /* Handing one day to the whole app is just the custom range it already has —
     no new filter path, so every view, export and brief agrees by construction. */
  if(d.calfeed!==undefined){
    S.range='custom'; CFG.rangeFrom=d.calfeed; CFG.rangeTo=d.calfeed; saveCfg();
    S.page={}; renderSideNav(); nav('feed');
    toast('Range set to '+FMT.dmy.format(new Date(dayTs(d.calfeed)))+' — clear it with the range buttons','ok');
    return; }
  /* Swap the grid, not the view. Re-rendering everything also rebuilt the
     toolbar, the filter bar and the panel header — identical output, thrown
     away and re-laid-out, and on a 200-row page that was the difference between
     62ms and a flick. Same trick as repaintBoard(). */
  /* ─── swipe file ─── */
  if(d.swipeview){
    if((CFG.swipeView||'notes')===d.swipeview) return;
    CFG.swipeView=d.swipeview; S.page.swipe=1; saveCfg();
    /* The fast path swaps the grid and nothing else — but the toolbar owns the
       S/M/L/XL buttons, which belong to the Thumbnails view alone, so it has to
       be told as well. Same one-line treatment the column sort already gets. */
    if(!fastTableUpdate('swipe')) renderContentOnly(); else repaintSwipeBar();
    document.querySelectorAll('[data-swipeview]').forEach(x=>
      x.classList.toggle('on', x.dataset.swipeview===CFG.swipeView));
    return; }
  if(d.swipesize){
    if(swipeSizeKey()===d.swipesize) return;
    S.filters.swipeSize=d.swipesize;
    if(!fastTableUpdate('swipe')) renderContentOnly();
    document.querySelectorAll('[data-swipesize]').forEach(x=>
      x.classList.toggle('on', x.dataset.swipesize===d.swipesize));
    return; }
  if(d.swipefilt!==undefined){
    S.filters.swipeCat = d.swipefilt==='__all' ? null : d.swipefilt==='__none' ? '' : d.swipefilt;
    S.page.swipe=1; renderContentOnly(); return; }
  if(d.swipecat!==undefined) return showCatPicker([d.swipecat], d.catfrom);
  if(d.catset!==undefined) return applyCat((d.ids||'').split(',').filter(Boolean), d.catset, d.catback);
  if(d.catnew!==undefined){
    const el=document.getElementById('newCatName');
    const name=(el&&el.value||'').trim();
    if(!name){ toast('Name the category first','warn'); if(el) el.focus(); return; }
    return applyCat((d.ids||'').split(',').filter(Boolean), name.slice(0,40), d.catback, true); }
  if(d.catrename!==undefined){
    const to=await askPrompt({title:'Rename category', icon:'tag', okLabel:'Rename', value:d.catrename, maxlength:40});
    if(to && to.trim() && to.trim()!==d.catrename){ renameCat(d.catrename, to.trim()); showCatManager();
      if(S.view==='swipe') renderContentOnly(); else paintCatChips(); }
    return; }
  if(d.catdel!==undefined){
    if(!(await askConfirm({title:`Delete “${d.catdel}”?`, icon:'tag', destructive:true, okLabel:'Delete Category',
      message:'The videos in it stay in your swipe file — they just lose the label.'}))) return;
    deleteCat(d.catdel); showCatManager();
    if(S.view==='swipe') renderContentOnly(); else paintCatChips();
    return; }
  if(d.feedview){
    if(CFG.feedView===d.feedview) return;
    CFG.feedView=d.feedview; S.page.feed=1; saveCfg();
    if(!fastTableUpdate('feed')) renderContentOnly();
    document.querySelectorAll('[data-feedview]').forEach(x=>
      x.classList.toggle('on', x.dataset.feedview===CFG.feedView));
    return; }
  if(d.nav) return nav(d.nav);
  if(d.close) { document.getElementById('modals').innerHTML=''; return; }
  if(d.range){ S.range=d.range; S.page={}; renderSideNav(); render(); return; }
  if(d.thr){ CFG.outlierThreshold=+d.thr; S.page={}; saveCfg(); renderSideNav(); render(); return; }
  if(d.toggle){
    if(d.toggle==='density'){ CFG.density = CFG.density==='compact'?'normal':'compact'; document.documentElement.dataset.density=CFG.density; }
    else CFG[d.toggle] = !CFG[d.toggle];
    saveCfg(); render(); return;
  }
  if(d.cat){ const c=+d.cat; CFG.trendCats = CFG.trendCats.includes(c)? CFG.trendCats.filter(x=>x!==c) : [...CFG.trendCats,c]; saveCfg(); render(); return; }
  if(d.sort){ const [key,col]=d.sort.split('|'); const cur=S.sort[key]||{c:'',d:-1};
    S.sort[key] = {c:col, d: cur.c===col? -cur.d : -1}; S.page[key]=1;
    if(!fastTableUpdate(key)) render();
    else if(key==='swipe') repaintSwipeBar();
    return; }
  if(d.export){ const [k,f]=d.export.split('|'); return doExport(k,f); }
  if(d.chopen){ S.filters.channel=d.chopen; render(); window.scrollTo(0,0); return; }
  if(d.chback){ S.filters.channel=null; render(); return; }
  if(d.brief) return showBrief(d.brief);
  if(d.copyBrief) return copyTxt(briefing(d.copyBrief));
  if(d.dlBrief) return dl(`signal-briefing-${d.dlBrief}-${todayPT()}.txt`, briefing(d.dlBrief));
  switch(d.act){
    case 'chPaste': return pasteChannels('add');
    case 'chPasteReplace': return pasteChannels('replace');
    case 'chCopy': return copyChannels();
    case 'chClean': return cleanChannels();
    case 'chClear': return clearChannels();
    case 'chUndo': return undoChannels();
    case 'chExportList': {
      const list = draftLines();
      if(!list.length){ toast('No channels to export','warn'); return; }
      dl(`signal-channels-${slug(activeProfile().name)}-${todayPT()}.txt`, list.join('\n'));
      return;
    }
    case 'pasteBoxAdd': {
      const box=document.getElementById('pasteBox'); if(!box) return;
      const mode = t.dataset.pastemode||'add';
      const txt = box.value;
      document.getElementById('modals').innerHTML='';
      applyPastedChannels(txt, mode); return;
    }
    case 'pruneStale': {
      const n = (S.staleChannels||[]).length;
      if(!n){ toast('Nothing to clear','warn'); return; }
      if(!(await askConfirm({title:`Delete cached data for ${n} delisted channel${n===1?'':'s'}?`, icon:'trash', destructive:true,
        okLabel:'Delete Cached Data', message:'They are already excluded from every metric. This permanently deletes their videos and snapshots and frees the disk space.'}))) return;
      const removed = await pruneOrphans({force:true, silent:true});
      S.page={}; renderProfBar(); renderSideNav(); render();
      toast(`Cleared cached data for ${removed} channel${removed===1?'':'s'}`,'ok'); return;
    }
    case 'discardDrafts': {
      const fields = dirtyFields();
      if(!fields.length){ toast('Nothing to discard','warn'); return; }
      if(!(await askConfirm({title:'Discard unsaved edits?', icon:'undo', destructive:true, okLabel:'Discard',
        message:`Your edits to ${fields.map(f=>DRAFT_LABEL[f].toLowerCase()).join(', ')} are dropped and the boxes go back to what is currently in effect.`}))) return;
      discardDrafts(); chUndoStack=[]; render();
      toast('Unsaved edits discarded','ok'); return;
    }
    case 'storageScan': return runStorageScan();
    case 'storageBackups': return showBackups();
    case 'storageRepair': return repairStorage();
    case 'sync': return syncAll();
    case 'deepSync': return syncAll({deep:true});
    case 'syncTrending': return syncTrending();
    case 'saveSettings': return saveSettings();
    case 'testKey': return testKey();
    case 'mineComments': return mineComments();
    case 'cmFromOutliers': {
      const ids = enrichedInRange().filter(v=>v.outlier>=CFG.outlierThreshold)
        .sort((a,b)=>b.outlier-a.outlier).slice(0,8).map(v=>v.id);
      if(!ids.length){ toast('No outliers found — sync first','warn'); return; }
      document.getElementById('cmIds').value = ids.join('\n'); toast(`Filled ${ids.length} outlier IDs`,'ok'); return;
    }
    case 'briefOutliers': return copyTxt(briefing('ideas'));
    case 'exportZip': return exportZip();
    case 'backup': return exportProfile(true);
    case 'restore': return document.getElementById('importFile').click();
    case 'wipe': return wipe();
    case 'copyCompare': {
      const rows = buildRows('compare');
      const sel = selectedChannelObjs();
      const allv = enrichedInRange();
      const per = sel.map(c=>({c, topics:new Set(allv.filter(v=>v.channelId===c.id).flatMap(v=>extractTopics(v.title||'')))}));
      const gapTxt = per.map((p,i)=>{
        const others = new Set(per.filter((_,j)=>j!==i).flatMap(x=>[...x.topics]));
        const owned = [...p.topics].filter(t=>!others.has(t)).slice(0,15);
        return `${p.c.title} owns alone: ${owned.join(', ')||'(nothing exclusive)'}`;
      }).join('\n');
      copyTxt(`CHANNEL COMPARISON — ${rangeLabel()} — ${new Date().toLocaleString()}

${rows.map(r=>`## ${r.channel} (${nfull(r.subscribers)} subs)
  videos in range: ${r.videos_in_range} | median views: ${nfull(r.median_views)} | best: ${nfull(r.best_video_views)}
  outliers: ${r.outliers} | uploads/month: ${r.uploads_per_month} | trend: ${r.trend_ratio||'n/a'} | output: ${r.consistency}
  engagement: ${r.median_engagement_pct}% | like rate: ${r.median_like_rate_pct}% | views per 1K subs: ${r.views_per_1k_subs}
  median length: ${dur(r.median_duration_sec)} | shorts: ${r.shorts_share_pct}%
  best video: "${r.best_title}" (${r.best_outlier}x)`).join('\n\n')}

=== TOPIC OWNERSHIP ===
${gapTxt}

TASK: Compare these channels. Identify (1) which is executing best and why, in terms of the
numbers above; (2) what each one is doing that the others are not; (3) the three biggest
openings for a new channel entering this same space; (4) the format and cadence I should
copy versus avoid. Be specific and cite the numbers.`);
      return;
    }
    case 'copyOppBrief': {
      const vids = enrichedInRange();
      const topics = topicStats(vids);
      const bs = vids.map(v=>({v,b:breakoutScore(v)})).filter(x=>x.b&&x.b.score>1.2)
        .sort((a,b)=>b.b.score-a.b.score).slice(0,15);
      const lanes = topics.filter(t=>t.coverage<=2&&t.medOutlier>=1.2&&t.count>=2).slice(0,15);
      const hot = topics.filter(t=>t.recent>0).sort((a,b)=>b.momentum-a.momentum).slice(0,15);
      const cold = topics.filter(t=>t.prior>=3&&t.recent===0).sort((a,b)=>b.medOutlier-a.medOutlier).slice(0,10);
      copyTxt(`OPPORTUNITY BRIEF — ${rangeLabel()} — ${new Date().toLocaleString()}
Channels tracked: ${S.channels.length} · Videos analysed: ${vids.length}

=== BREAKING OUT NOW (young videos running above their channel's normal pace) ===
${bs.map(({v,b})=>{const p=projectViews(v);
  return `- "${v.title}" | ${v.channelTitle} | ${nfull(v.views)} views in ${v.ageDays}d | ${b.paceRatio}x normal pace${p?` | ~${nfull(p)} projected 30d`:''}`;}).join('\n')||'(none)'}

=== OPEN LANES (proven topic, 1-2 channels covering) ===
${lanes.map(t=>`- ${t.topic} | ${t.count} videos across ${t.coverage} channel(s) | ${t.medOutlier}x median outlier | ${nfull(t.medViews)} median views | best: "${t.best.title}" (${nfull(t.best.views)})`).join('\n')||'(none)'}

=== HEATING UP (rising share of uploads, last 7d vs prior 3w) ===
${hot.map(t=>`- ${t.topic} | momentum ${t.momentum}x | ${t.recent} in last 7d vs ${t.prior} prior | ${t.medOutlier}x median outlier`).join('\n')||'(none)'}

=== REVIVAL CANDIDATES (performed well, untouched for 7d+) ===
${cold.map(t=>`- ${t.topic} | ${t.medOutlier}x median | last covered ${t.daysOld}d ago | best: "${t.best.title}"`).join('\n')||'(none)'}

=== FORMAT SIGNAL ===
${durationBuckets(vids).filter(b=>b.count>=3).sort((a,b)=>b.medOutlier-a.medOutlier)
  .map(b=>`${b.label}: ${b.medOutlier}x median outlier across ${b.count} videos (median ${nfull(b.medViews)} views)`).join('\n')}

TASK: Using the signals above, propose 15 video concepts. For each give: title, the angle,
which signal it came from (breakout / open lane / heating / revival), why now, and an
ad-risk grade of green/yellow/red. Follow these title patterns:
${CFG.titlePatterns}`);
      return;
    }
    case 'clearSel': { clearVsel(); return; }
    case 'selAllShown': {
      const ids = shownVideos().map(v=>v.id);
      if(!ids.length){ toast('Nothing on screen to select','warn'); return; }
      const n = addVsel(ids);
      toast(n? `${n} added — ${vselSet().size} selected` : 'Everything shown is already selected', n?'ok':'info');
      return; }
    case 'starShown': {
      const ids = shownVideos().map(v=>v.id);
      if(!ids.length){ toast('Nothing on screen to star','warn'); return; }
      const n = starMany(ids);
      if(S.view==='swipe') renderContentOnly(); else paintAllStars();
      toast(n? `${n} saved to your swipe file` : 'All of these are already saved', n?'ok':'info');
      return; }
    case 'starSel': {
      const ids = [...vselSet()];
      if(!ids.length){ toast('Nothing selected','warn'); return; }
      if(ids.every(isStarred)){
        const drop = new Set(ids);
        const gone = swipeList().map((e,i)=>({e,i})).filter(x=>drop.has(x.e.id));
        setSwipe(swipeList().filter(e=>!drop.has(e.id)));
        toast(`Removed ${ids.length} from your swipe file`,'ok', {action:'Undo', onAction:()=>restoreSwipe(gone)});
      } else {
        const n = starMany(ids);
        toast(`${n} saved to your swipe file`,'ok');
      }
      if(S.view==='swipe') renderContentOnly(); else paintAllStars();
      renderSelBar();
      return; }
    case 'newCat': {
      const name = await askPrompt({title:'New category', icon:'tag', okLabel:'Create', maxlength:40,
        placeholder:'e.g. Hooks worth stealing', message:'File your swipe file by purpose — "Thumbnail formats", "To script", anything.'});
      if(!name || !name.trim()) return;
      const n = name.trim().slice(0,40);
      if(swipeCats().includes(n)){ toast('That category already exists','warn'); return; }
      setSwipeCats([...swipeCats(), n]);
      renderContentOnly(); toast(`Created “${n}” — drop saves into it from any card`,'ok');
      return; }
    case 'manageCats':  return showCatManager();
    case 'catSel':      return showCatPicker([...vselSet()]);
    /* Filing everything currently shown is the same one dialog as filing one
       card — the category chips above already say what "shown" means, so this is
       the bulk move without the select-every-card step in front of it. */
    case 'fileShown': {
      const ids = swipeVisible().map(r=>r.id);
      if(!ids.length){ toast('Nothing shown to file','warn'); return; }
      return showCatPicker(ids); }
    case 'swipeExport':      return exportSwipePack(false);
    case 'swipeExportShown': return exportSwipePack(true);
    case 'swipeImport': { document.getElementById('swipeFile').click(); return; }
    case 'clearSwipeSort': { delete S.sort.swipe; S.page.swipe=1;
      if(!fastTableUpdate('swipe')) renderContentOnly(); else repaintSwipeBar();
      return; }
    case 'dismissStaleNote': {
      CFG.swipeStaleSeen = swipeList().map(swipeRow).filter(r=>r.stale).map(r=>r.id);
      saveCfg();
      if(!repaintSwipeBar()) renderContentOnly();
      return; }
    case 'cmpThumbs': return showThumbCompare(selectedVideos());
    case 'cmpTop':    return showThumbCompare(swipeVisible().slice(0,6));
    case 'starCmp': {
      const ids = (d.ids||'').split(',').filter(Boolean);
      const n = starMany(ids);
      paintAllStars();
      toast(n? `${n} saved to your swipe file` : 'All of these are already saved', n?'ok':'info');
      return; }
    case 'copyCmpUrls': {
      const ids = (d.ids||'').split(',').filter(Boolean);
      const rows = ids.map(findVid).filter(Boolean);
      copyTxt(rows.map(v=>`${v.thumbHi||thumbUrl(v,true)}\t${v.outlier}x\t${v.title}`).join('\n'));
      return; }
    case 'copySelUrls': {
      const rows = selectedVideos();
      if(!rows.length){ toast('Nothing selected','warn'); return; }
      copyTxt(rows.map(v=>`https://youtube.com/watch?v=${v.id}`).join('\n'));
      return; }
    case 'exportSel': {
      const rows = selectedVideos();
      if(!rows.length){ toast('Nothing selected','warn'); return; }
      dl(`signal-selection-${todayPT()}.csv`, toCSV(rows.map(v=>({
        title:v.title, channel:v.channelTitle, views:v.views, outlier_score:v.outlier,
        views_per_day:v.vpd, engagement_pct:v.engage, likes:v.likes, comments:v.comments,
        duration:dur(v.durationSec), is_short:v.isShort,
        published_date:v.publishedTs? new Date(v.publishedTs).toISOString().slice(0,10):'',
        age_days:v.ageDays, starred:isStarred(v.id),
        video_id:v.id, url:'https://youtube.com/watch?v='+v.id,
        thumbnail:v.thumbHi||thumbUrl(v,true) }))), 'text/csv');
      toast(`Exported ${rows.length} selected videos`,'ok');
      return; }
    case 'copySelBrief': {
      const rows = selectedVideos();
      if(!rows.length){ toast('Nothing selected','warn'); return; }
      copyTxt(videoBrief(rows, `SELECTED VIDEOS (${rows.length})`));
      return; }
    case 'copySwipeBrief': {
      const rows = swipeVisible();
      if(!rows.length){ toast('Nothing in your swipe file yet','warn'); return; }
      copyTxt(videoBrief(rows, `SWIPE FILE (${rows.length} saved)`, true));
      return; }
    case 'showSyncLog': return showSyncLog();
    case 'cancelSync': { S.syncCancel=true; toast('Stopping after this channel…','warn'); return; }
    case 'dismissSync': { S.syncJustDone=null; renderSyncStatus(); return; }
    case 'shortcuts': return showShortcuts();
    case 'palette': return openPalette();
    case 'toggleSidebar': return toggleSidebar();
    case 'clearTrendDates': { CFG.trendFrom=''; CFG.trendTo=''; saveCfg(); render(); return; }
    case 'clearRangeDates': { CFG.rangeFrom=''; CFG.rangeTo=''; S.page={}; saveCfg(); render(); return; }
    case 'copyThumbUrls': {
      const rows = applyQ(enrichedInRange())
        .sort((a,b)=>b.outlier-a.outlier).slice(0,120);
      copyTxt(rows.map(v=>`${thumbUrl(v,true)}\t${v.outlier}x\t${v.title}`).join('\n')); return;
    }
    case 'saveKeywords': {
      const el=document.getElementById('trendKw'); if(!el) return;
      CFG.trendKeywords = el.value.split('\n').map(s=>s.trim()).filter(Boolean);
      saveCfg(); render(); toast(`${CFG.trendKeywords.length} keywords saved`,'ok'); return;
    }
  }
});
document.addEventListener('input', e=>{
  if(e.target.dataset && e.target.dataset.pickfilter!==undefined){
    S.filters.chPickQ = e.target.value;
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#chPickMenu .mpick-item').forEach(r=>{ r.hidden = !!q && !(r.dataset.name||'').includes(q); });
    return;
  }
  // every registered settings field persists itself as you type
  // every settings field keeps its draft as you type; none of them apply it
  if(e.target.id && DRAFT_FIELDS[e.target.id]){ scheduleAutosave(e.target.id); }
  const nid = e.target.dataset.swipenote;
  if(nid!==undefined){
    e.target.classList.toggle('filled', !!e.target.value.trim());
    queueNote(nid, e.target.value);
    return;
  }
  if(e.target.dataset.search!==undefined){
    S.filters.q=e.target.value; S.page={};
    clearTimeout(window._st);
    window._st=setTimeout(()=>{
      const c=document.getElementById('content');
      const fn={feed:vFeed,outliers:vOutliers,board:vBoard,trending:vTrending,
        calendar:vCalendar,swipe:vSwipe}[S.view];
      if(fn){ c.innerHTML=fn();
        // keep focus + caret in the box so typing isn't interrupted by the redraw
        const box=[...document.querySelectorAll('[data-search]')].pop();
        if(box && document.activeElement!==box){ const val=box.value; box.focus(); box.setSelectionRange(val.length,val.length); }
      }
    },200);

/* ═══════════════════════════════════════════════════════════
   WHICH CHANNELS COUNT — one answer, used everywhere
   ───────────────────────────────────────────────────────────
   The list in Settings is the single source of truth for what is being tracked.
   Cached rows for a channel you have since removed stay on disk — deleting data
   behind your back is how people lose it — but they must not reach a single
   metric.

   They used to. The header read `CFG.channels.length` while the dashboard,
   the channel picker, every median and every outlier baseline read
   `S.channels`, which is whatever happens to be cached. Remove six channels
   from the list and you get a header saying "23 channels" above a dashboard
   saying "29 CHANNELS TRACKED", with six delisted channels' videos silently
   inside every total, every median and every baseline. Two independent answers
   to the same question, and the wrong one feeding the numbers.

   Now the split happens once, at load, and everything downstream reads the
   filtered arrays. The delisted rows are kept in S.staleChannels so they can be
   reported and cleaned up deliberately, never silently.
   ═══════════════════════════════════════════════════════════ */
/* Canonical keys, so matching is a set lookup instead of re-parsing every line
   for every channel. Same rules as before — id, handle, title, title without
   spaces — just resolved once. */
function listKeySet(lines){
  const s = new Set();
  for(const l of lines){ const k = canonCh(l); if(k) s.add(k); }
  return s;
}
function channelKeys(c){
  const out = [];
  if(c.id) out.push('id:'+c.id, 'h:'+String(c.id).toLowerCase());
  if(c.handle) out.push('h:'+String(c.handle).replace(/^@/,'').toLowerCase());
  if(c.title){
    const t = String(c.title).toLowerCase();
    out.push('h:'+t, 'h:'+t.replace(/\s+/g,''));
  }
  return out;
}
function channelMatchesKeys(c, keys){ return channelKeys(c).some(k=>keys.has(k)); }
/* Kept for callers that still work line-by-line (prune, sync logging). */
function channelMatchesList(c, lines){ return channelMatchesKeys(c, listKeySet(lines)); }
/* Cached data for channels you have removed is kept, but it is excluded from
   every number and said out loud. Silence here is what made the totals wrong:
   the rows kept counting while the list said otherwise. */
function staleNotice(){
  const n = (S.staleChannels||[]).length;
  if(!n) return '';
  const names = S.staleChannels.slice(0,4).map(c=>esc(c.title||c.id)).join(', ');
  return `<div class="row wrapf" style="gap:9px;padding:10px 12px;background:var(--warn-soft);border-radius:var(--r2);margin-bottom:11px">
    ${ic('warn')}<span class="grow" style="font-size:var(--f-xs);min-width:200px">
      <b>${n} cached channel${n===1?'':'s'} no longer on your list</b> — ${names}${n>4?` and ${n-4} more`:''}.
      Their videos are excluded from every metric. The data is still on disk until you clear it.</span>
    <button class="btn btn-sm btn-o" data-act="pruneStale">${ic('trash')}Clear cached data</button>
  </div>`;
}
/* An empty list means "nothing configured yet", not "track nothing" — blanking
   the app because a textarea is momentarily empty is the failure mode this
   whole area is being hardened against. */
function splitByList(rows){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length) return {active:rows.slice(), stale:[]};
  const keys = listKeySet(lines);
  const active=[], stale=[];
  for(const c of rows) (channelMatchesKeys(c, keys)? active : stale).push(c);
  return {active, stale};
}
/* Lowering the depth setting used to do nothing — it only ever controlled how
   far a sync reached, never what was already cached, so the counts stayed at the
   old high-water mark. This trims each channel back to its newest N videos (and
   drops the snapshots belonging to the removed ones so nothing is orphaned). */
async function trimToDepth(){
  const want = CFG.scrapeDepth;
  const byCh = new Map();
  for(const v of S.videos){
    let a = byCh.get(v.channelId);
    if(!a){ a=[]; byCh.set(v.channelId,a); }
    a.push(v);
  }
  const doomed=[];
  byCh.forEach(list=>{
    if(list.length<=want) return;
    list.sort((a,b)=>b.publishedTs-a.publishedTs);   // keep the newest
    doomed.push(...list.slice(want));
  });
  if(!doomed.length) return 0;
  const gone = new Set(doomed.map(v=>v.id));
  await idbDelete(STORES.videos, doomed.map(v=>v._k));
  const snaps = (await idbByPid(STORES.snapshots, PID())).filter(s=>gone.has(s.videoId));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return doomed.length;
}
async function applyDepthChange(){
  const want = CFG.scrapeDepth;
  const over = (()=>{ const c={}; S.videos.forEach(v=>c[v.channelId]=(c[v.channelId]||0)+1);
    return Object.values(c).reduce((n,x)=>n+Math.max(0,x-want),0); })();
  if(over){
    if(!(await askConfirm({title:`Trim to ${nfull(want)} videos per channel?`, icon:'layers', destructive:true, okLabel:'Trim Now', cancelLabel:'Keep Cache',
      message:`This deletes ${nfull(over)} older cached video${over===1?'':'s'} and their snapshots. Raising the depth later re-fetches them (about ${Math.ceil(want/50)*2} quota units per channel).`}))){
      return false;   // leave the cache alone; the setting still applies to future syncs
    }
    const n = await trimToDepth();
    S.page={};
    toast(`Trimmed ${nfull(n)} videos — now keeping the newest ${nfull(want)} per channel`,'ok');
  }
  return true;
}
/* Deleting cached rows because a line vanished from a textarea is a very sharp
   tool, and it used to have no handle on it. Two guards now stand in front of it:
   an empty list never triggers a mass delete (an empty box is far more often a
   render slip or an unsaved edit than a real "drop everything" instruction), and
   a prune that would take out every channel at once has to be confirmed. The
   deliberate path — Settings → Wipe this profile's data — is still one click. */
async function pruneOrphans(opts={}){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length){
    if((S.allChannels||[]).length && !opts.force){
      console.warn('[signal] refusing to prune: channel list is empty but',
        (S.allChannels||[]).length, 'channels are cached');
      return 0;
    }
    return 0;
  }
  /* Re-derive rather than trusting a cached field: prune is destructive, and it
     must never act on a stale idea of what is delisted. refilterChannels() is
     the same single algorithm the rest of the app reads, so this stays one
     definition of "orphan" — just a freshly evaluated one. */
  refilterChannels();
  const orphans = S.staleChannels||[];
  if(!orphans.length) return 0;
  const total = (S.allChannels||[]).length;
  if(orphans.length === total && total > 1 && !opts.force && !opts.silent){
    if(!(await askConfirm({title:`Drop all ${total} cached channels?`, icon:'warn', destructive:true, okLabel:'Drop All',
      message:'This deletes every cached channel and its videos. That usually means the list got cleared by accident.'}))){
      return 0;
    }
  }
  const gone = new Set(orphans.map(c=>c.id));
  const pid = PID();
  const [allVids, allSnaps] = await Promise.all([
    idbByPid(STORES.videos, pid), idbByPid(STORES.snapshots, pid),
  ]);
  const vids  = allVids.filter(v=>gone.has(v.channelId));
  const snaps = allSnaps.filter(s=>gone.has(s.channelId));
  await idbDelete(STORES.channels, orphans.map(c=>c._k));
  if(vids.length)  await idbDelete(STORES.videos,  vids.map(v=>v._k));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return orphans.length;
}
/* ═══════════════════════════════════════════════════════════
   CHANNEL LIST — parsing, clipboard, undo
   ═══════════════════════════════════════════════════════════ */
/* People paste from spreadsheets, from a notes app, from another browser tab.
   That arrives as newlines, commas, tabs, semicolons, bare URLs with tracking
   junk, and duplicates. All of it is one list, so accept all of it. */
function splitChannelText(text){
  return String(text||'')
    .replace(/\r/g,'\n')
    .split(/[\n,;\t]+|\s{2,}/)
    .map(s=>s.trim())
    .map(s=>s.replace(/^[-*•>\d.)\]\s]+/,''))   // list bullets and "1. " prefixes
    .map(s=>s.replace(/[),.;]+$/,''))
    .filter(s=>s && !s.startsWith('#'));
}
/* Dedupe on what the line actually resolves to, so "@MrBeast",
   "youtube.com/@mrbeast" and "https://www.youtube.com/@mrbeast?sub=1" all
   collapse to one entry instead of costing three quota units a sync. */
function canonCh(line){
  const p = parseChLine(line);
  if(!p) return null;
  return p.type==='id' ? 'id:'+p.value : 'h:'+p.value.replace(/^@/,'').toLowerCase();
}
function normalizeChannelLines(text){
  const raw = Array.isArray(text)? text : splitChannelText(text);
  const out=[], seen=new Set();
  for(const line of raw){
    const t = String(line).trim(); if(!t) continue;
    const key = canonCh(t); if(!key) continue;
    if(seen.has(key)) continue;
    seen.add(key); out.push(t);
  }
  return out;
}
/* Light pass used by autosave while you are still typing: keeps your lines
   exactly as written (no dedupe, no reordering) so the caret never jumps. */
function loosenChannelLines(text){
  return String(text||'').split('\n').map(s=>s.trim()).filter(Boolean);
}

/* Undo ring for the channel list specifically — it is the one field where a
   mis-click costs a re-sync, so every destructive action drops a restore point. */
let chUndoStack = [];
function pushChUndo(label){
  chUndoStack.push({list:draftLines(), label, at:Date.now()});
  if(chUndoStack.length>12) chUndoStack.shift();
}
function undoChannels(){
  const prev = chUndoStack.pop();
  if(!prev){ toast('Nothing to undo','warn'); return; }
  setDraftLines(prev.list); render();
  toast(`Undone — box back to ${prev.list.length} channel${prev.list.length===1?'':'s'}`,'ok');
}

async function readClipboard(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const t = await navigator.clipboard.readText();
      if(typeof t === 'string') return t;
    }
  }catch(e){}
  return null;   // blocked, unsupported, or the user declined — fall back to the box
}

async function pasteChannels(mode){
