}
function applyPastedChannels(text, mode){
  const incoming = normalizeChannelLines(text);
  if(!incoming.length){ toast('Nothing in the clipboard looked like a channel','warn'); return; }
  pushChUndo('paste');
  const before = draftLines().length;
  const merged = mode==='replace' ? incoming : normalizeChannelLines([...draftLines(), ...incoming]);
  setDraftLines(merged);
  const added = merged.length - (mode==='replace'? 0 : before);
  const dupes = incoming.length - (mode==='replace'? incoming.length : added);
  render();
  toast(mode==='replace'
    ? `List replaced with ${merged.length} channel${merged.length===1?'':'s'} — press Save changes to apply`
    : `Added ${added} channel${added===1?'':'s'}${dupes>0?` · ${dupes} duplicate${dupes===1?'':'s'} skipped`:''} — press Save changes to apply`, 'ok');

/* ═══════════════════════════════════════════════════════════
   DRAFTS — typing is never lost, and never destructive either
   ───────────────────────────────────────────────────────────
   Two failure modes, opposite directions, and both cost real work.

   Originally these fields were only read out of the DOM when you happened to
   press Save: type a list, refresh, gone. Making them commit as you type fixed
   that and introduced the worse one — a mis-select and a keystroke silently
   replaced the live channel list, and pruning followed it.

   A draft separates the two. What you type is written to storage immediately,
   so a refresh, a crash or a closed tab never loses it. But it stays a draft:
   the live settings, and everything that reads them, change only when you press
   Save. Discard puts the box back to what is actually in effect. Nothing you do
   in a text box can alter your data by accident, and nothing you type can
   evaporate.
   ═══════════════════════════════════════════════════════════ */
const DRAFT_FIELDS = { setChannels:'channels', setKey:'ytKey', setPatterns:'patterns' };
const DRAFT_LABEL  = { channels:'Channel list', ytKey:'API key', patterns:'Title patterns' };
function draftBag(){
  if(!STORE.drafts) STORE.drafts = {};
  const p = PID();
  if(!STORE.drafts[p]) STORE.drafts[p] = {};
  return STORE.drafts[p];
}
function liveValue(field){
  return field==='channels' ? (CFG.channels||[]).join('\n')
       : field==='ytKey'    ? (CFG.ytKey||'')
       : (CFG.titlePatterns||'');
}
function draftValue(field){
  const d = draftBag();
  return d[field]!==undefined ? d[field] : liveValue(field);
}
function setDraft(field, text){
  const d = draftBag();
  // a draft that matches what is live is not a draft
  if(text === liveValue(field)) delete d[field]; else d[field] = text;
  d.at = Date.now();
  return saveCfg();
}
function dirtyFields(){
  const d = draftBag();
  return Object.values(DRAFT_FIELDS).filter(f=>d[f]!==undefined && d[f]!==liveValue(f));
}
const isDirty = () => dirtyFields().length>0;
function commitDrafts(){
  const d = draftBag(), fields = dirtyFields();
  if(!fields.length) return {fields:[], ok:true};
  for(const f of fields){
    if(f==='channels')      CFG.channels = normalizeChannelLines(d.channels);
    else if(f==='ytKey')    CFG.ytKey = String(d.ytKey).trim();
    else if(f==='patterns') CFG.titlePatterns = d.patterns;
    delete d[f];
  }
  refilterChannels();
  return {fields, ok:saveCfg()};
}
function discardDrafts(){
  const d = draftBag(), fields = dirtyFields();
  fields.forEach(f=>delete d[f]);
  saveCfg();
  return fields;
}
/* The channel-list buttons edit the draft, not your data — the same rule as
   typing. Pasting 200 channels or clearing the box is a proposal until you save. */
function draftLines(){ return loosenChannelLines(draftValue('channels')); }
function setDraftLines(lines){
  setDraft('channels', lines.join('\n'));
  const el = document.getElementById('setChannels');
  if(el) el.value = draftValue('channels');
  renderDirtyBar();
}

let _dTimer=null, _dPending=new Set();
function scheduleAutosave(id){
  if(!DRAFT_FIELDS[id]) return;
  _dPending.add(id);
  markSaveState('pending');
  clearTimeout(_dTimer);
  _dTimer = setTimeout(flushPendingEdits, 400);
}
function flushPendingEdits(){
  flushNotes();                       // swipe-file notes ride the same flush points
  clearTimeout(_dTimer);
  if(!_dPending.size) return false;
  let ok = true;
  for(const id of [..._dPending]){
    const field = DRAFT_FIELDS[id], el = document.getElementById(id);
    _dPending.delete(id);
    if(!field || !el) continue;
    if(setDraft(field, el.value)===false) ok = false;
  }
  markSaveState(ok? 'saved' : 'failed');
  renderDirtyBar();
  return ok;
}
/* The unsaved-changes bar. It states exactly what is pending and offers the two
   ways out, so a draft can never quietly become the thing you are looking at. */
function dirtyBarHTML(){
  const fields = dirtyFields();
  if(!fields.length) return '';
  const detail = fields.map(f=>{
    if(f!=='channels') return DRAFT_LABEL[f];
    const before = (CFG.channels||[]).length;
    const after = normalizeChannelLines(draftValue('channels')).length;
    const diff = after-before;
    return `Channel list (${before} → ${after}${diff?`, ${diff>0?'+':''}${diff}`:''})`;
  }).join(' · ');
  const wipesAll = fields.includes('channels')
    && (CFG.channels||[]).length>0 && !normalizeChannelLines(draftValue('channels')).length;
  return `<div class="row wrapf dirtybar" style="gap:9px">
    ${ic('warn')}<span class="grow" style="font-size:var(--f-xs);min-width:200px">
      <b>Unsaved changes</b> — ${esc(detail)}. Nothing has been applied yet${wipesAll?', and saving this would empty your list':''}.</span>
    <button class="btn btn-sm btn-o" data-act="discardDrafts">${ic('undo')}Discard</button>
    <button class="btn btn-sm btn-p" data-act="saveSettings">${ic('check')}Save changes</button>
  </div>`;
}
function renderDirtyBar(){
  const host = document.getElementById('dirtyBar');
  if(host){ const h = dirtyBarHTML(); if(host._h !== h){ host.innerHTML = h; host._h = h; } }
  const cnt = document.getElementById('chCount');
  if(cnt){
    const n = normalizeChannelLines(draftValue('channels')).length;
    cnt.textContent = n;

  renderSideNav();

/* A quiet, honest indicator. "Saved" here means the write was read back and
   verified, not merely attempted — the whole point is that you can trust it. */
function markSaveState(state){
  const el = document.getElementById('saveState'); if(!el) return;
  if(state==='pending'){ el.innerHTML = `<span class="dim">saving…</span>`; return; }
  if(state==='failed'){ el.innerHTML = `<span style="color:var(--err)">save failed — export a backup</span>`; return; }
  el.innerHTML = `<span style="color:var(--ok)">${ic('check')}</span><span class="dim">saved</span>`;
}

/* Save is now a confirmation of work already persisted, not the only chance to
   persist it. It still normalises and prunes, because those are the deliberate
   actions you press a button for — but nothing you typed depends on reaching it. */
/* The only place drafts become real. Everything else is reversible by design. */
async function saveSettings(){
  Object.keys(DRAFT_FIELDS).forEach(id=>{ if(document.getElementById(id)) _dPending.add(id); });
  flushPendingEdits();
  const {fields, ok} = commitDrafts();
  if(!fields.length){ toast('Nothing to save','warn'); render(); return; }
  const removed = await pruneOrphans();
  S.page={};
  if(!ok){
    toast('Could not write to browser storage — use Export ALL profiles + data now to keep your work','err');
  }else{
    toast(removed? `Saved — ${removed} removed channel${removed===1?'':'s'} cleared from cache`
                 : `Saved — ${fields.map(f=>DRAFT_LABEL[f].toLowerCase()).join(', ')} applied`,'ok');
  }
  renderProfBar(); renderSideNav(); render();
}
async function testKey(){
  const el=document.getElementById('keyTest'); const k=document.getElementById('setKey').value.trim();
  if(!k){ el.textContent='Enter a key first'; return; }
  /* Tests the key in the box without committing it — the draft rule holds here
     too, so a typo you are checking never replaces the key that works. */
  const live = CFG.ytKey; CFG.ytKey = k; el.textContent='Testing…';
  try{ const j=await yt('videos',{part:'snippet',chart:'mostPopular',regionCode:'US',maxResults:1},1);
    el.innerHTML = j.items?.length? '<span style="color:var(--ok)">✓ Key works</span>' : '<span style="color:var(--warn)">Key accepted but returned nothing</span>';
  }catch(e){ el.innerHTML = `<span style="color:var(--err)">✗ ${esc(e.message)}</span>`; }
  finally{ CFG.ytKey = live; }
}
async function wipe(){
  const p = activeProfile();
  if(!(await askConfirm({title:`Wipe data for “${p.name}”?`, icon:'trash', destructive:true, okLabel:'Wipe Data',
    message:'Cached channels, videos and snapshots are deleted. Settings, your API key and other profiles are kept.'}))) return;
  for(const st of Object.values(STORES)){

    if(rows.length) await idbDelete(st, rows.map(r=>r._k));

/* ═══════════════════════════════════════════════════════════
   RECOVERY TOOLS — visible, manual versions of what boot does automatically
   ═══════════════════════════════════════════════════════════ */
const fmtBytes = b => { b=+b||0; if(b>=1073741824) return (b/1073741824).toFixed(1)+' GB';
  if(b>=1048576) return (b/1048576).toFixed(1)+' MB'; if(b>=1024) return (b/1024).toFixed(0)+' KB'; return b+' B'; };

/* Rebuild any profile's channel list from the channel rows it already cached.
   Separated out because boot needs it twice: once against whatever settings
   record survived, and again after a v1 migration lands new rows. */
async function healChannelLists(){
  const seen = await scanPids();
  const notes = [];
  for(const p of STORE.profiles){
    const e = seen.get(p.id); if(!e) continue;
    if(!p.cfg) p.cfg = {...DEF_CFG};
    if(!(p.cfg.channels||[]).length && e.chanRows.length){
      p.cfg.channels = linesFromChanRows(e.chanRows);
      notes.push(`rebuilt ${p.cfg.channels.length} channel${p.cfg.channels.length===1?'':'s'} for "${p.name}" from cached data`);
    }
  }
  if(notes.length) saveCfg();
  return notes;
}

/* The repair itself, shared by the post-paint integrity check and the manual
   Scan & repair button, so both can only ever behave identically. */
async function repairFromScan(){
  const notes = [];
  notes.push(...await healChannelLists());
  const seen = await scanPids();
  const known = new Set(STORE.profiles.map(p=>p.id));
  let adopted=0;
  for(const [pid,e] of seen){
    if(known.has(pid)) continue;
    const total = e.videos+e.channels+e.snapshots+e.trending;
    if(!total) continue;
    STORE.profiles.push({ id:pid, name:`Recovered ${new Date().toLocaleDateString()}${adopted?' ('+(adopted+1)+')':''}`,
      color:PCOLORS[STORE.profiles.length%PCOLORS.length],
      cfg:{...DEF_CFG, channels:linesFromChanRows(e.chanRows)} });
    adopted++;
    notes.push(`adopted ${nfull(total)} orphaned records`);
  }
  /* An adopted profile you can't get to is no better than an orphan. Only move
     when the profile you are on owns nothing at all — if it has data, that is a
     deliberate choice and switching under you would be its own kind of wrong. */
  if(adopted){
    const cur = seen.get(STORE.active);
    const curEmpty = !cur || !(cur.videos+cur.channels+cur.snapshots+cur.trending);
    if(curEmpty){
      const richest = [...seen.entries()].sort((a,b)=>
        (b[1].videos+b[1].channels)-(a[1].videos+a[1].channels))[0];
      if(richest && richest[1].videos+richest[1].channels){
        STORE.active = richest[0];
        notes.push(`switched to "${activeProfile().name}", which holds your data`);
      }
    }
  }
  if(!STORE.profiles.find(p=>p.id===STORE.active)) STORE.active = STORE.profiles[0].id;
  if(notes.length){
    saveCfg(); await flushMirror();
    await loadAll();
    renderProfBar(); renderSideNav(); render();
  }
  return notes;
}
async function repairStorage(){
  const notes = await repairFromScan();
  document.getElementById('modals').innerHTML='';
  renderProfBar(); renderSideNav(); render();
  toast(notes.length? `Repaired — ${notes.join('; ')}` : 'Nothing needed repairing','ok');
}

/* Every verified save leaves a restore point behind. These are settings and
   channel lists only — small, and precisely the part that goes missing. */
async function showBackups(){
  const baks = (await Promise.all([...Array(12)].map((_,i)=>idbGet('misc','store_bak_'+i))))
    .filter(m=>m && m.json)
    .map(m=>({...m, parsed:parseStore(m.json)}))
    .filter(m=>m.parsed)
    .sort((a,b)=>(b.rev|0)-(a.rev|0));
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:600px">
    <div class="mhead">${ic('clock')}<span class="grow">Recovery points</span>
      <button class="ib mclose" data-close="1" aria-label="Close" title="Close (Esc)">${ic('x')}</button></div>
    <div class="mbody">
      <div class="muted" style="font-size:var(--f-xs);line-height:1.65">
        A snapshot of your profiles, channel lists and thresholds is kept after every save.
        Restoring one puts those settings back; your cached videos and snapshots are never touched.</div>
      ${baks.length? baks.map(m=>{
        const chans = (m.parsed.profiles||[]).reduce((n,p)=>n+((p.cfg?.channels||[]).length),0);
        return `<div class="row" style="gap:9px;padding:9px 0;border-bottom:1px solid var(--rowline)">
          <div class="grow" style="min-width:0">
            <div style="font-weight:600;font-size:var(--f-sm)">Revision #${m.rev|0}${(m.rev|0)===(STORE._rev|0)?' <span class="tag">current</span>':''}</div>
            <div class="dim" style="font-size:var(--f-2xs)">${m.at?ago(m.at):'—'} · ${(m.parsed.profiles||[]).length} profile(s) · ${chans} channel(s)</div>
          </div>
          <button class="btn btn-sm btn-o" data-restorebak="${esc(m.k)}">${ic('undo')}Restore</button>
        </div>`;}).join('')
        : '<div class="dim" style="font-size:var(--f-xs)">No recovery points yet — they appear after your next save.</div>'}
    </div>
    <div class="mfoot"><span class="grow"></span><button class="btn btn-o" data-close="1">Close</button></div>
  </div></div>`;
}
async function restoreBackup(key){
  const m = await idbGet('misc', key);
  const parsed = m && parseStore(m.json);
  if(!parsed){ toast('That recovery point could not be read','err'); return; }
  const chans = (parsed.profiles||[]).reduce((n,p)=>n+((p.cfg?.channels||[]).length),0);
  if(!(await askConfirm({title:`Restore revision #${m.rev|0}?`, icon:'undo', okLabel:'Restore',
    message:`${(parsed.profiles||[]).length} profile(s), ${chans} channel(s). Your cached videos and snapshots are not affected.`}))) return;
  const keepRev = (STORE._rev|0) + 1;      // stay ahead so other tabs adopt this
  STORE = parsed; STORE._rev = keepRev;
  STORE_READY = true;
  saveCfg(); await flushMirror();
  await healChannelLists();
  invalidateBaselines(); S.filters={}; S.sort={}; await loadAll();
  document.getElementById('modals').innerHTML='';
  renderProfBar(); renderSideNav(); render();
  toast(`Restored revision #${m.rev|0}`,'ok');
}

/* ═══════════════════════════════════════════════════════════
   UI KIT — the interaction layer
   ───────────────────────────────────────────────────────────
   Menus, alerts, the command palette, appearance and the sidebar. All of it is
   additive: none of it touches data, and every action it offers routes through
   the same functions and data-attributes the rest of the app already uses, so
   each thing still happens in exactly one place.
   ═══════════════════════════════════════════════════════════ */
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
const MOD = IS_MAC? '⌘' : 'Ctrl+';
document.querySelectorAll('.modk').forEach(el=>{ el.textContent = IS_MAC? '⌘K' : 'Ctrl K'; });
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const isNarrow = () => !!(window.matchMedia && matchMedia('(max-width: 980px)').matches);

/* ─── Appearance: Light, Dark, or Auto (follows the system) ─── */
const _mqDark = window.matchMedia? matchMedia('(prefers-color-scheme: dark)') : null;
const THEME_NAME = {light:'Light', dark:'Dark', auto:'Auto'};
const themePick = () => (CFG.theme==='light' || CFG.theme==='dark')? CFG.theme : 'auto';
function resolvedTheme(){
  const t = themePick();
  if(t!=='auto') return t;
  return _mqDark && _mqDark.matches? 'dark' : 'light';
}
function applyTheme(){
  const h = document.documentElement, r = resolvedTheme();
  if(h.dataset.theme !== r){
    // every token flips in one frame — no half-light, half-dark cross-fade
    h.classList.add('no-trans');
    h.dataset.theme = r;
    requestAnimationFrame(()=>requestAnimationFrame(()=>h.classList.remove('no-trans')));
  }
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', r==='dark'? '#000000' : '#f5f5f7');
  const b = document.getElementById('themeBtn');
  if(b){
    const t = themePick();
    b.innerHTML = ic(t==='light'?'sun':t==='dark'?'moon':'auto');
    b.title = `Appearance: ${THEME_NAME[t]}${t==='auto'?' (follows system)':''} — click to change`;
    b.setAttribute('aria-label', b.title);
  }
}
function setTheme(t){
  CFG.theme = t; saveCfg(); applyTheme();
  document.querySelectorAll('[data-appearance]').forEach(x=>x.classList.toggle('on', x.dataset.appearance===t));
}
if(_mqDark){
  const f = ()=>{ if(themePick()==='auto') applyTheme(); };
  if(_mqDark.addEventListener) _mqDark.addEventListener('change', f);
  else if(_mqDark.addListener) _mqDark.addListener(f);
}
function setTextSize(k){ CFG.textSize = k; document.documentElement.dataset.text = k; saveCfg(); render(); }
function toggleDensity(){
  CFG.density = CFG.density==='compact'? 'normal' : 'compact';

}

/* ─── Swipe file: put back what an Undo toast promised, exactly as it was ─── */
function restoreSwipe(entries){
  const cur = swipeList().slice(), have = new Set(cur.map(x=>x.id));
  let n = 0;
  entries.slice().sort((a,b)=>a.i-b.i).forEach(({e,i})=>{
    if(have.has(e.id)) return;
    cur.splice(Math.min(i, cur.length), 0, e); have.add(e.id); n++;
  });
  if(!n){ toast('Already back in your swipe file','info'); return; }
  setSwipe(cur);
  if(S.view==='swipe') renderContentOnly(); else { paintAllStars(); paintCatChips(); }
  renderSelBar();
  toast(`Restored ${n===1?'':nfull(n)+' '}— notes and categories intact`,'ok');
}

/* ─── Pull-down menus ─────────────────────────────────────────
   Four or five format buttons in every header was the loudest thing on the
   screen and the least used. A pull-down keeps every format one click further
   in and clears the header for the view's real content. Items are ordinary
   buttons carrying the app's existing data-export / data-act attributes. */
const _pops = new Map();
let _popOpen = null;
const mi = (attrs, icon, label, sub='') =>
  `<button type="button" class="pm-item" role="menuitem" ${attrs}>${ic(icon)}<span class="grow">${label}</span>${sub?`<span class="pm-sub">${sub}</span>`:''}</button>`;
function popBtn(id, label, icon, items, cls='btn btn-sm btn-o'){
  _pops.set(id, items);
  return `<button type="button" class="${cls}" data-pop="${esc(id)}" aria-haspopup="menu" aria-expanded="false">${icon?ic(icon):''}${label}${ic('chevd','chev')}</button>`;
}
const FMT_META = {csv:['table','CSV','spreadsheet'], json:['braces','JSON','structured'],
  txt:['note','Plain text','.txt'], md:['note','Markdown','.md'], zip:['zip','All formats','.zip']};
function exportBtn(kind, fmts, attr='export'){

    return mi(attr==='export'? `data-export="${kind}|${f}"` : `data-${attr}="${f}"`, i, l, sub); }).join('');

/* ─── Alerts ──────────────────────────────────────────────────
   The browser's confirm() and prompt() are grey system boxes that freeze the
   page, can't say which button destroys data, and can't hold a colour picker.
   These are HIG alerts: a clear title, one line of consequence, a specific verb
   on the confirming button, destructive actions in red, Return to confirm and
   Escape to cancel. They never close on a stray backdrop click. */
let _dlg = null;
function uiDialog(o){
  return new Promise(resolve=>{
    if(_dlg) _dlg.finish(null, true);
    const host = document.getElementById('alerts');
    const prev = document.activeElement;
    const hasInput = o.input!==undefined && o.input!==null;
    const sw = o.swatches || null; let color = o.swatch || null;
    host.innerHTML = `<div class="abg"><div class="alert" role="alertdialog" aria-modal="true" aria-labelledby="alT"${o.message?' aria-describedby="alM"':''}>
      ${o.icon?`<div class="al-ico${o.destructive?' danger':''}">${ic(o.icon)}</div>`:''}
      <div class="al-t" id="alT">${esc(o.title||'')}</div>
      ${o.message?`<div class="al-m" id="alM">${esc(o.message).replace(/\n/g,'<br>')}</div>`:''}
      ${hasInput?`<input class="field al-in" id="alIn" value="${esc(o.input)}" placeholder="${esc(o.placeholder||'')}" maxlength="${o.maxlength||80}" autocomplete="off" spellcheck="false" aria-labelledby="alT">`:''}
      ${sw?`<div class="al-sw" role="radiogroup" aria-label="Colour">${sw.map(c=>`<button type="button" role="radio" aria-checked="${c===color}" aria-label="Colour ${c}" class="${c===color?'on':''}" style="--c:${c}" data-alc="${c}"></button>`).join('')}</div>`:''}
      <div class="al-b">
        <button type="button" class="btn" data-al="0">${esc(o.cancelLabel||'Cancel')}</button>
        <button type="button" class="btn ${o.destructive?'al-d':'btn-p'}" data-al="1">${esc(o.okLabel||'OK')}</button>
      </div></div></div>`;
    const inp = host.querySelector('#alIn');
    const onKey = e=>{
      const tg = e.target, ds = (tg && tg.dataset) || {};
      if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); cancel(); return; }
      if(e.key==='Enter' && !e.isComposing && ds.al!=='0' && !ds.alc){ e.preventDefault(); e.stopImmediatePropagation(); ok(); return; }
      if(e.key==='Tab'){
        const f = [...host.querySelectorAll('input,button')];
        const i = f.indexOf(document.activeElement);
        e.preventDefault();
        if(f.length) f[(i + (e.shiftKey?-1:1) + f.length) % f.length].focus();
      }
      e.stopImmediatePropagation();          // no app shortcut fires under an alert
    };
    const finish = (v, silent)=>{
      if(!_dlg) return; _dlg = null;
      document.removeEventListener('keydown', onKey, true);
      host.innerHTML = '';
      if(!silent){ try{ if(prev && document.contains(prev) && prev!==document.body) prev.focus({preventScroll:true}); }catch(e){} }
      resolve(v);
    };
    const ok = ()=>{ if(hasInput){ const v = inp.value; finish(sw? {value:v, color} : v); } else finish(true); };
    const cancel = ()=>finish(hasInput? null : false);
    document.addEventListener('keydown', onKey, true);
    host.querySelector('.abg').addEventListener('click', e=>{
      e.stopPropagation();
      const c = e.target.closest('[data-alc]');
      if(c){ color = c.dataset.alc;
        host.querySelectorAll('[data-alc]').forEach(x=>{ const on = x===c; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
        return; }
      const b = e.target.closest('[data-al]'); if(!b) return;
      b.dataset.al==='1'? ok() : cancel();
    });
    _dlg = {finish};
    requestAnimationFrame(()=>{
      if(inp){ inp.focus(); inp.select(); }
      else { const b = host.querySelector(o.destructive? '[data-al="0"]' : '[data-al="1"]'); if(b) b.focus(); }
    });
  });
}

function palMatch(q){
  const src = palSource();
  const qq = q.toLowerCase().trim();
  const toks = qq.split(/\s+/).filter(Boolean);
  let rows;
  if(!toks.length){
    rows = src.filter(x=>x.group==='Go to' || x.group==='Actions').map(x=>({...x, score:0}));
  } else {
    rows = [];
    for(const x of src){
      const hay = (x.label+' '+(x.sub||'')+' '+x.group).toLowerCase();
      if(!toks.every(t=>hay.includes(t))) continue;
      const l = x.label.toLowerCase();
      let s = l.startsWith(qq)? 100 : l.includes(qq)? 70 : 40;
      if(l.split(/[\s“”]+/).some(w=>w.startsWith(toks[0]))) s += 10;
      if(x.deep) s -= 5;
      rows.push({...x, score:s});
    }
    // videos are searched live against the cache, best-viewed first
    if(qq.length>=2){
      const hits = [];
      for(const v of S.videos){ const t = (v.title||'').toLowerCase(); if(toks.every(k=>t.includes(k))) hits.push(v); }
      hits.sort((a,b)=>b.views-a.views);
      hits.slice(0,8).forEach(v=>rows.push({group:'Videos', icon:'film', label:v.title||v.id, vid:v.id,
        sub:`${v.channelTitle||'—'} · ${nf(v.views)} views · ${dstr(v.publishedTs)}`,
        img:thumbUrl(v), run:()=>showVideo(v.id), score:30}));
    }
  }
  const ORDER = ['Go to','Actions','Channels','Videos','Swipe file','View','Date range','Profiles','Appearance'];
  const groups = new Map();
  for(const r of rows){ let g = groups.get(r.group); if(!g){ g=[]; groups.set(r.group, g); } g.push(r); }
  const gl = [...groups.entries()].map(([g,list])=>{
    list.sort((a,b)=>b.score-a.score);
    return {g, list: toks.length? list.slice(0, g==='Date range'? 9 : 8) : list, best:list[0].score};
  });
  gl.sort((a,b)=>(b.best-a.best) || (ORDER.indexOf(a.g)-ORDER.indexOf(b.g)));
  return gl.flatMap(x=>x.list);
}

/* ─── Keyboard: one capture-phase gate in front of every existing shortcut ───
   Whatever is on top — an alert, the palette, a menu, a picker — owns the keys
   first, so a letter typed into a menu can never start a sync underneath it. */
document.addEventListener('keydown', e=>{
  if(_dlg) return;                                   // the alert's own handler owns the keyboard
  const k = e.key;
  if((e.metaKey||e.ctrlKey) && !e.altKey && !e.shiftKey && (k==='k'||k==='K')){
    e.preventDefault(); e.stopImmediatePropagation();
    if(_pal) closePalette(); else openPalette();
    return; }
  if((e.metaKey||e.ctrlKey) && !e.altKey && k==='\\'){ e.preventDefault(); e.stopImmediatePropagation(); toggleSidebar(); return; }
  if(_pal){
    if(k==='Escape'){ e.preventDefault(); closePalette(); }
    else if(k==='ArrowDown' || k==='ArrowUp'){ e.preventDefault();
      const n = _pal.items.length; if(n){ _pal.sel = (_pal.sel + (k==='ArrowDown'?1:-1) + n) % n; palPaint(true); } }
    else if(k==='Enter' && !e.isComposing){ e.preventDefault(); palRun(_pal.sel); }
    else if(k==='Tab'){ e.preventDefault(); }
    e.stopImmediatePropagation();
    return;
  }
  if(_popOpen){
    const items = [...document.querySelectorAll('#popMenu .pm-item')];
    const i = items.indexOf(document.activeElement);
    if(k==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); closePop(true); return; }
    if(k==='ArrowDown' || k==='ArrowUp'){ e.preventDefault(); e.stopImmediatePropagation();
      if(items.length) items[(i + (k==='ArrowDown'?1:-1) + items.length) % items.length].focus(); return; }
    if(k==='Home' || k==='End'){ e.preventDefault(); e.stopImmediatePropagation();
      if(items.length) items[k==='Home'? 0 : items.length-1].focus(); return; }
    if(k==='Tab'){ closePop(); return; }
    if(k!=='Enter' && k!==' ') e.stopImmediatePropagation();
    return;
  }
  if(k==='Escape'){
    if(chPickOpen){ e.preventDefault(); e.stopImmediatePropagation(); chPickOpen=false; render();
      const b = document.querySelector('.mpick-btn'); if(b) b.focus({preventScroll:true}); return; }
    if(profMenuOpen){ e.preventDefault(); e.stopImmediatePropagation(); profMenuOpen=false; renderProfBar();
      const b = document.getElementById('profToggle'); if(b) b.focus({preventScroll:true}); return; }
    if(document.getElementById('sidebar').classList.contains('open')){ e.stopImmediatePropagation(); openSidebarMobile(false); return; }
  }
}, true);

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
const mine = rows => rows.filter(r=>r.pid===PID());
/* Reads this profile's rows through the pid index, all five in parallel, then
   applies the one filter that decides what counts. Everything downstream — every
   view, every metric, every export — reads S.channels / S.videos and is
   therefore consistent by construction rather than by each call site
   remembering to filter. */
async function loadAll(){
  const pid = PID();
  const [chRows, vidRows, snapRows, trRows, comm] = await Promise.all([
    idbByPid(STORES.channels, pid),
    idbByPid(STORES.videos, pid),
    idbByPid(STORES.snapshots, pid),
    idbByPid(STORES.trending, pid),
    idbGet('misc', 'comments_'+pid),
  ]);
  // a profile switch that landed while these were in flight must not overwrite
  // the newer profile's state with this one's
  if(PID() !== pid) return;

  /* Everything this profile owns, kept as the master copy. The arrays the app
     actually reads are derived from these, so putting a channel back on the
     list is a pure recompute rather than another trip to disk. */
  S.allChannels = chRows;
  S.allVideos = vidRows;
  S.allSnapshots = snapRows;
  S.trending = trRows.sort((a,b)=>a.ts-b.ts);
  S.comments = comm? comm.v : null;
  refilterChannels();
}
/* Applies the one filter that decides what counts, as a view over the masters.
   Editing the list changes every number immediately — the numbers can never
   describe a different set of channels than the list on screen, which is what
   let the header say 23 while the dashboard said 29. */
function refilterChannels(){
  const {active, stale} = splitByList(S.allChannels||[]);
  S.channels = active;
  S.staleChannels = stale;
  /* Drop only what is known to be delisted. A video whose channel row is
     missing entirely still counts — hiding it would under-report, which is the
     same error in the other direction. */
  const dropped = new Set(stale.map(c=>c.id));
  S.videos    = dropped.size? (S.allVideos||[]).filter(v=>!dropped.has(v.channelId))  : (S.allVideos||[]);
  S.snapshots = dropped.size? (S.allSnapshots||[]).filter(s=>!dropped.has(s.channelId)) : (S.allSnapshots||[]);
  invalidateBaselines();
}
async function boot(){
  applyTheme(); applySidebar();
  document.documentElement.dataset.density = CFG.density;
  document.documentElement.dataset.text = CFG.textSize||'m';

       1. ask for eviction protection BEFORE writing anything,
       2. reconcile BEFORE the first save, so a boot that started with an empty
          settings record can still find the real one (or the real data) instead
          of paving over it — saving is refused until this line has run,
       3. migrate v1 rows AFTER reconcile, so they get stamped with the surviving
          profile id rather than a freshly invented one,
       4. heal again afterwards, in case that migration is what brought the
          channel rows in. */
  /* Persistence is a policy request, not a precondition for a correct write —
     awaiting it just delayed first paint. */
  const persistP = requestPersistence();
  /* When localStorage handed over a usable record the active profile is already
     known, so the actual data read starts now and overlaps the integrity probe
     instead of queueing behind it. If the probe turns out to change which
     profile is active, or a v1 migration brings rows in, the read is simply
     redone — which only happens on the rare recovery path. */
  const optimisticPid = STORE._provisional? null : PID();
  const loadP = optimisticPid? loadAll().catch(()=>null) : null;

  const notes = await reconcileStore();
  const moved = await migrateV1();
  if(moved) notes.push(...await healChannelLists());

  if(loadP) await loadP;
  if(!optimisticPid || PID()!==optimisticPid || moved) await loadAll();
  else if(notes.length) refilterChannels();   // a rebuilt list changes what counts

  applyTheme(); applySidebar();
  document.documentElement.dataset.density = CFG.density;
  document.documentElement.dataset.text = CFG.textSize||'m';
  ensureDay();
  wireCrossTab(); wireFlush();
  /* Preserve context — a reload returns you to the view you were on. */
  try{ const sv = sessionStorage.getItem('signal_view'); if(sv && VIEW_FN[sv]) S.view = sv; }catch(e){}
  renderProfBar(); renderSideNav();
  // only worth a placeholder on very large catalogues — below that the first
  // render lands in a few ms and a spinner would just flash
  if(S.videos.length>5000){
    document.getElementById('content').innerHTML =
      `<div class="empty"><span class="spin" style="width:20px;height:20px"></span>
        <div class="t" style="margin-top:12px">Preparing ${nfull(S.videos.length)} videos…</div></div>`;
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }
  render();
  /* Say it out loud when something was repaired. A silent recovery is
     indistinguishable from the bug it just fixed. */
  if(notes.length){
    notes.slice(0,3).forEach((n,i)=>setTimeout(()=>toast('Recovered — '+n,'ok'), 600+i*900));
    console.info('[signal] recovery:', notes);
  }
  window.__ready = true;
  /* Everything below is after first paint: it must never delay the app being
     usable, and none of it changes what is on screen unless something is wrong. */
  persistP.then(()=>{
    if(HEALTH.persisted===false) console.warn('[signal] storage is best-effort — the browser may evict this data under pressure');
    if(S.view==='settings') render();
  });
  verifyMirrorLater();
  if(CFG.autoSync && CFG.ytKey && CFG.channels.length && Date.now()-CFG.lastSync > 20*36e5){
    setTimeout(()=>{ toast('Auto-syncing — 20h+ since last run'); syncAll(); }, 1200);
  }
  setInterval(()=>{ if(CFG.autoSync && CFG.ytKey && CFG.channels.length && !S.syncPids.has(PID())) syncAll(); }, 6*36e5);
}
/* A crash in boot used to leave a blank page with no explanation and no way
   back to your data. Fail loudly, and keep the export path reachable. */
boot().catch(err=>{
  console.error('[signal] boot failed', err);
  const c = document.getElementById('content');
  if(c) c.innerHTML = `<div class="empty"><div class="t">Something went wrong starting up</div>
    <div class="s">${esc(err && err.message || String(err))}</div>
    <div class="s" style="margin-top:8px">Your data is still on disk. Reload the page, and if this repeats, open the console for details.</div></div>`;
});
</script>
