  }
}
/* Repaint only the star controls for one id — starring must never cost a render.
   The same video can appear twice on a page (dashboard + feed), so all of them. */
function _paintStarBtn(b, on){
  if(b.classList.contains('on') === on) return;
  b.classList.toggle('on', on);
  b.setAttribute('aria-pressed', on? 'true':'false');
  b.title = on? 'In your swipe file — click to remove' : 'Star — save to your swipe file';
}
function paintStar(id){
  const on = isStarred(id);
  document.querySelectorAll(`[data-vstar="${CSS.escape(id)}"]`).forEach(b=>_paintStarBtn(b,on));
}
/* Same single-pass treatment as the selection, for "star this whole page". */
function paintAllStars(){
  const set = swipeSet();
  document.querySelectorAll('[data-vstar]').forEach(b=>_paintStarBtn(b, set.has(b.dataset.vstar)));
}

/* ─── CATEGORY OF A VIDEO — answered cheaply enough for the hot paths ───────────
   Board cards and table rows ask this once per row per render, so it is a
   memoised Map rebuilt only when swipe MEMBERSHIP changes — keyed on the very
   same PID()+_swipeVer that swipeSet() uses, so the two can never disagree.
   Three states, and they are all different: undefined = not in the swipe file at
   all, '' = saved but not filed, a string = the category it is filed under. */
let _catMap = null, _catMapKey = '';
function catOf(id){
  const k = PID()+':'+_swipeVer;
  if(!_catMap || _catMapKey!==k){
    _catMap = new Map();
    for(const e of swipeList()) _catMap.set(e.id, e.g||'');
    _catMapKey = k;
  }
  return _catMap.get(id);
}
/* Colour is derived from the name, never stored: a rename recolours, a category
   that comes in from an imported pack already has its colour, and there is no
   fourth place for the two to drift apart. Hues are spread and kept at one
   lightness so they read the same against both themes. */
const CAT_HUES = [212,266,330,14,40,150,190,240,300,96];
function catColor(name){
  let h = 0; const t = String(name||'');
  for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) >>> 0;
  return `hsl(${CAT_HUES[h%CAT_HUES.length]} 70% 62%)`;
}
const catDot = name => `<span class="cdot" style="background:${name? catColor(name) : 'var(--t4)'}"></span>`;
/* The tooltip the fourth action carries. The name lives here rather than on the
   meta line precisely because a tooltip costs no width. */
const catTitle = g => g? `In \u201C${g}\u201D — click to move it`
  : g===''? 'Saved, but not filed — click to put it in a category'
  : 'File this under a swipe-file category';
/* The same sentence, escaped for a title="" attribute — a category is named by
   hand, so it can contain a quote. Memoised on the name because the answer never
   changes for a given one and this runs once per row per render; the map is
   bounded by how many categories exist, which is a handful. */
const _catTitleAttr = new Map();
function catTitleAttr(g){
  const k = g===undefined? '\u0000' : g;
  let v = _catTitleAttr.get(k);
  if(v===undefined){ v = esc(catTitle(g)); _catTitleAttr.set(k, v); }
  return v;
}
/* Same paint-don't-render treatment the star gets. Filing a video from the board
   must not repaint the page to change one icon — that would re-decode every
   thumbnail on screen, which is the exact cost paintStar() and repaintBoard()
   exist to avoid. */
function paintCatChips(){
  document.querySelectorAll('.a-cat[data-swipecat]').forEach(b=>{
    const g = catOf(b.dataset.swipecat);
    b.classList.toggle('filed', !!g);
    b.style.setProperty('--cc', g? catColor(g) : '');
    b.title = catTitle(g);
  });
}

/* ═══════════════════════════════════════════════════════════
   MULTI-SELECT — ticking a card must not repaint the page
   ───────────────────────────────────────────────────────────
   The selection is a Set held outside the view, and toggling one patches
   exactly three things: the button, the row/card outline, and the floating bar.
   Re-rendering instead would re-decode every thumbnail on screen to change one
   checkbox — the same reasoning as syncPickerDom() and repaintBoard().
   The bar is position:fixed in its own host so it can never reflow the grid.
   ═══════════════════════════════════════════════════════════ */
function vselSet(){ if(!S.filters.vsel) S.filters.vsel = new Set(); return S.filters.vsel; }
const isVsel = id => vselSet().has(id);
const SEL_HOST = 'tr,.boardcard,.swipecard';
function _paintOne(b, on){
  if(b.classList.contains('sel-on') === on) return;
  b.classList.toggle('sel-on', on);
  b.setAttribute('aria-pressed', on? 'true':'false');
  const host = b.closest(SEL_HOST);
  if(host) host.classList.toggle('sel', on);
}
function paintVsel(id){
  const on = isVsel(id);
  document.querySelectorAll(`[data-vsel="${CSS.escape(id)}"]`).forEach(b=>_paintOne(b,on));
}
/* Bulk selection walks the DOM ONCE and asks the Set about each control, rather
   than running a fresh document-wide attribute query per id. The old shape was
   quadratic — "select all" on a 200-card page ran 200 full-document scans and
   took 32ms; this is a single pass and lands in about 2ms. */
function paintAllVsel(){
  const set = vselSet();
  document.querySelectorAll('[data-vsel]').forEach(b=>_paintOne(b, set.has(b.dataset.vsel)));
}
function toggleVsel(id){
  const set = vselSet();
  if(set.has(id)) set.delete(id); else set.add(id);
  paintVsel(id); renderSelBar();
}
function clearVsel(){
  if(!vselSet().size) return;
  vselSet().clear();
  paintAllVsel();
  renderSelBar();
}
function addVsel(ids){
  const set = vselSet();
  let added = 0;
  for(const id of ids){ if(!set.has(id)){ set.add(id); added++; } }
  if(added) paintAllVsel();
  renderSelBar();
  return added;
}
/* The videos currently on screen, in the order they are shown — what "select all
   visible" and the bulk actions operate on. */
function shownVideos(){
  if(S.view==='swipe'){
    const r = swipeVisible();
    return (CFG.swipeView||'notes')==='notes' ? r : pageSlice(r,'swipe');
  }
  if(S.view==='calendar') return calDayVideos();
  if(S.view==='board') return pageSlice(boardRows(),'board');
  if(S.view==='outliers') return pageSlice(sortRows(applyQ(enrichedInRange()).filter(v=>v.outlier>=CFG.outlierThreshold),'outliers'),'outliers');
  if(S.view==='feed') return pageSlice(sortRows(applyQ(enrichedInRange()),'feed'),'feed');
  return applyQ(enrichedInRange());
}
function pageSlice(rows, key){
  const per = CFG.perPage || 50;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const page = Math.min(Math.max(1, S.page[key]||1), pages);
  return rows.slice((page-1)*per, page*per);
}
function selectedVideos(){
  const set = vselSet();
  if(!set.size) return [];
  const out=[];
  for(const id of set){ const v=findVid(id); if(v) out.push(v); }
  return out.sort((a,b)=>(b.outlier||0)-(a.outlier||0));
}
/* ─── The bar is built ONCE and patched thereafter ───────────────
   It used to rewrite its own innerHTML on every single tick, which meant the
   element was destroyed and rebuilt each time — so the entrance animation
   replayed on every click (the flicker), fifty-odd nodes were re-parsed per
   selection (the lag), and because the bar is centre-anchored, any change in its
   width moved BOTH edges. Its width changed constantly: "1 selected" is narrower
   than "200 selected", and "Star all" is narrower than "Unstar all". That is the
   bar sliding left and right under the cursor.

   Now: the markup is created the moment the selection goes from none to some,
   and after that only two pieces of TEXT are written — never the structure. The
   two variable-width pieces are given fixed boxes below, so the bar's width is
   constant from the first selection to the last and it cannot move at all. The
   animation runs exactly once, on a genuine appearance. */
let _selBarHTML = null;
function selBarHTML(){
  if(_selBarHTML) return _selBarHTML;
  _selBarHTML = `<div class="selbar" role="toolbar" aria-label="Bulk actions"><div class="sb-in">
    <span class="selcount" id="selCount" aria-live="polite">0 selected</span>
    <button class="btn btn-sm btn-p" data-act="cmpThumbs">${ic('film')}Compare thumbnails</button>
    <button class="btn btn-sm btn-o" data-act="starSel" id="selStar">${ic('star')}<span class="sellbl" id="selStarLbl">Star all</span></button>
    <button class="btn btn-sm btn-o" data-act="copySelUrls">${ic('copy')}Copy URLs</button>
    <button class="btn btn-sm btn-o" data-act="copySelBrief">${ic('sparkles')}Copy brief</button>
    <button class="btn btn-sm btn-o" data-act="catSel"
      title="File these under a swipe-file category — saving any that aren't starred yet">${ic('tag')}Category</button>
    <button class="btn btn-sm btn-o" data-act="exportSel">${ic('table')}CSV</button>
    <button class="btn btn-sm btn-o" data-act="selAllShown">${ic('sqc')}Select all shown</button>
    <button class="ib" data-act="clearSel" title="Clear selection (Esc)" aria-label="Clear selection">${ic('x')}</button>
  </div></div>`;
  return _selBarHTML;
}
function renderSelBar(){
  const host = document.getElementById('selbar'); if(!host) return;
  const n = vselSet().size;
  document.body.classList.toggle('has-selbar', n>0);
  if(!n){ if(host.firstChild) host.innerHTML=''; return; }
  if(!host.firstChild) host.innerHTML = selBarHTML();
  const cnt = document.getElementById('selCount');
  const txt = nfull(n)+' selected';
  if(cnt && cnt.textContent !== txt) cnt.textContent = txt;
  // counted in a loop rather than [...set].filter(): no array to allocate on a
  // path that runs on every single click
  const sw = swipeSet();
  let starred = 0;
  for(const id of vselSet()) if(sw.has(id)) starred++;
  const allOn = starred >= n;
  const lbl = document.getElementById('selStarLbl');
  const want = allOn? 'Unstar all' : 'Star all';
  if(lbl && lbl.textContent !== want) lbl.textContent = want;
  const btn = document.getElementById('selStar');
  /* The "(N new)" detail moved into the tooltip — as a label it changed width on
     every tick, which is exactly what made the bar wander. */
  if(btn) btn.title = allOn ? `Remove all ${nfull(n)} from your swipe file`
    : starred ? `Save the ${nfull(n-starred)} of these that aren't in your swipe file yet`
    : `Save all ${nfull(n)} to your swipe file`;
}

/* One renderer for the three corner controls, used by every surface that shows a
   video — table rows, board cards, the calendar drill-down and the swipe file —
   so a video is starrable wherever you happen to spot it.

   This is the hottest string in the app: three controls x 200 rows x every
   render. Each one is now a SINGLE empty button whose icon is a CSS mask, so a
   row costs three nodes instead of ten. On a 200-row feed that is 1,200 fewer
   elements and about 20ms less layout per render — and it means flipping a
   control's state is a class toggle, never an innerHTML write.

   Ids go in raw, exactly as the neighbouring thumbLink() and boardGrid()
   already do with data-vid: a YouTube video id is [A-Za-z0-9_-]{11}. The paint
   helpers use CSS.escape() on the way back out. */
const _A0 = '<span class="vacts"><button class="vact a-sel', _A1 = '" data-vsel="',
      _A2 = '" title="Select for bulk actions" aria-pressed="',
      _A4 = '"></button><button class="vact a-star', _A5 = '" data-vstar="',
      _A6on  = '" title="In your swipe file — click to remove" aria-pressed="true"></button>',
      _A6off = '" title="Star — save to your swipe file" aria-pressed="false"></button>',
      _A7 = '<button class="vact a-info" data-vopen="',
      _A8 = '" title="Full breakdown"></button><button class="vact a-cat',
      _A9 = '" data-swipecat="', _A10 = '" style="--cc:', _A11 = '" title="', _A12 = '"></button></span>';
function videoActs(v){
  const id = v.id, st = isStarred(id), se = isVsel(id);
  const g = catOf(id);
  return _A0 + (se?' sel-on':'') + _A1 + id + _A2 + (se?'true':'false')
    + _A4 + (st?' on':'') + _A5 + id + (st?_A6on:_A6off)
    + _A7 + id + _A8 + (g?' filed':'') + _A9 + id
    + (g? _A10 + catColor(g) : '') + _A11 + catTitleAttr(g) + _A12;
}

/* ═══════════════════════════════════════════════════════════
   CALENDAR — the niche's publishing schedule, day by day
   ───────────────────────────────────────────────────────────
   One pass over the already-enriched, already-filtered rows builds a day index;
   the month grids, the busiest/best-day headline and the weekday strip all read
   it. Memoised on exactly the inputs that can change what a day contains —
   dataset version, range, channel selection, search, Shorts and minimum views —
   so flipping metric or month count is pure re-render with no recompute.

   Days are keyed in LOCAL time, matching pubHour / pubDay / pubTime everywhere
   else: a calendar that disagreed with the upload clock by a timezone offset
   would be worse than no calendar.
   ═══════════════════════════════════════════════════════════ */
const dayKey = ts => { const d = new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let _calCache=null, _calKey='';
function calendarIndex(){
  const key = [dataKey(), S.range, CFG.rangeFrom||'', CFG.rangeTo||'', selSig(),
    S.filters.q||'', CFG.includeShorts?1:0, CFG.minViews||0].join('|');
  if(_calCache && _calKey===key) return _calCache;
  const m = new Map();
  for(const v of applyQ(enrichedInRange())){
    const k = dayKey(v.publishedTs);
    let e = m.get(k);
    if(!e){ e = {k, n:0, views:0, likes:0, comments:0, outs:[], vids:[]}; m.set(k,e); }
    e.n++; e.views+=v.views; e.likes+=v.likes; e.comments+=v.comments;
    e.outs.push(v.outlier); e.vids.push(v);
  }
  m.forEach(e=>{
    e.med = +median(e.outs).toFixed(2);
    e.medViews = Math.round(median(e.vids.map(v=>v.views)));
    e.chans = new Set(e.vids.map(v=>v.channelId)).size;
    e.best = e.vids.reduce((a,b)=>(a && a.outlier>=b.outlier)? a : b, null);
  });
  _calCache=m; _calKey=key;
  return _calCache;
}
const CAL_METRICS = [
  {k:'uploads', l:'Uploads', get:d=>d.n,        fmt:v=>nfull(v),         word:'uploads',        top:'Busiest day'},
  {k:'views',   l:'Views',   get:d=>d.views,    fmt:v=>nf(v),            word:'combined views', top:'Biggest day'},
  {k:'median',  l:'Median',  get:d=>d.medViews, fmt:v=>nf(v),            word:'median views',   top:'Highest median'},
  {k:'outlier', l:'Outlier', get:d=>d.med,      fmt:v=>v.toFixed(1)+'×', word:'median outlier', top:'Strongest day'},
];
const calMetric = () => CAL_METRICS.find(m=>m.k===(CFG.calMetric||'uploads')) || CAL_METRICS[0];
function calDayVideos(){
  const d = calendarIndex().get(S.filters.calDay);
  return d? [...d.vids].sort(boardCmp[calSortKey()]||boardCmp.outlier) : [];
}
/* Channels that have stopped publishing — measured against THEIR OWN cadence,
   not a fixed number of days. A channel that posts three times a day going quiet
   for a week is a far louder signal than a monthly channel doing the same, and a
   single global threshold cannot say that. */
function quietChannels(){
  const idx = channelIndex();
  const now = Date.now();
  const out = [];
  for(const c of selectedChannelObjs()){
    const list = idx.get(c.id);
    if(!list || !list.length) continue;
    const last = list[0].publishedTs;
    const silent = Math.floor((now-last)/864e5);
    const gaps=[], lim=Math.min(20, list.length-1);
    for(let i=0;i<lim;i++) gaps.push((list[i].publishedTs-list[i+1].publishedTs)/864e5);
    const norm = gaps.length? median(gaps) : null;
    const ratio = norm!=null? +(silent/Math.max(0.5,norm)).toFixed(1) : null;
    out.push({c, silent, last, norm: norm!=null? +norm.toFixed(1):null, ratio});
  }
  return out
    .filter(x => x.ratio!=null ? (x.ratio>=2 && x.silent>=3) : x.silent>=21)
    .sort((a,b)=>b.silent-a.silent);
}

/* ═══════════════════════════════════════════════════════════
   CHART HELPERS (pure SVG, no libs)
   ═══════════════════════════════════════════════════════════ */
/* An item may carry {act:'vopen', key:'<id>'} — then the row renders as a button
   carrying that data attribute and the existing delegated click handler picks it
   up. Without it the markup is byte-for-byte what it always was, so every
   existing caller is untouched and nothing gains a cursor it can't use. */
function barList(items, {max, fmt=nf, sub}={}){
  if(!items.length) return emptyState('chart','Nothing to chart yet','Run a sync to populate this panel.');
  const m = max || Math.max(...items.map(i=>i.value),1);
  return `<div class="bars">${items.map(i=>{
    const inner = `<div class="bl"><span class="n" title="${esc(i.tip||i.label)}">${esc(i.label)}</span><b>${fmt(i.value)}${i.suffix||''}</b></div>
      <div class="track"><i style="width:${(i.value/m*100).toFixed(1)}%"></i></div>
      ${i.sub?`<div class="dim" style="font-size:var(--f-2xs);margin-top:3px">${esc(i.sub)}</div>`:''}`;
    return i.act
      ? `<button class="bar-item" data-${esc(i.act)}="${esc(i.key)}" title="${esc(i.tip||i.label)}">${inner}</button>`
      : `<div class="bar-item">${inner}</div>`;
  }).join('')}</div>`;
}
/* A 74px-wide sparkline cannot resolve 60 points — every extra point is markup
   the parser and layout engine pay for and the eye never sees. Downsampling to
   at most 1 point per ~5px is pixel-identical at these sizes and cut the feed's
   HTML by roughly a third. Endpoints and the min/max are always kept so the
   shape and the rising/falling colour stay exact. */
function sparkline(series, w=120, h=26){
  if(!series || series.length<2) return '<span class="dim s10">—</span>';
  const cap = Math.max(8, Math.round(w/5));
  let s = series;
  if(series.length > cap){
    const last = series.length-1, step = last/(cap-1), out=[];
    for(let i=0;i<cap;i++) out.push(series[Math.round(i*step)]);
    out[0]=series[0]; out[cap-1]=series[last];
    s = out;
  }
  let min=Infinity, max=-Infinity;
  for(const v of series){ if(v<min)min=v; if(v>max)max=v; }   // scale from the FULL series
  const rng=(max-min)||1, n=s.length-1;
  let pts='';
  for(let i=0;i<s.length;i++){
    pts += (i?' ':'') + (i/n*w).toFixed(1) + ',' + (h-((s[i]-min)/rng)*h).toFixed(1);
  }
  const rising = series[series.length-1]>=series[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${rising?'var(--ok)':'var(--err)'}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function heatmap(grid){
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const flat = grid.flat().filter(c=>c.n>0);
  const total = flat.reduce((a,c)=>a+c.n,0);
  if(total<10) return `<div class="row" style="gap:9px;padding:13px;background:var(--code);border-radius:var(--r2)">
    ${ic('info')}<span style="font-size:var(--f-xs)" class="muted">Only <b style="color:var(--t1)">${total}</b> video${total===1?'':'s'} in range — a 7×24 grid needs a few hundred before the pattern is real. Widen the range.</span></div>`;
  const max = Math.max(...flat.map(c=>c.med),1);
  let h = '<div class="heat-grid"><div></div>';
  for(let i=0;i<24;i++) h += `<div class="hh">${i%3===0?i:''}</div>`;
  grid.forEach((row,d)=>{
    h += `<div class="hd">${D[d]}</div>`;
    row.forEach((c,hr)=>{
      const a = c.n? clamp(c.med/max,0.08,1) : 0;
      h += `<div class="heat-cell" style="background:${c.n?`color-mix(in srgb, var(--heat) ${(a*100).toFixed(0)}%, transparent)`:'var(--hov)'}" title="${D[d]} ${hr}:00 — ${c.n} videos, median outlier ${c.med}×"></div>`;
    });
  });
  return h+'</div>';
}
function emptyState(icon,t,s,action){
  return `<div class="empty">${ic(icon)}<div class="t">${esc(t)}</div><div class="s">${esc(s||'')}</div>${action||''}</div>`;
}
/* 24-hour upload clock: bar height = how many videos land in that hour,
   bar colour = how well that hour's videos actually performed. Publishing
   volume and publishing success are different questions and this shows both. */
function uploadClock(vids){
  if(!vids.length) return emptyState('clock','No uploads in range','Widen the range to see the pattern.');
  if(vids.length<6) return `<div class="row" style="gap:9px;padding:13px;background:var(--code);border-radius:var(--r2)">
    ${ic('info')}<span style="font-size:var(--f-xs)" class="muted">Only <b style="color:var(--t1)">${vids.length}</b> upload${vids.length===1?'':'s'} in this range — not enough to read a pattern.
    Switch to <b style="color:var(--t1)">3 months</b> or wider and the clock becomes meaningful.</span></div>`;
  const hours = Array.from({length:24},(_,h)=>{
    const g = vids.filter(v=>v.pubHour===h);
    return {h, n:g.length, med:g.length? +median(g.map(v=>v.outlier)).toFixed(2):0,
      views:g.length? Math.round(median(g.map(v=>v.views))):0};
  });
  const maxN = Math.max(...hours.map(x=>x.n),1);
  const maxMed = Math.max(...hours.map(x=>x.med),1);
  const busiest = [...hours].sort((a,b)=>b.n-a.n)[0];
  const bestPerf = [...hours].filter(x=>x.n>=2).sort((a,b)=>b.med-a.med)[0];
  return `
  <div style="display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:8px">
    ${hours.map(x=>{
      const a = x.n? clamp(x.med/maxMed,.18,1) : 0;
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"
        title="${String(x.h).padStart(2,'0')}:00 — ${x.n} video${x.n===1?'':'s'}, median ${x.med}× outlier, median ${nf(x.views)} views">
        <div style="height:${x.n? Math.max(4,x.n/maxN*100):2}%;border-radius:4px 4px 2px 2px;
          background:${x.n?`color-mix(in srgb, var(--heat) ${(a*100).toFixed(0)}%, var(--panel3))`:'var(--hov)'};
          transition:height .3s var(--ease)"></div></div>`;}).join('')}
  </div>
  <div style="display:flex;gap:3px;margin-bottom:12px">
    ${hours.map(x=>`<div style="flex:1;text-align:center;font-size:var(--f-2xs);color:var(--t4)">${x.h%3===0?String(x.h).padStart(2,'0'):''}</div>`).join('')}
  </div>
  <div class="row wrapf" style="gap:8px">
    <span class="chip">Busiest hour <b>${String(busiest.h).padStart(2,'0')}:00</b> · ${busiest.n} uploads</span>
    ${bestPerf?`<span class="chip on">Best performing <b>${String(bestPerf.h).padStart(2,'0')}:00</b> · ${bestPerf.med}× median</span>`:''}
    <span class="dim" style="font-size:var(--f-2xs);align-self:center">Bar height = upload volume · colour intensity = median outlier score</span>
  </div>`;
}

async function importProfilePack(j){
  if(j._signal!=='profile-pack'){ // fall back to the older flat backup shape
    if(j.cfg||j.videos) return importLegacyBackup(j);
    throw new Error('Unrecognised file');
  }
  let added=0;
  const landed=[];   // {id, rows} so we can finish on the profile worth looking at
  for(const p of (j.profiles||[])){
    const clash = STORE.profiles.some(x=>x.id===p.id);
    const newId = clash? uid() : p.id;
    const name = clash? p.name+' (imported)' : p.name;
    STORE.profiles.push({...p, id:newId, name});
    // re-stamp every record onto the (possibly new) profile id
    let rowsForThis = 0;
    for(const [logical, st] of Object.entries(STORES)){
      const rows = (j.data?.[logical]||[]).filter(r=>r.pid===p.id)
        .map(r=>({...r, pid:newId, _k:`${newId}::${String(r._k||'').split('::').slice(1).join('::')||r.id||r.key||r.ts}`}));
      if(rows.length){ await idbPut(st, rows); added += rows.length; rowsForThis += rows.length; }
    }
    for(const m of (j.data?.comments||[])){
      if(m.k==='comments_'+p.id) await idbPut('misc',{k:'comments_'+newId, v:m.v});
    }
    landed.push({id:newId, rows:rowsForThis});
  }
  /* Finish on the profile that actually carries data. Landing on whichever one
     happened to be last in the file — routinely an empty one — makes a perfectly
     good restore look like it did nothing, which is the exact panic this whole
     change is meant to remove. */
  const best = landed.slice().sort((a,b)=>b.rows-a.rows)[0];
  if(best) STORE.active = best.id;
  saveCfg(); await flushMirror();
  invalidateBaselines(); S.filters={}; await loadAll();
  renderProfBar(); renderSideNav(); render();
  toast(`Imported ${j.profiles?.length||0} profile(s) · ${nfull(added)} records`,'ok');
}
async function importLegacyBackup(j){
  const pid = uid();
  STORE.profiles.push({id:pid, name:'Imported '+todayPT(), color:PCOLORS[STORE.profiles.length%PCOLORS.length],
    cfg:{...DEF_CFG, ...(j.cfg||{})}});
  STORE.active = pid;
  const map = {channels:'channels', videos:'videos', snapshots:'snapshots', trending:'trending'};
  for(const [k, logical] of Object.entries(map)){
    const rows = (j[k]||[]).map(r=>{
      const idf = logical==='snapshots'?'key' : logical==='trending'?'ts':'id';
      return {...r, pid, _k:`${pid}::${r[idf]}`};
    });
    if(rows.length) await idbPut(STORES[logical], rows);
  }
  saveCfg(); invalidateBaselines(); await loadAll();
  renderProfBar(); renderSideNav(); render(); toast('Legacy backup imported as a new profile','ok');
}

/* Rebuilds only the main panel, leaving the toolbar (and therefore the open
   channel menu) untouched. Used while the picker is open so the menu you are
   clicking in is never destroyed underneath you. */
/* A background sync finishing while you were mid-paste used to wipe the textarea
   and repaint it from disk — text gone, no warning, no undo. Capture whatever is
   focused (and exactly where the caret sits) before the swap and put it back
   after, uncommitted keystrokes included. */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return null;
  let start=null,end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return {id:el.id, value:el.value, start, end, scroll:el.scrollTop};
}
function restoreFocus(f){
  if(!f) return;
  const el = document.getElementById(f.id);
  if(!el) return;
  if(el.value !== f.value) el.value = f.value;
  try{ el.focus({preventScroll:true}); if(f.start!=null) el.setSelectionRange(f.start,f.end); }catch(e){}
  el.scrollTop = f.scroll;
}
function renderContentOnly(){
  const f = captureFocus();
  const c = document.getElementById('content');
  const fn = VIEW_FN[S.view];

/* ─────────── DASHBOARD ─────────── */
function vDash(){
  if(!CFG.ytKey) return setupCard();
  const vids = enrichedInRange();
  // score this week's uploads against the wider range's median, not just against each other
  const week = vids.filter(v=>v.publishedTs >= Date.now()-7*864e5);
  const hot = vids.filter(v=>v.outlier>=CFG.outlierThreshold).sort((a,b)=>b.outlier-a.outlier);
  const totalViews = vids.reduce((a,v)=>a+v.views,0);
  const accel = vids.map(v=>({v,m:momentumOf(v.id)})).filter(x=>x.m&&x.m.accel>1.4).length;
  /* Period-over-period: the same window immediately before this one, so every
     headline number carries a direction instead of sitting there context-free. */
  const {from,to} = rangeBounds();
  const span = (to===Infinity? Date.now():to) - from;
  // built from the same predicate as the current period so the delta compares like with like
  const prevVids = (S.range==='all')? [] : enrich(S.videos.filter(v=>
      v.publishedTs>=from-span && v.publishedTs<from
      && (CFG.includeShorts||!v.isShort) && isSel(v.channelId)));
  const delta = (cur, prev) => {
    if(!prev) return '';
    const d = (cur-prev)/prev*100;
    if(!isFinite(d) || Math.abs(d)<1) return `<span class="dim">flat vs prior</span>`;
    return `<span style="color:${d>0?'var(--ok)':'var(--err)'}">${d>0?'▲':'▼'} ${Math.abs(d).toFixed(0)}% vs prior ${RANGES[S.range]||'period'}</span>`;
  };
  const prevViews = prevVids.reduce((a,v)=>a+v.views,0);
  const medNow = median(vids.map(v=>v.views)), medPrev = median(prevVids.map(v=>v.views));
  const kpis = [
    {v:nfull(selCount()), k:isFiltered()?'Channels selected':'Channels tracked', i:'users',
      /* Listed-but-never-synced channels are called out rather than silently
         making this tile disagree with the list in Settings. */
      d: isFiltered()? `<span style="color:var(--acc)">filtered of ${S.channels.length}</span>`
        : (CFG.channels.length>S.channels.length
            ? `<span class="dim">${CFG.channels.length-S.channels.length} listed, not yet synced</span>` : '')},
    {v:nfull(vids.length), k:`Videos · ${rangeLabel()}`, i:'film', d:delta(vids.length, prevVids.length)},
    {v:nf(totalViews), k:'Combined views', i:'eye', d:delta(totalViews, prevViews)},
    {v:nf(Math.round(medNow)), k:'Median views / video', i:'chart', d:delta(medNow, medPrev)},
    {v:nfull(hot.length), k:`Outliers ≥${CFG.outlierThreshold}×`, i:'target', d:hot.length?`<span style="color:var(--acc)">top ${hot[0].outlier}×</span>`:''},
    {v:nfull(week.length), k:'Published last 7 days', i:'feed'},
  ];
  /* These used to be inert text: the dashboard would tell you something scored

/* One thumbnail renderer everywhere, so a fix here fixes every view.
   Falls back through YouTube's own CDN sizes if the stored URL is missing. */
function thumbUrl(v, big){
  if(big && v.thumbHi) return v.thumbHi;
  if(v.thumb) return v.thumb;
  return v.id? `https://i.ytimg.com/vi/${v.id}/${big?'hqdefault':'mqdefault'}.jpg` : '';
}
/* decoding="async" keeps image decode off the critical path so a redraw never
   blocks on it. The fallback moved from a per-image inline onerror (which is a
   parsed script attribute on every row) to one delegated capture listener. */
function thumbLink(v, cls=''){
  return `<a class="thumblink${v.stale?' uncached':''}" href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><img class="vthumb ${cls}" loading="lazy" decoding="async" src="${esc(thumbUrl(v))}" data-vid="${v.id}" alt="">${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}${v.stale?'<span class="uncachedbadge" title="No longer in the video cache — showing what was saved">UNCACHED</span>':''}</a>`;
}
/* A missing thumbnail used to drop straight to mqdefault — 320x180 — which at
   the 684px the breakdown dialog renders it is a blurry mess. YouTube generates
   maxres only for some uploads, so a miss there is common and must not cost you
   three quarters of the resolution. Big images now walk down a real ladder and
   stop at the first size that exists; small ones start low, because asking for
   1280x720 to paint a 142px row thumbnail is pure bandwidth.
   sd/hq are 4:3 with letterbox bars, which object-fit:cover trims back off. */
const FB_BIG   = ['maxresdefault','sddefault','hqdefault','mqdefault','default'];
const FB_SMALL = ['mqdefault','hqdefault','default'];
addEventListener('error', e=>{
  const img = e.target;
  if(!(img instanceof HTMLImageElement) || !img.dataset.vid) return;
  const ladder = img.dataset.big ? FB_BIG : FB_SMALL;
  let step = +(img.dataset.fb||0);
  if(step >= ladder.length) return;              // every size tried; leave it be
  img.dataset.fb = step+1;
  img.src = `https://i.ytimg.com/vi/${img.dataset.vid}/${ladder[step]}.jpg`;
}, true);
function sortRows(rows, key){
  const s = S.sort[key] || {c:'outlier', d:-1};
  return [...rows].sort((a,b)=>{
    const x=a[s.c], y=b[s.c];
    if(typeof x==='string') return s.d * x.localeCompare(y);
    return s.d * ((x||0)-(y||0));
  });
}
const COLS = [

function pager(key, total, per, page){
  const pages = Math.ceil(total/per);
  if(pages<=1) return '';
  const win=[]; const add=n=>{ if(n>=1&&n<=pages&&!win.includes(n)) win.push(n); };
  add(1); for(let i=page-2;i<=page+2;i++) add(i); add(pages);
  win.sort((a,b)=>a-b);
  let out='';
  win.forEach((n,i)=>{ if(i && n-win[i-1]>1) out+=`<span class="pgdots" aria-hidden="true">…</span>`;
    out+=`<button class="pgbtn ${n===page?'on':''}" data-page="${key}|${n}" aria-label="Page ${n}"${n===page?' aria-current="page"':''}>${n}</button>`; });
  return `<nav class="pagerow" aria-label="Pages">
    <button class="pgbtn" data-page="${key}|${Math.max(1,page-1)}" ${page===1?'disabled':''} aria-label="Previous page" title="Previous page">${ic('chevl')}</button>
    ${out}
    <button class="pgbtn" data-page="${key}|${Math.min(pages,page+1)}" ${page===pages?'disabled':''} aria-label="Next page" title="Next page">${ic('chevr')}</button>
    <span class="pginfo">${nfull((page-1)*per+1)}–${nfull(Math.min(total,page*per))} of ${nfull(total)}</span>
    <span class="right seg plain sm" role="group" aria-label="Rows per page">
      ${[25,50,100,200].map(n=>`<button class="${per===n?'on':''}" data-perpage="${n}" title="${n} per page" aria-pressed="${per===n}">${n}</button>`).join('')}
    </span></nav>`;

/* Paging and sorting change only the table. Rebuilding the whole view for them
   also rebuilds the KPI row, panels, toolbar and the picker's 13 avatars — all
   identical output, all thrown away and re-laid-out. These two helpers let those
   interactions swap just the table region, which is what makes them feel instant.
   If anything is missing we fall back to a normal full render, so behaviour is
   unchanged either way. */
const TABLE_VIEWS = {
  feed:     ()=>({key:'feed',     rows:sortRows(applyQ(enrichedInRange()),'feed')}),
  outliers: ()=>({key:'outliers', rows:sortRows(applyQ(enrichedInRange()).filter(v=>v.outlier>=CFG.outlierThreshold),'outliers')}),
  board:    ()=>({key:'board',    rows:boardRows()}),
  swipe:    ()=>({key:'swipe',    rows:swipeVisible()}),
};
function fastTableUpdate(wantKey){
  const build = TABLE_VIEWS[S.view];
  if(!build) return false;
  const {key, rows} = build();
  if(key!==wantKey) return false;
  const host = document.getElementById('tblhost-'+key);
  if(!host) return false;
  /* Paging must not move the page. Swapping innerHTML momentarily collapses the
     container's height, which the browser clamps the scroll position against —
     so the offset is captured and restored around the swap. */
  const y = window.scrollY;
  host.style.minHeight = host.offsetHeight + 'px';
  host.innerHTML = key==='board' ? boardGrid(rows,'board')
    : key==='swipe' ? swipeBody(rows)
    : (key==='feed' && CFG.feedView==='thumbs') ? boardGrid(rows,'feed')
    : videoTable(rows, key);
  window.scrollTo(0, y);
  requestAnimationFrame(()=>{ host.style.minHeight=''; window.scrollTo(0, y); });
  return true;
}

/* One filter path shared by the views and by every export, so what you download
   is always exactly what you're looking at. */
/* Channel selection is a SET. Empty means "all" — which keeps the common case
   zero-click while making comparison of any subset a first-class operation. */
/* null  = no filter (all channels)
   []    = explicitly nothing selected
   [ids] = exactly those channels
   Keeping "all" as null rather than a full id list means adding a channel later
   doesn't silently leave it out of an existing selection. */
function selIds(){ const s=S.filters.chSel; return (s===null||s===undefined)? null : s; }
function isFiltered(){ return selIds()!==null; }
function isSel(id){ const s=selIds(); return s===null || s.includes(id); }
function selectedChannelObjs(){
  const s=selIds();
  return s===null? S.channels : S.channels.filter(c=>s.includes(c.id));
}
function selCount(){ const s=selIds(); return s===null? S.channels.length : s.length; }
function selLabel(){
  const s=selIds();
  if(s===null) return `All channels (${S.channels.length})`;
  if(s.length===0) return 'No channels selected';
  if(s.length===1) return S.channels.find(c=>c.id===s[0])?.title || '1 channel';
  return `${s.length} of ${S.channels.length} channels`;
}
function toggleChSel(id){
  const all = S.channels.map(c=>c.id);
  const s = selIds();
  let next;
  if(id==='__all')        next = null;
  else if(id==='__none')  next = [];
  else if(id==='__invert'){ const cur = s===null? all : s; next = all.filter(x=>!cur.includes(x)); }
  else {
    let cur = (s===null? all : s).slice();
    cur = cur.includes(id)? cur.filter(x=>x!==id) : cur.concat(id);
    next = cur.length===all.length ? null : cur;     // everything ticked === no filter
  }
  S.filters.chSel = next; S.page={};
  /* While the menu is open, patch it in place rather than re-rendering the
     toolbar — rebuilding it destroyed and recreated all the avatars on every
     click, which is what made ticking channels feel harsh. The tick flips
     immediately; the table catches up on the next frame, and rapid clicks
     collapse into a single table render. */
  if(chPickOpen && syncPickerDom()) scheduleContentUpdate();
  else render();
}
function syncPickerDom(){
  const menu = document.getElementById('chPickMenu');
  if(!menu) return false;
  const rows = menu.querySelectorAll('[data-chsel]');
  for(const btn of rows){
    const id = btn.dataset.chsel;
    if(id.startsWith('__')) continue;
    const on = isSel(id);
    if(btn.classList.contains('on') !== on){
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-checked', on);
      const box = btn.querySelector('.cbox');
      if(box) box.innerHTML = on? ic('check') : '';
    }
  }
  const cnt = menu.querySelector('.mpick-count');
  if(cnt) cnt.textContent = `${selCount()} of ${S.channels.length}`;
  const foot = menu.querySelector('.mpick-foot');
  if(foot){
    const show = isFiltered() && selCount()>1;
    if(foot.hidden === show){                       // only touch the DOM when it changes
      foot.hidden = !show;
      const b = foot.querySelector('button');
      if(b && show) b.lastChild.textContent = `Compare these ${selCount()}`;
      positionChPick();                             // height changed — re-anchor
    } else if(show){
      const b = foot.querySelector('button');
      if(b) b.lastChild.textContent = `Compare these ${selCount()}`;
    }
  }
  const btn = document.querySelector('.mpick-btn');
  if(btn){
    btn.classList.toggle('act', isFiltered());
    const lbl = btn.querySelector('.mpick-label');
    if(lbl) lbl.textContent = selLabel();
  }
  return true;
}

function applyQ(rows){

  const mv=CFG.minViews||0;
  let out = rows;
  if(mv) out = out.filter(v=>v.views>=mv);

/* Anchors a fixed-position popover under its trigger, flipping above and
   clamping to the viewport so it can never render off-screen or half-cut. */
function anchorPopover(menu, btn){
  if(!menu||!btn) return;
  menu.style.maxHeight='';
  const r = btn.getBoundingClientRect();
  const gap = 5, pad = 8;
  const w = menu.offsetWidth || 300;
  let h = menu.offsetHeight;
  const below = window.innerHeight - r.bottom - gap - pad;
  const above = r.top - gap - pad;
  let top;
  if(h <= below || below >= above){                 // prefer below
    top = r.bottom + gap;
    menu.style.maxHeight = Math.max(140, below) + 'px';
  } else {                                          // flip above
    menu.style.maxHeight = Math.max(140, above) + 'px';
    h = Math.min(h, above);
    top = Math.max(pad, r.top - gap - h);
  }
  let left = r.left;
  left = Math.min(left, window.innerWidth - w - pad);
  left = Math.max(pad, left);
  menu.style.left = Math.round(left)+'px';
  menu.style.top  = Math.round(top)+'px';
  menu.classList.add('placed');

const ENTITY_JUNK = new Set(['official video','official music','official music video','official','video','music',
  'lyrics','lyric','letra','audio','live','remix','feat','ft','the official','new song','full album','mv',
  'episode','part','season','trailer','shorts','short','day','vs','tv','hd','4k','ep']);
function trendEntities(videos){
  const freq={};
  videos.forEach(v=>{
    (v.title.match(/\b[A-Z][a-zA-Z'.]+(?:\s+[A-Z][a-zA-Z'.]+)?\b/g)||[]).forEach(n=>{
      const k=n.trim(), lk=k.toLowerCase();
      if(k.length<3 || STOP.has(lk) || ENTITY_JUNK.has(lk)) return;
      if(lk.split(/\s+/).some(w=>ENTITY_JUNK.has(w))) return;
      freq[k]=(freq[k]||0)+1;

  });

      <span class="right dim" style="font-size:var(--f-2xs);font-weight:600">ranked by views within ${mode==='keyword'?'this keyword':'this category'}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:52px">#</th><th style="width:140px"></th><th>Video</th><th>Channel</th><th class="num">Views</th><th class="num">Engage</th><th class="num">Length</th><th class="num">Age</th></tr></thead>
    <tbody>${list.sort((a,b)=>a.rank-b.rank).map(v=>{
      const age=Math.floor((Date.now()-v.publishedTs)/864e5);
      return `<tr>
      <td><span class="rk ${v.rank===1?'g1':v.rank===2?'g2':v.rank===3?'g3':''}">${v.rank}</span></td>
      <td class="thumbcell">${thumbLink(v,'sm')}</td>
      <td style="min-width:260px"><a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="tt">${esc(v.title)}</a>
        <div class="vmeta">${v.isShort?'<span class="tag">SHORT</span>':''}<span>${nf(v.likes)} likes</span><span class="sep">·</span><span>${nf(v.comments)} comments</span><span class="sep">·</span><span>${FMT.dayMon.format(new Date(v.publishedTs))}</span></div></td>
      <td class="muted c1" style="max-width:140px">${esc(v.channelTitle)}</td>
      <td class="num"><b>${nf(v.views)}</b></td>
      <td class="num muted">${v.views?((v.likes+v.comments)/v.views*100).toFixed(2):0}%</td>
      <td class="num muted">${dur(v.durationSec)}</td>
      <td class="num dim">${age}d</td></tr>`;}).join('')}</tbody></table></div>`).join('')}</div>`;
}
/* ─────────── COMPARE ─────────── */
function vCompare(){
  const sel = selectedChannelObjs();
  if(sel.length<2) return `<div class="panel"><div class="pad">${emptyState('chart','Pick 2 or more channels to compare',
    'Use the channel selector in the toolbar — tick any combination, then come back here. Everything below is computed head-to-head over the current date range.')}</div></div>`;
  const all = enrichedInRange();
  const per = sel.map(c=>{
    const g = all.filter(v=>v.channelId===c.id);
    const t = channelTrend(c.id);
    const vals = g.map(v=>v.views), mu = mean(vals);
    const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
    const months = g.length? Math.max(1,(Date.now()-Math.min(...g.map(v=>v.publishedTs)))/(30*864e5)) : 1;
    const hrs={}; g.forEach(v=>{ (hrs[v.pubHour]=hrs[v.pubHour]||[]).push(v); });
    const bestHour = Object.entries(hrs).filter(([,a])=>a.length>=2)
      .sort((a,b)=>median(b[1].map(v=>v.outlier))-median(a[1].map(v=>v.outlier)))[0];
    return { c, g, t, cv,
      count:g.length, med:median(vals), mean:mu, max:Math.max(0,...vals),
      total:vals.reduce((a,b)=>a+b,0),
      outliers:g.filter(v=>v.outlier>=CFG.outlierThreshold).length,
      engage:median(g.map(v=>v.engage)), likeRate:median(g.map(v=>v.likeRate)),
      cadence:+(g.length/months).toFixed(1),
      medDur:median(g.map(v=>v.durationSec)),
      shorts:g.length? g.filter(v=>v.isShort).length/g.length : 0,
      viewsPerSub: c.subs? +(median(vals)/c.subs*1000).toFixed(2) : 0,
      bestHour: bestHour? String(bestHour[0]).padStart(2,'0')+':00' : '—',
      best:[...g].sort((a,b)=>b.outlier-a.outlier)[0],
      topics:new Set(g.flatMap(v=>extractTopics(v.title||'')))
    };
  });
  // winner per metric so the eye lands on it without reading every number
  const win = (key, hi=true)=>{ const vals=per.map(p=>p[key]); const best=hi?Math.max(...vals):Math.min(...vals);
    return per.map(p=>p[key]===best && vals.filter(v=>v===best).length<per.length); };
  const ROWS = [
    ['Videos in range','count', v=>nfull(v), true],
    ['Median views','med', v=>nf(Math.round(v)), true],
    ['Mean views','mean', v=>nf(Math.round(v)), true],
    ['Best video','max', v=>nf(v), true],
    ['Total views','total', v=>nf(v), true],
    [`Outliers ≥${CFG.outlierThreshold}×`,'outliers', v=>nfull(v), true],
    ['Uploads / month','cadence', v=>v, true],
    ['Median engagement','engage', v=>v.toFixed(2)+'%', true],
    ['Like rate','likeRate', v=>v.toFixed(2)+'%', true],
    ['Median length','medDur', v=>dur(Math.round(v)), null],
    ['Shorts share','shorts', v=>pct(v), null],
    ['Views per 1K subs','viewsPerSub', v=>nfull(v), true],
    ['Best publish hour','bestHour', v=>v, null],
  ];
  // topic gap: what each channel owns that none of the others touched
  const gaps = per.map((p,i)=>{
    const others = new Set(per.filter((_,j)=>j!==i).flatMap(x=>[...x.topics]));
    const owned = [...p.topics].filter(t=>!others.has(t));
    const scored = owned.map(t=>{
      const vs = p.g.filter(v=>extractTopics(v.title||'').includes(t));
      return {t, n:vs.length, med:median(vs.map(v=>v.outlier)), views:median(vs.map(v=>v.views))};
    }).filter(x=>x.n>=2).sort((a,b)=>b.med-a.med).slice(0,8);
    return {p, scored};
  });
  const shared = per.reduce((acc,p)=> acc===null? new Set(p.topics)
    : new Set([...acc].filter(t=>p.topics.has(t))), null);

  return `
  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('users')}Comparing ${sel.length} channels · ${rangeLabel()}
    <span class="right row" style="gap:6px">
      ${exportBtn('compare',['csv','json'])}
      <button class="btn btn-sm btn-p" data-act="copyCompare">${ic('sparkles')}Copy brief</button></span></div>
  <div class="tbl-wrap"><table><thead><tr><th style="min-width:150px">Metric</th>
    ${per.map(p=>`<th class="num" style="min-width:130px">
      <div class="row" style="justify-content:flex-end;gap:7px">
        <span class="c1" style="max-width:120px">${esc(p.c.title)}</span>
        <img class="avat" style="width:22px;height:22px" src="${esc(p.c.thumb)}" alt=""></div>
      <div class="dim" style="font-weight:600;font-size:var(--f-2xs);margin-top:2px">${nf(p.c.subs)} subs</div></th>`).join('')}
  </tr></thead><tbody>
    ${ROWS.map(([label,key,fmt,hi])=>{
      const w = hi===null? per.map(()=>false) : win(key,hi);
      return `<tr><td style="font-weight:600">${label}</td>
        ${per.map((p,i)=>`<td class="num ${w[i]?'':'muted'}">${w[i]?`<b style="color:var(--acc)">${fmt(p[key])}</b>`:fmt(p[key])}</td>`).join('')}</tr>`;
    }).join('')}
    <tr><td style="font-weight:600">Trend (last 10 vs prior 10)</td>
      ${per.map(p=>`<td class="num">${p.t?`<span class="badge ${p.t.ratio>=1.25?'b-ok':p.t.ratio<=0.75?'b-err':'b-grey'}">${p.t.ratio>=1.25?'▲':p.t.ratio<=0.75?'▼':'—'} ${p.t.ratio}×</span>`:'<span class="dim">—</span>'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Output consistency</td>
      ${per.map(p=>`<td class="num muted">${p.cv<0.8?'steady':p.cv<2?'mixed':'spiky'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Best performer</td>
      ${per.map(p=>p.best?`<td><a href="https://youtube.com/watch?v=${p.best.id}" target="_blank" rel="noopener">
        <img class="vthumb" style="width:120px;min-width:120px;margin-bottom:5px" loading="lazy" src="${esc(thumbUrl(p.best))}" alt="">
        <span class="c2" style="font-size:var(--f-2xs);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.best.title)}</span></a>
        <div class="dim" style="font-size:var(--f-2xs);margin-top:3px">${p.best.outlier}× · ${nf(p.best.views)}</div></td>`:'<td class="dim">—</td>').join('')}</tr>
  </tbody></table></div></div>

  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('target')}Topic gaps — what each one owns alone
    <span class="right dim" style="font-size:var(--f-2xs);font-weight:600">topics no other selected channel has covered</span></div>
    <div class="pad grid3">
      ${gaps.map(({p,scored})=>`<div>
        <div class="row" style="gap:8px;margin-bottom:9px">
          <img class="avat" style="width:24px;height:24px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:var(--f-sm)" class="c1">${esc(p.c.title)}</b></div>
        ${scored.length? scored.map(x=>`<div class="row" style="justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rowline)">
            <span class="c1" style="font-size:var(--f-xs)">${esc(x.t)}</span>
            <span class="row" style="gap:6px;flex-shrink:0">
              <span class="badge ${x.med>=1.5?'b-ok':'b-grey'}">${x.med.toFixed(2)}×</span>
              <span class="dim" style="font-size:var(--f-2xs)">${x.n}v · ${nf(x.views)}</span></span></div>`).join('')
          : '<div class="dim" style="font-size:var(--f-xs)">No exclusive topics — everything it covers, others cover too.</div>'}
      </div>`).join('')}
    </div>
    ${shared && shared.size? `<div class="pad" style="border-top:1px solid var(--line)">
      <div class="lbl">Contested — every selected channel covers these</div>
      <div class="row wrapf" style="gap:6px">${[...shared].slice(0,24).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`:''}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('clock')}Upload timing, side by side</div><div class="pad">
      ${per.map(p=>`<div style="margin-bottom:16px">
        <div class="row" style="gap:8px;margin-bottom:7px"><img class="avat" style="width:20px;height:20px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:var(--f-xs)">${esc(p.c.title)}</b><span class="dim" style="font-size:var(--f-2xs)">peak ${p.bestHour}</span></div>
        ${(()=>{ const hrs=Array.from({length:24},(_,h)=>p.g.filter(v=>v.pubHour===h).length);
          const mx=Math.max(...hrs,1);
          return `<div style="display:flex;gap:2px;height:38px;align-items:flex-end">${hrs.map((n,h)=>
            `<div style="flex:1;height:${n?Math.max(6,n/mx*100):2}%;border-radius:3px 3px 1px 1px;
              background:${n?'var(--chart)':'var(--hov)'};opacity:${n?0.35+0.65*(n/mx):1}"
              title="${String(h).padStart(2,'0')}:00 — ${n} uploads"></div>`).join('')}</div>`;})()}
      </div>`).join('')}
      <div class="dim" style="font-size:var(--f-2xs)">Bar height = uploads in that hour, local time.</div></div></div>

    <div class="panel"><div class="phead">${ic('film')}Length strategy, side by side</div><div class="pad">
      ${(()=>{ const B=[[0,60,'Shorts'],[60,600,'1–10m'],[600,1200,'10–20m'],[1200,2400,'20–40m'],[2400,1e9,'40m+']];
        return B.map(([a,b,label])=>`<div style="margin-bottom:12px">
          <div class="bl" style="display:flex;justify-content:space-between;font-size:var(--f-xs);margin-bottom:5px">
            <span class="muted">${label}</span></div>
          ${per.map(p=>{ const g=p.g.filter(v=>v.durationSec>=a&&v.durationSec<b);
            const share=p.g.length? g.length/p.g.length:0;
            return `<div class="row" style="gap:7px;margin-bottom:3px">
              <span class="c1 dim" style="width:96px;font-size:var(--f-2xs)">${esc(p.c.title)}</span>
              <span class="track grow"><i style="width:${(share*100).toFixed(0)}%"></i></span>
              <span class="dim" style="font-size:var(--f-2xs);width:78px;text-align:right">${g.length} · ${g.length?nf(median(g.map(v=>v.views))):'—'}</span></div>`;}).join('')}
        </div>`).join('');})()}
      <div class="dim" style="font-size:var(--f-2xs)">Bar = share of that channel's uploads · right = count and median views.</div></div></div>
  </div>`;
}

/* ─────────── OPPORTUNITIES ─────────── */
function vOpps(){
  const vids = enrichedInRange();
  if(!vids.length) return `<div class="panel"><div class="pad">${emptyState('bolt','No data in this range','Run a sync or widen the range.')}</div></div>`;
  const topics = topicStats(vids);
  const breakouts = vids.map(v=>({v, b:breakoutScore(v)})).filter(x=>x.b && x.b.score>1.2)
    .sort((a,b)=>b.b.score-a.b.score).slice(0,12);
  const openLanes = topics.filter(t=>t.coverage<=2 && t.medOutlier>=1.2 && t.count>=2).slice(0,12);
  const heating = [...topics].filter(t=>t.recent>0).sort((a,b)=>b.momentum-a.momentum).slice(0,12);
  const cooling = [...topics].filter(t=>t.prior>=3 && t.recent===0)
    .sort((a,b)=>b.medOutlier-a.medOutlier).slice(0,8);
  const tab = S.filters.oppTab||'breakout';

  const topicRow = (t,extra)=>`<tr>
    <td><div style="font-weight:700;font-size:var(--f-sm)">${esc(t.topic)}</div>
      <div class="vmeta"><span>${t.count} videos</span><span class="sep">·</span>
        <span>${t.coverage} channel${t.coverage===1?'':'s'}</span><span class="sep">·</span>
        <span>last ${t.daysOld}d ago</span></div></td>
    <td class="num"><span class="badge ${t.medOutlier>=2?'b-ok':t.medOutlier>=1.2?'b-acc':'b-grey'}">${t.medOutlier}×</span></td>
    <td class="num">${nf(t.medViews)}</td>
    ${extra||''}
    <td style="max-width:250px"><a href="https://youtube.com/watch?v=${t.best.id}" target="_blank" rel="noopener" class="c1" style="font-size:var(--f-xs);color:var(--t3)">${esc(t.best.title)}</a>
      <div class="dim" style="font-size:var(--f-2xs)">${t.best.outlier}× · ${nf(t.best.views)} views</div></td>
    <td><button class="btn btn-sm btn-o" data-oppsearch="${esc(t.topic)}">See all</button></td></tr>`;

  return `
  <div class="kgrid" style="margin-bottom:14px">
    <div class="kpi"><div class="ico">${ic('bolt')}</div><div class="v" style="color:var(--warn)">${breakouts.length}</div>
      <div class="k">Breaking out now</div><div class="d dim">young videos beating channel pace</div></div>
    <div class="kpi"><div class="ico">${ic('target')}</div><div class="v">${openLanes.length}</div>
      <div class="k">Open lanes</div><div class="d dim">proven topic, ≤2 channels on it</div></div>
    <div class="kpi"><div class="ico">${ic('up')}</div><div class="v" style="color:var(--ok)">${heating.filter(t=>t.momentum>1.5).length}</div>
      <div class="k">Heating up</div><div class="d dim">rising share of uploads</div></div>
    <div class="kpi"><div class="v">${nfull(topics.length)}</div><div class="k">Topics detected</div>
      <div class="d dim">across ${nfull(vids.length)} videos</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="phead"><div class="seg plain" style="margin-right:auto">
      ${[['breakout','bolt','Breakout watch'],['lanes','target','Open lanes'],['heating','up','Heating up'],['cooling','clock','Revival candidates']]
        .map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-opptab="${k}" aria-pressed="${tab===k}">${ic(i)}${l}</button>`).join('')}
    </div>
    ${exportBtn('topics',['csv','json'])}
    <button class="btn btn-sm btn-p" data-act="copyOppBrief">${ic('sparkles')}Copy brief</button></div>

    ${tab==='breakout'? (!breakouts.length? `<div class="pad">${emptyState('bolt','Nothing breaking out',
        'Breakout detection compares a young video\'s daily pace against its channel\'s norm, and needs 2+ days of snapshots. Sync daily and this fills in.')}</div>`
      : `<div class="tbl-wrap"><table><thead><tr><th style="width:158px"></th><th>Video</th><th>Channel</th>
        <th class="num">Views now</th><th class="num">Pace vs norm</th><th class="num">Accel</th>
        <th class="num">Projected 30d</th><th class="num">Age</th><th style="width:92px"></th></tr></thead><tbody>
        ${breakouts.map(({v,b})=>{ const proj=projectViews(v);
          return `<tr class="fire${isVsel(v.id)?' sel':''}">
          <td class="thumbcell">${thumbLink(v,'sm')}</td>
          <td style="min-width:250px"><a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="tt">${esc(v.title)}</a>
            <div class="vmeta"><span class="badge b-warn">SCORE ${b.score}</span>
              <span>${v.pubDay} ${v.pubTime}</span><span class="sep">·</span><span>${dur(v.durationSec)}</span></div></td>
          <td class="muted c1" style="max-width:130px">${esc(v.channelTitle)}</td>
          <td class="num"><b>${nf(v.views)}</b>${b.m?`<div style="width:74px;margin-left:auto">${sparkline(b.m.series,74,16)}</div>`:''}</td>
          <td class="num"><span class="badge ${b.paceRatio>=3?'b-err':b.paceRatio>=1.5?'b-ok':'b-grey'}">${b.paceRatio}×</span></td>
          <td class="num ${b.accel>1.3?'':'dim'}">${b.accel}×</td>
          <td class="num">${proj?`<b style="color:var(--acc)">${nf(proj)}</b><div class="dim" style="font-size:var(--f-2xs)">estimate</div>`:'<span class="dim">—</span>'}</td>
          <td class="num dim">${v.ageDays}d</td>
          <td class="actcell">${videoActs(v)}</td></tr>`;}).join('')}
      </tbody></table></div>`)
    : tab==='lanes'? (!openLanes.length? `<div class="pad">${emptyState('target','No open lanes found yet',
        'An open lane is a topic that performs above channel median but only 1–2 channels have covered. Track more competitors or widen the range.')}</div>`
      : `<div class="pad section-note">Topics that <b style="color:var(--t1)">perform above channel median</b> but only 1–2 channels have touched. Proven demand, little competition.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Opportunity</th><th>Best example</th><th></th></tr></thead><tbody>
        ${openLanes.map(t=>topicRow(t,`<td class="num"><span class="badge b-acc">${t.opportunity}</span></td>`)).join('')}
      </tbody></table></div>`)
    : tab==='heating'? `<div class="pad section-note">Topics taking a <b style="color:var(--t1)">rising share of uploads</b> in the last 7 days versus the prior 3 weeks — the niche is moving toward these.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
        <th class="num">Momentum</th><th>Best example</th><th></th></tr></thead><tbody>
        ${heating.map(t=>topicRow(t,`<td class="num"><span class="badge ${t.momentum>=2?'b-ok':'b-grey'}">${t.momentum}× <span class="dim">${t.recent}v/7d</span></span></td>`)).join('')}
      </tbody></table></div>`
    : (!cooling.length? `<div class="pad">${emptyState('clock','No revival candidates',
        'These are topics that performed well but nobody has published on for a while. Needs a wider range to detect.')}</div>`
      : `<div class="pad section-note">Performed well historically, but <b style="color:var(--t1)">nobody has published on them in the last 7 days</b>. Proven topics going unserved.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Last covered</th><th>Best example</th><th></th></tr></thead><tbody>
        ${cooling.map(t=>topicRow(t,`<td class="num"><span class="badge b-grey">${t.daysOld}d ago</span></td>`)).join('')}
      </tbody></table></div>`)}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('users')}Who is winning right now</div>
      <div class="tbl-wrap"><table><thead><tr><th>Channel</th><th class="num">Outliers</th><th class="num">Median</th>
        <th class="num">Trend</th><th class="num">Consistency</th></tr></thead><tbody>
      ${selectedChannelObjs().map(c=>{
        const g=vids.filter(v=>v.channelId===c.id); if(!g.length) return null;
        const t=channelTrend(c.id);
        const outs=g.filter(v=>v.outlier>=CFG.outlierThreshold).length;
        const vals=g.map(v=>v.views), mu=mean(vals);
        const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
        return {c,g,t,outs,cv};
      }).filter(Boolean).sort((a,b)=>b.outs-a.outs||b.g.length-a.g.length).map(({c,g,t,outs,cv})=>`
        <tr><td><div class="c1" style="max-width:170px;font-weight:600">${esc(c.title)}</div>
          <div class="dim" style="font-size:var(--f-2xs)">${g.length} videos · ${nf(c.subs)} subs</div></td>
          <td class="num"><b style="color:${outs?'var(--acc)':'inherit'}">${outs}</b></td>
          <td class="num">${nf(median(g.map(v=>v.views)))}</td>
          <td class="num">${t?`<span class="badge ${t.ratio>=1.25?'b-ok':t.ratio<=0.75?'b-err':'b-grey'}">${t.ratio>=1.25?'▲':t.ratio<=0.75?'▼':'—'}${t.ratio}×</span>`:'<span class="dim">—</span>'}</td>
          <td class="num"><span class="dim" title="Lower = more predictable output">${cv<0.8?'steady':cv<2?'mixed':'spiky'}</span></td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="panel"><div class="phead">${ic('film')}Winning formats right now</div>
      <div class="pad">${(()=>{
        const bands = durationBuckets(vids).filter(b=>b.count>=3);
        const best = [...bands].sort((a,b)=>b.medOutlier-a.medOutlier);
        if(!best.length) return emptyState('film','Not enough videos','Widen the range.');
        return barList(best.map(b=>({label:b.label, value:b.medOutlier,
          sub:`${b.count} videos · median ${nf(b.medViews)} views · p90 ${nf(b.p90)}`})),{fmt:n=>n.toFixed(2)+'×'});
      })()}
      <div class="divider"></div>
      <div class="lbl">Best publish slots (median outlier, ≥3 videos)</div>
      ${(()=>{
        const slots={};
        vids.forEach(v=>{ const k=v.pubDay+' '+String(v.pubHour).padStart(2,'0')+':00';
          (slots[k]=slots[k]||[]).push(v.outlier); });
        const rows=Object.entries(slots).filter(([,a])=>a.length>=3)
          .map(([k,a])=>({label:k, value:+median(a).toFixed(2), sub:`${a.length} videos`}))
          .sort((a,b)=>b.value-a.value).slice(0,6);
        return rows.length? barList(rows,{fmt:n=>n.toFixed(2)+'×'}) : '<div class="dim" style="font-size:var(--f-xs)">Need more videos per slot.</div>';
      })()}</div></div>
  </div>`;
}

/* ─────────── THUMBNAIL BOARD ─────────── */
/* The board used to hard-stop at 120 cards with no way to see the rest. It now
   pages exactly like the feed, using the same per-page setting and the same
   pager control, so both views behave identically. */
const BOARD_SORTS = [['outlier','By outlier'],['views','By views'],['vpd','Views / day'],['recent','Newest']];
const BOARD_SIZES = [['sm','S'],['md','M'],['lg','L'],['xl','XL']];
const BOARD_W = {sm:150, md:210, lg:290, xl:390};
const BOARD_DEFAULT_SIZE = 'lg';
/* Views/day is the honest comparison when a 3-day-old video sits next to a
   3-month-old one: raw views reward age, and outlier score is relative to the
   channel rather than to the shelf you are choosing from. */
const boardCmp = {
  recent:  (a,b)=>b.publishedTs-a.publishedTs,
  views:   (a,b)=>b.views-a.views,
  vpd:     (a,b)=>b.vpd-a.vpd,
  outlier: (a,b)=>b.outlier-a.outlier,
};
let _boardCache=null, _boardKey='';
function boardRows(){
  const sortBy = S.filters.boardSort||'outlier';
  const key = [dataKey(), S.range, CFG.rangeFrom||'', CFG.rangeTo||'', selSig(),
    S.filters.q||'', CFG.includeShorts?1:0, CFG.minViews||0, sortBy].join('|');
  if(_boardCache && _boardKey===key) return _boardCache;
  _boardCache = [...applyQ(enrichedInRange())].sort(boardCmp[sortBy]||boardCmp.outlier);
  _boardKey = key;
  return _boardCache;
}
/* `key` parameterises which pager slot this grid uses, so the Competitor Feed can
   render the very same cards under its own paging without the two views fighting
   over S.page.board. */
function boardGrid(rows, key='board', sizeKey){
  const size = sizeKey || S.filters.boardSize||BOARD_DEFAULT_SIZE;
  const W = BOARD_W[size]||BOARD_W[BOARD_DEFAULT_SIZE];
  const per = CFG.perPage || 50;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const page = Math.min(Math.max(1, S.page[key]||1), pages);
  const shown = rows.slice((page-1)*per, page*per);
  if(!rows.length) return `<div class="panel"><div class="pad">${emptyState('film','Nothing to show','Run a sync or widen the range.')}</div></div>`;
  return `${pager(key, rows.length, per, page)}
  <div class="boardgrid" style="grid-template-columns:repeat(auto-fill,minmax(${W}px,1fr))">
    ${shown.map(v=>{
      const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';
      return `<div class="boardcard${isVsel(v.id)?' sel':''}">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardthumb${v.stale?' uncached':''}">
          <img loading="lazy" decoding="async" src="${esc(thumbUrl(v,true))}" data-vid="${v.id}" data-big="1" alt="">
          ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
          ${v.isShort?'<span class="boardshort">SHORT</span>':''}
          ${v.stale?'<span class="uncachedbadge" title="No longer in the video cache — showing what was saved">UNCACHED</span>':''}
        </a>
        <div class="boardbody">
          <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardtitle" title="${esc(v.title)}">${esc(v.title)}</a>
          <div class="vmeta" style="margin-top:6px">
            <span class="badge ${oc}" title="Views versus this channel's own median">${v.outlier}×</span>
            <span class="uptime">${nf(v.views)} views</span><span class="sep">·</span>
            <span class="vpd" title="Views per day since publication">${nf(v.vpd)}/day</span><span class="sep">·</span>
            <span class="c1" title="${esc(v.channelTitle)}">${esc(v.channelTitle)}</span></div>
          <div class="vmeta"><span class="boarddate">${FMT.dmy.format(new Date(v.publishedTs))}</span><span class="sep">·</span>
            <span>${v.ageDays}d</span><span class="sep">·</span><span>${v.pubTime}</span>
            <span class="right">${videoActs(v)}</span></div>
        </div></div>`;}).join('')}
  </div>
  ${pager(key, rows.length, per, page)}`;
}
function vBoard(){
  const rows = boardRows();
  const sortBy = S.filters.boardSort||'outlier';
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE;
  const per = CFG.perPage || 50;
  const page = Math.min(Math.max(1, S.page.board||1), Math.max(1,Math.ceil(rows.length/per)));
  const shown = Math.min(per, Math.max(0, rows.length-(page-1)*per));
  return `
  <div class="panel" style="margin-bottom:14px"><div class="pad row wrapf" style="gap:10px">
    <div class="seg plain">
      ${BOARD_SORTS.map(([k,l])=>
        `<button class="${sortBy===k?'on':''}" data-boardsort="${k}">${l}</button>`).join('')}</div>
    <div class="seg plain">
      ${BOARD_SIZES.map(([k,l])=>
        `<button class="${size===k?'on':''}" data-boardsize="${k}" title="${
          k==='xl'?'3 per row':k==='lg'?'4 per row':k==='md'?'6 per row':'8 per row'}">${l}</button>`).join('')}</div>
    <div class="grow"></div>
    <span class="dim" style="font-size:var(--f-xs)">${nfull(shown)} of ${nfull(rows.length)} · ${rangeLabel()}</span>
    <button class="btn btn-sm btn-o" data-act="selAllShown" title="Tick every card on this page for bulk actions">${ic('sqc')}Select</button>
    <button class="btn btn-sm btn-o" data-act="starShown" title="Save every card on this page to your swipe file">${ic('star')}Star</button>
    <button class="btn btn-sm btn-o" data-act="copyThumbUrls">${ic('copy')}Copy URLs</button>
    ${exportBtn('thumbs',['csv','json','zip'])}
  </div></div>
  <div id="tblhost-board">${boardGrid(rows,'board')}</div>`;
}
function repaintBoard(){
  const host = document.getElementById('tblhost-board');
  if(!host) return render();
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE, sortBy = S.filters.boardSort||'outlier';
  host.innerHTML = boardGrid(boardRows(),'board');
  document.querySelectorAll('[data-boardsize]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsize===size));
  document.querySelectorAll('[data-boardsort]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsort===sortBy));
