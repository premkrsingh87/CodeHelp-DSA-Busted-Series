<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Signal — YouTube Competitor Intelligence</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Signal%22%2C%22short_name%22%3A%22Signal%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%5D%7D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%23ec4899'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M22 62 L38 44 L50 54 L78 26' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ═══════════════ TOKENS ═══════════════ */
:root{
  --acc:#6366f1; --acc2:#ec4899; --acc-soft:rgba(99,102,241,.16);
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#3b82f6; --yt:#ef4444;
  --r1:6px; --r2:9px; --r3:13px; --r4:18px;
  --pad:12px; --fs:12.5px;
  --ease:cubic-bezier(.4,0,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --sw:240px;
}
/* Surfaces step up in luminance so panels read as distinct objects on the page
   instead of merging into one dark field. Borders reinforce; they don't carry it alone. */
/* "Too grey" is almost always washed-out TEXT, not washed-out surfaces — mid-grey
   type on a mid-grey card is what reads as murk. So: surfaces stay dark and calm,
   and every text stop is pushed up hard. Secondary text sits at 84%, not 60%.
   Cool-neutral greys (a hint of blue) instead of pure neutral, which reads
   cleaner on OLED/IPS panels than flat #1a1a1a. */
html[data-theme="dark"]{
  --bg:#000000; --bg2:#07070a;
  --panel:#101014; --panel2:#0a0a0d; --panel3:#1b1b21;
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.24);
  --t1:#ffffff; --t2:rgba(255,255,255,.95); --t3:rgba(255,255,255,.84); --t4:rgba(255,255,255,.66);
  --hov:rgba(255,255,255,.07); --hov2:rgba(255,255,255,.15); --code:rgba(255,255,255,.05);
  --shadow:0 16px 44px rgba(0,0,0,.9);
  --rowline:rgba(255,255,255,.09);
  --trackbg:rgba(255,255,255,.13);
}
html[data-theme="light"]{
  --bg:#f4f5f9; --bg2:#eceef4; --panel:#fff; --panel2:#f8f9fc; --panel3:#eef0f6;
  --line:rgba(10,10,25,.12); --line2:rgba(10,10,25,.22);
  --t1:#0b0c18; --t2:rgba(15,16,32,.88); --t3:rgba(15,16,32,.68); --t4:rgba(15,16,32,.5);
  --hov:rgba(10,10,30,.05); --hov2:rgba(10,10,30,.09); --code:rgba(10,10,30,.04);
  --shadow:0 12px 34px rgba(20,20,50,.14);
  --rowline:rgba(10,10,25,.08); --trackbg:rgba(10,10,30,.12);
}
html[data-density="compact"]{ --pad:8px; --fs:11.5px; }
/* Density controls spacing; text size controls type. They were the same knob,
   which meant reading comfortably cost you screen real estate and vice versa. */
html[data-text="s"]{ --fs:11.5px; --fs-title:11.5px; }
html[data-text="m"]{ --fs:12.5px; --fs-title:12.5px; }
html[data-text="l"]{ --fs:13.5px; --fs-title:13.5px; }
html[data-text="xl"]{ --fs:15px;  --fs-title:14.5px; }
:root{ --fs-title:12.5px; }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* No webfont: this file has to work offline, and a network fetch for type is
   both a hang and a flash of unstyled text. Instead, ask for the best face each
   platform already ships — Segoe UI Variable on Win11 and SF on macOS are
   markedly cleaner at small sizes than the generics they fall back to.
   `optical-sizing` and the tabular-numbers feature make dense metric columns
   line up instead of shimmering as digits change. */
html{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;font-optical-sizing:auto;font-synthesis-weight:none}
.num,.kpi .v,.mono,td.num,th.num{font-variant-numeric:tabular-nums}
body{background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;font-size:var(--fs);line-height:1.5}
img{display:block;max-width:100%}
/* inline icons default to a sane size; every sized context below overrides via a class selector */
svg{width:15px;height:15px;flex-shrink:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.hide{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.muted{color:var(--t3)} .dim{color:var(--t4)}
.c1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);font-weight:700;display:block;margin-bottom:6px}

/* ═══════════════ LAYOUT ═══════════════ */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--bg2);border-right:1px solid var(--line);z-index:40;display:flex;flex-direction:column;transition:transform .12s var(--ease)}
.sidebar.off{transform:translateX(-100%)}
.main{margin-left:var(--sw);min-height:100vh;transition:margin-left .12s var(--ease)}
.main.wide{margin-left:0}
.side-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 16px var(--acc-soft);flex-shrink:0}
.logo svg{width:19px;height:19px}
.side-nav{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.side-foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.nav-sec{padding:14px 10px 6px;font-size:9px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--t4)}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r2);color:var(--t2);width:100%;text-align:left;font-size:12.5px;transition:background .13s,color .13s;position:relative}
.navbtn svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.navbtn:hover{background:var(--hov);color:var(--t1)}
.navbtn.active{background:var(--hov2);color:var(--t1);font-weight:600}
.navbtn.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:linear-gradient(var(--acc),var(--acc2))}
.navbtn .cnt{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--t4);background:var(--hov);padding:2px 7px;border-radius:20px}
.navbtn.active .cnt{color:var(--t2)}

.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:11px 16px;min-width:0}
.ptitle{font-size:15.5px;font-weight:700;letter-spacing:-.3px;line-height:1.15;white-space:nowrap}
.psub{font-size:10.5px;color:var(--t3);margin-top:2px;white-space:nowrap}
.subrow{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.subrow::-webkit-scrollbar{height:0;display:none}
.subrow>*{flex-shrink:0}
.content{padding:16px;max-width:1900px}

/* ═══════════════ CONTROLS ═══════════════ */
.field{background:var(--code);border:1px solid var(--line);color:var(--t1);border-radius:var(--r2);padding:9px 11px;font-size:12px;transition:border-color .11s,box-shadow .11s;width:100%}
.field:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.field::placeholder{color:var(--t4)}
textarea.field{resize:vertical;line-height:1.6;min-height:90px}
select.field{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select.field option{background:var(--panel);color:var(--t1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r2);font-size:11.5px;font-weight:600;background:var(--hov);color:var(--t2);transition:background .1s,color .1s,transform .1s,box-shadow .11s;white-space:nowrap}
.btn svg{width:13px;height:13px}
.btn:hover{background:var(--hov2);color:var(--t1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn-p:hover{color:#fff;box-shadow:0 6px 20px var(--acc-soft);transform:translateY(-1px)}
.btn-o{background:transparent;border:1px solid var(--line2)}
.btn-d{background:rgba(239,68,68,.12);color:#f87171} .btn-d:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 10px;font-size:10.5px}
.ib{width:32px;height:32px;border-radius:var(--r2);display:grid;place-items:center;color:var(--t3);transition:background .13s,color .13s}
.ib svg{width:15px;height:15px}
.ib:hover{background:var(--hov);color:var(--t1)}
.ib.on{background:var(--acc-soft);color:var(--acc)}
.seg{display:flex;background:var(--hov);border-radius:var(--r2);padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--t3);transition:background .11s,color .11s;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--t1)}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.seg.plain button.on{background:var(--panel3);color:var(--t1)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--hov);color:var(--t3);font-size:10.5px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:all .1s}
.chip:hover{background:var(--hov2);color:var(--t1)}
.chip.on{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.tag{padding:2.5px 7px;background:var(--hov);border-radius:5px;font-size:10px;color:var(--t3);font-weight:600}
.badge{padding:3px 8px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.2px;display:inline-flex;align-items:center;gap:4px}
.b-ok{background:rgba(34,197,94,.14);color:#4ade80}
.b-warn{background:rgba(245,158,11,.14);color:#fbbf24}
.b-err{background:rgba(239,68,68,.14);color:#f87171}
.b-acc{background:var(--acc-soft);color:#a5b4fc}
.b-grey{background:var(--hov);color:var(--t3)}
.sw{position:relative;width:38px;height:21px;border-radius:20px;background:var(--hov2);transition:background .13s;flex-shrink:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:var(--t3);transition:transform .12s var(--spring),background .13s}
.sw.on{background:var(--acc)} .sw.on::after{transform:translateX(17px);background:#fff}

/* ═══════════════ SURFACES ═══════════════ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3)}
.phead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700}
.phead svg{width:14px;height:14px;opacity:.7}
.pad{padding:14px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:14px;position:relative;overflow:hidden;transition:transform .12s var(--ease),border-color .12s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kpi .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);font-weight:700;margin-top:4px}
.kpi .d{font-size:10px;margin-top:6px;font-weight:600}
.kpi .ico{position:absolute;right:-8px;top:-8px;opacity:.06}
.kpi .ico svg{width:58px;height:58px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:1100px){.grid2{grid-template-columns:1fr 1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* ═══════════════ TABLE ═══════════════ */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--t4);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;
  padding:11px 13px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0;background:var(--panel);z-index:2}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--t2)}
th.sortable.act{color:var(--acc)}
th .arw{opacity:.5;margin-left:3px}
td{padding:12px 13px;border-bottom:1px solid var(--rowline);vertical-align:middle}
tbody tr{transition:background .1s} tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:none}
tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tr.fire td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
/* numeric columns share one alignment so the eye can scan straight down a column */
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.colgroup{border-left:1px solid var(--line)}
/* Thumbnails are the primary analytical object here — locked to 16:9 at a size
   you can actually read the overlay text on. min-width and max-width:none are
   load-bearing: the global img{max-width:100%} plus a shrink-to-fit table cell
   would otherwise collapse these to zero width. */
.vthumb{width:142px;min-width:142px;max-width:none;aspect-ratio:16/9;height:auto;object-fit:cover;
  border-radius:8px;background:var(--panel3);flex-shrink:0;border:1px solid var(--line);display:block;
  transition:transform .12s var(--ease),border-color .12s}
.vthumb.sm{width:120px;min-width:120px}
.vthumb.lg{width:190px;min-width:190px}
.thumblink{display:block;position:relative;width:142px;min-width:142px}
.thumblink:hover .vthumb{transform:scale(1.04);border-color:var(--acc)}
/* standalone, not scoped to .thumblink — the board reuses it inside .boardthumb */
.dur-badge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.85);color:#fff;
  font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.2px;
  line-height:1.3;pointer-events:none}
.thumbcell{width:158px;min-width:158px}
.tt{font-weight:600;color:var(--t1);line-height:1.4;display:block;font-size:13px}
.tt:hover{color:var(--acc)}
.vmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;
  font-size:calc(var(--fs) - 2px);color:var(--t3);font-variant-numeric:tabular-nums}
.vmeta .vpd{color:var(--t2);font-weight:600}
.vmeta .sep{opacity:.4}
.uptime{color:var(--t3);font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.score-pill{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:800;font-size:11px;font-variant-numeric:tabular-nums}
.rk{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;font-size:10.5px;font-weight:800;background:var(--hov);color:var(--t3)}
.rk.g1{background:linear-gradient(135deg,#ffd76a,#f59e0b);color:#3a2400}
.rk.g2{background:linear-gradient(135deg,#dfe4ec,#9aa4b5);color:#20232c}
.rk.g3{background:linear-gradient(135deg,#dd9a63,#a3572c);color:#2a1200}

/* ═══════════════ CHARTS ═══════════════ */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-item .bl{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;margin-bottom:5px}
.bar-item .bl .n{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-item .bl b{font-variant-numeric:tabular-nums;flex-shrink:0}
.track{height:8px;border-radius:5px;background:var(--trackbg);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s var(--ease)}
.heat-grid{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;font-size:8.5px}
.heat-grid .hh{color:var(--t4);text-align:center;font-size:7.5px;padding-bottom:2px}
.heat-grid .hd{color:var(--t4);padding-right:5px;text-align:right;display:flex;align-items:center;justify-content:flex-end;font-weight:700}
.heat-cell{aspect-ratio:1;border-radius:2.5px;background:var(--hov);transition:transform .1s;min-height:13px;cursor:default}
.heat-cell:hover{transform:scale(1.5);z-index:3;position:relative}
.spark{display:block;width:100%;height:26px}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:11px}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .sw2{width:9px;height:9px;border-radius:3px;flex-shrink:0}

/* ═══════════════ CARDS / MISC ═══════════════ */
.chcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:14px;transition:border-color .12s,transform .12s}
.chcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.avat{width:42px;height:42px;border-radius:50%;background:var(--panel3);object-fit:cover;flex-shrink:0}
.dirtybar{padding:11px 13px;margin-bottom:14px;border-radius:var(--r2);
  background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.3);color:var(--t1)}
.dirtybar svg{color:var(--warn)}
.empty{text-align:center;padding:44px 18px;color:var(--t4)}
.empty svg{width:36px;height:36px;opacity:.4;margin-bottom:10px}
.empty .t{font-size:12.5px;font-weight:600;color:var(--t3);margin-bottom:4px}
.empty .s{font-size:11px;max-width:340px;margin:0 auto}
.mbg{position:fixed;inset:0;z-index:60;background:rgba(2,2,8,.78);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .16s ease-out}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r4);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .14s var(--spring);overflow:hidden;width:660px;max-width:100%}
.mhead{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0;font-weight:700}
.mbody{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:15px}
.mfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--panel2)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
@keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeout{to{opacity:0;transform:translateX(20px)}}
.toasts{position:fixed;bottom:18px;right:18px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);padding:11px 15px;border-radius:var(--r2);display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:12px;pointer-events:auto;animation:slideup .24s var(--spring);max-width:400px}
.toast.out{animation:fadeout .2s forwards}
.toast svg{width:15px;height:15px;flex-shrink:0}
.prog{height:5px;border-radius:4px;background:var(--hov);overflow:hidden}

.mpick{position:relative;display:inline-block}

.mpick-btn svg:last-child{opacity:.5;width:12px;height:12px}
/* Fixed, not absolute. The toolbar it lives in is a horizontal scroll container
   (overflow-x:auto), and an absolutely-positioned child of a scroll container is
   clipped by it — which is exactly what cut this menu off. Fixed positioning
   escapes that; coordinates are set from the trigger's rect after each render. */
.mpick-menu{position:fixed;top:0;left:0;z-index:200;width:300px;background:var(--panel3);
  border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--shadow);padding:5px;

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   ICONS
   ═══════════════════════════════════════════════════════════ */
const I = {
  dash:'<path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>',
  feed:'<path d="M4 11a9 9 0 019 9M4 4a16 16 0 0116 16"/><circle cx="5" cy="19" r="1.5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  fire:'<path d="M12 2s4 4 4 8a4 4 0 01-8 0c0-1 .5-2 .5-2S6 11 6 14a6 6 0 0012 0c0-5-6-12-6-12z"/>',
  users:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/>',
  msg:'<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.9-.9L3 21l1.9-5a8.4 8.4 0 01-.9-3.9 8.5 8.5 0 018.4-8.6 8.5 8.5 0 018.6 8.5z"/>',
  down:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008 19.4a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 003.6 8a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H8a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V8a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  sync:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M20.5 9a9 9 0 00-14.9-3.4L1 10m22 4l-4.6 4.4A9 9 0 013.5 15"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
  bolt:'<path d="M13 2L3 14h8l-1 8 10-12h-8z"/>',
  up:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  warn:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  film:'<rect x="2" y="2" width="20" height="20" rx="2.2"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',
  layers:'<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  undo:'<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
};
const ic = (n, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;
const icf = (n) => `<svg viewBox="0 0 24 24" fill="currentColor">${I[n]||''}</svg>`;

/* ═══════════════════════════════════════════════════════════
   STORAGE — durable, verified, self-healing
   ───────────────────────────────────────────────────────────
   Two tiers, and they fail in completely different ways:

     • STORE (profiles, channel lists, key, thresholds) is small and lives in
       localStorage. localStorage is the fragile one — it gets cleared by
       "clear site data", evicted under storage pressure, wiped by privacy
       sweeps, and it throws on quota with no warning.
     • Bulk rows (videos, channels, snapshots, trending) live in IndexedDB,
       which is roomy and durable — but every row is keyed `pid::id` and read
       back through `r.pid === PID()`. So the bulk data is only reachable
       through STORE. Lose the small fragile thing and the big durable thing
       becomes invisible: "0 channels", even though every byte is still on disk.

   That coupling is what used to eat the channel list on refresh. It is fixed
   in four layers, each of which alone is enough to survive the others failing:

     1. WRITE VERIFIED — every localStorage write is read back and compared.
        A write that didn't land is treated as a failure, not as success.
     2. MIRRORED — the same JSON is mirrored into IndexedDB, plus a rolling
        ring of the last 12 good revisions. localStorage and IndexedDB are
        cleared by different events, so one almost always survives.
     3. NEVER OVERWRITE GOOD DATA WITH NOTHING — a boot that finds no settings
        starts *provisional* and is forbidden from saving until reconcile has
        run. The old code minted a fresh random profile id and then saved it
        over the real one; that is what made the loss permanent.
     4. SELF-HEALING — reconcile compares STORE against what is actually in
        IndexedDB. Orphaned profile ids get re-adopted as recovered profiles,
        and a profile whose channel list is empty while its cached channel
        rows are not gets its list rebuilt from those rows.
   ═══════════════════════════════════════════════════════════ */
const LS='signal_store_v2', LS_OLD='signal_cfg_v1', LS_BAK='signal_store_v2_bak';
const DEF_CFG = {
  channels:[], scrapeDepth:200, snapshotDays:120, outlierThreshold:3, region:'US',
  trendCats:[22,24,25], trendMode:'charts', trendKeywords:[], trendShorts:false, trendWindow:30,
  trendDurMin:0, trendDurMax:0, trendFrom:'', trendTo:'', trendSort:'views',
  lastSync:0, includeShorts:true, minViews:0, perPage:50, rangeFrom:'', rangeTo:'',
  titlePatterns:['[Number] [Things] Nobody Told You About [Subject]','The [Adjective] Truth About [Subject]','Why [Subject] Is [Surprising Claim] (And What It Means)','[Subject]: The Untold Story','How [Subject] [Achieved Surprising Outcome]','What Really Happened to [Subject]','The Rise and Fall of [Subject]','Inside the [Adjective] World of [Subject]','[Subject] vs [Subject]: Who Actually Wins','The Real Reason [Subject] [Outcome]'].join('\n'),
};
/* Global settings live outside profiles — your API key and chrome shouldn't
   change just because you switched which niche you're looking at. */
const DEF_GLOBAL = { ytKey:'', theme:'dark', density:'normal', textSize:'m', autoSync:true, quota:{date:'',units:0,search:0} };
const uid = () => 'p'+Math.random().toString(36).slice(2,9);

/* ─── storage health, surfaced in Settings so a silent failure can't stay silent ─── */
const HEALTH = {
  persisted:null,        // navigator.storage.persist() result
  lsOk:true,             // last localStorage write verified?
  idbOk:true,            // last IndexedDB write succeeded?
  lastSave:0, rev:0, saves:0,
  degraded:false, lastError:'',
  recovered:null,        // what reconcile had to repair on this boot
  usage:0, quota:0,
};

function readLSRaw(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function parseStore(raw){
  if(!raw) return null;
  try{
    const o = JSON.parse(raw);
    // A store is only usable if it actually carries profiles. Anything else is
    // a truncated or half-written record and must never win over a real one.
    if(o && Array.isArray(o.profiles) && o.profiles.length && o.profiles.every(p=>p && p.id)) return o;
  }catch(e){}
  return null;
}
/* Newer wins; ties break on how much is actually in the record, so a stunted
   write can never displace a fuller one that happens to share a timestamp. */
function storeScore(o){
  if(!o) return -1;
  const chans = (o.profiles||[]).reduce((n,p)=>n+((p.cfg?.channels||[]).length),0);
  return (o._rev|0)*1e6 + Math.min(999999, Math.floor((o._savedAt||0)/1000)%1e6) + chans;
}
function betterStore(a,b){
  if(!a) return b; if(!b) return a;
  if((a._rev|0)!==(b._rev|0)) return (a._rev|0)>(b._rev|0)? a : b;
  if((a._savedAt||0)!==(b._savedAt||0)) return (a._savedAt||0)>(b._savedAt||0)? a : b;
  return storeScore(a)>=storeScore(b)? a : b;
}

function freshStore(migrated){
  const pid = uid();
  return {
    _rev:0, _savedAt:0,
    global: {...DEF_GLOBAL, ...(migrated? {ytKey:migrated.ytKey||'', theme:migrated.theme||'dark',
      density:migrated.density||'normal', autoSync:migrated.autoSync!==false, quota:migrated.quota||DEF_GLOBAL.quota} : {})},
    active: pid,
    profiles: [{ id:pid, name: migrated? 'Imported profile':'My niche', color:'#6366f1',
      cfg: {...DEF_CFG, ...(migrated? {channels:migrated.channels||[], scrapeDepth:migrated.scrapeDepth||200,
        snapshotDays:migrated.snapshotDays||120, outlierThreshold:migrated.outlierThreshold||3,
        region:migrated.region||'US', trendCats:migrated.trendCats||[22,24,25],
        includeShorts:migrated.includeShorts!==false, titlePatterns:migrated.titlePatterns||DEF_CFG.titlePatterns,
        lastSync:migrated.lastSync||0} : {})} }]
  };
}

/* Synchronous boot value. Both localStorage slots are consulted; if neither
   yields a usable record the store is marked PROVISIONAL, which locks saving
   until reconcileStore() has had a chance to look in IndexedDB. Without that
   lock, one unlucky read turns into a permanent wipe the moment anything
   calls saveCfg(). */
let STORE_READY = false;      // false = provisional, saving is refused
let STORE = (()=>{
  const a = parseStore(readLSRaw(LS)), b = parseStore(readLSRaw(LS_BAK));
  const best = betterStore(a,b);
  if(best){ STORE_READY = true; return best; }
  let migrated=null;
  try{ const old=JSON.parse(readLSRaw(LS_OLD)||'null'); if(old) migrated=old; }catch(e){}
  const s = freshStore(migrated);
  // A v1 migration is real data, so it may save immediately. A blank store may not.
  if(migrated) STORE_READY = true;
  else s._provisional = true;
  return s;
})();

function activeProfile(){
  let p = STORE.profiles.find(x=>x.id===STORE.active);
  if(!p){ p = STORE.profiles[0]; if(p) STORE.active = p.id; }
  if(!p){ // never hand back undefined — callers dereference .cfg unconditionally
    p = {id:uid(), name:'My niche', color:'#6366f1', cfg:{...DEF_CFG}};
    STORE.profiles.push(p); STORE.active = p.id;
  }
  if(!p.cfg) p.cfg = {...DEF_CFG};
  return p;
}
/* CFG proxies the active profile's cfg, so every existing `CFG.x` read/write
   in the app transparently targets whichever profile is selected. */
let CFG = new Proxy({}, {
  get(_,k){
    if(k in DEF_GLOBAL) return STORE.global[k] !== undefined ? STORE.global[k] : DEF_GLOBAL[k];
    const p = activeProfile();
    return p.cfg[k] !== undefined ? p.cfg[k] : DEF_CFG[k];
  },
  set(_,k,v){
    if(k in DEF_GLOBAL) STORE.global[k]=v; else activeProfile().cfg[k]=v;
    return true;
  },
  has(_,k){ return (k in DEF_GLOBAL) || (k in DEF_CFG); }
});
const PID = () => STORE.active;

/* ─── the write path ─────────────────────────────────────────
   Synchronous localStorage first (it is the only thing guaranteed to complete
   during an unload), then a debounced IndexedDB mirror. Every localStorage
   write is read back: a setItem that silently truncates or no-ops is a
   failure, and pretending otherwise is exactly how a refresh eats your work. */
function writeLSVerified(key, json){
  try{
    localStorage.setItem(key, json);
    return localStorage.getItem(key) === json;   // read-back proof
  }catch(e){ HEALTH.lastError = e && e.name || String(e); return false; }
}
/* Quota is nearly always our own rolling debris, so clear that before deciding
   localStorage is unusable. Never touches keys we don't own. */
function reclaimLS(){
  try{
    const doomed=[];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (k.startsWith('signal_tmp_') || k.startsWith('signal_store_v2_bak'))) doomed.push(k);
    }
    doomed.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    return doomed.length;
  }catch(e){ return 0; }
}

let _mirrorTimer=null, _mirrorPending=null;
function queueMirror(json, rev){
  _mirrorPending = {json, rev};
  clearTimeout(_mirrorTimer);
  _mirrorTimer = setTimeout(flushMirror, 700);
}
async function flushMirror(){
  clearTimeout(_mirrorTimer);
  const p = _mirrorPending; if(!p) return;
  _mirrorPending = null;
  try{
    await idbPut('misc', {k:'store_mirror', json:p.json, rev:p.rev, at:Date.now()});
    // rolling ring of the last 12 good revisions — a few KB each, and the
    // difference between "annoying" and "gone" if a bad write ever lands
    await idbPut('misc', {k:'store_bak_'+(p.rev%12), json:p.json, rev:p.rev, at:Date.now()});
    HEALTH.idbOk = true;
  }catch(e){ HEALTH.idbOk = false; HEALTH.lastError = e && e.message || String(e); }
}

const TAB_ID = Math.random().toString(36).slice(2,10);
let _bc = null;
try{ _bc = ('BroadcastChannel' in self) ? new BroadcastChannel('signal_store') : null; }catch(e){ _bc=null; }

function saveCfg(){
  // A provisional store is a store we know nothing about yet. Writing it would
  // overwrite whatever is really on disk, which is the bug this whole file
  // exists to kill. Drop the write; reconcile will save once it knows the truth.
  if(!STORE_READY){ return false; }
  STORE._rev = (STORE._rev|0) + 1;
  STORE._savedAt = Date.now();
  delete STORE._provisional;
  let json;
  try{ json = JSON.stringify(STORE); }
  catch(e){ HEALTH.degraded=true; HEALTH.lastError='serialise: '+e.message; return false; }

  let ok = writeLSVerified(LS, json);
  if(!ok){ reclaimLS(); ok = writeLSVerified(LS, json); }   // one reclaim-and-retry
  HEALTH.lsOk = ok;
  if(ok) writeLSVerified(LS_BAK, json);                      // backup only after primary lands
  else if(!HEALTH.degraded){
    HEALTH.degraded = true;
    try{ toast('Browser storage refused a write — your data is being kept in the database mirror. Export a backup from Settings.','err'); }catch(e){}
  }
  if(ok) HEALTH.degraded = false;

  HEALTH.lastSave = STORE._savedAt; HEALTH.rev = STORE._rev; HEALTH.saves++;
  queueMirror(json, STORE._rev);
  try{ _bc && _bc.postMessage({t:'store', rev:STORE._rev, from:TAB_ID}); }catch(e){}
  return ok;
}

/* v2 re-keys every store on a composite `_k` (profile::id) so two profiles can
   track the same channel without their rows overwriting each other. The v1
   stores are left in place and drained once on first boot — no data is lost. */
const DB_NAME='signal_db', DB_VER=2;
const STORES = {videos:'v2_videos', channels:'v2_channels', snapshots:'v2_snapshots', trending:'v2_trending'};
const OLD = {videos:'videos', channels:'channels', snapshots:'snapshots', trending:'trending'};
let _db=null, _dbOpening=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  if(_dbOpening) return _dbOpening;
  _dbOpening = new Promise((res,rej)=>{
    let r;
    try{ r = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ _dbOpening=null; return rej(e); }
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('videos')){
        const s=db.createObjectStore('videos',{keyPath:'id'}); s.createIndex('channelId','channelId');
      }
      if(!db.objectStoreNames.contains('channels')) db.createObjectStore('channels',{keyPath:'id'});
      if(!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots',{keyPath:'key'});
      if(!db.objectStoreNames.contains('trending')) db.createObjectStore('trending',{keyPath:'ts'});
      if(!db.objectStoreNames.contains('misc')) db.createObjectStore('misc',{keyPath:'k'});
      Object.values(STORES).forEach(n=>{
        if(!db.objectStoreNames.contains(n)){
          const s=db.createObjectStore(n,{keyPath:'_k'});
          s.createIndex('pid','pid'); s.createIndex('channelId','channelId');
        }
      });
    };
    r.onsuccess = ()=>{
      _db=r.result; _dbOpening=null;
      /* A cached handle that has been closed underneath us — another tab
         upgrading, or the browser reclaiming an idle connection — makes every
         later write fail silently. Drop it so the next call reopens. */
      _db.onversionchange = ()=>{ try{ _db.close(); }catch(e){} _db=null; };
      _db.onclose = ()=>{ _db=null; };
      res(_db);
    };
    r.onerror = ()=>{ _dbOpening=null; rej(r.error); };
    r.onblocked = ()=>{ /* another tab holds an old version; onsuccess still fires once it closes */ };
  });
  return _dbOpening;
}
const keyOf = (r, idField) => `${r.pid}::${r[idField]}`;
async function migrateV1(){
  const flag = await idbGet('misc','migrated_v2');
  if(flag) return 0;
  const first = STORE.profiles[0].id;
  let moved=0;
  for(const [logical, oldName] of Object.entries(OLD)){
    const rows = await idbAll(oldName);
    if(!rows.length) continue;
    const idField = logical==='snapshots'?'key' : logical==='trending'?'ts' : 'id';
    const stamped = rows.map(r=>({...r, pid:first, _k:`${first}::${r[idField]}`}));
    await idbPut(STORES[logical], stamped);
    moved += stamped.length;
  }
  await idbPut('misc',{k:'migrated_v2', v:true, movedRows:moved, at:Date.now()});
  if(moved) console.info(`[signal] migrated ${moved} rows into profile-scoped stores`);
  return moved;
}
/* One transparent reopen-and-retry. An IndexedDB call that fails because the
   handle went stale is the single most common way a "saved" write isn't. */
async function withDB(fn){
  try{ return await fn(await idb()); }
  catch(e){
    _db=null; _dbOpening=null;
    return await fn(await idb());
  }
}
/* Every readwrite transaction asks for relaxed durability.

   IndexedDB's default is to force the write all the way to disk before the
   transaction completes, once per transaction. Storing a scraped catalogue means
   thousands of rows across dozens of transactions, and those forced flushes were
   almost the entire cost of a sync: 5.6 seconds of a 6.3-second run with the
   network stubbed out. Relaxed durability keeps the write ordered and atomic and
   lets the OS decide when it hits the platter — the only thing at risk is the
   last few seconds of writes in a power cut, and this is a cache of data that a
   re-sync rebuilds. Browsers that don't know the option ignore it. */
function rwTx(db, store){
  try{ return db.transaction(store,'readwrite',{durability:'relaxed'}); }
  catch(e){ return db.transaction(store,'readwrite'); }
}
async function idbPut(store, items){
  const list = Array.isArray(items)?items:[items];
  if(!list.length) return;
  // Chunked so a huge sync can't build one transaction big enough to be
  // aborted wholesale — a partial failure then costs one chunk, not the lot.
  const CH = 2000;
  for(let i=0;i<list.length;i+=CH){
    const slice = list.slice(i,i+CH);
    await withDB(db=>new Promise((res,rej)=>{
      const tx = rwTx(db, store), os = tx.objectStore(store);
      slice.forEach(it=>os.put(it));
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('aborted'));
    }));
  }
}
async function idbAll(store){
  return withDB(db=>new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(store)) return res([]);
    const r = db.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  }));
}
async function idbClear(store){
  return withDB(db=>new Promise((res,rej)=>{
    const tx = rwTx(db, store); tx.objectStore(store).clear();
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
async function idbDelete(store, keys){
  if(!keys || !keys.length) return;
  const CH = 2000;
  for(let i=0;i<keys.length;i+=CH){
    const slice = keys.slice(i,i+CH);
    await withDB(db=>new Promise((res,rej)=>{
      const tx = rwTx(db, store), os = tx.objectStore(store);
      slice.forEach(k=>os.delete(k));
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('aborted'));
    }));
  }
}


/* ─── indexed reads ──────────────────────────────────────────
   Every profile-scoped store already carries a `pid` index, and nothing used it.
   loadAll() called getAll() on each store — pulling every row belonging to every
   profile into memory — and then discarded most of it with a `.filter()`. With
   five profiles that is five times the reading, five times the deserialisation
   and five times the garbage on every boot and every profile switch. That is
   the slow refresh. Reading through the index touches only this profile's rows.

   The same applies to single records: fetching one `comments_<pid>` blob used to
   getAll() the misc store, which drags every profile's comment payload and all
   twelve settings snapshots through memory to find one key. */
function _hasIndex(os, name){ try{ return Array.from(os.indexNames).includes(name); }catch(e){ return false; } }
async function idbByPid(store, pid){
  return withDB(db=>new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(store)) return res([]);
    const os = db.transaction(store,'readonly').objectStore(store);
    if(_hasIndex(os,'pid')){
      const r = os.index('pid').getAll(pid);
      r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
    }else{                                   // pre-index database: one-time full read
      const r = os.getAll();
      r.onsuccess=()=>res((r.result||[]).filter(x=>x&&x.pid===pid)); r.onerror=()=>rej(r.error);
    }
  }));
}
async function idbCountByPid(store, pid){
  return withDB(db=>new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(store)) return res(0);
    const os = db.transaction(store,'readonly').objectStore(store);
    if(!_hasIndex(os,'pid')){
      const r = os.getAll();
      r.onsuccess=()=>res((r.result||[]).filter(x=>x&&x.pid===pid).length); r.onerror=()=>rej(r.error);
      return;
    }
    const r = os.index('pid').count(pid);    // counted in the index, no records read
    r.onsuccess=()=>res(r.result||0); r.onerror=()=>rej(r.error);
  }));
}
async function idbGet(store, key){
  return withDB(db=>new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(store)) return res(null);
    const r = db.transaction(store,'readonly').objectStore(store).get(key);
    r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);
  }));
}
/* All four stores probed inside a single readonly transaction. Opening one
   transaction per store was most of the cost — the walks themselves are trivial
   because they only visit distinct index keys and never touch a record. */
async function distinctPidsAll(){
  const names = Object.values(STORES);
  return withDB(db=>new Promise((res,rej)=>{
    const present = names.filter(n=>db.objectStoreNames.contains(n));
    if(!present.length) return res(new Set());
    const tx = db.transaction(present,'readonly');
    const out = new Set();
    for(const n of present){
      const os = tx.objectStore(n);
      if(!_hasIndex(os,'pid')) continue;
      const c = os.index('pid').openKeyCursor(null,'nextunique');
      c.onsuccess = e=>{ const cur=e.target.result; if(!cur) return; out.add(cur.key); cur.continue(); };
    }
    tx.oncomplete=()=>res(out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
  }));
}
/* Walks distinct index keys only — no record is ever deserialised. This is what
   makes the integrity check affordable: finding which profiles own data used to
   mean reading all of it. */
async function distinctPids(store){
  return withDB(db=>new Promise((res,rej)=>{
    if(!db.objectStoreNames.contains(store)) return res([]);
    const os = db.transaction(store,'readonly').objectStore(store);
    if(!_hasIndex(os,'pid')){
      const r = os.getAll();
      r.onsuccess=()=>res([...new Set((r.result||[]).map(x=>x&&x.pid).filter(Boolean))]);
      r.onerror=()=>rej(r.error); return;
    }
    const out=[];
    const c = os.index('pid').openKeyCursor(null,'nextunique');
    c.onsuccess=e=>{ const cur=e.target.result; if(!cur) return res(out); out.push(cur.key); cur.continue(); };
    c.onerror=()=>rej(c.error);
  }));
}

/* ─── reconcile & repair ─────────────────────────────────────
   Runs once, before the first render, and is the reason "0 channels" cannot
   survive a refresh any more. */
/* Boot asks one question of the database: which profiles own data, and how
   much. The first version answered it by reading every row of every store —
   tens of thousands of video records deserialised on every single load, just to
   count them. That was most of the slow refresh.

   Now: distinct profile ids come from an index key walk (no records read),
   counts come from index counts (no records read), and only the channels store
   is read in full — it holds a few dozen rows per profile and its contents are
   what rebuilding a lost list actually needs. */
async function scanPids(){
  const seen = new Map();
  const touch = p => { let e=seen.get(p);
    if(!e){ e={pid:p, videos:0, channels:0, snapshots:0, trending:0, chanRows:[]}; seen.set(p,e); }
    return e; };
  for(const st of Object.values(STORES)){
    let list=[]; try{ list = await distinctPids(st); }catch(e){ continue; }
    (list||[]).forEach(p=>{ if(p) touch(p); });
  }
  let chAll=[]; try{ chAll = await idbAll(STORES.channels); }catch(e){}
  for(const c of chAll){ if(c && c.pid){ const e=touch(c.pid); e.chanRows.push(c); e.channels++; } }
  await Promise.all([...seen.values()].map(async e=>{
    const [v,s,t] = await Promise.all([
      idbCountByPid(STORES.videos, e.pid),
      idbCountByPid(STORES.snapshots, e.pid),
      idbCountByPid(STORES.trending, e.pid),
    ]);
    e.videos=v; e.snapshots=s; e.trending=t;
  }));
  return seen;
}
/* Cached channel rows carry the channel's UC id, which is exactly what the
   settings list accepts — so a lost list can be rebuilt verbatim from the data
   it produced. UC ids are also the cheap path on re-sync: 50 resolve per quota
   unit, versus one unit each for handles. */
function linesFromChanRows(rows){
  const out=[], seen=new Set();
  rows.sort((a,b)=>(b.subs||0)-(a.subs||0)).forEach(c=>{
    const v = c.id || c.handle; if(!v || seen.has(v)) return;
    seen.add(v); out.push(v);
  });
  return out;
}
/* Recovery must not be a tax on every healthy load.

   The first version of this ran the full repair path unconditionally: thirteen
   IndexedDB round-trips for the mirror and its backup ring, then a scan that
   counted every row of every store, then a second scan for the channel-list
   heal. On a five-profile install that turned a 300ms boot into a 670ms one —
   trading the slow refresh being fixed here for a slower one somewhere else.

   Now there are two paths. If localStorage handed over a usable settings
   record, boot does one cheap integrity probe — an index key walk per store,
   which reads no records at all — and stops there. The mirror, the backup ring,
   the counts and the heal only run when that probe finds something wrong, or
   when there was no usable record to begin with. A newer mirror (another tab,
   a restore) is still adopted, just after first paint instead of before it. */
async function reconcileStore(){
  const notes = [];
  let best = parseStore(readLSRaw(LS));
  best = betterStore(best, parseStore(readLSRaw(LS_BAK)));
  const hadNothing = !!STORE._provisional;

  if(hadNothing || !best){                 // ── recovery path: consult everything
    const [mirror, ...baks] = await Promise.all([
      idbGet('misc','store_mirror'),
      ...[...Array(12)].map((_,i)=>idbGet('misc','store_bak_'+i)),
    ]);
    if(mirror && mirror.json) best = betterStore(best, parseStore(mirror.json));
    for(const m of baks){ if(m && m.json) best = betterStore(best, parseStore(m.json)); }
  }
  if(best && (hadNothing || storeScore(best) > storeScore(STORE))){
    if(hadNothing) notes.push('settings restored from the database mirror');
    STORE = best;
  }
  STORE_READY = true;
  delete STORE._provisional;

  /* A boot that loaded a usable settings record has nothing to prove before it
     paints. The integrity probe still runs — just after the first render, where
     130ms of index walking costs the user nothing instead of delaying the app.
     The one case that cannot wait is a boot that found no settings at all:
     there, repair has to happen before anything is written. */
  if(!hadNothing){
    HEALTH.recovered = null;
    return notes;
  }

  // ── repair path ──
  const known = new Set(STORE.profiles.map(p=>p.id));
  const seen = await scanPids();

  //   2a. profile exists, but its channel list was lost while its rows survived
  //       — this is the "0 channels · N videos" case, verbatim.
  for(const p of STORE.profiles){
    const e = seen.get(p.id); if(!e) continue;
    if(!p.cfg) p.cfg = {...DEF_CFG};
    if(!(p.cfg.channels||[]).length && e.chanRows.length){
      p.cfg.channels = linesFromChanRows(e.chanRows);
      notes.push(`rebuilt ${p.cfg.channels.length} channel${p.cfg.channels.length===1?'':'s'} for "${p.name}" from cached data`);
    }
  }

  //   2b. rows whose profile is gone entirely — adopt them rather than leaving
  //       gigabytes of perfectly good data unreachable and invisible.
  let adopted=0;
  for(const [pid,e] of seen){
    if(known.has(pid)) continue;
    const total = e.videos+e.channels+e.snapshots+e.trending;
    if(!total) continue;
    STORE.profiles.push({
      id: pid,
      name: `Recovered ${new Date().toLocaleDateString()}${adopted?' ('+(adopted+1)+')':''}`,
      color: PCOLORS[STORE.profiles.length % PCOLORS.length],
      cfg: {...DEF_CFG, channels: linesFromChanRows(e.chanRows)}
    });
    adopted++;
    notes.push(`recovered ${nfull(total)} orphaned record${total===1?'':'s'} into a new profile`);
  }
  //   an adopted profile is worthless if you can't get to it
  if(adopted && (hadNothing || !seen.get(STORE.active))){
    const richest = [...seen.entries()].sort((a,b)=>
      (b[1].videos+b[1].channels)-(a[1].videos+a[1].channels))[0];
    if(richest) STORE.active = richest[0];
  }
  if(!STORE.profiles.find(p=>p.id===STORE.active)) STORE.active = STORE.profiles[0].id;

  HEALTH.recovered = notes.length? notes : null;
  saveCfg();                                  // first legal write of the session
  await flushMirror();
  return notes;
}

/* The fast boot path trusts localStorage and never opens the mirror. That is
   right nearly always, and wrong in one case: another tab (or a restore) wrote
   a newer revision while this tab's localStorage lagged. Checking after first
   paint keeps boot fast and still converges — and because the fast path writes
   nothing, the mirror's revision is still comparable when we get here. */
async function verifyMirrorLater(){
  try{
    const m = await idbGet('misc','store_mirror');
    const inc = m && parseStore(m.json);
    if(inc && (inc._rev|0) > (STORE._rev|0)){
      STORE = inc;
      await loadAll();
      renderProfBar(); renderSideNav(); render();
      console.info('[signal] adopted newer settings revision #'+(inc._rev|0)+' from the database mirror');
    }
  }catch(e){}
  try{ await integrityCheckLater(); }catch(e){}
}
/* The post-paint half of reconcile: does any row on disk belong to a profile
   that no longer exists, or does a profile own channel rows while its list is
   empty? Both are cheap to ask and only expensive to answer, so the answer is
   only computed when the question comes back yes. */
async function integrityCheckLater(){
  const owners = await distinctPidsAll();
  const known = new Set(STORE.profiles.map(p=>p.id));
  const orphans = [...owners].filter(p=>!known.has(p));
  const stunted = STORE.profiles.filter(p=>!(p.cfg?.channels||[]).length && owners.has(p.id));
  if(!orphans.length && !stunted.length) return;
  const notes = await repairFromScan();
  if(notes.length){
    HEALTH.recovered = notes;
    notes.slice(0,3).forEach((n,i)=>setTimeout(()=>toast('Recovered — '+n,'ok'), i*900));
    console.info('[signal] recovery:', notes);
  }
}

/* Ask the browser to stop treating this origin as disposable. Without it,
   IndexedDB and localStorage are both "best effort" and get evicted under
   storage pressure with no prompt and no warning — which is the other half of
   "I refreshed and my data was gone". */
async function requestPersistence(){
  try{
    if(navigator.storage?.persisted) HEALTH.persisted = await navigator.storage.persisted();
    if(!HEALTH.persisted && navigator.storage?.persist) HEALTH.persisted = await navigator.storage.persist();
  }catch(e){ HEALTH.persisted = null; }
  try{
    const est = await navigator.storage?.estimate?.();
    if(est){ HEALTH.usage = est.usage||0; HEALTH.quota = est.quota||0; }
  }catch(e){}
}

/* Two tabs open on the same profile used to race: whichever saved last won,
   silently discarding the other's edits. Now a tab that hears about a newer
   revision adopts it instead of overwriting it. */
function wireCrossTab(){
  /* Typing in one tab writes a draft roughly twice a second. The first version
     answered every one of those by reloading this tab's data and repainting the
     whole view — two open tabs turned each other's keystrokes into a stutter.
     Now: coalesce the notifications, and only pay for a reload when something
     this tab actually displays has changed. A draft belonging to a text box in
     another window is not that. */
  let t=null;
  const dataFingerprint = s => s
    ? s.active + '|' + (s.profiles||[]).map(p=>
        p.id+':'+((p.cfg?.channels||[]).length)+':'+(p.cfg?.lastSync||0)).join(',')
    : '';
  const adopt = async ()=>{
    const incoming = parseStore(readLSRaw(LS));
    if(!incoming) return;
    if((incoming._rev|0) <= (STORE._rev|0)) return;
    const before = dataFingerprint(STORE);
    const wasActive = STORE.active;
    STORE = incoming;
    if(dataFingerprint(STORE) === before){
      // settings-only change (a draft, a theme, a quota tick) — nothing to reload
      if(S.view==='settings') renderDirtyBar();
      return;
    }
    await loadAll();
    renderProfBar(); renderSideNav();
    if(STORE.active!==wasActive) toast(`Switched to "${activeProfile().name}" in another tab`);

  const schedule = ()=>{ clearTimeout(t); t=setTimeout(adopt, 300); };
  if(_bc) _bc.onmessage = e=>{ if(e.data?.t==='store' && e.data.from!==TAB_ID) schedule(); };

}

/* Last-moment durability. localStorage is synchronous so it always lands; the
   IndexedDB mirror is fired best-effort. Both are cheap enough to run on every
   hide, and a phone backgrounding the tab is a very common way to lose a tab. */
function wireFlush(){

  addEventListener('blur', flush);

/* Intl formatters are built once and reused. Calling toLocaleString(opts) in a

const FMT = {

  date:  new Intl.DateTimeFormat([], {month:'short',day:'numeric',year:'numeric'}),

const ago = ts => { const d=(Date.now()-ts)/1000; if(d<60)return'just now'; if(d<3600)return Math.floor(d/60)+'m ago'; if(d<86400)return Math.floor(d/3600)+'h ago'; return Math.floor(d/86400)+'d ago'; };

function toTXT(rows, title){

    Object.entries(r).forEach(([k,v])=>{ if(k!=='title'&&k!=='name') o += `    ${k}: ${v}\n`; }); o+='\n'; });

/* minimal store-only ZIP writer so "export everything" is one file */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

    lh.setUint16(10,0,true); lh.setUint16(12,0,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);

  eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
  eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,off,true); eo.setUint16(20,0,true);
  return new Blob([...parts,...central,new Uint8Array(eo.buffer)],{type:'application/zip'});
}

/* ═══════════════════════════════════════════════════════════
   YOUTUBE API
   ═══════════════════════════════════════════════════════════ */
const YT='https://www.googleapis.com/youtube/v3/';
function ensureDay(){ const d=todayPT(); if(CFG.quota.date!==d){ CFG.quota={date:d,units:0,search:0}; saveCfg(); } }
function spend(n,isSearch){ ensureDay(); if(isSearch) CFG.quota.search+=1; else CFG.quota.units+=n; saveCfg(); renderQuota(); }
async function yt(ep, params, cost=1, isSearch=false){
  ensureDay();
  if(!CFG.ytKey) throw new Error('No YouTube API key — add one in Settings');
  if(isSearch && CFG.quota.search>=100) throw new Error('search.list daily cap (100) reached');
  if(!isSearch && CFG.quota.units+cost>10000) throw new Error('Daily quota (10,000 units) would be exceeded');
  const u = new URLSearchParams({...params, key:CFG.ytKey});
  const r = await fetch(YT+ep+'?'+u);
  const j = await r.json();
  spend(cost,isSearch);
  if(j.error) throw new Error(j.error.message || ('HTTP '+r.status));
  return j;
}
function parseDur(iso){ const m=/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso||''); if(!m) return 0;
  return (+(m[1]||0))*86400 + (+(m[2]||0))*3600 + (+(m[3]||0))*60 + (+(m[4]||0)); }
/* Accepts every shape a channel link actually arrives in. The old version only
   matched a full `https://www.youtube.com/...`, so the two commonest pastes both
   broke: the scheme-less form Chrome shows in the address bar
   (`youtube.com/@x`), and a link copied from a tab that carries the sub-page you
   were on (`.../@x/videos`) — that one silently became a handle named
   "@x/videos" and quietly failed to resolve on every sync. */
function parseChLine(line){
  line=String(line).trim(); if(!line) return null;
  line=line.replace(/^https?:\/\//i,'')
           .replace(/^(www\.|m\.|music\.)/i,'')
           .replace(/^youtube\.com\//i,'')
           .replace(/^youtu\.be\//i,'')
           .replace(/[?#].*$/,'')
           .replace(/\/+$/,'');
  line=line.replace(/\/(videos|shorts|streams|live|playlists|community|about|featured|posts|store)$/i,'');
  if(!line) return null;
  if(/^UC[A-Za-z0-9_-]{20,}$/.test(line)) return {type:'id',value:line};
  if(/^channel\//i.test(line)){ const v=line.split('/')[1]||''; return v? {type:'id',value:v} : null; }
  if(line.startsWith('@')){ const v=line.split('/')[0]; return v.length>1? {type:'handle',value:v} : null; }
  if(/^(c|user)\//i.test(line)){ const v=line.split('/')[1]||''; return v? {type:'handle',value:'@'+v} : null; }
  return {type:'handle',value:'@'+line.split('/')[0]};
}
async function resolveChannels(lines){
  const parsed = lines.map(parseChLine).filter(Boolean);
  const ids = parsed.filter(p=>p.type==='id').map(p=>p.value);
  const handles = parsed.filter(p=>p.type==='handle').map(p=>p.value);
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const j = await yt('channels',{part:'snippet,statistics,contentDetails,brandingSettings',id:ids.slice(i,i+50).join(',')},1);
    (j.items||[]).forEach(it=>out.push(mapChannel(it)));
  }
  for(const h of handles){
    const j = await yt('channels',{part:'snippet,statistics,contentDetails,brandingSettings',forHandle:h},1);
    (j.items||[]).forEach(it=>out.push(mapChannel(it)));
  }
  return out;
}
function mapChannel(it){
  return {
    id: it.id, title: it.snippet.title,
    handle: (it.snippet.customUrl||'').replace(/^@?/,'@'),
    desc: (it.snippet.description||'').slice(0,400),
    country: it.snippet.country||'—',
    createdAt: it.snippet.publishedAt,
    thumb: (it.snippet.thumbnails?.medium||it.snippet.thumbnails?.default||{}).url||'',
    uploads: it.contentDetails.relatedPlaylists.uploads,
    subs: +(it.statistics.subscriberCount||0),
    totalViews: +(it.statistics.viewCount||0),
    videoCount: +(it.statistics.videoCount||0),
    keywords: it.brandingSettings?.channel?.keywords||'',

}
function mapVideo(v, channelId){
  const d = parseDur(v.contentDetails?.duration);
  const st = v.statistics||{}, sn = v.snippet||{};
  return {
    id: v.id, channelId: channelId||sn.channelId, channelTitle: sn.channelTitle||'',
    /* 320, not 600: the only thing that ever reads this truncates to 300, so the
       extra half-kilobyte per row was stored, re-stored on every refresh and
       read back forever without a single consumer. Across a scraped catalogue
       that is megabytes of pure write cost. */
    title: sn.title||'', desc: (sn.description||'').slice(0,320),
    publishedAt: sn.publishedAt, publishedTs: +new Date(sn.publishedAt),
    thumb: (sn.thumbnails?.medium||sn.thumbnails?.default||{}).url||'',
    thumbHi: (sn.thumbnails?.maxres||sn.thumbnails?.standard||sn.thumbnails?.high||sn.thumbnails?.medium||{}).url||'',
    tags: sn.tags||[], categoryId: sn.categoryId||'', lang: sn.defaultAudioLanguage||sn.defaultLanguage||'',
    views:+(st.viewCount||0), likes:+(st.likeCount||0), comments:+(st.commentCount||0),
    durationSec:d, isShort: d>0 && d<=60,
    definition: v.contentDetails?.definition||'', caption: v.contentDetails?.caption==='true',
    licensed: !!v.contentDetails?.licensedContent,
    madeForKids: !!v.status?.madeForKids, license: v.status?.license||'',
