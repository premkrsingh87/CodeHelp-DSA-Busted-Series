/* ─────────── COMPARE ─────────── */
function vCompare(){
  const sel = selectedChannelObjs();
  if(sel.length<2) return `<div class="panel"><div class="pad">${emptyState('chart','Pick 2 or more channels to compare',
    'Use the channel selector in the toolbar — tick any combination, then come back here. Everything below is computed head-to-head over the current date range.')}</div></div>`;
  const all = enrichedInRange();
  const per = sel.map(c=>{
    const g = all.filter(v=>v.channelId===c.id);
    const t = channelTrend(c.id);
    const vals = g.map(v=>v.views), mu = mean(vals);
    const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
    const months = g.length? Math.max(1,(Date.now()-Math.min(...g.map(v=>v.publishedTs)))/(30*864e5)) : 1;
    const hrs={}; g.forEach(v=>{ (hrs[v.pubHour]=hrs[v.pubHour]||[]).push(v); });
    const bestHour = Object.entries(hrs).filter(([,a])=>a.length>=2)
      .sort((a,b)=>median(b[1].map(v=>v.outlier))-median(a[1].map(v=>v.outlier)))[0];
    return { c, g, t, cv,
      count:g.length, med:median(vals), mean:mu, max:Math.max(0,...vals),
      total:vals.reduce((a,b)=>a+b,0),
      outliers:g.filter(v=>v.outlier>=CFG.outlierThreshold).length,
      engage:median(g.map(v=>v.engage)), likeRate:median(g.map(v=>v.likeRate)),
      cadence:+(g.length/months).toFixed(1),
      medDur:median(g.map(v=>v.durationSec)),
      shorts:g.length? g.filter(v=>v.isShort).length/g.length : 0,
      viewsPerSub: c.subs? +(median(vals)/c.subs*1000).toFixed(2) : 0,
      bestHour: bestHour? String(bestHour[0]).padStart(2,'0')+':00' : '—',
      best:[...g].sort((a,b)=>b.outlier-a.outlier)[0],
      topics:new Set(g.flatMap(v=>extractTopics(v.title||'')))
    };
  });
  // winner per metric so the eye lands on it without reading every number
  const win = (key, hi=true)=>{ const vals=per.map(p=>p[key]); const best=hi?Math.max(...vals):Math.min(...vals);
    return per.map(p=>p[key]===best && vals.filter(v=>v===best).length<per.length); };
  const ROWS = [
    ['Videos in range','count', v=>nfull(v), true],
    ['Median views','med', v=>nf(Math.round(v)), true],
    ['Mean views','mean', v=>nf(Math.round(v)), true],
    ['Best video','max', v=>nf(v), true],
    ['Total views','total', v=>nf(v), true],
    [`Outliers ≥${CFG.outlierThreshold}×`,'outliers', v=>nfull(v), true],
    ['Uploads / month','cadence', v=>v, true],
    ['Median engagement','engage', v=>v.toFixed(2)+'%', true],
    ['Like rate','likeRate', v=>v.toFixed(2)+'%', true],
    ['Median length','medDur', v=>dur(Math.round(v)), null],
    ['Shorts share','shorts', v=>pct(v), null],
    ['Views per 1K subs','viewsPerSub', v=>nfull(v), true],
    ['Best publish hour','bestHour', v=>v, null],
  ];
  // topic gap: what each channel owns that none of the others touched
  const gaps = per.map((p,i)=>{
    const others = new Set(per.filter((_,j)=>j!==i).flatMap(x=>[...x.topics]));
    const owned = [...p.topics].filter(t=>!others.has(t));
    const scored = owned.map(t=>{
      const vs = p.g.filter(v=>extractTopics(v.title||'').includes(t));
      return {t, n:vs.length, med:median(vs.map(v=>v.outlier)), views:median(vs.map(v=>v.views))};
    }).filter(x=>x.n>=2).sort((a,b)=>b.med-a.med).slice(0,8);
    return {p, scored};
  });
  const shared = per.reduce((acc,p)=> acc===null? new Set(p.topics)
    : new Set([...acc].filter(t=>p.topics.has(t))), null);

  return `
  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('users')}Comparing ${sel.length} channels · ${rangeLabel()}
    <span class="right row" style="gap:6px">
      <button class="btn btn-sm btn-o" data-export="compare|csv">CSV</button>
      <button class="btn btn-sm btn-o" data-export="compare|json">JSON</button>
      <button class="btn btn-sm btn-p" data-act="copyCompare">${ic('copy')}Copy brief</button></span></div>
  <div class="tbl-wrap"><table><thead><tr><th style="min-width:150px">Metric</th>
    ${per.map(p=>`<th class="num" style="min-width:130px">
      <div class="row" style="justify-content:flex-end;gap:7px">
        <span class="c1" style="max-width:120px">${esc(p.c.title)}</span>
        <img class="avat" style="width:22px;height:22px" src="${esc(p.c.thumb)}" alt=""></div>
      <div class="dim" style="font-weight:600;font-size:9.5px;margin-top:2px">${nf(p.c.subs)} subs</div></th>`).join('')}
  </tr></thead><tbody>
    ${ROWS.map(([label,key,fmt,hi])=>{
      const w = hi===null? per.map(()=>false) : win(key,hi);
      return `<tr><td style="font-weight:600">${label}</td>
        ${per.map((p,i)=>`<td class="num ${w[i]?'':'muted'}">${w[i]?`<b style="color:var(--acc)">${fmt(p[key])}</b>`:fmt(p[key])}</td>`).join('')}</tr>`;
    }).join('')}
    <tr><td style="font-weight:600">Trend (last 10 vs prior 10)</td>
      ${per.map(p=>`<td class="num">${p.t?`<span class="badge ${p.t.ratio>=1.25?'b-ok':p.t.ratio<=0.75?'b-err':'b-grey'}">${p.t.ratio>=1.25?'▲':p.t.ratio<=0.75?'▼':'—'} ${p.t.ratio}×</span>`:'<span class="dim">—</span>'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Output consistency</td>
      ${per.map(p=>`<td class="num muted">${p.cv<0.8?'steady':p.cv<2?'mixed':'spiky'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Best performer</td>
      ${per.map(p=>p.best?`<td><a href="https://youtube.com/watch?v=${p.best.id}" target="_blank" rel="noopener">
        <img class="vthumb" style="width:120px;min-width:120px;margin-bottom:5px" loading="lazy" src="${esc(thumbUrl(p.best))}" alt="">
        <span class="c2" style="font-size:10.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.best.title)}</span></a>
        <div class="dim" style="font-size:9.5px;margin-top:3px">${p.best.outlier}× · ${nf(p.best.views)}</div></td>`:'<td class="dim">—</td>').join('')}</tr>
  </tbody></table></div></div>

  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('target')}Topic gaps — what each one owns alone
    <span class="right dim" style="font-size:10px;font-weight:600">topics no other selected channel has covered</span></div>
    <div class="pad grid3">
      ${gaps.map(({p,scored})=>`<div>
        <div class="row" style="gap:8px;margin-bottom:9px">
          <img class="avat" style="width:24px;height:24px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:12px" class="c1">${esc(p.c.title)}</b></div>
        ${scored.length? scored.map(x=>`<div class="row" style="justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rowline)">
            <span class="c1" style="font-size:11.5px">${esc(x.t)}</span>
            <span class="row" style="gap:6px;flex-shrink:0">
              <span class="badge ${x.med>=1.5?'b-ok':'b-grey'}">${x.med.toFixed(2)}×</span>
              <span class="dim" style="font-size:9.5px">${x.n}v · ${nf(x.views)}</span></span></div>`).join('')
          : '<div class="dim" style="font-size:11px">No exclusive topics — everything it covers, others cover too.</div>'}
      </div>`).join('')}
    </div>
    ${shared && shared.size? `<div class="pad" style="border-top:1px solid var(--line)">
      <div class="lbl">Contested — every selected channel covers these</div>
      <div class="row wrapf" style="gap:6px">${[...shared].slice(0,24).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`:''}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('clock')}Upload timing, side by side</div><div class="pad">
      ${per.map(p=>`<div style="margin-bottom:16px">
        <div class="row" style="gap:8px;margin-bottom:7px"><img class="avat" style="width:20px;height:20px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:11.5px">${esc(p.c.title)}</b><span class="dim" style="font-size:10px">peak ${p.bestHour}</span></div>
        ${(()=>{ const hrs=Array.from({length:24},(_,h)=>p.g.filter(v=>v.pubHour===h).length);
          const mx=Math.max(...hrs,1);
          return `<div style="display:flex;gap:2px;height:38px;align-items:flex-end">${hrs.map((n,h)=>
            `<div style="flex:1;height:${n?Math.max(6,n/mx*100):2}%;border-radius:3px 3px 1px 1px;
              background:${n?'var(--acc)':'var(--hov)'};opacity:${n?0.35+0.65*(n/mx):1}"
              title="${String(h).padStart(2,'0')}:00 — ${n} uploads"></div>`).join('')}</div>`;})()}
      </div>`).join('')}
      <div class="dim" style="font-size:10px">Bar height = uploads in that hour, local time.</div></div></div>

    <div class="panel"><div class="phead">${ic('film')}Length strategy, side by side</div><div class="pad">
      ${(()=>{ const B=[[0,60,'Shorts'],[60,600,'1–10m'],[600,1200,'10–20m'],[1200,2400,'20–40m'],[2400,1e9,'40m+']];
        return B.map(([a,b,label])=>`<div style="margin-bottom:12px">
          <div class="bl" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px">
            <span class="muted">${label}</span></div>
          ${per.map(p=>{ const g=p.g.filter(v=>v.durationSec>=a&&v.durationSec<b);
            const share=p.g.length? g.length/p.g.length:0;
            return `<div class="row" style="gap:7px;margin-bottom:3px">
              <span class="c1 dim" style="width:96px;font-size:10px">${esc(p.c.title)}</span>
              <span class="track grow"><i style="width:${(share*100).toFixed(0)}%"></i></span>
              <span class="dim" style="font-size:10px;width:78px;text-align:right">${g.length} · ${g.length?nf(median(g.map(v=>v.views))):'—'}</span></div>`;}).join('')}
        </div>`).join('');})()}
      <div class="dim" style="font-size:10px">Bar = share of that channel's uploads · right = count and median views.</div></div></div>
  </div>`;
}

/* ─────────── OPPORTUNITIES ─────────── */
function vOpps(){
  const vids = enrichedInRange();
  if(!vids.length) return `<div class="panel"><div class="pad">${emptyState('bolt','No data in this range','Run a sync or widen the range.')}</div></div>`;
  const topics = topicStats(vids);
  const breakouts = vids.map(v=>({v, b:breakoutScore(v)})).filter(x=>x.b && x.b.score>1.2)
    .sort((a,b)=>b.b.score-a.b.score).slice(0,12);
  const openLanes = topics.filter(t=>t.coverage<=2 && t.medOutlier>=1.2 && t.count>=2).slice(0,12);
  const heating = [...topics].filter(t=>t.recent>0).sort((a,b)=>b.momentum-a.momentum).slice(0,12);
  const cooling = [...topics].filter(t=>t.prior>=3 && t.recent===0)
    .sort((a,b)=>b.medOutlier-a.medOutlier).slice(0,8);
  const tab = S.filters.oppTab||'breakout';

  const topicRow = (t,extra)=>`<tr>
    <td><div style="font-weight:700;font-size:12.5px">${esc(t.topic)}</div>
      <div class="vmeta"><span>${t.count} videos</span><span class="sep">·</span>
        <span>${t.coverage} channel${t.coverage===1?'':'s'}</span><span class="sep">·</span>
        <span>last ${t.daysOld}d ago</span></div></td>
    <td class="num"><span class="badge ${t.medOutlier>=2?'b-ok':t.medOutlier>=1.2?'b-acc':'b-grey'}">${t.medOutlier}×</span></td>
    <td class="num">${nf(t.medViews)}</td>
    ${extra||''}
    <td style="max-width:250px"><a href="https://youtube.com/watch?v=${t.best.id}" target="_blank" rel="noopener" class="c1" style="font-size:11px;color:var(--t3)">${esc(t.best.title)}</a>
      <div class="dim" style="font-size:9.5px">${t.best.outlier}× · ${nf(t.best.views)} views</div></td>
    <td><button class="btn btn-sm btn-o" data-oppsearch="${esc(t.topic)}">See all</button></td></tr>`;

  return `
  <div class="kgrid" style="margin-bottom:14px">
    <div class="kpi"><div class="ico">${ic('bolt')}</div><div class="v" style="color:var(--warn)">${breakouts.length}</div>
      <div class="k">Breaking out now</div><div class="d dim">young videos beating channel pace</div></div>
    <div class="kpi"><div class="ico">${ic('target')}</div><div class="v">${openLanes.length}</div>
      <div class="k">Open lanes</div><div class="d dim">proven topic, ≤2 channels on it</div></div>
    <div class="kpi"><div class="ico">${ic('up')}</div><div class="v" style="color:var(--ok)">${heating.filter(t=>t.momentum>1.5).length}</div>
      <div class="k">Heating up</div><div class="d dim">rising share of uploads</div></div>
    <div class="kpi"><div class="v">${nfull(topics.length)}</div><div class="k">Topics detected</div>
      <div class="d dim">across ${nfull(vids.length)} videos</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="phead"><div class="seg plain" style="margin-right:auto">
      ${[['breakout','⚡ Breakout watch'],['lanes','🎯 Open lanes'],['heating','📈 Heating up'],['cooling','🕰 Revival candidates']]
        .map(([k,l])=>`<button class="${tab===k?'on':''}" data-opptab="${k}">${l}</button>`).join('')}
    </div>
    <button class="btn btn-sm btn-o" data-export="topics|csv">CSV</button>
    <button class="btn btn-sm btn-o" data-export="topics|json">JSON</button>
    <button class="btn btn-sm btn-p" data-act="copyOppBrief">${ic('copy')}Copy brief</button></div>

    ${tab==='breakout'? (!breakouts.length? `<div class="pad">${emptyState('bolt','Nothing breaking out',
        'Breakout detection compares a young video\'s daily pace against its channel\'s norm, and needs 2+ days of snapshots. Sync daily and this fills in.')}</div>`
      : `<div class="tbl-wrap"><table><thead><tr><th style="width:158px"></th><th>Video</th><th>Channel</th>
        <th class="num">Views now</th><th class="num">Pace vs norm</th><th class="num">Accel</th>
        <th class="num">Projected 30d</th><th class="num">Age</th></tr></thead><tbody>
        ${breakouts.map(({v,b})=>{ const proj=projectViews(v);
          return `<tr class="fire">
          <td class="thumbcell">${thumbLink(v,'sm')}</td>
          <td style="min-width:250px"><a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="tt">${esc(v.title)}</a>
            <div class="vmeta"><span class="badge b-warn">SCORE ${b.score}</span>
              <span>${v.pubDay} ${v.pubTime}</span><span class="sep">·</span><span>${dur(v.durationSec)}</span></div></td>
          <td class="muted c1" style="max-width:130px">${esc(v.channelTitle)}</td>
          <td class="num"><b>${nf(v.views)}</b>${b.m?`<div style="width:74px;margin-left:auto">${sparkline(b.m.series,74,16)}</div>`:''}</td>
          <td class="num"><span class="badge ${b.paceRatio>=3?'b-err':b.paceRatio>=1.5?'b-ok':'b-grey'}">${b.paceRatio}×</span></td>
          <td class="num ${b.accel>1.3?'':'dim'}">${b.accel}×</td>
          <td class="num">${proj?`<b style="color:var(--acc)">${nf(proj)}</b><div class="dim" style="font-size:9px">estimate</div>`:'<span class="dim">—</span>'}</td>
          <td class="num dim">${v.ageDays}d</td></tr>`;}).join('')}
      </tbody></table></div>`)
    : tab==='lanes'? (!openLanes.length? `<div class="pad">${emptyState('target','No open lanes found yet',
        'An open lane is a topic that performs above channel median but only 1–2 channels have covered. Track more competitors or widen the range.')}</div>`
      : `<div class="pad section-note">Topics that <b style="color:var(--t1)">perform above channel median</b> but only 1–2 channels have touched. Proven demand, little competition.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Opportunity</th><th>Best example</th><th></th></tr></thead><tbody>
        ${openLanes.map(t=>topicRow(t,`<td class="num"><span class="badge b-acc">${t.opportunity}</span></td>`)).join('')}
      </tbody></table></div>`)
    : tab==='heating'? `<div class="pad section-note">Topics taking a <b style="color:var(--t1)">rising share of uploads</b> in the last 7 days versus the prior 3 weeks — the niche is moving toward these.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
        <th class="num">Momentum</th><th>Best example</th><th></th></tr></thead><tbody>
        ${heating.map(t=>topicRow(t,`<td class="num"><span class="badge ${t.momentum>=2?'b-ok':'b-grey'}">${t.momentum}× <span class="dim">${t.recent}v/7d</span></span></td>`)).join('')}
      </tbody></table></div>`
    : (!cooling.length? `<div class="pad">${emptyState('clock','No revival candidates',
        'These are topics that performed well but nobody has published on for a while. Needs a wider range to detect.')}</div>`
      : `<div class="pad section-note">Performed well historically, but <b style="color:var(--t1)">nobody has published on them in the last 7 days</b>. Proven topics going unserved.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Last covered</th><th>Best example</th><th></th></tr></thead><tbody>
        ${cooling.map(t=>topicRow(t,`<td class="num"><span class="badge b-grey">${t.daysOld}d ago</span></td>`)).join('')}
      </tbody></table></div>`)}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('users')}Who is winning right now</div>
      <div class="tbl-wrap"><table><thead><tr><th>Channel</th><th class="num">Outliers</th><th class="num">Median</th>
        <th class="num">Trend</th><th class="num">Consistency</th></tr></thead><tbody>
      ${selectedChannelObjs().map(c=>{
        const g=vids.filter(v=>v.channelId===c.id); if(!g.length) return null;
        const t=channelTrend(c.id);
        const outs=g.filter(v=>v.outlier>=CFG.outlierThreshold).length;
        const vals=g.map(v=>v.views), mu=mean(vals);
        const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
        return {c,g,t,outs,cv};
      }).filter(Boolean).sort((a,b)=>b.outs-a.outs||b.g.length-a.g.length).map(({c,g,t,outs,cv})=>`
        <tr><td><div class="c1" style="max-width:170px;font-weight:600">${esc(c.title)}</div>
          <div class="dim" style="font-size:9.5px">${g.length} videos · ${nf(c.subs)} subs</div></td>
          <td class="num"><b style="color:${outs?'var(--acc)':'inherit'}">${outs}</b></td>
          <td class="num">${nf(median(g.map(v=>v.views)))}</td>
          <td class="num">${t?`<span class="badge ${t.ratio>=1.25?'b-ok':t.ratio<=0.75?'b-err':'b-grey'}">${t.ratio>=1.25?'▲':t.ratio<=0.75?'▼':'—'}${t.ratio}×</span>`:'<span class="dim">—</span>'}</td>
          <td class="num"><span class="dim" title="Lower = more predictable output">${cv<0.8?'steady':cv<2?'mixed':'spiky'}</span></td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="panel"><div class="phead">${ic('film')}Winning formats right now</div>
      <div class="pad">${(()=>{
        const bands = durationBuckets(vids).filter(b=>b.count>=3);
        const best = [...bands].sort((a,b)=>b.medOutlier-a.medOutlier);
        if(!best.length) return emptyState('film','Not enough videos','Widen the range.');
        return barList(best.map(b=>({label:b.label, value:b.medOutlier,
          sub:`${b.count} videos · median ${nf(b.medViews)} views · p90 ${nf(b.p90)}`})),{fmt:n=>n.toFixed(2)+'×'});
      })()}
      <div class="divider"></div>
      <div class="lbl">Best publish slots (median outlier, ≥3 videos)</div>
      ${(()=>{
        const slots={};
        vids.forEach(v=>{ const k=v.pubDay+' '+String(v.pubHour).padStart(2,'0')+':00';
          (slots[k]=slots[k]||[]).push(v.outlier); });
        const rows=Object.entries(slots).filter(([,a])=>a.length>=3)
          .map(([k,a])=>({label:k, value:+median(a).toFixed(2), sub:`${a.length} videos`}))
          .sort((a,b)=>b.value-a.value).slice(0,6);
        return rows.length? barList(rows,{fmt:n=>n.toFixed(2)+'×'}) : '<div class="dim" style="font-size:11px">Need more videos per slot.</div>';
      })()}</div></div>
  </div>`;
}

/* ─────────── THUMBNAIL BOARD ─────────── */
/* The board used to hard-stop at 120 cards with no way to see the rest. It now
   pages exactly like the feed, using the same per-page setting and the same
   pager control, so both views behave identically. */
const BOARD_SORTS = [['outlier','By outlier'],['views','By views'],['vpd','Views / day'],['recent','Newest']];
const BOARD_SIZES = [['sm','S'],['md','M'],['lg','L'],['xl','XL']];
const BOARD_W = {sm:150, md:210, lg:290, xl:390};
const BOARD_DEFAULT_SIZE = 'lg';
/* Views/day is the honest comparison when a 3-day-old video sits next to a
   3-month-old one: raw views reward age, and outlier score is relative to the
   channel rather than to the shelf you are choosing from. */
const boardCmp = {
  recent:  (a,b)=>b.publishedTs-a.publishedTs,
  views:   (a,b)=>b.views-a.views,
  vpd:     (a,b)=>b.vpd-a.vpd,
  outlier: (a,b)=>b.outlier-a.outlier,
};
let _boardCache=null, _boardKey='';
function boardRows(){
  const sortBy = S.filters.boardSort||'outlier';
  const key = [dataKey(), S.range, CFG.rangeFrom||'', CFG.rangeTo||'', selSig(),
    S.filters.q||'', CFG.includeShorts?1:0, CFG.minViews||0, sortBy].join('|');
  if(_boardCache && _boardKey===key) return _boardCache;
  _boardCache = [...applyQ(enrichedInRange())].sort(boardCmp[sortBy]||boardCmp.outlier);
  _boardKey = key;
  return _boardCache;
}
function boardGrid(rows){
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE;
  const W = BOARD_W[size]||BOARD_W[BOARD_DEFAULT_SIZE];
  const per = CFG.perPage || 50;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const page = Math.min(Math.max(1, S.page.board||1), pages);
  const shown = rows.slice((page-1)*per, page*per);
  if(!rows.length) return `<div class="panel"><div class="pad">${emptyState('film','Nothing to show','Run a sync or widen the range.')}</div></div>`;
  return `${pager('board', rows.length, per, page)}
  <div class="boardgrid" style="grid-template-columns:repeat(auto-fill,minmax(${W}px,1fr))">
    ${shown.map(v=>{
      const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';
      return `<div class="boardcard">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardthumb">
          <img loading="lazy" decoding="async" src="${esc(thumbUrl(v,true))}" data-vid="${v.id}" alt="">
          <span class="boardscore ${oc}">${v.outlier}×</span>
          ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
          ${v.isShort?'<span class="boardshort">SHORT</span>':''}
        </a>
        <div class="boardbody">
          <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardtitle">${esc(v.title)}</a>
          <div class="vmeta" style="margin-top:6px">
            <span class="uptime">${nf(v.views)} views</span><span class="sep">·</span>
            <span class="vpd" title="Views per day since publication">${nf(v.vpd)}/day</span><span class="sep">·</span>
            <span class="c1">${esc(v.channelTitle)}</span></div>
          <div class="vmeta"><span>${v.pubDay} ${v.pubTime}</span><span class="sep">·</span>
            <span>${v.ageDays}d</span><span class="sep">·</span><span>${v.engage}% eng</span></div>
        </div></div>`;}).join('')}
  </div>
  ${pager('board', rows.length, per, page)}`;
}
function vBoard(){
  const rows = boardRows();
  const sortBy = S.filters.boardSort||'outlier';
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE;
  const per = CFG.perPage || 50;
  const page = Math.min(Math.max(1, S.page.board||1), Math.max(1,Math.ceil(rows.length/per)));
  const shown = Math.min(per, Math.max(0, rows.length-(page-1)*per));
  return `
  <div class="panel" style="margin-bottom:14px"><div class="pad row wrapf" style="gap:10px">
    <div class="seg plain">
      ${BOARD_SORTS.map(([k,l])=>
        `<button class="${sortBy===k?'on':''}" data-boardsort="${k}">${l}</button>`).join('')}</div>
    <div class="seg plain">
      ${BOARD_SIZES.map(([k,l])=>
        `<button class="${size===k?'on':''}" data-boardsize="${k}" title="${
          k==='xl'?'3 per row':k==='lg'?'4 per row':k==='md'?'6 per row':'8 per row'}">${l}</button>`).join('')}</div>
    <div class="grow"></div>
    <span class="dim" style="font-size:11px">Showing ${nfull(shown)} of ${nfull(rows.length)} · ${rangeLabel()}</span>
    <button class="btn btn-sm btn-o" data-act="copyThumbUrls">${ic('copy')}Copy URLs</button>
    <button class="btn btn-sm btn-o" data-export="thumbs|csv">CSV</button>
    <button class="btn btn-sm btn-o" data-export="thumbs|json">JSON</button>
    <button class="btn btn-sm btn-p" data-export="thumbs|zip">${ic('layers')}All</button>
  </div></div>
  <div id="tblhost-board">${boardGrid(rows)}</div>`;
}
function repaintBoard(){
  const host = document.getElementById('tblhost-board');
  if(!host) return render();
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE, sortBy = S.filters.boardSort||'outlier';
  host.innerHTML = boardGrid(boardRows());
  document.querySelectorAll('[data-boardsize]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsize===size));
  document.querySelectorAll('[data-boardsort]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsort===sortBy));
}

/* ─────────── ANALYTICS ─────────── */
function vAnalytics(){

  const grams2 = nGrams(vids,2), grams1 = nGrams(vids,1);
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const byDow = dows.map((d,i)=>{ const g=vids.filter(v=>new Date(v.publishedTs).getDay()===i);
    return {label:d, value:Math.round(median(g.map(v=>v.views))), sub:`${g.length} videos`}; });
  const engageLeaders = selectedChannelObjs().map(c=>{ const g=vids.filter(v=>v.channelId===c.id);
    return {label:c.title, value:+median(g.map(v=>v.engage)).toFixed(2), sub:`${g.length} videos`}; })
    .filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const titleLen = [[0,40,'<40 chars'],[40,55,'40–55'],[55,70,'55–70'],[70,90,'70–90'],[90,999,'90+']]

    .filter(x=>x.sub!=='0 videos · median outlier 0.00×');
  const tagFreq={}; vids.forEach(v=>v.tags.forEach(t=>tagFreq[t.toLowerCase()]=(tagFreq[t.toLowerCase()]||0)+1));
  const topTags = Object.entries(tagFreq).sort((a,b)=>b[1]-a[1]).slice(0,24);
  const best = buckets.slice().sort((a,b)=>b.medViews-a.medViews)[0];
  return `

    <div class="pad">${uploadClock(vids)}</div></div>

    <span class="right dim" style="font-size:10px;font-weight:600">their slot vs yours</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Channel</th><th class="num">Videos</th><th class="num">Usual hour</th>
      <th class="num">Best hour</th><th class="num">Top weekday</th><th class="num">Median views</th></tr></thead><tbody>
    ${selectedChannelObjs().map(c=>{
      const g=vids.filter(v=>v.channelId===c.id); if(!g.length) return '';
      const hrs={}, dws={};

      const usual=Object.entries(hrs).sort((a,b)=>b[1].length-a[1].length)[0];

async function mineComments(){
  const pid = PID();                       // bound, like syncAll — see the note there
  const raw = document.getElementById('cmIds').value;
  S.filters.cmIds = raw;
  const ids = raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)
    .map(s=>{ const m=s.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:s; })
    .filter(s=>/^[A-Za-z0-9_-]{11}$/.test(s));
  if(!ids.length){ toast('No valid video IDs found','err'); return; }
  const pages = clamp(+document.getElementById('cmPages').value||3,1,5);
  const log=document.getElementById('cmLog'); log.classList.remove('hide'); log.innerHTML='';
  const push=(m,e)=>{ log.innerHTML += `<div class="${e?'e':''}">${esc(m)}</div>`; log.scrollTop=log.scrollHeight; };
  const all=[];
  try{
    for(const id of ids){
      let token=null,p=0,n=0;
      do{
        const par={part:'snippet',videoId:id,order:'relevance',maxResults:100};
        if(token) par.pageToken=token;
        const j = await yt('commentThreads',par,1);
        (j.items||[]).forEach(it=>{ const c=it.snippet.topLevelComment.snippet;
          all.push({videoId:id, text:(c.textDisplay||'').replace(/<[^>]+>/g,'').trim(), likes:+c.likeCount||0, author:c.authorDisplayName}); });
        n+=(j.items||[]).length; token=j.nextPageToken; p++;
        push(`${id}: page ${p} → ${n} comments`);
      } while(token && p<pages);
    }
    const seen=new Set();
    const requests = all.filter(c=>REQ_PAT.some(p=>p.test(c.text))).map(c=>{seen.add(c.text);return c;}).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const questions = all.filter(c=>!seen.has(c.text)&&c.text.includes('?')&&c.text.length>18).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const freq={}; all.forEach(c=>(c.text.match(/\b[A-Z][a-zA-Z'.]+(?:\s[A-Z][a-zA-Z'.]+)?\b/g)||[]).forEach(x=>{ if(x.length>2&&!STOP.has(x.toLowerCase())) freq[x]=(freq[x]||0)+1; }));
    const entities = Object.entries(freq).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]).slice(0,25)
      .map(([n,c])=>({text:n, likes:c, author:c+' mentions'}));
    const reactions = [...all].sort((a,b)=>b.likes-a.likes).slice(0,20);
    const mined = {ts:Date.now(), total:all.length, videoIds:ids, data:{requests,questions,entities,reactions}};
    await idbPut('misc',{k:'comments_'+pid, v:mined});
    if(PID()===pid) S.comments = mined;    // don't write another profile's findings into this one
    push(`▸ Done — ${all.length} comments, ${requests.length} requests, ${questions.length} questions, ${entities.length} entities`);
    toast(`${all.length} comments analysed`,'ok'); render();
  }catch(e){ push('✗ '+e.message,true); toast(e.message,'err'); }
}

        const best=[...g].sort((a,b)=>b.outlier-a.outlier)[0];
        return { channel:c.title, channel_id:c.id, subscribers:c.subs,
          videos_in_range:g.length, median_views:Math.round(median(vals)), mean_views:Math.round(mu),
          best_video_views:Math.max(0,...vals), total_views:vals.reduce((a,b)=>a+b,0),
          outliers:g.filter(v=>v.outlier>=CFG.outlierThreshold).length,
          uploads_per_month:+(g.length/months).toFixed(1),
          median_engagement_pct:+median(g.map(v=>v.engage)).toFixed(2),
          median_like_rate_pct:+median(g.map(v=>v.likeRate)).toFixed(2),
          median_duration_sec:Math.round(median(g.map(v=>v.durationSec))),
          shorts_share_pct:g.length?+(g.filter(v=>v.isShort).length/g.length*100).toFixed(1):0,
          views_per_1k_subs:c.subs?+(median(vals)/c.subs*1000).toFixed(2):0,
          trend_ratio:t?t.ratio:'', consistency:(()=>{const cv=mu?Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu:0;
            return cv<0.8?'steady':cv<2?'mixed':'spiky';})(),
          best_title:best?best.title:'', best_outlier:best?best.outlier:'',
          best_url:best?'https://youtube.com/watch?v='+best.id:'' };}); }
    case 'topics': return topicStats(vids).slice(0,300).map(t=>({
      topic:t.topic, videos:t.count, channels_covering:t.coverage,
      median_outlier:t.medOutlier, max_outlier:t.maxOutlier, median_views:t.medViews,
      uploads_last_7d:t.recent, uploads_prior_3w:t.prior, momentum:t.momentum,
      days_since_last:t.daysOld, opportunity_score:t.opportunity,
      best_title:t.best.title, best_views:t.best.views, best_outlier:t.best.outlier,
      best_url:'https://youtube.com/watch?v='+t.best.id }));
    case 'thumbs': return applyQ(vids).sort((a,b)=>b.outlier-a.outlier).slice(0,120).map((v,i)=>({
      rank:i+1, outlier_score:v.outlier, views:v.views, title:v.title, channel:v.channelTitle,
      duration:dur(v.durationSec), is_short:v.isShort, published_at:v.publishedAt,
      thumbnail_maxres:thumbUrl(v,true), thumbnail_medium:thumbUrl(v),
      url:'https://youtube.com/watch?v='+v.id }));
    case 'analytics': { const out=[];
      durationBuckets(vids).forEach(b=>out.push({metric:'duration_band', label:b.label, videos:b.count, median_views:b.medViews, median_outlier:b.medOutlier, p90_views:b.p90}));
      const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      dows.forEach((d,i)=>{ const g=vids.filter(v=>new Date(v.publishedTs).getDay()===i);
        out.push({metric:'weekday', label:d, videos:g.length, median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)}); });
      nGrams(vids,2).forEach(g=>out.push({metric:'title_phrase', label:g.phrase, videos:g.inTop, median_views:'', median_outlier:'', lift:g.lift, in_rest:g.inRest}));
      // hour-of-day clock
      for(let h=0;h<24;h++){ const g=vids.filter(v=>v.pubHour===h); if(!g.length) continue;
        out.push({metric:'upload_hour', label:String(h).padStart(2,'0')+':00', videos:g.length,
          median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)}); }
      // title anatomy A/B
      [['tHasNumber','has_number'],['tHasQuestion','is_question'],['tHasExclaim','has_exclaim'],
       ['tHasParen','has_parenthetical'],['tHasColon','has_colon'],['tHasEmoji','has_emoji']].forEach(([k,lab])=>{
        const w=vids.filter(v=>v[k]), o=vids.filter(v=>!v[k]);
        if(w.length<3||o.length<3) return;
        out.push({metric:'title_feature', label:lab, videos:w.length,
          median_views:Math.round(median(w.map(v=>v.views))), median_outlier:+median(w.map(v=>v.outlier)).toFixed(2),
          lift:+(median(w.map(v=>v.outlier))/(median(o.map(v=>v.outlier))||1)).toFixed(2)});
      });
      // upload gap bands
      [[0,1,'0-1d'],[1,3,'1-3d'],[3,7,'3-7d'],[7,14,'7-14d'],[14,9999,'14d+']].forEach(([a,b,lab])=>{
        const g=vids.filter(v=>v.gapDays!=null&&v.gapDays>=a&&v.gapDays<b); if(!g.length) return;
        out.push({metric:'upload_gap', label:lab, videos:g.length,
          median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)});
      });
      // channel momentum
      selectedChannelObjs().forEach(c=>{ const t=channelTrend(c.id); if(!t) return;
        out.push({metric:'channel_trend', label:c.title, videos:t.n, median_views:t.recent,
          median_outlier:'', lift:t.ratio, in_rest:t.before}); });
      return out; }
  }
  return [];
}
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function doExport(kind, fmt){
  const rows = buildRows(kind);
  if(!rows.length){ toast('Nothing to export in this dataset yet','warn'); return; }
  const sc = selIds();
  const ch = (sc && sc.length===1 && ['feed','outliers','thumbs','topics'].includes(kind))
    ? S.channels.find(c=>c.id===sc[0]) : null;
  const scope = ch? '-'+slug(ch.title) : (sc && sc.length>1? `-${sc.length}channels` : '');
  const base = `signal-${kind}${scope}-${S.range==='all'?'lifetime':S.range+'d'}-${todayPT()}`;
  const T = {feed:'All videos', outliers:'Outliers', channels:'Channel summary', momentum:'Momentum snapshots',
    trending:'Trending snapshot', comments:'Comment demand', analytics:'Analytics rollups'}[kind]||kind;
  const title = ch? `${T} — ${ch.title}` : T;
  if(fmt==='csv') dl(base+'.csv', toCSV(rows), 'text/csv');
  else if(fmt==='json') dl(base+'.json', JSON.stringify(rows,null,2), 'application/json');
  else if(fmt==='txt') dl(base+'.txt', toTXT(rows, title), 'text/plain');
  else if(fmt==='md') dl(base+'.md', toMD(rows, title), 'text/markdown');
  else if(fmt==='zip') dl(base+'.zip', makeZip([
    {name:base+'.csv', content:toCSV(rows)},
    {name:base+'.json', content:JSON.stringify(rows,null,2)},
    {name:base+'.txt', content:toTXT(rows,title)},
    {name:base+'.md', content:toMD(rows,title)}]));
  toast(`Exported ${nfull(rows.length)} rows${ch?` — ${ch.title} only`:''}`,'ok');
}
function exportZip(){
  const kinds=['feed','outliers','channels','momentum','trending','comments','analytics','thumbs','topics','compare'];
  const files=[];
  const stamp = `${S.range==='all'?'lifetime':S.range+'d'}-${todayPT()}`;
  kinds.forEach(k=>{ const rows=buildRows(k); if(!rows.length) return;
    files.push({name:`${k}/${k}.csv`, content:toCSV(rows)});
    files.push({name:`${k}/${k}.json`, content:JSON.stringify(rows,null,2)});
    files.push({name:`${k}/${k}.md`, content:toMD(rows,k)});
    files.push({name:`${k}/${k}.txt`, content:toTXT(rows,k)});
  });
  files.push({name:'briefing-ideas.txt', content:briefing('ideas')});
  files.push({name:'briefing-format.txt', content:briefing('format')});
  files.push({name:'briefing-gap.txt', content:briefing('gap')});
  files.push({name:'README.txt', content:
`Signal export — ${stamp}
Range: ${rangeLabel()}
Channels: ${S.channels.length}
Videos cached: ${S.videos.length}
Snapshots: ${S.snapshots.length}
Generated: ${new Date().toString()}

Each folder holds the same dataset in csv / json / md / txt.
briefing-*.txt are ready to paste into any AI chat.`});
  if(!files.length){ toast('Nothing to export yet','warn'); return; }
  dl(`signal-full-export-${stamp}.zip`, makeZip(files));
  toast(`Exported ${files.length} files`,'ok');
}
function briefing(kind){
  const vids = enrichedInRange();
  const hot = vids.filter(v=>v.outlier>=CFG.outlierThreshold).sort((a,b)=>b.outlier-a.outlier).slice(0,40);
  const trend = S.trending[S.trending.length-1];
  const cm = S.comments?.data;
  const head = `RANGE: ${rangeLabel()}\nCHANNELS TRACKED: ${S.channels.length}\nVIDEOS IN RANGE: ${vids.length}\nGENERATED: ${new Date().toLocaleString()}\n`;
  const outBlock = hot.map(v=>`- "${v.title}" | ${v.channelTitle} | ${nfull(v.views)} views | ${v.outlier}x channel median | ${nf(v.vpd)}/day | ${dur(v.durationSec)} | ${v.ageDays}d old`).join('\n') || '(none)';
  if(kind==='raw') return head+'\n=== ALL VIDEOS ===\n'+toCSV(buildRows('feed'));
  if(kind==='format') return `${head}
You are analysing a YouTube niche. Below are the outlier videos — those beating their own channel's median views.

=== OUTLIER VIDEOS ===
${outBlock}

=== DURATION PERFORMANCE ===
${durationBuckets(vids).map(b=>`${b.label}: ${b.count} videos, median ${nfull(b.medViews)} views, median outlier ${b.medOutlier}x`).join('\n')}

=== TITLE PHRASES CORRELATED WITH WINNERS ===
${nGrams(vids,2).slice(0,20).map(g=>`"${g.phrase}" — ${g.inTop} winners vs ${g.inRest} others, lift ${g.lift}x`).join('\n')}

TASK:
1. Identify repeatable title TEMPLATES in the outlier list. Output each as a fill-in-the-blank string.
2. For each template, note how many outliers use it and its median outlier score.
3. Identify the format archetypes (listicle / investigation / timeline / reaction / explainer) and which performs best.
4. Flag any template that appears to be channel-specific rather than niche-wide.
Output as a ranked table.`;
  if(kind==='gap') return `${head}
=== EVERY VIDEO PUBLISHED IN THIS RANGE, BY CHANNEL ===
${selectedChannelObjs().map(c=>{ const g=vids.filter(v=>v.channelId===c.id).sort((a,b)=>b.views-a.views);
  return `\n## ${c.title} (${nf(c.subs)} subs, median ${nf(median(g.map(v=>v.views)))} views)\n`+
    g.slice(0,40).map(v=>`- "${v.title}" — ${nfull(v.views)} views (${v.outlier}x)`).join('\n'); }).join('\n')}

TASK:
1. Extract the core topic/entity from every title above.
2. Build a topic × channel coverage matrix.
3. Find topics covered by FEWER THAN 3 channels where the videos that did cover it scored above their channel median — these are proven topics with open lanes.
4. Find topics covered heavily more than 6 months ago but not in the last 90 days — revival candidates.
5. Rank both lists by opportunity, and explain the reasoning for the top 5.`;
  return `${head}
You are a YouTube content strategist. Generate 20 video ideas from the live competitive data below.

=== MY TITLE PATTERNS (use these, name which one each idea follows) ===
${CFG.titlePatterns}

=== SIGNAL 1: OUTLIER VIDEOS (beating their channel's median) ===
${outBlock}

=== SIGNAL 2: TRENDING NOW (${trend?trend.region:'—'}) ===
${trend?.videos?.length? trend.videos.slice(0,25).map(v=>`- "${v.title}" | ${v.channelTitle} | rank ${v.rank} | ${nfull(v.views)} views`).join('\n') : '(no trending snapshot — refresh the Trending tab)'}

=== SIGNAL 3: AUDIENCE DEMAND FROM COMMENTS ===
${cm? [...cm.requests.slice(0,10),...cm.questions.slice(0,10),...cm.entities.slice(0,10)].map(i=>`- ${i.text} (${i.likes})`).join('\n') : '(no comment run yet — use the Comment Mining tab)'}

=== NICHE TIMING DATA ===
Best duration band: ${(durationBuckets(vids).sort((a,b)=>b.medViews-a.medViews)[0]||{}).label||'—'}
Title phrases with highest lift: ${nGrams(vids,2).slice(0,10).map(g=>g.phrase).join(', ')||'—'}

TASK:
Return a JSON array of 20 objects:
[{"title": string, "angle": string (2 sentences), "source_signal": "outlier"|"trending"|"comment_demand", "pattern_used": string, "reach_estimate": "low"|"medium"|"high"|"viral", "ad_risk": "green"|"yellow"|"red", "why_now": string}]

document.addEventListener('click', async e=>{

  if(d.nav) return nav(d.nav);
  if(d.close) { document.getElementById('modals').innerHTML=''; return; }
  if(d.range){ S.range=d.range; S.page={}; renderSideNav(); render(); return; }
  if(d.thr){ CFG.outlierThreshold=+d.thr; S.page={}; saveCfg(); renderSideNav(); render(); return; }
  if(d.toggle){
    if(d.toggle==='density'){ CFG.density = CFG.density==='compact'?'normal':'compact'; document.documentElement.dataset.density=CFG.density; }

  if(d.sort){ const [key,col]=d.sort.split('|'); const cur=S.sort[key]||{c:'',d:-1};

  switch(d.act){

    case 'pruneStale': {

      if(!confirm(`Permanently delete cached videos and snapshots for ${n} delisted channel${n===1?'':'s'}?\n\nThey are already excluded from every metric. This frees the disk space.`)) return;

${rows.map(r=>`## ${r.channel} (${nfull(r.subscribers)} subs)

      copyTxt(`OPPORTUNITY BRIEF — ${rangeLabel()} — ${new Date().toLocaleString()}
Channels tracked: ${S.channels.length} · Videos analysed: ${vids.length}

TASK: Using the signals above, propose 15 video concepts. For each give: title, the angle,

${CFG.titlePatterns}`);
      return;

    case 'showSyncLog': return showSyncLog();
    case 'cancelSync': { S.syncCancel=true; toast('Stopping after this channel…','warn'); return; }

/* Keyboard shortcuts. Ignored while typing so they never eat real input. */
const NAV_KEYS = ['dash','feed','outliers','momentum','trending','opps','compare','board','channels','analytics'];
document.addEventListener('keydown', e=>{
  const el = document.activeElement;
  const typing = el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
  if(e.key==='Escape'){
    if(document.getElementById('modals').innerHTML){ document.getElementById('modals').innerHTML=''; return; }
    if(typing){ el.blur(); return; }
  }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==='s'){ e.preventDefault(); syncAll(); return; }
  if(k==='d'){ e.preventDefault(); syncAll({deep:true}); return; }
  if(k==='t'){ e.preventDefault(); syncTrending(); return; }
  if(k==='/'){ e.preventDefault();
    const box=[...document.querySelectorAll('[data-search]')].pop(); if(box){ box.focus(); box.select(); } return; }
  if(k==='?'){ e.preventDefault(); showShortcuts(); return; }
  if(k==='['||k===']'){ e.preventDefault();
    const keys=Object.keys(RANGES).concat('custom'); const i=keys.indexOf(S.range);
    S.range = keys[clamp(i+(k===']'?1:-1),0,keys.length-1)]; S.page={}; renderSideNav(); render(); return; }
  if(/^[1-9]$/.test(k)){ const v=NAV_KEYS[+k-1]; if(v){ e.preventDefault(); nav(v); } return; }
  if(k==='0'){ e.preventDefault(); nav('settings'); return; }
});

/* ═══════════════════════════════════════════════════════════
   WHICH CHANNELS COUNT — one answer, used everywhere
   ───────────────────────────────────────────────────────────
   The list in Settings is the single source of truth for what is being tracked.
   Cached rows for a channel you have since removed stay on disk — deleting data
   behind your back is how people lose it — but they must not reach a single
   metric.

   They used to. The header read `CFG.channels.length` while the dashboard,
   the channel picker, every median and every outlier baseline read
   `S.channels`, which is whatever happens to be cached. Remove six channels
   from the list and you get a header saying "23 channels" above a dashboard
   saying "29 CHANNELS TRACKED", with six delisted channels' videos silently
   inside every total, every median and every baseline. Two independent answers
   to the same question, and the wrong one feeding the numbers.

   Now the split happens once, at load, and everything downstream reads the
   filtered arrays. The delisted rows are kept in S.staleChannels so they can be
   reported and cleaned up deliberately, never silently.
   ═══════════════════════════════════════════════════════════ */
/* Canonical keys, so matching is a set lookup instead of re-parsing every line
   for every channel. Same rules as before — id, handle, title, title without
   spaces — just resolved once. */
function listKeySet(lines){
  const s = new Set();
  for(const l of lines){ const k = canonCh(l); if(k) s.add(k); }
  return s;
}
function channelKeys(c){
  const out = [];
  if(c.id) out.push('id:'+c.id, 'h:'+String(c.id).toLowerCase());
  if(c.handle) out.push('h:'+String(c.handle).replace(/^@/,'').toLowerCase());
  if(c.title){
    const t = String(c.title).toLowerCase();
    out.push('h:'+t, 'h:'+t.replace(/\s+/g,''));
  }
  return out;
}
function channelMatchesKeys(c, keys){ return channelKeys(c).some(k=>keys.has(k)); }
/* Kept for callers that still work line-by-line (prune, sync logging). */
function channelMatchesList(c, lines){ return channelMatchesKeys(c, listKeySet(lines)); }
/* Cached data for channels you have removed is kept, but it is excluded from
   every number and said out loud. Silence here is what made the totals wrong:
   the rows kept counting while the list said otherwise. */
function staleNotice(){
  const n = (S.staleChannels||[]).length;
  if(!n) return '';
  const names = S.staleChannels.slice(0,4).map(c=>esc(c.title||c.id)).join(', ');
  return `<div class="row wrapf" style="gap:9px;padding:10px 12px;background:rgba(245,158,11,.12);border-radius:var(--r2);margin-bottom:11px">
    ${ic('warn')}<span class="grow" style="font-size:11.5px;min-width:200px">
      <b>${n} cached channel${n===1?'':'s'} no longer on your list</b> — ${names}${n>4?` and ${n-4} more`:''}.
      Their videos are excluded from every metric. The data is still on disk until you clear it.</span>
    <button class="btn btn-sm btn-o" data-act="pruneStale">${ic('trash')}Clear cached data</button>
  </div>`;
}
/* An empty list means "nothing configured yet", not "track nothing" — blanking
   the app because a textarea is momentarily empty is the failure mode this
   whole area is being hardened against. */
function splitByList(rows){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length) return {active:rows.slice(), stale:[]};
  const keys = listKeySet(lines);
  const active=[], stale=[];
  for(const c of rows) (channelMatchesKeys(c, keys)? active : stale).push(c);
  return {active, stale};
}
/* Lowering the depth setting used to do nothing — it only ever controlled how
   far a sync reached, never what was already cached, so the counts stayed at the
   old high-water mark. This trims each channel back to its newest N videos (and
   drops the snapshots belonging to the removed ones so nothing is orphaned). */
async function trimToDepth(){
  const want = CFG.scrapeDepth;
  const byCh = new Map();
  for(const v of S.videos){
    let a = byCh.get(v.channelId);
    if(!a){ a=[]; byCh.set(v.channelId,a); }
    a.push(v);
  }
  const doomed=[];
  byCh.forEach(list=>{
    if(list.length<=want) return;
    list.sort((a,b)=>b.publishedTs-a.publishedTs);   // keep the newest
    doomed.push(...list.slice(want));
  });
  if(!doomed.length) return 0;
  const gone = new Set(doomed.map(v=>v.id));
  await idbDelete(STORES.videos, doomed.map(v=>v._k));
  const snaps = (await idbByPid(STORES.snapshots, PID())).filter(s=>gone.has(s.videoId));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return doomed.length;
}
async function applyDepthChange(){
  const want = CFG.scrapeDepth;
  const over = (()=>{ const c={}; S.videos.forEach(v=>c[v.channelId]=(c[v.channelId]||0)+1);
    return Object.values(c).reduce((n,x)=>n+Math.max(0,x-want),0); })();
  if(over){
    if(!confirm(`Lowering the depth to ${nfull(want)} will delete ${nfull(over)} older cached video${over===1?'':'s'} and their snapshots.\n\nRaising it again later would need to re-fetch them (about ${Math.ceil(want/50)*2} quota units per channel).\n\nTrim now?`)){
      return false;   // leave the cache alone; the setting still applies to future syncs
    }
    const n = await trimToDepth();
    S.page={};
    toast(`Trimmed ${nfull(n)} videos — now keeping the newest ${nfull(want)} per channel`,'ok');
  }
  return true;
}
/* Deleting cached rows because a line vanished from a textarea is a very sharp
   tool, and it used to have no handle on it. Two guards now stand in front of it:
   an empty list never triggers a mass delete (an empty box is far more often a
   render slip or an unsaved edit than a real "drop everything" instruction), and
   a prune that would take out every channel at once has to be confirmed. The
   deliberate path — Settings → Wipe this profile's data — is still one click. */
async function pruneOrphans(opts={}){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length){
    if((S.allChannels||[]).length && !opts.force){
      console.warn('[signal] refusing to prune: channel list is empty but',
        (S.allChannels||[]).length, 'channels are cached');
      return 0;
    }
    return 0;
  }
  /* Re-derive rather than trusting a cached field: prune is destructive, and it
     must never act on a stale idea of what is delisted. refilterChannels() is
     the same single algorithm the rest of the app reads, so this stays one
     definition of "orphan" — just a freshly evaluated one. */
  refilterChannels();
  const orphans = S.staleChannels||[];
  if(!orphans.length) return 0;
  const total = (S.allChannels||[]).length;
  if(orphans.length === total && total > 1 && !opts.force && !opts.silent){
    if(!confirm(`This would drop ALL ${total} cached channels and their videos.\n\nThat usually means the list got cleared by accident. Continue?`)){
      return 0;
    }
  }
  const gone = new Set(orphans.map(c=>c.id));
  const pid = PID();
  const [allVids, allSnaps] = await Promise.all([
    idbByPid(STORES.videos, pid), idbByPid(STORES.snapshots, pid),
  ]);
  const vids  = allVids.filter(v=>gone.has(v.channelId));
  const snaps = allSnaps.filter(s=>gone.has(s.channelId));
  await idbDelete(STORES.channels, orphans.map(c=>c._k));
  if(vids.length)  await idbDelete(STORES.videos,  vids.map(v=>v._k));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return orphans.length;
}
/* ═══════════════════════════════════════════════════════════
   CHANNEL LIST — parsing, clipboard, undo
   ═══════════════════════════════════════════════════════════ */
/* People paste from spreadsheets, from a notes app, from another browser tab.
   That arrives as newlines, commas, tabs, semicolons, bare URLs with tracking
   junk, and duplicates. All of it is one list, so accept all of it. */
function splitChannelText(text){
  return String(text||'')
    .replace(/\r/g,'\n')
    .split(/[\n,;\t]+|\s{2,}/)
    .map(s=>s.trim())
    .map(s=>s.replace(/^[-*•>\d.)\]\s]+/,''))   // list bullets and "1. " prefixes
    .map(s=>s.replace(/[),.;]+$/,''))
    .filter(s=>s && !s.startsWith('#'));
}
/* Dedupe on what the line actually resolves to, so "@MrBeast",
   "youtube.com/@mrbeast" and "https://www.youtube.com/@mrbeast?sub=1" all
   collapse to one entry instead of costing three quota units a sync. */
function canonCh(line){
  const p = parseChLine(line);
  if(!p) return null;
  return p.type==='id' ? 'id:'+p.value : 'h:'+p.value.replace(/^@/,'').toLowerCase();
}
function normalizeChannelLines(text){
  const raw = Array.isArray(text)? text : splitChannelText(text);
  const out=[], seen=new Set();
  for(const line of raw){
    const t = String(line).trim(); if(!t) continue;
    const key = canonCh(t); if(!key) continue;
    if(seen.has(key)) continue;
    seen.add(key); out.push(t);
  }
  return out;
}
/* Light pass used by autosave while you are still typing: keeps your lines
   exactly as written (no dedupe, no reordering) so the caret never jumps. */
function loosenChannelLines(text){
  return String(text||'').split('\n').map(s=>s.trim()).filter(Boolean);
}

/* Undo ring for the channel list specifically — it is the one field where a
   mis-click costs a re-sync, so every destructive action drops a restore point. */
let chUndoStack = [];
function pushChUndo(label){
  chUndoStack.push({list:draftLines(), label, at:Date.now()});
  if(chUndoStack.length>12) chUndoStack.shift();
}
function undoChannels(){
  const prev = chUndoStack.pop();
  if(!prev){ toast('Nothing to undo','warn'); return; }
  setDraftLines(prev.list); render();
  toast(`Undone — box back to ${prev.list.length} channel${prev.list.length===1?'':'s'}`,'ok');
}

async function readClipboard(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const t = await navigator.clipboard.readText();
      if(typeof t === 'string') return t;
    }
  }catch(e){}
  return null;   // blocked, unsupported, or the user declined — fall back to the box
}
/* mode: 'add' merges into the existing list, 'replace' swaps it out. */
async function pasteChannels(mode){
  const text = await readClipboard();
  if(text===null || !text.trim()){ pasteFallbackModal(mode); return; }
  applyPastedChannels(text, mode);
}
function applyPastedChannels(text, mode){
  const incoming = normalizeChannelLines(text);
  if(!incoming.length){ toast('Nothing in the clipboard looked like a channel','warn'); return; }
  pushChUndo('paste');
  const before = draftLines().length;
  const merged = mode==='replace' ? incoming : normalizeChannelLines([...draftLines(), ...incoming]);
  setDraftLines(merged);
  const added = merged.length - (mode==='replace'? 0 : before);
  const dupes = incoming.length - (mode==='replace'? incoming.length : added);
  render();
  toast(mode==='replace'
    ? `List replaced with ${merged.length} channel${merged.length===1?'':'s'} — press Save changes to apply`
    : `Added ${added} channel${added===1?'':'s'}${dupes>0?` · ${dupes} duplicate${dupes===1?'':'s'} skipped`:''} — press Save changes to apply`, 'ok');
}
function pasteFallbackModal(mode){
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:560px">
    <div class="mhead">${ic('copy')}<span class="grow">Paste channels</span>

    <div class="mbody">
      <div class="muted" style="font-size:11.5px;line-height:1.65">
        This browser won't hand the clipboard over automatically. Click the box and press
        <span class="kbd">Ctrl</span>+<span class="kbd">V</span> (<span class="kbd">⌘V</span> on Mac), then Add.
        Newlines, commas, tabs and full URLs all work — duplicates are dropped for you.</div>
      <textarea class="field mono" id="pasteBox" rows="10" placeholder="@mrbeast&#10;UC_x5XG1OV2P6uZZ5FSM9Ttw&#10;https://youtube.com/@veritasium"></textarea>
