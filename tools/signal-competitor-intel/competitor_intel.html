   SYNC ENGINE
   ═══════════════════════════════════════════════════════════ */
let syncLog=[];
function slog(msg, err){ syncLog.push({msg,err,t:Date.now()});
  const el=document.getElementById('syncLog'); if(el){ el.innerHTML=syncLog.map(l=>`<div class="${l.err?'e':''}">${esc(l.msg)}</div>`).join(''); el.scrollTop=el.scrollHeight; } }
function setProg(p, label){
  S.syncPct = p; S.syncLabel = label||'';
  renderSyncStatus();   // sidebar footer only — no modal, no strip, no layout shift
}

async function fetchUploadIds(ch, limit, stopAtTs){
  const ids=[]; let token=null, pages=0;
  // page ceiling follows the requested depth (50 ids per page) instead of a
  // fixed 60, so a 2,000 or 5,000 setting can actually be reached
  const maxPages = Math.ceil(limit/50) + 2;
  do{
    const p={part:'contentDetails',playlistId:ch.uploads,maxResults:50};
    if(token) p.pageToken=token;
    const j = await yt('playlistItems',p,1);
    let stop=false;
    for(const it of (j.items||[])){
      const ts=+new Date(it.contentDetails.videoPublishedAt||it.snippet?.publishedAt||0);
      if(stopAtTs && ts && ts<=stopAtTs){ stop=true; break; }
      ids.push(it.contentDetails.videoId);
    }
    token = j.nextPageToken; pages++;
    if(stop || ids.length>=limit) break;
  } while(token && pages<maxPages);
  return ids.slice(0,limit);
}
async function fetchVideos(ids, channelId){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const j = await yt('videos',{part:'snippet,statistics,contentDetails,status,topicDetails',id:ids.slice(i,i+50).join(',')},1);
    (j.items||[]).forEach(v=>out.push(mapVideo(v,channelId)));
  }
  return out;
}

/* A sync is bound to the profile that started it. Every row it writes is
   stamped with that profile's id, captured once, up front.

   It used to read PID() live, at write time, inside a loop that awaits the
   network for each channel. Switch profiles while a sync was running — the one
   thing five profiles invites you to do — and the remaining channels' videos,
   snapshots and channel rows were written into whichever profile you had just
   opened, and pushed into its in-memory arrays too. Silent cross-profile
   corruption, visible later only as counts and medians that make no sense.

   Binding the id also makes concurrent syncs safe, so a sync running on one
   profile no longer stops you working in another. */
async function syncAll(opts={}){
  const pid = PID(), prof = activeProfile();
  if(S.syncPids.has(pid)){ toast('This profile is already syncing','warn'); return; }
  if(!CFG.ytKey){ toast('Add your YouTube API key in Settings first','err'); nav('settings'); return; }
  if(!CFG.channels.length){ toast('Add competitor channels in Settings first','err'); nav('settings'); return; }
  const cfg = {                                  // snapshot of the settings this run uses
    channels: [...CFG.channels], scrapeDepth: CFG.scrapeDepth,
    snapshotDays: CFG.snapshotDays, deep: !!opts.deep,
  };
  const onProfile = () => PID()===pid;           // are we still looking at this profile?
  S.syncPids.add(pid);
  S.syncing=true; S.syncCancel=false; S.syncJustDone=null; S.syncPct=0; S.syncLabel='starting…';
  syncLog=[]; const deep = cfg.deep;
  const unitsBefore = CFG.quota.units;
  renderSyncStrip();
  try{
    slog(`▸ ${deep?'DEEP':'INCREMENTAL'} sync starting — ${CFG.channels.length} channels`);
    const chans = await resolveChannels(cfg.channels);
    slog(`▸ Resolved ${chans.length}/${cfg.channels.length} channels`);
    /* Work against this profile's rows read from disk, not against S.*, which
       belongs to whatever profile is on screen and may change under us. */
    const rows = await idbByPid(STORES.videos, pid);
    const existing = new Map((await idbByPid(STORES.channels, pid)).map(c=>[c.id,c]));
    /* Indexed once, maintained in place.

       The previous loop rebuilt an entire id->row lookup object for every
       channel and scanned the whole catalogue three more times per channel to
       find that channel's videos. At 34 channels over an 8,500-video cache that
       is roughly a million redundant comparisons and a quarter of a million
       throwaway allocations before a single byte reaches disk — pure overhead
       that grows with the square of how much you have scraped, which is exactly
       backwards for the feature the app exists for. */
    const byId = new Map(rows.map(v=>[v.id,v]));
    const byChannel = new Map();
    for(const v of rows){
      let a = byChannel.get(v.channelId);
      if(!a){ a=[]; byChannel.set(v.channelId,a); }
      a.push(v);
    }
    /* Existing snapshots, so a re-sync doesn't rewrite readings it already has. */
    const snapById = new Map((await idbByPid(STORES.snapshots, pid)).map(s=>[s.key,s]));
    let skippedV=0, skippedS=0;
    const today = todayPT();
    const snapCutoff = Date.now() - CFG.snapshotDays*864e5;
    let newVids=0, updVids=0, i=0;

    for(const ch of chans){
      if(S.syncCancel){ slog('▸ Cancelled by user', true); break; }
      i++;
      const prev = existing.get(ch.id);
      ch.lastScraped = prev?.lastScraped||0;
      setProg(i/chans.length*100, `${ch.title} (${i}/${chans.length})`);
      slog(`  ${ch.title} · ${nf(ch.subs)} subs · ${nfull(ch.videoCount)} videos`);
      try{
        let mine = byChannel.get(ch.id);
        if(!mine){ mine=[]; byChannel.set(ch.id, mine); }
        const known = new Set(mine.map(v=>v.id));
        /* A normal sync used to hard-cap at 100 no matter what depth you'd set,
           so raising the setting did nothing unless you happened to run a deep
           sync. Now: if this channel holds fewer videos than your configured
           depth, the sync backfills up to that depth (and skips the early-stop
           so it can reach past what's already cached). Once it's at depth, syncs
           go back to being cheap and incremental. */
        const cached = known.size;
        const want = cfg.scrapeDepth;
        /* If a previous full pull hit the end of the uploads playlist we know
           the channel's real ceiling, so asking for more than it has must not
           re-pull the whole catalogue on every sync forever. */
        ch.exhausted = prev?.exhausted; ch.maxAvailable = prev?.maxAvailable;
        const ceiling = ch.exhausted ? (ch.maxAvailable ?? Infinity) : Infinity;
        const target = Math.min(want, ceiling);
        const backfill = cached < target;
        const limit = (deep || backfill) ? want : Math.min(want, 100);
        const stopAt = (!deep && !backfill && ch.lastScraped) ? ch.lastScraped - 2*864e5 : null;
        if(backfill && cached) slog(`    backfilling ${cached} → ${target}`);
        const ids = await fetchUploadIds(ch, limit, stopAt);
        if(deep || backfill){                       // a full pull tells us the ceiling
          ch.exhausted = ids.length < limit;
          if(ch.exhausted) ch.maxAvailable = Math.max(ids.length, cached);
        }
        const fresh = ids.filter(id=>!known.has(id));
        // refresh stats for recent videos so velocity/snapshots stay live
        const refresh = mine.filter(v=>v.publishedTs>snapCutoff).map(v=>v.id);
        const toFetch = [...new Set([...ids, ...refresh])];
        if(toFetch.length){
          const vids = await fetchVideos(toFetch, ch.id);
          vids.forEach(v=>{ v.channelTitle = v.channelTitle||ch.title; v.pid=pid; v._k=`${pid}::${v.id}`; });
          /* Only write what actually moved.

             An incremental sync re-reads every video inside the snapshot window
             — for a 250-video channel that is most of the catalogue, every run,
             whether or not a single view count changed. Writing to IndexedDB
             costs roughly twenty times what reading does, so rewriting an
             identical row is the most expensive way to do nothing. Comparing
             first turns a same-day re-sync into almost pure reads. */
          const dirty = [];
          for(const v of vids){
            const cur = byId.get(v.id);
            const same = cur && cur.views===v.views && cur.likes===v.likes
              && cur.comments===v.comments && cur.title===v.title
              && cur.durationSec===v.durationSec && cur.channelTitle===v.channelTitle;
            if(same){ skippedV++; continue; }
            dirty.push(v);
            if(cur) Object.assign(cur, v);
            else { byId.set(v.id, v); mine.push(v); }
          }
          if(dirty.length) await idbPut(STORES.videos, dirty);
          newVids += fresh.length; updVids += vids.length - fresh.length;
          // daily snapshot for anything inside the snapshot window — again, only
          // when the reading differs from the one already stored for today
          const snaps = [];
          for(const v of vids){
            if(v.publishedTs<=snapCutoff) continue;
            const key = `${v.id}_${today}`;
            const prevSnap = snapById.get(key);
            if(prevSnap && prevSnap.views===v.views && prevSnap.likes===v.likes
               && prevSnap.comments===v.comments){ skippedS++; continue; }
            const row = { key, _k:`${pid}::${key}`, pid, videoId:v.id, channelId:ch.id, date:today,
              views:v.views, likes:v.likes, comments:v.comments, ts:Date.now() };
            snaps.push(row); snapById.set(key, row);
          }
          if(snaps.length) await idbPut(STORES.snapshots, snaps);
          slog(`    +${fresh.length} new, ${dirty.length-fresh.length} changed, ${snaps.length} snapshots`);
        } else slog(`    nothing new`);
        ch.lastScraped = Date.now();
        ch.scrapedCount = mine.length;
      }catch(e){ slog(`    ✗ ${e.message}`, true); }
      ch.pid=pid; ch._k=`${pid}::${ch.id}`;
      await idbPut(STORES.channels, ch);
    }
    // prune snapshots outside the window — scoped to this profile
    const snapRows = await idbByPid(STORES.snapshots, pid);
    const stale = snapRows.filter(s=>+new Date(s.date) < Date.now()-cfg.snapshotDays*864e5).map(s=>s._k);
    if(stale.length) await idbDelete(STORES.snapshots, stale);
    if(onProfile()) await loadAll();
    /* Prune and trim edit this profile's cache, so they only run while it is
       still the one on screen — S.* is what they operate on. Skipping them is
       safe: they are housekeeping, and the next sync on this profile does them. */
    if(onProfile()){
      const pruned = await pruneOrphans({silent:true});
      if(pruned) slog(`▸ Cleared ${pruned} channel(s) no longer in your list`);
      const trimmed = await trimToDepth();
      if(trimmed) slog(`▸ Trimmed ${trimmed} video(s) beyond the ${nfull(cfg.scrapeDepth)} depth`);
    }
    prof.cfg.lastSync = Date.now(); saveCfg(); invalidateBaselines();
    const used = CFG.quota.units - unitsBefore;
    if(skippedV||skippedS) slog(`▸ Skipped ${nfull(skippedV)} unchanged videos and ${nfull(skippedS)} unchanged snapshots`);
    slog(`▸ Done — ${newVids} new videos, ${updVids} refreshed, ${used} quota units used`);
    setProg(100,'Complete');
    const done = `Sync complete — ${newVids} new, ${updVids} refreshed, ${used} units`;
    if(onProfile()){ S.syncJustDone = done; toast(done,'ok'); }
    else toast(`"${prof.name}": ${done}`,'ok');   // finished in the background
  }catch(e){ slog('✗ '+e.message,true);
    if(onProfile()) S.syncJustDone='Sync failed — '+e.message;
    toast((onProfile()?'':`"${prof.name}": `)+e.message,'err'); }
  S.syncPids.delete(pid);
  S.syncing = S.syncPids.size>0; S.syncCancel=false;
  renderSyncStrip(); renderProfBar(); renderSideNav(); renderSyncStatus(); render();
  setTimeout(()=>{ if(!S.syncing){ S.syncJustDone=null; renderSyncStrip(); } }, 12000);
}

/* Two modes. "charts" = YouTube's own mostPopular feed (1 unit/category, unlimited).
   "keyword" = search.list scoped to your terms, which is the only way to see what's
   rising on a topic rather than whatever the global chart happens to be pushing.
   search.list draws on a hard 100-calls/day bucket, so each term costs one call
   and the UI states the spend before you commit. */
/* Duration presets in minutes. 0 max = no upper bound. YouTube's own search
   filter only knows short/medium/long, so it's used as a coarse pre-filter and
   the exact bounds are always enforced client-side on real durations. */
const DUR_PRESETS = [
  {k:'any',   l:'Any length',    min:0,  max:0},
  {k:'u4',    l:'Under 4 min',   min:0,  max:4},
  {k:'4to8',  l:'4–8 min',       min:4,  max:8},
  {k:'8plus', l:'8 min +',       min:8,  max:0},
  {k:'10plus',l:'10 min +',      min:10, max:0},
  {k:'20plus',l:'20 min +',      min:20, max:0},
  {k:'30plus',l:'30 min +',      min:30, max:0},
];
function activeDurPreset(){
  const p = DUR_PRESETS.find(p=>p.min===(CFG.trendDurMin||0) && p.max===(CFG.trendDurMax||0));
  return p? p.k : 'custom';
}
function durationHint(){
  const min=CFG.trendDurMin||0, max=CFG.trendDurMax||0;
  if(!min && !max) return 'any';
  if(max && max<=4) return 'short';
  if(min>=20) return 'long';
  if(min>=4 && max && max<=20) return 'medium';
  return 'any';
}
function passesDuration(v){
  const min=(CFG.trendDurMin||0)*60, max=(CFG.trendDurMax||0)*60;
  if(min && v.durationSec < min) return false;
  if(max && v.durationSec > max) return false;
  return true;
}
function trendDateBounds(){
  if(CFG.trendFrom){
    const after = new Date(CFG.trendFrom+'T00:00:00Z').toISOString();
    const before = CFG.trendTo? new Date(CFG.trendTo+'T23:59:59Z').toISOString() : null;
    return {after, before};
  }
  return {after:new Date(Date.now()-(CFG.trendWindow||30)*864e5).toISOString(), before:null};
}
async function syncTrending(){
  if(!CFG.ytKey){ toast('Add your YouTube API key first','err'); return; }
  const pid = PID();                       // bound, like syncAll — see the note there
  const mode = CFG.trendMode||'charts';
  try{
    const all=[]; let label='';
    if(mode==='keyword'){
      const kws = (CFG.trendKeywords||[]).filter(Boolean);
      if(!kws.length){ toast('Add at least one keyword below','warn'); return; }
      ensureDay();
      if(CFG.quota.search + kws.length > 100){ toast(`Only ${100-CFG.quota.search} search calls left today`,'err'); return; }
      const {after, before} = trendDateBounds();
      for(const kw of kws){
        const params = {part:'snippet',q:kw,type:'video',order:CFG.trendSort==='date'?'date':'viewCount',
          publishedAfter:after,regionCode:CFG.region,relevanceLanguage:'en',maxResults:50};
        if(before) params.publishedBefore = before;
        // narrow at the API where we can so the 50 slots aren't wasted on the wrong lengths;
        // the exact minute-level filter still runs client-side afterwards
        const hint = durationHint();
        if(hint!=='any') params.videoDuration = hint;
        const s = await yt('search',params,0,true);
        const ids=(s.items||[]).map(i=>i.id.videoId).filter(Boolean);
        if(!ids.length) continue;
        const full = await fetchVideos(ids);           // 1 unit, gives real stats
        full.sort((a,b)=>b.views-a.views);
        full.forEach((v,i)=>{ v.rank=i+1; v.cat=kw; all.push(v); });
      }
      label = `${kws.length} keyword${kws.length===1?'':'s'}`;
    } else {
      for(const cat of CFG.trendCats){
        const j = await yt('videos',{part:'snippet,statistics,contentDetails',chart:'mostPopular',
          regionCode:CFG.region,videoCategoryId:cat,maxResults:50},1);
        (j.items||[]).forEach((v,idx)=>{ const m=mapVideo(v); m.rank=idx+1; m.cat=String(cat); all.push(m); });
      }
      label = `${CFG.trendCats.length} categories`;
    }
    if(!all.length){ toast('No results returned','warn'); return; }
    const ts=Date.now();
    const snap = {ts, _k:`${pid}::${ts}`, pid, region:CFG.region, mode, label, videos:all};
    await idbPut(STORES.trending, snap);
    S.trending = mine(await idbAll(STORES.trending)).sort((a,b)=>a.ts-b.ts);
    const old = S.trending.filter(t=>t.ts<=Date.now()-14*864e5);
    if(old.length){ await idbDelete(STORES.trending, old.map(t=>t._k));
      S.trending = S.trending.filter(t=>t.ts>Date.now()-14*864e5); }
    toast(`Trending updated — ${all.length} videos from ${label}`,'ok'); render();
  }catch(e){ toast(e.message,'err'); }
}

/* ═══════════════════════════════════════════════════════════
   ANALYTICS
   ═══════════════════════════════════════════════════════════ */
const RANGES = {'1':'24 hours','3':'3 days','7':'7 days','30':'30 days','90':'3 months','180':'6 months','365':'1 year','all':'Lifetime'};
function rangeCutoff(r){ return r==='all' ? 0 : Date.now() - (+r)*864e5; }
/* 'custom' reads two dates off the profile so a picked window survives reloads
   and profile switches, exactly like every other range. */
function rangeBounds(r){
  r = r||S.range;
  if(r==='custom'){
    return { from: CFG.rangeFrom? +new Date(CFG.rangeFrom+'T00:00:00') : 0,
             to:   CFG.rangeTo?   +new Date(CFG.rangeTo+'T23:59:59')   : Infinity };
  }
  return { from: rangeCutoff(r), to: Infinity };
}
function rangeLabel(r){
  r = r||S.range;
  if(r!=='custom') return RANGES[r]||r;
  const f=CFG.rangeFrom, t=CFG.rangeTo;
  if(!f && !t) return 'Custom (pick dates)';
  const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});
  return f && t ? `${fmt(f)} → ${fmt(t)}` : f ? `Since ${fmt(f)}` : `Up to ${fmt(t)}`;
}
/* The channel selection is applied HERE, at the data layer, next to the Shorts
   filter — not in the view layer. It used to live in applyQ(), which only 6 of
   the 19 places that read this data actually called, so the dashboard KPIs,
   momentum, opportunities, analytics and several exports silently ignored the
   selection while the prior-period comparison honoured it. Filtering at the
   source makes every consumer consistent by construction. */
function videosInRange(r, chId){
  const {from,to} = rangeBounds(r);
  const sel = selIds();
  // a Set, not Array.includes — this predicate runs once per cached video on
  // every range change, and includes() made it O(videos x selected channels)
  const selSet = sel? new Set(sel) : null;
  return S.videos.filter(v=>v.publishedTs>=from && v.publishedTs<=to
    && (!chId||v.channelId===chId)
    && (!selSet || selSet.has(v.channelId))
    && (CFG.includeShorts||!v.isShort));
}
// stable signature of the current selection, for cache keys
function selSig(){ const s=selIds(); return s? s.slice().sort().join(',') : '*'; }
/* Baselines are computed from the channel's FULL cached history, not from the
   selected range. Two reasons this matters:
     1. At a 24h or 3-day range a channel may have one video — its own median
        would be itself, scoring a permanent and meaningless 1.0×.
     2. A score should mean the same thing whichever range you're looking through.
   Shorts and long-form get separate baselines: a Short routinely pulls 10× a
   long-form video's views on the same channel, and scoring them against one
   shared median makes every Short look like a breakout when it isn't. */
const BASELINE_DAYS = 180, MIN_BASE = 8;
/* One pass groups + sorts each channel's catalogue; baselines and upload gaps
   then both read it instead of each sorting the same lists again. */
let _chIdx=null, _chIdxKey='';
function channelIndex(){
  const key = dataKey();
  if(_chIdx && _chIdxKey===key) return _chIdx;
  const m = new Map();
  for(const v of S.videos){
    let a = m.get(v.channelId);
    if(!a){ a=[]; m.set(v.channelId,a); }
    a.push(v);
  }
  m.forEach(a=>a.sort((x,y)=>y.publishedTs-x.publishedTs));   // newest first
  _chIdx=m; _chIdxKey=key; return m;
}
function baselineFor(sortedDesc){
  const cut = Date.now()-BASELINE_DAYS*864e5;
  let base = sortedDesc.filter(v=>v.publishedTs>=cut);
  if(base.length<MIN_BASE) base = sortedDesc.slice(0,30);
  if(!base.length) base = sortedDesc;
  return median(base.map(v=>v.views))||1;
}
let _baseCache=null, _baseKey='';
function channelBaselines(){
  const key = dataKey();
  if(_baseCache && _baseKey===key) return _baseCache;
  const out={};
  channelIndex().forEach((list,cid)=>{
    const shorts=[], longs=[];
    for(const v of list) (v.isShort?shorts:longs).push(v);   // already sorted desc
    out[cid] = {
      short: shorts.length>=4 ? baselineFor(shorts) : null,
      long:  longs.length ? baselineFor(longs) : null,
      all:   baselineFor(list)
    };
  });
  _baseCache=out; _baseKey=key; return out;
}
function invalidateBaselines(){
  S.dataVer++;
  _baseCache=null; _gapCache=null; _enrichCache=null; _snapIdx=null; _chIdx=null;
  _chMapCache=null; _topicCache=null; _boardCache=null; _momCache.clear();
}
/* Identity of the current dataset. Anything memoised over S.videos / S.channels
   / S.snapshots keys on this, so a refresh that changes values but not counts
   still invalidates. */
const dataKey = () => S.dataVer+':'+PID();
/* Every view asks for "the enriched videos in the current range". Computing that
   once per render instead of once per call site is the other half of the fix. */
let _enrichCache=null, _enrichKey='';
function enrichedInRange(r){
  const range = r || S.range;
  const key = [range, CFG.rangeFrom||'', CFG.rangeTo||'', CFG.includeShorts?1:0,
    dataKey(), selSig()].join('|');   // selection is part of the identity
  if(r && r!==S.range) return enrich(videosInRange(r));   // one-off range, don't pollute the cache
  if(_enrichCache && _enrichKey===key) return _enrichCache;
  _enrichCache = enrich(videosInRange(range)); _enrichKey = key;
  return _enrichCache;
}
/* Title anatomy — cheap to compute, and the strongest lever a faceless channel
   actually controls. Every field here is also exported so you can regress on it. */
const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/u;
/* Memoised by title string — a full catalogue re-enrich would otherwise run
   ~10 regexes per video every time, and titles almost never change. */
const _anat = new Map();
function titleAnatomy(t){
  let a = _anat.get(t);
  if(a) return a;
  a = {
    titleLen: t.length, titleWords: t.trim().split(/\s+/).filter(Boolean).length,
    tHasNumber: /\d/.test(t),
    tCapsWords: (t.match(/\b[A-Z]{2,}\b/g)||[]).length,
    tHasQuestion: t.includes('?'), tHasExclaim: t.includes('!'),
    tHasParen: /[(\[].+[)\]]/.test(t), tHasEmoji: EMOJI_RE.test(t),
    tHasColon: t.includes(':'), tHasDash: /—|–|\s-\s/.test(t),
    tHasQuote: /["“”']/.test(t)
  };
  if(_anat.size>5000) _anat.clear();
  _anat.set(t,a);
  return a;
}
/* Days since that channel's previous upload. Publishing after a long gap behaves
   very differently from publishing into a daily cadence, and nothing else surfaces it. */
function uploadGaps(){
  const gaps={};
  channelIndex().forEach(list=>{
    // list is newest-first, so the "previous upload" is the next element along
    for(let i=0;i<list.length;i++){
      const prev = list[i+1];
      gaps[list[i].id] = prev? Math.round((list[i].publishedTs-prev.publishedTs)/864e5) : null;
    }
  });
  return gaps;
}
let _gapCache=null, _gapKey='';
function gapMap(){ const k=dataKey();
  if(_gapCache && _gapKey===k) return _gapCache;
  _gapCache=uploadGaps(); _gapKey=k; return _gapCache; }
/* Per-video memo keyed on the inputs that actually affect the result. A sync that
   touches 20 videos then only rebuilds those 20, instead of the whole catalogue. */
const _encache = new Map();
let _chMapCache=null;
function channelMap(){
  if(_chMapCache) return _chMapCache;
  _chMapCache = new Map(S.channels.map(c=>[c.id,c]));
  return _chMapCache;
}
const EMPTY_CH = {};
function enrich(vids){
  const bl = channelBaselines(), gaps = gapMap();
  const chMap = channelMap();   // built once per data change, not once per call
  if(_encache.size>20000) _encache.clear();
  return vids.map(v=>{
    const ch = chMap.get(v.channelId)||EMPTY_CH;
    const b = bl[v.channelId]||EMPTY_CH;
    const med = (v.isShort ? (b.short||b.all) : (b.long||b.all)) || 1;
    const ck = `${v.updatedAt}|${med}|${gaps[v.id]}|${ch.subs}`;
    const hit = _encache.get(v.id);
    if(hit && hit.k===ck) return hit.o;
    const hrs = Math.max(1,(Date.now()-v.publishedTs)/36e5);
    const days = Math.max(1,hrs/24);
    const d = new Date(v.publishedTs);
    const o = {...v, ...titleAnatomy(v.title||''),
      channelTitle: v.channelTitle||ch.title||'—',
      channelSubs: ch.subs||0, channelMedian: Math.round(med),
      baselineKind: v.isShort ? (b.short?'shorts':'all') : (b.long?'long-form':'all'),
      outlier: +(v.views/med).toFixed(2),
      vph: +(v.views/hrs).toFixed(1), vpd: Math.round(v.views/days),
      subRatio: ch.subs? +(v.views/ch.subs).toFixed(3):0,
      engage: v.views? +((v.likes+v.comments)/v.views*100).toFixed(2):0,
      likeRate: v.views? +(v.likes/v.views*100).toFixed(2):0,
      commentRate: v.views? +(v.comments/v.views*100).toFixed(3):0,
      // high comments relative to likes = argument in the comments = a divisive topic
      talkRatio: v.likes? +(v.comments/v.likes).toFixed(3):0,
      gapDays: gaps[v.id]!=null? gaps[v.id] : null,
      ageDays: Math.floor((Date.now()-v.publishedTs)/864e5),
      pubHour: d.getHours(), pubDow: d.getDay(),
      pubTime: FMT.time.format(d),
      pubDay: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()],
      pubLocal: FMT.local.format(d)
    };
    _encache.set(v.id, {k:ck, o});
    return o;
  });
}
/* ══════════ OPPORTUNITY ENGINE ══════════
   Topics are entities pulled out of titles — capitalised name runs plus salient
   words — then scored on four axes the API can actually support:
     performance  how well videos on this topic do vs their own channel norms
     coverage     how many DIFFERENT channels have touched it (fewer = open lane)
     momentum     share of recent uploads vs the prior window (is it heating up?)
     freshness    how recently anyone published on it
   Opportunity = proven performance × rising momentum ÷ competition.            */
const TOPIC_JUNK = new Set(['official','video','music','lyrics','letra','audio','live','remix','feat','ft',
  'shorts','short','episode','part','season','trailer','full','new','latest','update','breaking','watch',
  'today','now','just','after','before','why','what','who','when','how','this','that','they','their','been',
  'from','with','into','over','under','about','more','most','best','worst','real','truth','story','video']);
function extractTopics(title){
  const out = new Set();
  (title.match(/\b[A-Z][a-zA-Z'’.]+(?:\s+[A-Z][a-zA-Z'’.]+){0,2}\b/g)||[]).forEach(m=>{
    const t=m.trim(); const lt=t.toLowerCase();
    if(t.length<4) return;
    if(lt.split(/\s+/).every(w=>TOPIC_JUNK.has(w)||STOP.has(w))) return;
    if(TOPIC_JUNK.has(lt)||STOP.has(lt)) return;
    out.add(t);
  });
  return [...out];
}
let _topicCache=null, _topicKey='';
function topicStats(vids){
  const key = vids.length+':'+S.range+':'+dataKey()+':'+selSig();
  if(_topicCache && _topicKey===key) return _topicCache;
  const now=Date.now(), recentCut=now-7*864e5, priorCut=now-28*864e5;
  const m = new Map();
  for(const v of vids){
    for(const t of extractTopics(v.title||'')){
      let e = m.get(t);
      if(!e){ e={topic:t, vids:[], channels:new Set(), recent:0, prior:0, newest:0}; m.set(t,e); }
      e.vids.push(v); e.channels.add(v.channelId);
      if(v.publishedTs>=recentCut) e.recent++;
      else if(v.publishedTs>=priorCut) e.prior++;
      if(v.publishedTs>e.newest) e.newest=v.publishedTs;
    }
  }
  const rows=[];
  m.forEach(e=>{
    if(e.vids.length<2) return;
    const outs = e.vids.map(v=>v.outlier);
    const medOut = median(outs), maxOut = Math.max(...outs);
    const medViews = median(e.vids.map(v=>v.views));
    const coverage = e.channels.size;
    // recent share vs prior share, smoothed so a single new video can't spike it
    const momentum = +(((e.recent+0.5)/(e.prior+1.5))).toFixed(2);
    const daysOld = Math.floor((now-e.newest)/864e5);
    const freshness = Math.max(0.2, 1 - daysOld/60);
    const opportunity = +((medOut * Math.min(momentum,4) * freshness) / Math.sqrt(coverage)).toFixed(2);
    rows.push({topic:e.topic, count:e.vids.length, coverage, medOutlier:+medOut.toFixed(2),
      maxOutlier:+maxOut.toFixed(2), medViews:Math.round(medViews),
      recent:e.recent, prior:e.prior, momentum, daysOld, opportunity,
      best:[...e.vids].sort((a,b)=>b.outlier-a.outlier)[0]});
  });
  rows.sort((a,b)=>b.opportunity-a.opportunity);
  _topicCache=rows; _topicKey=key; return rows;
}
/* Breakout score for young videos: how far above the channel's own normal
   pace this one is running, weighted for how early we are and whether the
   snapshot curve is still accelerating. */
function breakoutScore(v){
  if(v.ageDays>21) return null;
  const base = v.channelMedian||1;
  const paceRatio = v.vpd / Math.max(1, base/30);      // vs channel's typical per-day earn
  const m = momentumOf(v.id);
  const accel = m && m.accel ? clamp(m.accel,0.5,3) : 1;
  const earliness = 1 + Math.max(0, (14 - v.ageDays))/14;
  const score = paceRatio * accel * earliness;
  return { score:+score.toFixed(2), paceRatio:+paceRatio.toFixed(2), accel:+accel.toFixed(2), m };
}
/* Rough 30-day projection from observed daily gain with decay. Explicitly an
   estimate — YouTube exposes no forecast, this is fitted from your own snapshots. */
function projectViews(v){
  const m = momentumOf(v.id);
  if(!m || m.series.length<2) return null;
  const gain = m.gain;
  if(gain<=0) return null;
  const daysLeft = Math.max(0, 30 - v.ageDays);
  let total = v.views, g = gain;
  for(let d=0; d<daysLeft; d++){ total += g; g *= 0.93; }   // decay tail
  return Math.round(total);
}
/* Is a channel on the way up or sliding? Median of their last 10 uploads
   against the 10 before that. Nothing in the API says this directly. */
function channelTrend(chId){
  // channelIndex() is already grouped and sorted newest-first; the old version
  // filtered and re-sorted the entire catalogue once per channel, so the
  // Channels view alone cost O(channels x videos log videos) per render
  const list = (channelIndex().get(chId)||[]).filter(v=>!v.isShort);
  if(list.length<8) return null;
  const n = Math.min(10, Math.floor(list.length/2));
  const recent = median(list.slice(0,n).map(v=>v.views));
  const before = median(list.slice(n,n*2).map(v=>v.views));
  if(!before) return null;
  return { recent:Math.round(recent), before:Math.round(before), ratio:+(recent/before).toFixed(2), n };
}
/* Snapshots are indexed once per data change instead of being re-scanned per row.
   The old version filtered + sorted the whole snapshot table for every rendered
   row — at a few hundred rows and a few thousand snapshots that is the single
   biggest source of render lag in the app. */
let _snapIdx=null, _snapKey='';
function snapIndex(){
  const k = dataKey();
  if(_snapIdx && _snapKey===k) return _snapIdx;
  const m = new Map();
  for(const s of S.snapshots){
    let a = m.get(s.videoId);
    if(!a){ a=[]; m.set(s.videoId,a); }
    a.push(s);
  }
  m.forEach(a=>a.sort((x,y)=> x.date<y.date?-1:x.date>y.date?1:0));
  _snapIdx=m; _snapKey=k; return m;
}
const _momCache = new Map();
function momentumOf(videoId){
  const idx = snapIndex();
  if(_momCache.has(videoId) && _momCache.get(videoId)?._k===_snapKey) return _momCache.get(videoId).v;
  const s = idx.get(videoId);
  let out = null;
  if(s && s.length>=2){
    const last=s[s.length-1], prev=s[s.length-2], prev2=s[s.length-3];
    const d1 = last.views-prev.views;
    const d2 = prev2 ? prev.views-prev2.views : null;
    out = { series:s.map(x=>x.views), gain:d1, accel: d2!=null && d2>0 ? +(d1/d2).toFixed(2) : null };
  }
  _momCache.set(videoId, {_k:_snapKey, v:out});
  return out;
}
function durationBuckets(vids){
  const B=[[0,60,'Shorts (<1m)'],[60,300,'1–5m'],[300,600,'5–10m'],[600,1200,'10–20m'],[1200,1800,'20–30m'],[1800,2700,'30–45m'],[2700,3600,'45–60m'],[3600,1e9,'60m+']];
  return B.map(([a,b,label])=>{
    const g = vids.filter(v=>v.durationSec>=a && v.durationSec<b);
    return { label, count:g.length, medViews:Math.round(median(g.map(v=>v.views))),
      medOutlier:+median(g.map(v=>v.outlier)).toFixed(2), p90:Math.round(pctile(g.map(v=>v.views),90)) };

function publishHeat(vids){

}
const STOP = new Set('the a an and or of to in for on is are was were be been how why what when who this that with from at as it its i you your my our we they he she his her their new best top most get make made all not but if can will just about into more than then them us do does did done over under after before out up down off very really most much some any every no nor so such only own same too can could should would may might must shall vs'.split(' '));
function nGrams(vids, n=2){
  const top = vids.filter(v=>v.outlier>=1.5), rest = vids.filter(v=>v.outlier<1.5);
  const count = (list)=>{ const m={};
    list.forEach(v=>{ const w=v.title.toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/).filter(x=>x&&!STOP.has(x)&&x.length>2);
      for(let i=0;i+n<=w.length;i++){ const g=w.slice(i,i+n).join(' '); m[g]=(m[g]||0)+1; } });
    return m; };
  const a=count(top), b=count(rest);
  return Object.entries(a).filter(([,c])=>c>=3)
    .map(([g,c])=>({phrase:g, inTop:c, inRest:b[g]||0, lift:+((c/Math.max(1,top.length))/((b[g]||0.5)/Math.max(1,rest.length))).toFixed(2)}))
    .sort((x,y)=>y.lift-x.lift || y.inTop-x.inTop).slice(0,30);

function channelStats(chId, range){

  const total = views.reduce((a,b)=>a+b,0);
  const top3 = sorted.slice(0,3).reduce((a,v)=>a+v.views,0);
  const months = vids.length? Math.max(1,(Date.now()-Math.min(...vids.map(v=>v.publishedTs)))/(30*864e5)) : 1;
  const ageMonths = ch.createdAt? Math.max(1,(Date.now()-+new Date(ch.createdAt))/(30*864e5)) : 1;
  return { ch, vids, count:vids.length, totalViews:total, medViews:Math.round(median(views)),

    top3Share: total? top3/total : 0, cadence:+(vids.length/months).toFixed(1),

function barList(items, {max, fmt=nf, sub}={}){

/* A 74px-wide sparkline cannot resolve 60 points — every extra point is markup
   the parser and layout engine pay for and the eye never sees. Downsampling to
   at most 1 point per ~5px is pixel-identical at these sizes and cut the feed's
   HTML by roughly a third. Endpoints and the min/max are always kept so the
   shape and the rising/falling colour stay exact. */
function sparkline(series, w=120, h=26){
  if(!series || series.length<2) return '<span class="dim s10">—</span>';
  const cap = Math.max(8, Math.round(w/5));
  let s = series;
  if(series.length > cap){
    const last = series.length-1, step = last/(cap-1), out=[];
    for(let i=0;i<cap;i++) out.push(series[Math.round(i*step)]);
    out[0]=series[0]; out[cap-1]=series[last];
    s = out;
  }
  let min=Infinity, max=-Infinity;
  for(const v of series){ if(v<min)min=v; if(v>max)max=v; }   // scale from the FULL series
  const rng=(max-min)||1, n=s.length-1;
  let pts='';
  for(let i=0;i<s.length;i++){
    pts += (i?' ':'') + (i/n*w).toFixed(1) + ',' + (h-((s[i]-min)/rng)*h).toFixed(1);
  }
  const rising = series[series.length-1]>=series[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${rising?'var(--ok)':'var(--err)'}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function heatmap(grid){
  const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const flat = grid.flat().filter(c=>c.n>0);
  const total = flat.reduce((a,c)=>a+c.n,0);
  if(total<10) return `<div class="row" style="gap:9px;padding:13px;background:var(--code);border-radius:var(--r2);border:1px dashed var(--line2)">
    ${ic('info')}<span style="font-size:11.5px" class="muted">Only <b style="color:var(--t1)">${total}</b> video${total===1?'':'s'} in range — a 7×24 grid needs a few hundred before the pattern is real. Widen the range.</span></div>`;
  const max = Math.max(...flat.map(c=>c.med),1);
  let h = '<div class="heat-grid"><div></div>';
  for(let i=0;i<24;i++) h += `<div class="hh">${i%3===0?i:''}</div>`;
  grid.forEach((row,d)=>{
    h += `<div class="hd">${D[d]}</div>`;
    row.forEach((c,hr)=>{
      const a = c.n? clamp(c.med/max,0.08,1) : 0;
      h += `<div class="heat-cell" style="background:${c.n?`color-mix(in srgb, var(--acc) ${(a*100).toFixed(0)}%, transparent)`:'var(--hov)'}" title="${D[d]} ${hr}:00 — ${c.n} videos, median outlier ${c.med}×"></div>`;
    });
  });
  return h+'</div>';
}

/* 24-hour upload clock: bar height = how many videos land in that hour,
   bar colour = how well that hour's videos actually performed. Publishing
   volume and publishing success are different questions and this shows both. */
function uploadClock(vids){
  if(!vids.length) return emptyState('clock','No uploads in range','Widen the range to see the pattern.');
  if(vids.length<6) return `<div class="row" style="gap:9px;padding:13px;background:var(--code);border-radius:var(--r2);border:1px dashed var(--line2)">

    Switch to <b style="color:var(--t1)">3 months</b> or wider and the clock becomes meaningful.</span></div>`;
  const hours = Array.from({length:24},(_,h)=>{

  });
  const maxN = Math.max(...hours.map(x=>x.n),1);

  const busiest = [...hours].sort((a,b)=>b.n-a.n)[0];
  const bestPerf = [...hours].filter(x=>x.n>=2).sort((a,b)=>b.med-a.med)[0];
  return `
  <div style="display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:8px">
    ${hours.map(x=>{
      const a = x.n? clamp(x.med/maxMed,.18,1) : 0;
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"
        title="${String(x.h).padStart(2,'0')}:00 — ${x.n} video${x.n===1?'':'s'}, median ${x.med}× outlier, median ${nf(x.views)} views">
        <div style="height:${x.n? Math.max(4,x.n/maxN*100):2}%;border-radius:4px 4px 2px 2px;
          background:${x.n?`color-mix(in srgb, var(--acc) ${(a*100).toFixed(0)}%, var(--panel3))`:'var(--hov)'};
          transition:height .3s var(--ease)"></div></div>`;}).join('')}
  </div>
  <div style="display:flex;gap:3px;margin-bottom:12px">
    ${hours.map(x=>`<div style="flex:1;text-align:center;font-size:8px;color:var(--t4)">${x.h%3===0?String(x.h).padStart(2,'0'):''}</div>`).join('')}
  </div>
  <div class="row wrapf" style="gap:8px">
    <span class="chip">Busiest hour <b>${String(busiest.h).padStart(2,'0')}:00</b> · ${busiest.n} uploads</span>
    ${bestPerf?`<span class="chip on">Best performing <b>${String(bestPerf.h).padStart(2,'0')}:00</b> · ${bestPerf.med}× median</span>`:''}
    <span class="dim" style="font-size:10px;align-self:center">Bar height = upload volume · colour intensity = median outlier score</span>

async function importProfilePack(j){
  if(j._signal!=='profile-pack'){ // fall back to the older flat backup shape
    if(j.cfg||j.videos) return importLegacyBackup(j);
    throw new Error('Unrecognised file');
  }
  let added=0;
  const landed=[];   // {id, rows} so we can finish on the profile worth looking at
  for(const p of (j.profiles||[])){
    const clash = STORE.profiles.some(x=>x.id===p.id);
    const newId = clash? uid() : p.id;
    const name = clash? p.name+' (imported)' : p.name;
    STORE.profiles.push({...p, id:newId, name});
    // re-stamp every record onto the (possibly new) profile id
    let rowsForThis = 0;
    for(const [logical, st] of Object.entries(STORES)){
      const rows = (j.data?.[logical]||[]).filter(r=>r.pid===p.id)
        .map(r=>({...r, pid:newId, _k:`${newId}::${String(r._k||'').split('::').slice(1).join('::')||r.id||r.key||r.ts}`}));
      if(rows.length){ await idbPut(st, rows); added += rows.length; rowsForThis += rows.length; }
    }
    for(const m of (j.data?.comments||[])){
      if(m.k==='comments_'+p.id) await idbPut('misc',{k:'comments_'+newId, v:m.v});
    }
    landed.push({id:newId, rows:rowsForThis});
  }
  /* Finish on the profile that actually carries data. Landing on whichever one
     happened to be last in the file — routinely an empty one — makes a perfectly
     good restore look like it did nothing, which is the exact panic this whole
     change is meant to remove. */
  const best = landed.slice().sort((a,b)=>b.rows-a.rows)[0];
  if(best) STORE.active = best.id;
  saveCfg(); await flushMirror();
  invalidateBaselines(); S.filters={}; await loadAll();
  renderProfBar(); renderSideNav(); render();
  toast(`Imported ${j.profiles?.length||0} profile(s) · ${nfull(added)} records`,'ok');
}
async function importLegacyBackup(j){
  const pid = uid();
  STORE.profiles.push({id:pid, name:'Imported '+todayPT(), color:PCOLORS[STORE.profiles.length%PCOLORS.length],
    cfg:{...DEF_CFG, ...(j.cfg||{})}});
  STORE.active = pid;
  const map = {channels:'channels', videos:'videos', snapshots:'snapshots', trending:'trending'};
  for(const [k, logical] of Object.entries(map)){
    const rows = (j[k]||[]).map(r=>{
      const idf = logical==='snapshots'?'key' : logical==='trending'?'ts':'id';
      return {...r, pid, _k:`${pid}::${r[idf]}`};
    });
    if(rows.length) await idbPut(STORES[logical], rows);
  }
  saveCfg(); invalidateBaselines(); await loadAll();
  renderProfBar(); renderSideNav(); render(); toast('Legacy backup imported as a new profile','ok');
}

const VIEW_FN = {dash:vDash,feed:vFeed,outliers:vOutliers,momentum:vMomentum,trending:vTrending,opps:vOpps,

/* Rebuilds only the main panel, leaving the toolbar (and therefore the open
   channel menu) untouched. Used while the picker is open so the menu you are
   clicking in is never destroyed underneath you. */
/* A background sync finishing while you were mid-paste used to wipe the textarea
   and repaint it from disk — text gone, no warning, no undo. Capture whatever is
   focused (and exactly where the caret sits) before the swap and put it back
   after, uncommitted keystrokes included. */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return null;
  let start=null,end=null;
  try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){}
  return {id:el.id, value:el.value, start, end, scroll:el.scrollTop};
}
function restoreFocus(f){
  if(!f) return;
  const el = document.getElementById(f.id);
  if(!el) return;
  if(el.value !== f.value) el.value = f.value;
  try{ el.focus({preventScroll:true}); if(f.start!=null) el.setSelectionRange(f.start,f.end); }catch(e){}
  el.scrollTop = f.scroll;
}
function renderContentOnly(){
  const f = captureFocus();
  const c = document.getElementById('content');
  const fn = VIEW_FN[S.view];
  c.innerHTML = fn? fn() : '';
  renderQuota(); renderSyncStatus();
  restoreFocus(f);
}
function render(){
  const v = VIEWS.find(x=>x.id===S.view)||VIEWS[1];

/* One thumbnail renderer everywhere, so a fix here fixes every view.
   Falls back through YouTube's own CDN sizes if the stored URL is missing. */
function thumbUrl(v, big){
  if(big && v.thumbHi) return v.thumbHi;
  if(v.thumb) return v.thumb;
  return v.id? `https://i.ytimg.com/vi/${v.id}/${big?'hqdefault':'mqdefault'}.jpg` : '';
}
/* decoding="async" keeps image decode off the critical path so a redraw never
   blocks on it. The fallback moved from a per-image inline onerror (which is a
   parsed script attribute on every row) to one delegated capture listener. */
function thumbLink(v, cls=''){
  return `<a class="thumblink" href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><img class="vthumb ${cls}" loading="lazy" decoding="async" src="${esc(thumbUrl(v))}" data-vid="${v.id}" alt="">${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}</a>`;
}
addEventListener('error', e=>{
  const img = e.target;
  if(!(img instanceof HTMLImageElement) || !img.dataset.vid || img.dataset.fb) return;
  img.dataset.fb='1';
  img.src = `https://i.ytimg.com/vi/${img.dataset.vid}/mqdefault.jpg`;
}, true);
function sortRows(rows, key){
  const s = S.sort[key] || {c:'outlier', d:-1};
  return [...rows].sort((a,b)=>{
    const x=a[s.c], y=b[s.c];
    if(typeof x==='string') return s.d * x.localeCompare(y);
    return s.d * ((x||0)-(y||0));
  });
}
const COLS = [
  {c:'', l:'', no:1},
  {c:'title', l:'Video'},
  {c:'channelTitle', l:'Channel'},
  {c:'publishedTs', l:'Uploaded', n:1},
  {c:'views', l:'Views', n:1},
  {c:'outlier', l:'Outlier', n:1},
  {c:'vpd', l:'Views/day', n:1},
  {c:'engage', l:'Engage', n:1},
  {c:'durationSec', l:'Length', n:1},
];
function pager(key, total, per, page){
  const pages = Math.ceil(total/per);
  if(pages<=1) return '';
  const win=[]; const add=n=>{ if(n>=1&&n<=pages&&!win.includes(n)) win.push(n); };
  add(1); for(let i=page-2;i<=page+2;i++) add(i); add(pages);
  win.sort((a,b)=>a-b);
  let out='';
  win.forEach((n,i)=>{ if(i && n-win[i-1]>1) out+=`<span class="dim" style="padding:0 3px">…</span>`;
    out+=`<button class="pgbtn ${n===page?'on':''}" data-page="${key}|${n}">${n}</button>`; });
  return `<div class="pagerow">
    <button class="pgbtn" data-page="${key}|${Math.max(1,page-1)}" ${page===1?'disabled':''}>← Prev</button>
    ${out}
    <button class="pgbtn" data-page="${key}|${Math.min(pages,page+1)}" ${page===pages?'disabled':''}>Next →</button>
    <span class="dim" style="font-size:10.5px;margin-left:8px">${nfull(total)} rows · ${per}/page</span>
    <span class="right row" style="gap:5px">
      ${[25,50,100,200].map(n=>`<button class="pgbtn ${per===n?'on':''}" data-perpage="${n}">${n}</button>`).join('')}
    </span></div>`;
}
/* Paging and sorting change only the table. Rebuilding the whole view for them
   also rebuilds the KPI row, panels, toolbar and the picker's 13 avatars — all
   identical output, all thrown away and re-laid-out. These two helpers let those
   interactions swap just the table region, which is what makes them feel instant.
   If anything is missing we fall back to a normal full render, so behaviour is
   unchanged either way. */
const TABLE_VIEWS = {
  feed:     ()=>({key:'feed',     rows:sortRows(applyQ(enrichedInRange()),'feed')}),
  outliers: ()=>({key:'outliers', rows:sortRows(applyQ(enrichedInRange()).filter(v=>v.outlier>=CFG.outlierThreshold),'outliers')}),
  board:    ()=>({key:'board',    rows:boardRows()}),
};
function fastTableUpdate(wantKey){
  const build = TABLE_VIEWS[S.view];
  if(!build) return false;
  const {key, rows} = build();
  if(key!==wantKey) return false;
  const host = document.getElementById('tblhost-'+key);
  if(!host) return false;
  /* Paging must not move the page. Swapping innerHTML momentarily collapses the
     container's height, which the browser clamps the scroll position against —
     so the offset is captured and restored around the swap. */
  const y = window.scrollY;
  host.style.minHeight = host.offsetHeight + 'px';
  host.innerHTML = key==='board' ? boardGrid(rows) : videoTable(rows, key);
  window.scrollTo(0, y);
  requestAnimationFrame(()=>{ host.style.minHeight=''; window.scrollTo(0, y); });
  return true;
}
function videoTable(rows, key, opts={}){
  if(!rows.length) return `<div class="pad">${emptyState('film','Nothing here yet','Adjust the range or run a sync to pull more data.')}</div>`;
  const s = S.sort[key]||{c:'outlier',d:-1};
  // paginate rather than dumping every row + image into the DOM at once
  const total = rows.length;
  const per = opts.limit || CFG.perPage || 50;
  const pages = Math.max(1, Math.ceil(total/per));
  const page = Math.min(Math.max(1, S.page[key]||1), pages);
  const slice = opts.limit? rows.slice(0,opts.limit) : rows.slice((page-1)*per, page*per);
  return `${opts.limit?'':pager(key,total,per,page)}<div class="tbl-wrap"><table><thead><tr>${COLS.map(c=>
    c.no? `<th style="width:166px"></th>` :
    `<th class="sortable ${s.c===c.c?'act':''} ${c.n?'num':''}" data-sort="${key}|${c.c}">${c.l}${s.c===c.c?`<span class="arw">${s.d<0?'▼':'▲'}</span>`:''}</th>`).join('')}</tr></thead>
  <tbody>${slice.map(v=>{
    const m = momentumOf(v.id);
    const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';
    const url = `https://youtube.com/watch?v=${v.id}`;
    return `<tr class="${v.outlier>=CFG.outlierThreshold?'hot':''}">
      <td class="thumbcell">${thumbLink(v)}</td>
      <td class="tdTitle"><a href="${url}" target="_blank" rel="noopener" class="tt">${esc(v.title)}</a>
        <div class="vmeta">
          ${v.isShort?'<span class="tag">SHORT</span>':''}
          ${m&&m.accel>1.4?'<span class="badge b-warn">ACCELERATING</span>':''}
          <span>${v.ageDays}d old</span>
          <span class="sep">·</span><span>${nf(v.likes)} likes</span>
          <span class="sep">·</span><span>${nf(v.comments)} comments</span>
          ${v.gapDays!=null?`<span class="sep">·</span><span title="Days since this channel's previous upload">${v.gapDays}d gap</span>`:''}
        </div></td>
      <td class="muted tdChan"><div class="c1">${esc(v.channelTitle)}</div>
        <div class="dim subline">base ${nf(v.channelMedian)}</div></td>
      <td class="num"><div class="uptime">${v.pubDay} ${v.pubTime}</div>
        <div class="dim subline">${dstr(v.publishedTs)}</div></td>
      <td class="num"><b class="vbig">${nf(v.views)}</b>${m?`<div class="sparkcell">${sparkline(m.series,74,16)}</div>`:''}</td>
      <td class="num"><span class="badge ${oc}">${v.outlier}×</span></td>
      <td class="num muted">${nf(v.vpd)}</td>
      <td class="num muted">${v.engage}%</td>
      <td class="num muted">${dur(v.durationSec)}</td>
    </tr>`;}).join('')}</tbody></table></div>${opts.limit?'':pager(key,total,per,page)}`;
}
/* One filter path shared by the views and by every export, so what you download
   is always exactly what you're looking at. */
/* Channel selection is a SET. Empty means "all" — which keeps the common case
   zero-click while making comparison of any subset a first-class operation. */
/* null  = no filter (all channels)
   []    = explicitly nothing selected
   [ids] = exactly those channels
   Keeping "all" as null rather than a full id list means adding a channel later
   doesn't silently leave it out of an existing selection. */
function selIds(){ const s=S.filters.chSel; return (s===null||s===undefined)? null : s; }
function isFiltered(){ return selIds()!==null; }
function isSel(id){ const s=selIds(); return s===null || s.includes(id); }
function selectedChannelObjs(){
  const s=selIds();

function selCount(){ const s=selIds(); return s===null? S.channels.length : s.length; }

  const s=selIds();

  if(s.length===0) return 'No channels selected';

function toggleChSel(id){
  const all = S.channels.map(c=>c.id);
  const s = selIds();
  let next;
  if(id==='__all')        next = null;
  else if(id==='__none')  next = [];
  else if(id==='__invert'){ const cur = s===null? all : s; next = all.filter(x=>!cur.includes(x)); }
  else {
    let cur = (s===null? all : s).slice();
    cur = cur.includes(id)? cur.filter(x=>x!==id) : cur.concat(id);
    next = cur.length===all.length ? null : cur;     // everything ticked === no filter
  }
  S.filters.chSel = next; S.page={};
  /* While the menu is open, patch it in place rather than re-rendering the
     toolbar — rebuilding it destroyed and recreated all the avatars on every
     click, which is what made ticking channels feel harsh. The tick flips
     immediately; the table catches up on the next frame, and rapid clicks
     collapse into a single table render. */
  if(chPickOpen && syncPickerDom()) scheduleContentUpdate();
  else render();
}
function syncPickerDom(){
  const menu = document.getElementById('chPickMenu');
  if(!menu) return false;
  const rows = menu.querySelectorAll('[data-chsel]');
  for(const btn of rows){
    const id = btn.dataset.chsel;
    if(id.startsWith('__')) continue;
    const on = isSel(id);
    if(btn.classList.contains('on') !== on){
      btn.classList.toggle('on', on);
      const box = btn.querySelector('.cbox');
      if(box) box.innerHTML = on? ic('check') : '';
    }
  }
  const cnt = menu.querySelector('.mpick-count');
  if(cnt) cnt.textContent = `${selCount()} of ${S.channels.length}`;
  const foot = menu.querySelector('.mpick-foot');
  if(foot){
    const show = isFiltered() && selCount()>1;
    if(foot.hidden === show){                       // only touch the DOM when it changes
      foot.hidden = !show;
      const b = foot.querySelector('button');
      if(b && show) b.lastChild.textContent = `Compare these ${selCount()}`;
      positionChPick();                             // height changed — re-anchor
    } else if(show){
      const b = foot.querySelector('button');
      if(b) b.lastChild.textContent = `Compare these ${selCount()}`;
    }
  }
  const btn = document.querySelector('.mpick-btn');
  if(btn){
    btn.classList.toggle('act', isFiltered());
    const lbl = btn.querySelector('.mpick-label');
    if(lbl) lbl.textContent = selLabel();
  }
  return true;
}

/* Channel selection is no longer applied here — videosInRange() already did it
   for every consumer. This now only layers on the view-level search box and
   minimum-views control. */
function applyQ(rows){
  const q=(S.filters.q||'').toLowerCase().trim();
  const mv=CFG.minViews||0;
  let out = rows;
  if(mv) out = out.filter(v=>v.views>=mv);
  if(q) out = out.filter(v=>v.title.toLowerCase().includes(q)||(v.channelTitle||'').toLowerCase().includes(q));
  return out;
}

/* Anchors a fixed-position popover under its trigger, flipping above and
   clamping to the viewport so it can never render off-screen or half-cut. */
function anchorPopover(menu, btn){
  if(!menu||!btn) return;
  menu.style.maxHeight='';
  const r = btn.getBoundingClientRect();
  const gap = 5, pad = 8;
  const w = menu.offsetWidth || 300;
  let h = menu.offsetHeight;
  const below = window.innerHeight - r.bottom - gap - pad;
  const above = r.top - gap - pad;
  let top;
  if(h <= below || below >= above){                 // prefer below
    top = r.bottom + gap;
    menu.style.maxHeight = Math.max(140, below) + 'px';
  } else {                                          // flip above
    menu.style.maxHeight = Math.max(140, above) + 'px';
    h = Math.min(h, above);
    top = Math.max(pad, r.top - gap - h);
  }
  let left = r.left;
  left = Math.min(left, window.innerWidth - w - pad);
  left = Math.max(pad, left);
  menu.style.left = Math.round(left)+'px';
  menu.style.top  = Math.round(top)+'px';
  menu.classList.add('placed');
}
/* Measuring inside render() forces a synchronous reflow on every keystroke and
   page change while the menu is open — measured at ~98ms per render on a large
   catalogue. Deferring to the next frame keeps render() pure DOM-write, and the
   browser does that layout pass once anyway. */

  if(!chPickOpen || _posQueued) return;
  _posQueued=true;
  requestAnimationFrame(()=>{
    _posQueued=false;

  });
}

function trendEntities(videos){
  const freq={};
  videos.forEach(v=>{
    (v.title.match(/\b[A-Z][a-zA-Z'.]+(?:\s+[A-Z][a-zA-Z'.]+)?\b/g)||[]).forEach(n=>{
      const k=n.trim(), lk=k.toLowerCase();

      if(lk.split(/\s+/).some(w=>ENTITY_JUNK.has(w))) return;
      freq[k]=(freq[k]||0)+1;
