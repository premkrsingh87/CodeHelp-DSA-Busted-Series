function vCompare(){
  const sel = selectedChannelObjs();
  if(sel.length<2) return `<div class="panel"><div class="pad">${emptyState('chart','Pick 2 or more channels to compare',
    'Use the channel selector in the toolbar — tick any combination, then come back here. Everything below is computed head-to-head over the current date range.')}</div></div>`;
  const all = enrichedInRange();
  const per = sel.map(c=>{
    const g = all.filter(v=>v.channelId===c.id);
    const t = channelTrend(c.id);
    const vals = g.map(v=>v.views), mu = mean(vals);
    const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
    const months = g.length? Math.max(1,(Date.now()-Math.min(...g.map(v=>v.publishedTs)))/(30*864e5)) : 1;
    const hrs={}; g.forEach(v=>{ (hrs[v.pubHour]=hrs[v.pubHour]||[]).push(v); });
    const bestHour = Object.entries(hrs).filter(([,a])=>a.length>=2)
      .sort((a,b)=>median(b[1].map(v=>v.outlier))-median(a[1].map(v=>v.outlier)))[0];
    return { c, g, t, cv,
      count:g.length, med:median(vals), mean:mu, max:Math.max(0,...vals),
      total:vals.reduce((a,b)=>a+b,0),
      outliers:g.filter(v=>v.outlier>=CFG.outlierThreshold).length,
      engage:median(g.map(v=>v.engage)), likeRate:median(g.map(v=>v.likeRate)),
      cadence:+(g.length/months).toFixed(1),
      medDur:median(g.map(v=>v.durationSec)),
      shorts:g.length? g.filter(v=>v.isShort).length/g.length : 0,
      viewsPerSub: c.subs? +(median(vals)/c.subs*1000).toFixed(2) : 0,
      bestHour: bestHour? String(bestHour[0]).padStart(2,'0')+':00' : '—',
      best:[...g].sort((a,b)=>b.outlier-a.outlier)[0],
      topics:new Set(g.flatMap(v=>extractTopics(v.title||'')))
    };
  });
  // winner per metric so the eye lands on it without reading every number
  const win = (key, hi=true)=>{ const vals=per.map(p=>p[key]); const best=hi?Math.max(...vals):Math.min(...vals);
    return per.map(p=>p[key]===best && vals.filter(v=>v===best).length<per.length); };
  const ROWS = [
    ['Videos in range','count', v=>nfull(v), true],
    ['Median views','med', v=>nf(Math.round(v)), true],
    ['Mean views','mean', v=>nf(Math.round(v)), true],
    ['Best video','max', v=>nf(v), true],
    ['Total views','total', v=>nf(v), true],
    [`Outliers ≥${CFG.outlierThreshold}×`,'outliers', v=>nfull(v), true],
    ['Uploads / month','cadence', v=>v, true],
    ['Median engagement','engage', v=>v.toFixed(2)+'%', true],
    ['Like rate','likeRate', v=>v.toFixed(2)+'%', true],
    ['Median length','medDur', v=>dur(Math.round(v)), null],
    ['Shorts share','shorts', v=>pct(v), null],
    ['Views per 1K subs','viewsPerSub', v=>nfull(v), true],
    ['Best publish hour','bestHour', v=>v, null],
  ];
  // topic gap: what each channel owns that none of the others touched
  const gaps = per.map((p,i)=>{
    const others = new Set(per.filter((_,j)=>j!==i).flatMap(x=>[...x.topics]));
    const owned = [...p.topics].filter(t=>!others.has(t));
    const scored = owned.map(t=>{
      const vs = p.g.filter(v=>extractTopics(v.title||'').includes(t));
      return {t, n:vs.length, med:median(vs.map(v=>v.outlier)), views:median(vs.map(v=>v.views))};
    }).filter(x=>x.n>=2).sort((a,b)=>b.med-a.med).slice(0,8);
    return {p, scored};
  });
  const shared = per.reduce((acc,p)=> acc===null? new Set(p.topics)
    : new Set([...acc].filter(t=>p.topics.has(t))), null);

  return `
  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('users')}Comparing ${sel.length} channels · ${rangeLabel()}
    <span class="right row" style="gap:6px">
      <button class="btn btn-sm btn-o" data-export="compare|csv">CSV</button>
      <button class="btn btn-sm btn-o" data-export="compare|json">JSON</button>
      <button class="btn btn-sm btn-p" data-act="copyCompare">${ic('copy')}Copy brief</button></span></div>
  <div class="tbl-wrap"><table><thead><tr><th style="min-width:150px">Metric</th>
    ${per.map(p=>`<th class="num" style="min-width:130px">
      <div class="row" style="justify-content:flex-end;gap:7px">
        <span class="c1" style="max-width:120px">${esc(p.c.title)}</span>
        <img class="avat" style="width:22px;height:22px" src="${esc(p.c.thumb)}" alt=""></div>
      <div class="dim" style="font-weight:600;font-size:9.5px;margin-top:2px">${nf(p.c.subs)} subs</div></th>`).join('')}
  </tr></thead><tbody>
    ${ROWS.map(([label,key,fmt,hi])=>{
      const w = hi===null? per.map(()=>false) : win(key,hi);
      return `<tr><td style="font-weight:600">${label}</td>
        ${per.map((p,i)=>`<td class="num ${w[i]?'':'muted'}">${w[i]?`<b style="color:var(--acc)">${fmt(p[key])}</b>`:fmt(p[key])}</td>`).join('')}</tr>`;
    }).join('')}
    <tr><td style="font-weight:600">Trend (last 10 vs prior 10)</td>
      ${per.map(p=>`<td class="num">${p.t?`<span class="badge ${p.t.ratio>=1.25?'b-ok':p.t.ratio<=0.75?'b-err':'b-grey'}">${p.t.ratio>=1.25?'▲':p.t.ratio<=0.75?'▼':'—'} ${p.t.ratio}×</span>`:'<span class="dim">—</span>'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Output consistency</td>
      ${per.map(p=>`<td class="num muted">${p.cv<0.8?'steady':p.cv<2?'mixed':'spiky'}</td>`).join('')}</tr>
    <tr><td style="font-weight:600">Best performer</td>
      ${per.map(p=>p.best?`<td><a href="https://youtube.com/watch?v=${p.best.id}" target="_blank" rel="noopener">
        <img class="vthumb" style="width:120px;min-width:120px;margin-bottom:5px" loading="lazy" src="${esc(thumbUrl(p.best))}" alt="">
        <span class="c2" style="font-size:10.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.best.title)}</span></a>
        <div class="dim" style="font-size:9.5px;margin-top:3px">${p.best.outlier}× · ${nf(p.best.views)}</div></td>`:'<td class="dim">—</td>').join('')}</tr>
  </tbody></table></div></div>

  <div class="panel" style="margin-bottom:14px"><div class="phead">${ic('target')}Topic gaps — what each one owns alone
    <span class="right dim" style="font-size:10px;font-weight:600">topics no other selected channel has covered</span></div>
    <div class="pad grid3">
      ${gaps.map(({p,scored})=>`<div>
        <div class="row" style="gap:8px;margin-bottom:9px">
          <img class="avat" style="width:24px;height:24px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:12px" class="c1">${esc(p.c.title)}</b></div>
        ${scored.length? scored.map(x=>`<div class="row" style="justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rowline)">
            <span class="c1" style="font-size:11.5px">${esc(x.t)}</span>
            <span class="row" style="gap:6px;flex-shrink:0">
              <span class="badge ${x.med>=1.5?'b-ok':'b-grey'}">${x.med.toFixed(2)}×</span>
              <span class="dim" style="font-size:9.5px">${x.n}v · ${nf(x.views)}</span></span></div>`).join('')
          : '<div class="dim" style="font-size:11px">No exclusive topics — everything it covers, others cover too.</div>'}
      </div>`).join('')}
    </div>
    ${shared && shared.size? `<div class="pad" style="border-top:1px solid var(--line)">
      <div class="lbl">Contested — every selected channel covers these</div>
      <div class="row wrapf" style="gap:6px">${[...shared].slice(0,24).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`:''}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('clock')}Upload timing, side by side</div><div class="pad">
      ${per.map(p=>`<div style="margin-bottom:16px">
        <div class="row" style="gap:8px;margin-bottom:7px"><img class="avat" style="width:20px;height:20px" src="${esc(p.c.thumb)}" alt="">
          <b style="font-size:11.5px">${esc(p.c.title)}</b><span class="dim" style="font-size:10px">peak ${p.bestHour}</span></div>
        ${(()=>{ const hrs=Array.from({length:24},(_,h)=>p.g.filter(v=>v.pubHour===h).length);
          const mx=Math.max(...hrs,1);
          return `<div style="display:flex;gap:2px;height:38px;align-items:flex-end">${hrs.map((n,h)=>
            `<div style="flex:1;height:${n?Math.max(6,n/mx*100):2}%;border-radius:3px 3px 1px 1px;
              background:${n?'var(--acc)':'var(--hov)'};opacity:${n?0.35+0.65*(n/mx):1}"
              title="${String(h).padStart(2,'0')}:00 — ${n} uploads"></div>`).join('')}</div>`;})()}
      </div>`).join('')}
      <div class="dim" style="font-size:10px">Bar height = uploads in that hour, local time.</div></div></div>

    <div class="panel"><div class="phead">${ic('film')}Length strategy, side by side</div><div class="pad">
      ${(()=>{ const B=[[0,60,'Shorts'],[60,600,'1–10m'],[600,1200,'10–20m'],[1200,2400,'20–40m'],[2400,1e9,'40m+']];
        return B.map(([a,b,label])=>`<div style="margin-bottom:12px">
          <div class="bl" style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px">
            <span class="muted">${label}</span></div>
          ${per.map(p=>{ const g=p.g.filter(v=>v.durationSec>=a&&v.durationSec<b);
            const share=p.g.length? g.length/p.g.length:0;
            return `<div class="row" style="gap:7px;margin-bottom:3px">
              <span class="c1 dim" style="width:96px;font-size:10px">${esc(p.c.title)}</span>
              <span class="track grow"><i style="width:${(share*100).toFixed(0)}%"></i></span>
              <span class="dim" style="font-size:10px;width:78px;text-align:right">${g.length} · ${g.length?nf(median(g.map(v=>v.views))):'—'}</span></div>`;}).join('')}
        </div>`).join('');})()}
      <div class="dim" style="font-size:10px">Bar = share of that channel's uploads · right = count and median views.</div></div></div>
  </div>`;
}

/* ─────────── OPPORTUNITIES ─────────── */
function vOpps(){
  const vids = enrichedInRange();
  if(!vids.length) return `<div class="panel"><div class="pad">${emptyState('bolt','No data in this range','Run a sync or widen the range.')}</div></div>`;
  const topics = topicStats(vids);
  const breakouts = vids.map(v=>({v, b:breakoutScore(v)})).filter(x=>x.b && x.b.score>1.2)
    .sort((a,b)=>b.b.score-a.b.score).slice(0,12);
  const openLanes = topics.filter(t=>t.coverage<=2 && t.medOutlier>=1.2 && t.count>=2).slice(0,12);
  const heating = [...topics].filter(t=>t.recent>0).sort((a,b)=>b.momentum-a.momentum).slice(0,12);
  const cooling = [...topics].filter(t=>t.prior>=3 && t.recent===0)
    .sort((a,b)=>b.medOutlier-a.medOutlier).slice(0,8);
  const tab = S.filters.oppTab||'breakout';

  const topicRow = (t,extra)=>`<tr>
    <td><div style="font-weight:700;font-size:12.5px">${esc(t.topic)}</div>
      <div class="vmeta"><span>${t.count} videos</span><span class="sep">·</span>
        <span>${t.coverage} channel${t.coverage===1?'':'s'}</span><span class="sep">·</span>
        <span>last ${t.daysOld}d ago</span></div></td>
    <td class="num"><span class="badge ${t.medOutlier>=2?'b-ok':t.medOutlier>=1.2?'b-acc':'b-grey'}">${t.medOutlier}×</span></td>
    <td class="num">${nf(t.medViews)}</td>
    ${extra||''}
    <td style="max-width:250px"><a href="https://youtube.com/watch?v=${t.best.id}" target="_blank" rel="noopener" class="c1" style="font-size:11px;color:var(--t3)">${esc(t.best.title)}</a>
      <div class="dim" style="font-size:9.5px">${t.best.outlier}× · ${nf(t.best.views)} views</div></td>
    <td><button class="btn btn-sm btn-o" data-oppsearch="${esc(t.topic)}">See all</button></td></tr>`;

  return `
  <div class="kgrid" style="margin-bottom:14px">
    <div class="kpi"><div class="ico">${ic('bolt')}</div><div class="v" style="color:var(--warn)">${breakouts.length}</div>
      <div class="k">Breaking out now</div><div class="d dim">young videos beating channel pace</div></div>
    <div class="kpi"><div class="ico">${ic('target')}</div><div class="v">${openLanes.length}</div>
      <div class="k">Open lanes</div><div class="d dim">proven topic, ≤2 channels on it</div></div>
    <div class="kpi"><div class="ico">${ic('up')}</div><div class="v" style="color:var(--ok)">${heating.filter(t=>t.momentum>1.5).length}</div>
      <div class="k">Heating up</div><div class="d dim">rising share of uploads</div></div>
    <div class="kpi"><div class="v">${nfull(topics.length)}</div><div class="k">Topics detected</div>
      <div class="d dim">across ${nfull(vids.length)} videos</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="phead"><div class="seg plain" style="margin-right:auto">
      ${[['breakout','⚡ Breakout watch'],['lanes','🎯 Open lanes'],['heating','📈 Heating up'],['cooling','🕰 Revival candidates']]
        .map(([k,l])=>`<button class="${tab===k?'on':''}" data-opptab="${k}">${l}</button>`).join('')}
    </div>
    <button class="btn btn-sm btn-o" data-export="topics|csv">CSV</button>
    <button class="btn btn-sm btn-o" data-export="topics|json">JSON</button>
    <button class="btn btn-sm btn-p" data-act="copyOppBrief">${ic('copy')}Copy brief</button></div>

    ${tab==='breakout'? (!breakouts.length? `<div class="pad">${emptyState('bolt','Nothing breaking out',
        'Breakout detection compares a young video\'s daily pace against its channel\'s norm, and needs 2+ days of snapshots. Sync daily and this fills in.')}</div>`
      : `<div class="tbl-wrap"><table><thead><tr><th style="width:158px"></th><th>Video</th><th>Channel</th>
        <th class="num">Views now</th><th class="num">Pace vs norm</th><th class="num">Accel</th>
        <th class="num">Projected 30d</th><th class="num">Age</th><th style="width:82px"></th></tr></thead><tbody>
        ${breakouts.map(({v,b})=>{ const proj=projectViews(v);
          return `<tr class="fire${isVsel(v.id)?' sel':''}">
          <td class="thumbcell">${thumbLink(v,'sm')}</td>
          <td style="min-width:250px"><a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="tt">${esc(v.title)}</a>
            <div class="vmeta"><span class="badge b-warn">SCORE ${b.score}</span>
              <span>${v.pubDay} ${v.pubTime}</span><span class="sep">·</span><span>${dur(v.durationSec)}</span></div></td>
          <td class="muted c1" style="max-width:130px">${esc(v.channelTitle)}</td>
          <td class="num"><b>${nf(v.views)}</b>${b.m?`<div style="width:74px;margin-left:auto">${sparkline(b.m.series,74,16)}</div>`:''}</td>
          <td class="num"><span class="badge ${b.paceRatio>=3?'b-err':b.paceRatio>=1.5?'b-ok':'b-grey'}">${b.paceRatio}×</span></td>
          <td class="num ${b.accel>1.3?'':'dim'}">${b.accel}×</td>
          <td class="num">${proj?`<b style="color:var(--acc)">${nf(proj)}</b><div class="dim" style="font-size:9px">estimate</div>`:'<span class="dim">—</span>'}</td>
          <td class="num dim">${v.ageDays}d</td>
          <td class="actcell">${videoActs(v)}</td></tr>`;}).join('')}
      </tbody></table></div>`)
    : tab==='lanes'? (!openLanes.length? `<div class="pad">${emptyState('target','No open lanes found yet',
        'An open lane is a topic that performs above channel median but only 1–2 channels have covered. Track more competitors or widen the range.')}</div>`
      : `<div class="pad section-note">Topics that <b style="color:var(--t1)">perform above channel median</b> but only 1–2 channels have touched. Proven demand, little competition.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Opportunity</th><th>Best example</th><th></th></tr></thead><tbody>
        ${openLanes.map(t=>topicRow(t,`<td class="num"><span class="badge b-acc">${t.opportunity}</span></td>`)).join('')}
      </tbody></table></div>`)
    : tab==='heating'? `<div class="pad section-note">Topics taking a <b style="color:var(--t1)">rising share of uploads</b> in the last 7 days versus the prior 3 weeks — the niche is moving toward these.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
        <th class="num">Momentum</th><th>Best example</th><th></th></tr></thead><tbody>
        ${heating.map(t=>topicRow(t,`<td class="num"><span class="badge ${t.momentum>=2?'b-ok':'b-grey'}">${t.momentum}× <span class="dim">${t.recent}v/7d</span></span></td>`)).join('')}
      </tbody></table></div>`
    : (!cooling.length? `<div class="pad">${emptyState('clock','No revival candidates',
        'These are topics that performed well but nobody has published on for a while. Needs a wider range to detect.')}</div>`
      : `<div class="pad section-note">Performed well historically, but <b style="color:var(--t1)">nobody has published on them in the last 7 days</b>. Proven topics going unserved.</div>
        <div class="tbl-wrap"><table><thead><tr><th>Topic</th><th class="num">Median outlier</th><th class="num">Median views</th>
          <th class="num">Last covered</th><th>Best example</th><th></th></tr></thead><tbody>
        ${cooling.map(t=>topicRow(t,`<td class="num"><span class="badge b-grey">${t.daysOld}d ago</span></td>`)).join('')}
      </tbody></table></div>`)}
  </div>

  <div class="grid2">
    <div class="panel"><div class="phead">${ic('users')}Who is winning right now</div>
      <div class="tbl-wrap"><table><thead><tr><th>Channel</th><th class="num">Outliers</th><th class="num">Median</th>
        <th class="num">Trend</th><th class="num">Consistency</th></tr></thead><tbody>
      ${selectedChannelObjs().map(c=>{
        const g=vids.filter(v=>v.channelId===c.id); if(!g.length) return null;
        const t=channelTrend(c.id);
        const outs=g.filter(v=>v.outlier>=CFG.outlierThreshold).length;
        const vals=g.map(v=>v.views), mu=mean(vals);
        const cv = mu? Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu : 0;
        return {c,g,t,outs,cv};
      }).filter(Boolean).sort((a,b)=>b.outs-a.outs||b.g.length-a.g.length).map(({c,g,t,outs,cv})=>`
        <tr><td><div class="c1" style="max-width:170px;font-weight:600">${esc(c.title)}</div>
          <div class="dim" style="font-size:9.5px">${g.length} videos · ${nf(c.subs)} subs</div></td>
          <td class="num"><b style="color:${outs?'var(--acc)':'inherit'}">${outs}</b></td>
          <td class="num">${nf(median(g.map(v=>v.views)))}</td>
          <td class="num">${t?`<span class="badge ${t.ratio>=1.25?'b-ok':t.ratio<=0.75?'b-err':'b-grey'}">${t.ratio>=1.25?'▲':t.ratio<=0.75?'▼':'—'}${t.ratio}×</span>`:'<span class="dim">—</span>'}</td>
          <td class="num"><span class="dim" title="Lower = more predictable output">${cv<0.8?'steady':cv<2?'mixed':'spiky'}</span></td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="panel"><div class="phead">${ic('film')}Winning formats right now</div>
      <div class="pad">${(()=>{
        const bands = durationBuckets(vids).filter(b=>b.count>=3);
        const best = [...bands].sort((a,b)=>b.medOutlier-a.medOutlier);
        if(!best.length) return emptyState('film','Not enough videos','Widen the range.');
        return barList(best.map(b=>({label:b.label, value:b.medOutlier,
          sub:`${b.count} videos · median ${nf(b.medViews)} views · p90 ${nf(b.p90)}`})),{fmt:n=>n.toFixed(2)+'×'});
      })()}
      <div class="divider"></div>
      <div class="lbl">Best publish slots (median outlier, ≥3 videos)</div>
      ${(()=>{
        const slots={};
        vids.forEach(v=>{ const k=v.pubDay+' '+String(v.pubHour).padStart(2,'0')+':00';
          (slots[k]=slots[k]||[]).push(v.outlier); });
        const rows=Object.entries(slots).filter(([,a])=>a.length>=3)
          .map(([k,a])=>({label:k, value:+median(a).toFixed(2), sub:`${a.length} videos`}))
          .sort((a,b)=>b.value-a.value).slice(0,6);
        return rows.length? barList(rows,{fmt:n=>n.toFixed(2)+'×'}) : '<div class="dim" style="font-size:11px">Need more videos per slot.</div>';
      })()}</div></div>
  </div>`;
}

/* ─────────── THUMBNAIL BOARD ─────────── */
/* The board used to hard-stop at 120 cards with no way to see the rest. It now
   pages exactly like the feed, using the same per-page setting and the same
   pager control, so both views behave identically. */
const BOARD_SORTS = [['outlier','By outlier'],['views','By views'],['vpd','Views / day'],['recent','Newest']];
const BOARD_SIZES = [['sm','S'],['md','M'],['lg','L'],['xl','XL']];
const BOARD_W = {sm:150, md:210, lg:290, xl:390};
const BOARD_DEFAULT_SIZE = 'lg';
/* Views/day is the honest comparison when a 3-day-old video sits next to a
   3-month-old one: raw views reward age, and outlier score is relative to the
   channel rather than to the shelf you are choosing from. */
const boardCmp = {
  recent:  (a,b)=>b.publishedTs-a.publishedTs,
  views:   (a,b)=>b.views-a.views,
  vpd:     (a,b)=>b.vpd-a.vpd,
  outlier: (a,b)=>b.outlier-a.outlier,
};
let _boardCache=null, _boardKey='';
function boardRows(){
  const sortBy = S.filters.boardSort||'outlier';
  const key = [dataKey(), S.range, CFG.rangeFrom||'', CFG.rangeTo||'', selSig(),
    S.filters.q||'', CFG.includeShorts?1:0, CFG.minViews||0, sortBy].join('|');
  if(_boardCache && _boardKey===key) return _boardCache;
  _boardCache = [...applyQ(enrichedInRange())].sort(boardCmp[sortBy]||boardCmp.outlier);
  _boardKey = key;
  return _boardCache;
}
/* `key` parameterises which pager slot this grid uses, so the Competitor Feed can
   render the very same cards under its own paging without the two views fighting
   over S.page.board. */
function boardGrid(rows, key='board', sizeKey){
  const size = sizeKey || S.filters.boardSize||BOARD_DEFAULT_SIZE;
  const W = BOARD_W[size]||BOARD_W[BOARD_DEFAULT_SIZE];
  const per = CFG.perPage || 50;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const page = Math.min(Math.max(1, S.page[key]||1), pages);
  const shown = rows.slice((page-1)*per, page*per);
  if(!rows.length) return `<div class="panel"><div class="pad">${emptyState('film','Nothing to show','Run a sync or widen the range.')}</div></div>`;
  return `${pager(key, rows.length, per, page)}
  <div class="boardgrid" style="grid-template-columns:repeat(auto-fill,minmax(${W}px,1fr))">
    ${shown.map(v=>{
      const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';
      return `<div class="boardcard${isVsel(v.id)?' sel':''}">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardthumb">
          <img loading="lazy" decoding="async" src="${esc(thumbUrl(v,true))}" data-vid="${v.id}" data-big="1" alt="">
          ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
          ${v.isShort?'<span class="boardshort">SHORT</span>':''}
        </a>
        <div class="boardbody">
          <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardtitle" title="${esc(v.title)}">${esc(v.title)}</a>
          <div class="vmeta" style="margin-top:6px">
            <span class="badge ${oc}" title="Views versus this channel's own median">${v.outlier}×</span>
            <span class="uptime">${nf(v.views)} views</span><span class="sep">·</span>
            <span class="vpd" title="Views per day since publication">${nf(v.vpd)}/day</span><span class="sep">·</span>
            <span class="c1" title="${esc(v.channelTitle)}">${esc(v.channelTitle)}</span></div>
          <div class="vmeta"><span class="boarddate">${FMT.dmy.format(new Date(v.publishedTs))}</span><span class="sep">·</span>
            <span>${v.ageDays}d</span><span class="sep">·</span><span>${v.pubTime}</span>
            <span class="right">${videoActs(v)}</span></div>
        </div></div>`;}).join('')}
  </div>
  ${pager(key, rows.length, per, page)}`;
}
function vBoard(){
  const rows = boardRows();
  const sortBy = S.filters.boardSort||'outlier';

  const per = CFG.perPage || 50;
  const page = Math.min(Math.max(1, S.page.board||1), Math.max(1,Math.ceil(rows.length/per)));
  const shown = Math.min(per, Math.max(0, rows.length-(page-1)*per));
  return `
  <div class="panel" style="margin-bottom:14px"><div class="pad row wrapf" style="gap:10px">
    <div class="seg plain">
      ${BOARD_SORTS.map(([k,l])=>
        `<button class="${sortBy===k?'on':''}" data-boardsort="${k}">${l}</button>`).join('')}</div>
    <div class="seg plain">
      ${BOARD_SIZES.map(([k,l])=>
        `<button class="${size===k?'on':''}" data-boardsize="${k}" title="${
          k==='xl'?'3 per row':k==='lg'?'4 per row':k==='md'?'6 per row':'8 per row'}">${l}</button>`).join('')}</div>
    <div class="grow"></div>
    <span class="dim" style="font-size:11px">${nfull(shown)} of ${nfull(rows.length)} · ${rangeLabel()}</span>
    <button class="btn btn-sm btn-o" data-act="selAllShown" title="Tick every card on this page for bulk actions">${ic('sqc')}Select</button>
    <button class="btn btn-sm btn-o" data-act="starShown" title="Save every card on this page to your swipe file">${ic('star')}Star</button>
    <button class="btn btn-sm btn-o" data-act="copyThumbUrls">${ic('copy')}Copy URLs</button>
    <button class="btn btn-sm btn-o" data-export="thumbs|csv">CSV</button>
    <button class="btn btn-sm btn-o" data-export="thumbs|json">JSON</button>
    <button class="btn btn-sm btn-p" data-export="thumbs|zip">${ic('layers')}All</button>
  </div></div>
  <div id="tblhost-board">${boardGrid(rows,'board')}</div>`;
}
function repaintBoard(){
  const host = document.getElementById('tblhost-board');
  if(!host) return render();
  const size = S.filters.boardSize||BOARD_DEFAULT_SIZE, sortBy = S.filters.boardSort||'outlier';
  host.innerHTML = boardGrid(boardRows(),'board');
  document.querySelectorAll('[data-boardsize]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsize===size));
  document.querySelectorAll('[data-boardsort]').forEach(b=>
    b.classList.toggle('on', b.dataset.boardsort===sortBy));

/* ─────────── CALENDAR ─────────── */
/* The publishing schedule of the whole niche, month by month. Every other view
   answers "which video", this one answers "which DAY" — when the niche floods,
   when it goes quiet, and which dates actually earned their uploads. Pick a day
   and it drills straight into that day's uploads, or hands the whole app that
   date as its range. */
/* The day panel shows board cards, so it gets the board's own sort and size
   controls — but on its own state, not the board's. Two reasons. Sorting a
   single day is a different question from sorting the whole shelf ("Newest"
   across one day is a timeline; across six months it is a different view
   entirely), and reaching into S.filters.boardSort from here would silently
   re-sort the Thumbnail Board the next time it was opened.

   Size INHERITS from the board until the calendar is given one of its own, which
   is exactly how this panel already behaved — it read S.filters.boardSize
   directly — so nothing moves for anyone who never touches these buttons. */
/* The range at the top is the master control, and the calendar was ignoring it:
   asking the app for six months and getting a three-month grid meant three
   months of uploads simply were not on screen, with nothing to say so. The
   window now FOLLOWS the range — six months of range draws six months of
   calendar — and the window buttons still narrow it, with that choice remembered
   against the range it was made for. Switch range and the calendar re-fits;
   switch back and your narrower window is still there.

   calMonthsFor is empty on every profile that predates this, which reads as
   "never picked one" and therefore auto-fits — which is the behaviour anyone
   hitting this wanted in the first place. */
const RANGE_MONTHS = {'1':1,'3':1,'7':1,'30':1,'90':3,'180':6,'365':12,'all':12};
const rangeSig = () => S.range==='custom'
  ? 'custom:'+(CFG.rangeFrom||'')+':'+(CFG.rangeTo||'') : String(S.range);
/* Which button lights up: the range's own length, so the calendar and the bar at
   the top always read the same. */
function calFitSel(){
  if(S.range!=='custom') return RANGE_MONTHS[S.range] || 3;
  const {from,to} = rangeBounds('custom');
  const a = new Date(from || Date.now());
  const b = new Date(isFinite(to) ? to : Date.now());
  const span = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + 1;
  return CAL_WINDOWS.map(w=>w[0]).find(n=>n>=span) || 12;
}
const calWindowSel = () =>
  CFG.calMonthsFor===rangeSig() ? (CFG.calMonths || calFitSel()) : calFitSel();
/* How many months of grid to actually draw. Months, unlike ranges, do not divide
   evenly: 180 days back from today lands in the middle of a month, so a six-month
   range genuinely covers seven calendar months and drawing only six clips the
   oldest one — the same "my uploads are not on the calendar" bug in miniature.
   An auto-fitted window therefore stretches to cover every month the range
   reaches. A window you picked by hand means exactly what you picked. */
function calDataSpan(idx){
  if(!idx || !idx.size) return 1;
  const keys=[...idx.keys()].sort();
  const a=keys[0], b=keys[keys.length-1];
  return (+b.slice(0,4)-+a.slice(0,4))*12 + (+b.slice(5,7)-+a.slice(5,7)) + 1;
}
/* No ceiling on the auto fit. Lifetime means lifetime: capping it at twelve
   months was the same silent truncation, just further out — a profile with two
   years of scraped history simply lost the older half with nothing on screen to
   say so. The grid only ever spans as far as there is data, the empty tail is
   trimmed below, and anyone who finds a long calendar unwieldy has four window
   buttons that mean exactly what they say. */
const calGridMonths = (idx, sel) =>
  CFG.calMonthsFor===rangeSig() ? sel : Math.max(sel, calDataSpan(idx));
const calSortKey = () => S.filters.calSort || 'outlier';
const calSizeKey = () => S.filters.calSize || S.filters.boardSize || BOARD_DEFAULT_SIZE;
const CAL_WINDOWS = [[1,'1 month'],[3,'3 months'],[6,'6 months'],[12,'12 months']];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayTs = k => +new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10));
function vCalendar(){
  if(!CFG.ytKey) return setupCard();
  const idx = calendarIndex();
  const M = calMetric();
  const winSel = calWindowSel();
  const months = calGridMonths(idx, winSel);
  /* The summary is a function of what is ON SCREEN, so it is built after the
     window is known rather than before it. Reading the whole index here was the
     bug: narrowing to one month left the chips describing days from months you
     could no longer see — and clicking one selected a day that was not in the
     grid. It also never moved when you changed metric, which made the entire
     control row look dead. */
  const controls = headline => `
  <div class="panel" style="margin-bottom:14px"><div class="pad row wrapf" style="gap:10px">
    <div class="seg plain">${CAL_WINDOWS.map(([n,l])=>
      `<button class="${winSel===n?'on':''}" data-calmonths="${n}">${l}</button>`).join('')}</div>
    <div class="seg plain">${CAL_METRICS.map(m=>
      `<button class="${M.k===m.k?'on':''}" data-calmetric="${m.k}" title="Show ${m.word} on every day">${m.l}</button>`).join('')}</div>
    <div class="grow"></div>
    ${headline}
  </div></div>`;

  if(!idx.size) return controls('') + `<div class="panel"><div class="pad">${emptyState('cal',
    'No uploads land in this range','Widen the date range above, clear the channel filter, or run a sync. The calendar only ever shows what the rest of the app is showing.')}</div></div>`;

  const keys = [...idx.keys()].sort();
  const newest = keys[keys.length-1];
  const anchor = new Date(+newest.slice(0,4), +newest.slice(5,7)-1, 1);
  const grid = [];
  for(let i=0;i<months;i++) grid.push(new Date(anchor.getFullYear(), anchor.getMonth()-i, 1));
  /* Drop empty months off the far end. A 12-month window on a profile holding
     two months of uploads used to draw ten blank grids, which reads as broken
     rather than as "there is nothing there". Only the tail is trimmed: a quiet
     month BETWEEN two busy ones is the signal this whole view exists to show. */
  const withData = new Set([...idx.keys()].map(k=>k.slice(0,7)));
  const moKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  while(grid.length>1 && !withData.has(moKey(grid[grid.length-1]))) grid.pop();

  /* Colour scale spans only the months actually on screen, so narrowing to one
     month re-reads that month at full contrast instead of against a year's peak. */
  const lo = +new Date(grid[grid.length-1].getFullYear(), grid[grid.length-1].getMonth(), 1);
  const hi = +new Date(anchor.getFullYear(), anchor.getMonth()+1, 0, 23, 59, 59);
  const win = [];
  idx.forEach(d=>{ const t = dayTs(d.k); if(t>=lo && t<=hi) win.push(d); });
  const max = Math.max(...win.map(d=>M.get(d)||0), 1);
  const todayK = dayKey(Date.now());

  /* Order matters here. Clicking a day is the whole point of the view, so what
     that day published sits immediately under the grid you clicked in — not
     three analysis panels further down where you have to go looking for it. The
     analysis describes the whole window rather than the selected day, so it
     reads perfectly well underneath. */
  return `${controls(calHeadline(win, M))}
  <div class="calgrid" style="margin-bottom:14px">
    ${grid.map(mo=>calMonth(mo, idx, M, max, todayK)).join('')}
  </div>
  ${calDayPanel(idx)}
  ${calWeekdayStrip(win)}
  ${calInsights(win, months)}`;
}
/* ─── What the schedule is actually telling you to publish ───
   The grid above answers "when did they post". These three answer "so what",
   which is the only reason to look at a publishing calendar at all:

     SATURATION  does a day the whole niche floods perform worse than a quiet
                 one? This is the single most actionable thing in the view — if
                 crowded days underperform, the calendar just told you which
                 dates to aim at.
     VOLUME      week-by-week output across the months shown, so you can see the
                 niche accelerating or going off the boil before the numbers do.
     WINDOWS     the best weekday-and-hour pockets by median outlier, which is
                 the resolution you actually schedule an upload at.

   All three read the day index that is already built and memoised for the grid,
   so the whole block costs one pass over the days on screen. */
function calInsights(win, months){
  if(win.length < 10) return '';
  const vids = [];
  for(const d of win) vids.push(...d.vids);
  if(vids.length < 40) return '';

  // ── saturation: group DAYS by how many uploads landed on them ──
  const BANDS = [[1,2,'1–2 uploads'],[3,5,'3–5'],[6,9,'6–9'],[10,14,'10–14'],[15,Infinity,'15+']];
  const bands = BANDS.map(([lo,hi,label])=>{
    const days = win.filter(d=>d.n>=lo && d.n<=hi);
    const outs = days.flatMap(d=>d.outs);
    return {label, days:days.length, videos:outs.length,
      med: outs.length? +median(outs).toFixed(2) : 0,
      medViews: days.length? Math.round(median(days.flatMap(d=>d.vids.map(v=>v.views)))) : 0};
  }).filter(b=>b.days>=2 && b.videos>=5);
  let verdict = '';
  if(bands.length>=2){
    const best = bands.reduce((a,b)=>b.med>a.med?b:a);
    const worst = bands.reduce((a,b)=>b.med<a.med?b:a);
    const spread = worst.med? best.med/worst.med : 1;
    verdict = spread>=1.25
      ? `Days with <b style="color:var(--t1)">${esc(best.label)}</b> outperform <b style="color:var(--t1)">${esc(worst.label)}</b> days by ${spread.toFixed(2)}× on median outlier. Aim at that band.`
      : `Upload volume on a day barely moves performance here (${spread.toFixed(2)}× spread) — <b style="color:var(--t1)">what you publish matters more than when</b> in this niche.`;
  }

  /* Buckets follow the window. Weeks are the right grain for one to four
     months; past that a 14-week cap meant the 6- and 12-month views drew the
     identical chart, so a long window silently told you nothing new. */
  const byMonth = months >= 6;
  const weeks = new Map();
  for(const d of win){
    let wk;
    if(byMonth) wk = d.k.slice(0,7)+'-01';
    else { const dt = new Date(dayTs(d.k)); dt.setDate(dt.getDate()-dt.getDay()); wk = dayKey(+dt); }
    let e = weeks.get(wk);
    if(!e){ e={wk, n:0, outs:[]}; weeks.set(wk,e); }
    e.n += d.n; e.outs.push(...d.outs);
  }
  const wl = [...weeks.values()].sort((a,b)=> a.wk<b.wk?-1:1).slice(byMonth? -12 : -14);
  const half = Math.floor(wl.length/2);
  const early = wl.slice(0,half).reduce((a,w)=>a+w.n,0)/Math.max(1,half);
  const late  = wl.slice(half).reduce((a,w)=>a+w.n,0)/Math.max(1,wl.length-half);
  const trend = early? late/early : 1;

  // ── best weekday+hour pockets ──
  const cells = new Map();
  for(const v of vids){
    const k = v.pubDow+'|'+v.pubHour;
    let e = cells.get(k);
    if(!e){ e={dow:v.pubDow, hour:v.pubHour, outs:[], views:[]}; cells.set(k,e); }
    e.outs.push(v.outlier); e.views.push(v.views);
  }
  /* The floor scales with how much data is in the window. A fixed "4 uploads"
     let a single lucky cell out of 168 top the table at 10x on a catalogue where
     the average cell holds fifty — which is advice, confidently given, from
     noise. Roughly a third of an average cell, never below four. */
  const minN = Math.max(4, Math.round(vids.length/168/3));
  const pockets = [...cells.values()].filter(c=>c.outs.length>=minN)
    .map(c=>({...c, med:+median(c.outs).toFixed(2), medViews:Math.round(median(c.views)), n:c.outs.length}))
    .sort((a,b)=>b.med-a.med).slice(0,6);
  const overall = median(vids.map(v=>v.outlier))||1;

  return `<div class="grid2" style="margin-bottom:14px">
    <div class="panel"><div class="phead">${ic('layers')}Does a crowded day hurt?
      <span class="right dim" style="font-size:10px;font-weight:600">days grouped by how many uploads landed on them</span></div>
      ${bands.length<2? `<div class="pad">${emptyState('layers','Not enough days yet','Widen the month window and this fills in.')}</div>`
      : `<div class="pad">
        ${barList(bands.map(b=>({label:b.label, value:b.med,
          sub:`${b.days} day${b.days===1?'':'s'} · ${nfull(b.videos)} videos · ${nf(b.medViews)} median views`})),
          {fmt:n=>n.toFixed(2)+'×'})}
        ${verdict?`<div class="dim" style="font-size:11px;line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">${verdict}</div>`:''}
      </div>`}
    </div>
    <div class="panel"><div class="phead">${ic('chart')}Niche output, ${byMonth?'month by month':'week by week'}
      <span class="right">${trend>=1.2? '<span class="badge b-ok">▲ speeding up</span>'
        : trend<=0.8? '<span class="badge b-err">▼ slowing down</span>' : '<span class="badge b-grey">— steady</span>'}</span></div>
      <div class="pad">
        ${barList(wl.map(w=>({label:(byMonth?FMT.mon:FMT.dmy).format(new Date(dayTs(w.wk))), value:w.n,
          sub:w.outs.length? `median ${median(w.outs).toFixed(2)}× outlier` : ''})), {fmt:nfull})}
        <div class="dim" style="font-size:11px;line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
          ${byMonth?'Calendar month':'Week beginning'}, oldest first. The niche is publishing
          <b style="color:var(--t1)">${trend.toFixed(2)}×</b> as much now as it was at the start of this window${
          trend>=1.3? ' — competition is climbing, so packaging has to work harder' : trend<=0.75? ' — output is thinning out, which is when a consistent uploader takes share' : ''}.
        </div>
      </div>
    </div>
  </div>
  ${pockets.length? `<div class="panel" style="margin-bottom:14px">
    <div class="phead">${ic('clock')}Best publishing windows
      <span class="right dim" style="font-size:10px;font-weight:600">weekday + hour, local time · ${minN}+ uploads each</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Window</th><th class="num">Median outlier</th>
      <th class="num">vs niche median</th><th class="num">Median views</th><th class="num">Uploads</th></tr></thead><tbody>
      ${pockets.map(c=>{ const lift = c.med/overall;
        return `<tr><td><b style="font-size:12.5px">${DOW_SHORT[c.dow]} ${String(c.hour).padStart(2,'0')}:00</b>
          <div class="dim" style="font-size:9.5px">${String(c.hour).padStart(2,'0')}:00–${String((c.hour+1)%24).padStart(2,'0')}:00</div></td>
        <td class="num"><span class="badge ${c.med>=2?'b-ok':c.med>=1.2?'b-acc':'b-grey'}">${c.med}×</span></td>
        <td class="num ${lift>=1.2?'':'dim'}" style="${lift>=1.2?'color:var(--ok);font-weight:700':''}">${lift.toFixed(2)}×</td>
        <td class="num">${nf(c.medViews)}</td>
        <td class="num dim">${c.n}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="pad dim" style="font-size:11px;line-height:1.6;border-top:1px solid var(--line)">
      These are the hours your competitors' uploads did best in, not the hours they upload most — the
      <b style="color:var(--t1)">Analytics</b> view has the full 7×24 grid behind this.
    </div>
  </div>`:''}`;
}
/* Ranks only the days in the visible window, by the metric you actually picked,
   so both chips always point at a day you can see and both move the moment you
   change either control. */
function calHeadline(win, M){
  if(!win.length) return '';
  let top=null, best=null;
  const allOut=[];
  for(const d of win){
    if(!top || M.get(d) > M.get(top)) top = d;
    allOut.push(...d.outs);
    if(d.n>=2 && (!best || d.med>best.med)) best = d;
  }
  const overall = median(allOut)||1;
  const fmtK = k => FMT.dmy.format(new Date(dayTs(k)));
  const sameDay = top && best && top.k===best.k;
  return `<span class="row wrapf" style="gap:7px;justify-content:flex-end">
    ${top? `<button class="chip" data-calday="${top.k}"
      title="Highest ${esc(M.word)} of the ${win.length} active days on screen — click to open it">
      ${M.top} <b>${fmtK(top.k)}</b> · ${M.fmt(M.get(top))} ${esc(M.word)}</button>`:''}
    ${best && !sameDay? `<button class="chip on" data-calday="${best.k}"
      title="Highest median outlier of any day on screen with 2+ uploads — click to open it">
      Best day <b>${fmtK(best.k)}</b> · ${(best.med/overall).toFixed(2)}× median</button>`:''}
  </span>`;
}
function calMonth(mo, idx, M, max, todayK){
  const y = mo.getFullYear(), mi = mo.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const firstDow = new Date(y, mi, 1).getDay();
  const nDays = new Date(y, mi+1, 0).getDate();
  let total=0, views=0;
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<span class="calday void"></span>');
  for(let dd=1; dd<=nDays; dd++){
    const k = `${y}-${pad(mi+1)}-${pad(dd)}`;
    const d = idx.get(k);
    const isToday = k===todayK;
    if(!d){
      cells.push(`<span class="calday void ${isToday?'today':''}"><span class="dn">${dd}</span></span>`);
      continue;
    }
    total += d.n; views += d.views;
    const val = M.get(d)||0;
    /* Capped at 88%, not 100%: the tile is mixed with --panel3, which is dark in
       one theme and light in the other, so the ramp has to stop where var(--t1)
       still clears 5:1 against it on BOTH. Colour is left to CSS entirely —
       the theme button flips data-theme without re-rendering, and anything this
       function decided about text colour would be stale the moment you used it. */
    const a = clamp(val/max, .14, .88);
    const on = S.filters.calDay===k;
    cells.push(`<button class="calday has ${on?'on':''} ${isToday?'today':''}" data-calday="${k}"
      style="background:color-mix(in srgb, var(--acc) ${(a*100).toFixed(0)}%, var(--panel3))"
      title="${esc(FMT.full.format(new Date(dayTs(k))))} — ${d.n} upload${d.n===1?'':'s'} from ${d.chans} channel${d.chans===1?'':'s'} · ${nfull(d.views)} combined views · ${nf(d.medViews)} median · ${d.med}× median outlier">
      <span class="dn">${dd}</span><span class="dv">${M.fmt(val)}</span></button>`);
  }
  return `<div class="calmonth ${total?'':'blank'}">
    <div class="calhead">${ic('cal')}<span class="grow">${esc(FMT.mon.format(mo))}</span>
      <span class="dim" style="font-weight:600;font-size:10.5px">${total? `${nfull(total)} upload${total===1?'':'s'} · ${nf(views)} views` : 'no uploads'}</span></div>
    <div class="calbody">
      ${DOW_SHORT.map(d=>`<span class="caldow">${d}</span>`).join('')}
      ${cells.join('')}
    </div></div>`;
}
/* Which weekday actually earns its uploads — the same question the upload clock
   answers for hours, at the resolution you schedule at. */
function calWeekdayStrip(days){
  if(days.length<7) return '';
  const buckets = DOW_SHORT.map(()=>({n:0, views:0, outs:[]}));
  for(const d of days){
    const b = buckets[new Date(dayTs(d.k)).getDay()];
    b.n += d.n; b.views += d.views; b.outs.push(...d.outs);
  }
  const active = buckets.filter(b=>b.n>0);
  if(active.length<3) return '';
  const meds = buckets.map(b=>b.outs.length? median(b.outs) : 0);
  const bestMed = Math.max(...meds);
  return `<div class="panel" style="margin-bottom:14px">
    <div class="phead">${ic('chart')}Which weekday performs
      <span class="right dim" style="font-size:10px;font-weight:600">median outlier · uploads · median views, across the months shown</span></div>
    <div class="pad"><div class="dowbar">
      ${buckets.map((b,i)=>`<div class="dowcell ${b.n&&meds[i]===bestMed?'best':''}">
        <div class="k">${DOW_SHORT[i]}</div>
        <div class="v">${b.n? meds[i].toFixed(2)+'×' : '—'}</div>
        <div class="s">${b.n? `${nfull(b.n)} up · ${nf(Math.round(b.views/Math.max(1,b.n)))}` : 'none'}</div>
      </div>`).join('')}
    </div></div></div>`;
}
function calDayPanel(idx){
  const k = S.filters.calDay;
  /* A slim hint, not a full empty state: this sits between the grid and the
     analysis now, and a 200px "nothing here" panel in that gap would push the
     useful half of the view off screen for no information at all. */
  if(!k) return `<div class="row wrapf" style="gap:9px;padding:11px 13px;margin-bottom:14px;
      background:var(--code);border:1px dashed var(--line2);border-radius:var(--r2)">
      ${ic('cal')}<span style="font-size:11.5px" class="muted">Click any day above to see exactly what it
      published — or hand that date to the whole app as its range.</span></div>`;
  const d = idx.get(k);
  if(!d) return `<div class="row wrapf" style="gap:9px;padding:11px 13px;margin-bottom:14px;

/* A five-week strip of the same day index, for the dashboard. Cheap: the index
   is already built and memoised for the Calendar view. */
function miniCalStrip(){
  const idx = calendarIndex();
  const M = calMetric();
  const start = new Date(); start.setHours(0,0,0,0);
  const cells=[]; let max=1, any=0;
  const days=[];
  for(let i=34;i>=0;i--){
    const dt = new Date(+start - i*864e5);
    const k = dayKey(+dt);
    const d = idx.get(k);
    if(d){ max = Math.max(max, M.get(d)||0); any++; }
    days.push({dt,k,d});
  }
  if(!any) return `<div class="pad">${emptyState('cal','No uploads in the last five weeks','Widen the range or run a sync.')}</div>`;
  const todayK = dayKey(Date.now());
  for(const {dt,k,d} of days){
    if(!d){ cells.push(`<span class="calday void ${k===todayK?'today':''}"><span class="dn">${dt.getDate()}</span></span>`); continue; }
    const val = M.get(d)||0;
    const a = clamp(val/max, .14, .88);
    cells.push(`<button class="calday has ${k===todayK?'today':''}" data-calopen="${k}"
      style="background:color-mix(in srgb, var(--acc) ${(a*100).toFixed(0)}%, var(--panel3))"
      title="${esc(FMT.full.format(dt))} — ${d.n} upload${d.n===1?'':'s'} · ${nfull(d.views)} views · ${d.med}× median outlier">
      <span class="dn">${dt.getDate()}</span><span class="dv">${M.fmt(val)}</span></button>`);
  }
  return `<div class="pad"><div class="calbody" style="padding:0">
    ${DOW_SHORT.map(d=>`<span class="caldow">${d}</span>`).join('')}
    ${cells.join('')}
  </div>
  <div class="dim" style="font-size:10px;margin-top:9px">Last five weeks · number and shade = ${esc(M.word)} · click a day to open it in the calendar.</div></div>`;
}

const SWIPE_SORTS = [['saved','Recently starred'],['rating','Rating'],['outlier','Outlier'],['views','Views'],
  ['vpd','Views / day'],['drift','Gained since saved'],['published','Published'],
  ['channel','Channel'],['category','Category'],['notes','Has a note']];
const SWIPE_VIEWS = [['notes','Notes','note'],['rows','Rows','dash'],['thumbs','Thumbnails','film']];
/* ── CATEGORIES ──────────────────────────────────────────────
   A swipe file stops being useful at about thirty saves: everything is in one
   pile and the reason you kept each thing is gone. Categories are a flat list
   on the profile (so they export, import and stay per-niche), and an entry
   stores the NAME rather than an id — renaming is then a visible, explicit
   migration rather than a dangling reference, and an entry can never point at a
   category that no longer exists. */
const swipeCats = () => Array.isArray(CFG.swipeCats)? CFG.swipeCats : [];
function setSwipeCats(list){ CFG.swipeCats = list; saveCfg(); }
function catCounts(){
  const m = new Map(); let none = 0;
  for(const e of swipeList()){
    const g = e.g||'';
    if(!g){ none++; continue; }
    m.set(g, (m.get(g)||0)+1);
  }
  return {m, none};
}
/* Categorising a video that isn't saved yet saves it, under that category — the
   two are one intent, and refusing until you had starred it first is a step that
   exists only because of how the data happens to be stored. Returns how many
   were newly saved so the caller can say so. */
function assignCat(ids, cat){
  /* The restore point is taken here rather than inside setSwipe, because this
     changes the category LIST as well as the entries and the two have to be
     captured together — before either moves. */
  pushSwipeUndo(`file ${ids.length} under ${cat||'Uncategorised'}`);
  const have = swipeSet();
  const missing = ids.filter(id=>!have.has(id));
  let list = swipeList();
  if(missing.length){
    const add = missing.map(findVid).filter(Boolean).map(swipeEntry);
    if(add.length) list = [...add, ...list];
  }
  const set = new Set(ids);
  const next = list.map(e=> set.has(e.id)? {...e, g:cat} : e);
  if(cat && !swipeCats().includes(cat)) setSwipeCats([...swipeCats(), cat]);
  setSwipe(next);
  return missing.length;
}
function renameCat(from, to){
  if(!to || from===to) return;
  pushSwipeUndo(`rename ${from}`);
  setSwipe(swipeList().map(e=> e.g===from? {...e, g:to} : e));
  setSwipeCats(swipeCats().map(c=> c===from? to : c));
  if(S.filters.swipeCat===from) S.filters.swipeCat = to;
}
function deleteCat(name){
  pushSwipeUndo(`delete category ${name}`);
  setSwipe(swipeList().map(e=> e.g===name? {...e, g:''} : e));
  setSwipeCats(swipeCats().filter(c=>c!==name));
  if(S.filters.swipeCat===name) S.filters.swipeCat = null;

/* Every saved entry resolved against live data, memoised.
   swipeVisible() is asked for three times in a single render of this view — by
   vSwipe for the tiles, by swipeToolbar for the counts and by shownVideos() for
   the keyboard cursor — and each call used to re-run swipeRow() over the whole
   file, which itself calls enrich() per row. The mapping depends on exactly two
   things: what is saved (content version) and what is cached (data version), so
   it is keyed on both and rebuilt only when one of them moves. Filtering and
   sorting still run per call, because those are the cheap part and they depend
   on controls that change far more often than the data does. */
function swipeRows(){
  const k = PID()+':'+_swipeCVer+':'+dataKey();
  if(_swipeRowsC && _swipeRowsK===k) return _swipeRowsC;
  _swipeRowsC = swipeList().map(swipeRow);
  _swipeRowsK = k;
  return _swipeRowsC;
}
const SWIPE_CMP = {
  saved:     (a,b)=>b.savedAt-a.savedAt,
  outlier:   (a,b)=>b.outlier-a.outlier,
  views:     (a,b)=>b.views-a.views,
  published: (a,b)=>b.publishedTs-a.publishedTs,
  channel:   (a,b)=>(a.channelTitle||'').localeCompare(b.channelTitle||'')||b.views-a.views,
  notes:     (a,b)=>((b.note?1:0)-(a.note?1:0))||b.savedAt-a.savedAt,
  rating:    (a,b)=>(b.rating-a.rating)||b.savedAt-a.savedAt,
  category:  (a,b)=>(a.cat||'\uffff').localeCompare(b.cat||'\uffff')||b.savedAt-a.savedAt,
  vpd:       (a,b)=>b.vpd-a.vpd,
  drift:     (a,b)=>((b.views-b.savedViews)||0)-((a.views-a.savedViews)||0),
};
function swipeVisible(){
  const q = compileQuery(S.filters.q||'');
  const mv = CFG.minViews||0;
  let rows = swipeRows();
  const sel = selIds();
  if(sel){ const ss = new Set(sel); rows = rows.filter(r=>ss.has(r.channelId)); }
  const cat = S.filters.swipeCat;
  if(cat!=null) rows = rows.filter(r=>(r.cat||'')===cat);
  if(mv) rows = rows.filter(r=>r.views>=mv);
  /* `true` = search my note and my category as well as the title and channel.
     The reason you saved something is the most useful thing to be able to
     search, and it is the one thing no scraper could ever give you. */
  if(!q.empty) rows = rows.filter(r=>q.test(r,true));
  /* A column header click wins over the dropdown, so the Rows view sorts like
     every other table in the app; clearing it falls back to your chosen order. */
  if(S.sort.swipe) return sortRows(rows,'swipe');
  /* slice() first: with no filters active `rows` IS the memoised array, and
     sorting it in place would quietly reorder the cache for every other caller. */
  return rows.slice().sort(SWIPE_CMP[CFG.swipeSort] || SWIPE_CMP.saved);
}

/* One host, three renderers — and the two dense ones are the very same

   and sorts exactly like a live one. */
function swipeBody(rows){
  const view = CFG.swipeView||'notes';
  if(view==='rows')   return `<div class="panel">${videoTable(rows,'swipe')}</div>`;
  if(view==='thumbs') return boardGrid(rows,'swipe');

     which is what categories were for. The headers are grid children spanning
     every column, so the cards keep the same two-column flow and nothing about
     the ungrouped layout moves. Order follows the category list you built, with
     Uncategorised last because it is a staging area, not a shelf. */
  const by = new Map();
  for(const r of rows){ const k=r.cat||'';
    let a=by.get(k); if(!a){ a=[]; by.set(k,a); } a.push(r); }
  const order = [...swipeCats().filter(c=>by.has(c)), ...[...by.keys()].filter(c=>c && !swipeCats().includes(c)).sort()];
  if(by.has('')) order.push('');
  return `<div class="grid2">${order.map(k=>{
    const list = by.get(k)||[];
    return `<div class="swgrp">${k? catDot(k):''}
      <span class="gl">${k? esc(k) : 'Uncategorised'}</span>

}

const NOTE_PROMPTS = ['Hook:', 'Thumbnail:', 'Angle to steal:', 'Why it worked:', 'Format:', 'Do differently:'];
/* ONE prompt row for the whole view, moved next to whichever note has focus.

   elements on a 220-item file, all of them invisible, to serve the single note
   you are actually typing in. Moved on demand it is six elements, total, and

let _notePromptEl = null;
function notePromptsFor(ta){

document.addEventListener('focusin', e=>{

function noteRating(r){

function swipeCard(r){
  const oc = r.outlier>=5?'b-err':r.outlier>=CFG.outlierThreshold?'b-acc':r.outlier>=1.5?'b-ok':'b-grey';

        style="color:var(--${gained>0?'ok':'err'})">${gained>0?'+':''}${nf(gained)} since saved</span>` : '';
  return `<div class="panel swipecard${isVsel(r.id)?' sel':''}"><div class="pad">
    <div class="row" style="gap:11px;align-items:flex-start">
      ${thumbLink(r)}
      <div class="grow" style="min-width:0">
        <a href="https://youtube.com/watch?v=${r.id}" target="_blank" rel="noopener" class="tt c2">${esc(r.title)}</a>
        <div class="vmeta">
          <span class="badge ${oc}">${r.outlier}×</span>
          ${r.isShort?'<span class="tag">SHORT</span>':''}
          ${r.stale?'<span class="tag" title="No longer in the video cache — showing what was saved">SAVED COPY</span>':''}
          <b>${nf(r.views)} views</b>${drift}
        </div>
        <div class="vmeta">
          <span class="c1" style="max-width:150px">${esc(r.channelTitle||'—')}</span><span class="sep">·</span>
          <span>${r.publishedTs?FMT.dmy.format(new Date(r.publishedTs)):'—'}</span><span class="sep">·</span>
          <span>${dur(r.durationSec)}</span><span class="sep">·</span>
          <span class="dim">starred ${r.savedAt?ago(r.savedAt):'—'}</span>
          <span class="right">${videoActs(r)}</span>
        </div>
        <div class="vmeta" style="margin-top:6px">
          <button class="chip ${r.cat?'on':''}" data-swipecat="${esc(r.id)}"
            title="${r.cat?'In “'+esc(r.cat)+'” — click to move':'Put this in a category'}">${
            r.cat? catDot(r.cat)+esc(r.cat) : ic('plus')+'Category'}</button>
          <span class="right">${noteRating(r)}</span>
        </div>
      </div>
    </div>
    <textarea class="swipenote ${(r.note||'').trim()?'filled':''}" style="margin-top:10px" rows="2"
      data-swipenote="${esc(r.id)}" placeholder="Why did this catch your eye? The hook, the thumbnail move, the angle to steal…">${esc(r.note||'')}</textarea>
  </div></div>`;
}

/* ─────────── VIDEO DETAIL ─────────── */
/* The dashboard used to rank your best outliers and then give you nowhere to go
   with them — you could read that something scored 8.4× and not find out what it
   was. Every ranked row in the app now opens this. */
function showVideo(id){
  const v = findVid(id);
  if(!v){ toast('That video is not in this profile\'s cache any more','warn'); return; }
  const m = momentumOf(v.id);
  const live = !v.stale;
  const b = live? breakoutScore(v) : null;
  const proj = live? projectViews(v) : null;
  const st = isStarred(v.id);
  const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';
  const kv = (k,val,tip)=>`<div class="kv"><span class="muted"${tip?` title="${esc(tip)}"`:''}>${k}</span><b>${val}</b></div>`;
  const anat = live? [
    v.tHasNumber&&'number', v.tHasQuestion&&'question', v.tHasExclaim&&'exclaim',
    v.tHasParen&&'parenthetical', v.tHasColon&&'colon', v.tHasDash&&'dash',
    v.tHasQuote&&'quoted', v.tHasEmoji&&'emoji', v.tCapsWords>0&&`${v.tCapsWords} CAPS word${v.tCapsWords===1?'':'s'}`
  ].filter(Boolean) : [];
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:720px">
    <div class="mhead">${ic('film')}<span class="grow c1">${esc(v.title)}</span>
      <button class="ib" data-close="1">${ic('x')}</button></div>
    <div class="mbody">
      <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" class="boardthumb vhero"
         style="border-radius:var(--r3);border:1px solid var(--line)">
        <img loading="lazy" decoding="async" src="${esc(v.thumbHi||v.thumb||thumbUrl(v,true))}" data-vid="${v.id}" data-big="1" alt="">
        ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
        ${v.isShort?'<span class="boardshort">SHORT</span>':''}
      </a>
      <div class="row wrapf" style="gap:6px">
        <span class="badge ${oc}">${v.outlier}× channel median</span>
        ${b&&b.score>1.2?`<span class="badge b-warn">BREAKING OUT · ${b.paceRatio}× pace</span>`:''}
        ${m&&m.accel>1.4?'<span class="badge b-warn">ACCELERATING</span>':''}
        ${v.stale?'<span class="badge b-grey">SAVED COPY — no longer cached</span>':''}
        <span class="tag">${esc(v.channelTitle||'—')}</span>
        ${v.publishedTs?`<span class="tag">${esc(FMT.full.format(new Date(v.publishedTs)))}</span>`:''}
      </div>
      <div class="grid2" style="gap:14px">
        <div>
          ${kv('Views', nfull(v.views))}
          ${live? kv('Views / day', nfull(v.vpd), 'Average since publication') : ''}
          ${live? kv('Channel median', nfull(v.channelMedian)+' <span class="dim" style="font-weight:600">('+esc(v.baselineKind)+')</span>', 'The baseline this outlier score is measured against') : ''}
          ${kv('Likes', nfull(v.likes))}
          ${kv('Comments', nfull(v.comments))}
          ${live? kv('Engagement', v.engage+'%') : ''}
        </div>
        <div>
          ${kv('Length', dur(v.durationSec))}
          ${kv('Age', v.ageDays+' days')}
          ${live? kv('Published', esc(v.pubDay+' '+v.pubTime), 'Local time — the same clock the Analytics timing charts use') : ''}
          ${live&&v.gapDays!=null? kv('Days since their previous upload', v.gapDays) : ''}
          ${live? kv('Views per subscriber', v.subRatio) : ''}
          ${proj? kv('Projected 30d', '<span style="color:var(--acc)">'+nf(proj)+'</span>', 'Fitted from your own snapshots, with a decay tail. An estimate, not an API figure.') : ''}
        </div>
      </div>
      ${m&&m.series.length>1? `<div>
        <div class="lbl">Growth curve · ${m.series.length} daily snapshots</div>
        ${sparkline(m.series, 640, 60)}
        <div class="row wrapf" style="gap:7px;margin-top:8px">
          <span class="chip">Last cycle <b>+${nf(m.gain)}</b></span>
          ${m.accel?`<span class="chip ${m.accel>1.4?'on':''}">Acceleration <b>${m.accel}×</b></span>`:''}
        </div></div>`
      : `<div class="row" style="gap:9px;padding:11px 13px;background:var(--code);border-radius:var(--r2);border:1px dashed var(--line2)">
          ${ic('info')}<span style="font-size:11.5px" class="muted">No growth curve yet — that needs two days of snapshots on this video. Sync daily and it fills in.</span></div>`}
      ${anat.length? `<div><div class="lbl">Title anatomy</div>
        <div class="row wrapf" style="gap:6px">${anat.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}
        <span class="chip">${v.titleWords} words</span><span class="chip">${v.titleLen} chars</span></div></div>`:''}
      ${(starOf(v.id)||{}).n? `<div><div class="lbl">Your note</div>
        <div style="font-size:12px;line-height:1.65;background:var(--panel2);border:1px solid var(--line);
          border-left:3px solid var(--acc);border-radius:var(--r2);padding:10px 12px;white-space:pre-wrap">${esc(starOf(v.id).n)}</div></div>`:''}
      ${live? relatedPanel(v) : ''}
    </div>
    <div class="mfoot">
      <a class="btn btn-p btn-sm" href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${ic('ext')}Watch on YouTube</a>
      <button class="btn btn-sm btn-o" data-vstar="${esc(v.id)}" data-modalstar="1">${ic('star')}${st?'In swipe file':'Star it'}</button>
      <span class="row" style="gap:6px;padding:0 3px"
        title="Rate it 1\u20133 \u2014 this saves it to your swipe file if it isn't there yet">
        <span class="dim" style="font-size:9px;font-weight:800;letter-spacing:.5px">RATE</span>
        ${noteRating({id:v.id, rating:qRating(v)})}</span>
      <button class="btn btn-sm btn-o" data-swipecat="${esc(v.id)}" data-catfrom="${esc(v.id)}"
        title="File this under a swipe-file category${st?'':' — this saves it too'}">${ic('layers')}${
        (starOf(v.id)||{}).g ? esc((starOf(v.id)||{}).g) : 'Category'}</button>
      <button class="btn btn-sm btn-o" data-vcopy="${esc(v.id)}">${ic('copy')}Copy URL</button>
      ${v.channelId? `<button class="btn btn-sm btn-o" data-chdrill="${esc(v.channelId)}">${ic('users')}Channel teardown</button>`:''}
      <span class="grow"></span>
      <button class="btn btn-sm btn-o" data-close="1">Close</button>
    </div>
  </div></div>`;
}
/* Assigning a category is one dialog whether you came from a single card or a
   200-item selection, so there is one code path and one thing to learn. */
function showCatPicker(ids, back){
  if(!ids.length){ toast('Nothing selected','warn'); return; }
  const cats = swipeCats();
  const cur = ids.length===1 ? (starOf(ids[0])||{}).g||'' : null;
  const unsaved = ids.filter(id=>!isStarred(id)).length;
  const bk = back? ` data-catback="${esc(back)}"` : '';
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:440px">
    <div class="mhead">${ic('layers')}<span class="grow">${ids.length===1?'Category':`Category for ${nfull(ids.length)} videos`}</span>
      <button class="ib" data-close="1">${ic('x')}</button></div>
    <div class="mbody" style="gap:10px">
      ${unsaved? `<div class="row" style="gap:8px;padding:9px 11px;background:var(--acc-soft);border-radius:var(--r2)">
        <span style="color:var(--warn)">${ic('star')}</span><span style="font-size:11.5px">${
        unsaved===ids.length? (ids.length===1?'This video isn\'t in your swipe file yet — picking a category saves it.'
          :`None of these ${ids.length} are saved yet — picking a category saves them all.`)
        : `${unsaved} of these aren't saved yet — picking a category saves them too.`}</span></div>`:''}
      ${cats.length? `<div class="col" style="gap:5px">
        ${cats.map(c=>`<button class="btn ${cur===c?'btn-p':'btn-o'}" style="justify-content:flex-start"
          data-catset="${esc(c)}" data-ids="${esc(ids.join(','))}"${bk}>${catDot(c)}${esc(c)}
          <span class="dim right" style="font-size:10px">${nfull(catCounts().m.get(c)||0)}</span></button>`).join('')}
      </div>` : `<div class="dim" style="font-size:11.5px">No categories yet — name one below.</div>`}
      <button class="btn btn-o" style="justify-content:flex-start" data-catset="" data-ids="${esc(ids.join(','))}"${bk}>
        ${ic('x')}Uncategorised</button>
      <div>
        <label class="lbl">New category</label>
        <div class="row" style="gap:7px">
          <input class="field" id="newCatName" placeholder="Hooks worth stealing" maxlength="40">
          <button class="btn btn-p" data-catnew="1" data-ids="${esc(ids.join(','))}"${bk}>${ic('plus')}Create</button>
        </div>
      </div>
    </div>
  </div></div>`;
  const el = document.getElementById('newCatName');
  if(el) el.focus();
}
function applyCat(ids, cat, back, isNew){
  const saved = assignCat(ids, cat);
  if(back) showVideo(back); else document.getElementById('modals').innerHTML='';
  if(S.view==='swipe') renderContentOnly(); else paintAllStars();
  const where = cat? `“${cat}”` : 'Uncategorised';
  toast(saved
    ? `${isNew?'Created ':''}${where} — ${saved} newly saved to your swipe file`
    : `${isNew?'Created ':'Moved to '}${where}`, 'ok');
}

   which is how you actually tell what a winning thumbnail has in common. */

  const cols = list.length<=2? 2 : list.length<=6? 3 : 4;
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:1080px">

    <div class="mbody">
      <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(${cols>=4?200:260}px,1fr))">
        ${list.map(v=>{
          const oc = v.outlier>=5?'b-err':v.outlier>=CFG.outlierThreshold?'b-acc':v.outlier>=1.5?'b-ok':'b-grey';

            <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" style="display:block;position:relative">
              <img loading="lazy" decoding="async" src="${esc(v.thumbHi||thumbUrl(v,true))}" data-vid="${v.id}" data-big="1" alt="">
              ${v.durationSec?`<span class="dur-badge">${dur(v.durationSec)}</span>`:''}
            </a>
            <div class="b">
              <div class="c2" style="font-size:11.5px;font-weight:600;line-height:1.45">${esc(v.title)}</div>
              <div class="vmeta"><span class="badge ${oc}">${v.outlier}×</span><b>${nf(v.views)}</b><span class="sep">·</span>
                <span class="c1" style="max-width:110px">${esc(v.channelTitle||'—')}</span></div>
              <div class="vmeta"><span>${v.publishedTs?FMT.dmy.format(new Date(v.publishedTs)):'—'}</span>
                <span class="right">${videoActs(v)}</span></div>
            </div></div>`;}).join('')}
      </div>
      ${list.length>1? `<div class="row wrapf" style="gap:7px">
        <span class="chip">Median views <b>${nf(Math.round(median(list.map(v=>v.views))))}</b></span>
        <span class="chip">Median outlier <b>${median(list.map(v=>v.outlier)).toFixed(2)}×</b></span>

      <button class="btn btn-sm btn-o" data-act="copyCmpUrls" data-ids="${esc(list.map(v=>v.id).join(','))}">${ic('copy')}Copy thumbnail URLs</button>
      <span class="grow"></span>
      <button class="btn btn-sm btn-o" data-close="1">Close</button>
    </div>
  </div></div>`;
}

async function mineComments(){
  const pid = PID();                       // bound, like syncAll — see the note there
  const raw = document.getElementById('cmIds').value;
  S.filters.cmIds = raw;
  const ids = raw.split(/[\n,\s]+/).map(s=>s.trim()).filter(Boolean)
    .map(s=>{ const m=s.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{11})/); return m?m[1]:s; })
    .filter(s=>/^[A-Za-z0-9_-]{11}$/.test(s));
  if(!ids.length){ toast('No valid video IDs found','err'); return; }
  const pages = clamp(+document.getElementById('cmPages').value||3,1,5);
  const log=document.getElementById('cmLog'); log.classList.remove('hide'); log.innerHTML='';
  const push=(m,e)=>{ log.innerHTML += `<div class="${e?'e':''}">${esc(m)}</div>`; log.scrollTop=log.scrollHeight; };
  const all=[];
  try{
    for(const id of ids){
      let token=null,p=0,n=0;
      do{
        const par={part:'snippet',videoId:id,order:'relevance',maxResults:100};
        if(token) par.pageToken=token;
        const j = await yt('commentThreads',par,1);
        (j.items||[]).forEach(it=>{ const c=it.snippet.topLevelComment.snippet;
          all.push({videoId:id, text:(c.textDisplay||'').replace(/<[^>]+>/g,'').trim(), likes:+c.likeCount||0, author:c.authorDisplayName}); });
        n+=(j.items||[]).length; token=j.nextPageToken; p++;
        push(`${id}: page ${p} → ${n} comments`);
      } while(token && p<pages);
    }
    const seen=new Set();
    const requests = all.filter(c=>REQ_PAT.some(p=>p.test(c.text))).map(c=>{seen.add(c.text);return c;}).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const questions = all.filter(c=>!seen.has(c.text)&&c.text.includes('?')&&c.text.length>18).sort((a,b)=>b.likes-a.likes).slice(0,20);
    const freq={}; all.forEach(c=>(c.text.match(/\b[A-Z][a-zA-Z'.]+(?:\s[A-Z][a-zA-Z'.]+)?\b/g)||[]).forEach(x=>{ if(x.length>2&&!STOP.has(x.toLowerCase())) freq[x]=(freq[x]||0)+1; }));
    const entities = Object.entries(freq).filter(([,c])=>c>=3).sort((a,b)=>b[1]-a[1]).slice(0,25)
      .map(([n,c])=>({text:n, likes:c, author:c+' mentions'}));
    const reactions = [...all].sort((a,b)=>b.likes-a.likes).slice(0,20);
    const mined = {ts:Date.now(), total:all.length, videoIds:ids, data:{requests,questions,entities,reactions}};
    await idbPut('misc',{k:'comments_'+pid, v:mined});
    if(PID()===pid) S.comments = mined;    // don't write another profile's findings into this one
    push(`▸ Done — ${all.length} comments, ${requests.length} requests, ${questions.length} questions, ${entities.length} entities`);
    toast(`${all.length} comments analysed`,'ok'); render();
  }catch(e){ push('✗ '+e.message,true); toast(e.message,'err'); }
}

function buildRows(kind){

  switch(kind){
    case 'feed': case 'outliers': {
      // exports honour the active channel filter and search box exactly as shown on screen
      let rows = applyQ(vids);
      if(kind==='outliers') rows = rows.filter(v=>v.outlier>=CFG.outlierThreshold);
      return rows.sort((a,b)=>b.outlier-a.outlier).map(v=>({
        title:v.title, channel:v.channelTitle, channel_id:v.channelId,
        published_at:v.publishedAt, published_date:new Date(v.publishedTs).toISOString().slice(0,10),

        comments_per_like:v.talkRatio,
        duration:dur(v.durationSec), duration_sec:v.durationSec, is_short:v.isShort,
        title_length:v.titleLen, title_words:v.titleWords, title_has_number:v.tHasNumber,
        title_caps_words:v.tCapsWords, title_is_question:v.tHasQuestion, title_has_exclaim:v.tHasExclaim,
        title_has_parenthetical:v.tHasParen, title_has_colon:v.tHasColon, title_has_emoji:v.tHasEmoji,
        channel_subs:v.channelSubs, category_id:v.categoryId, language:v.lang,
        captions:v.caption, definition:v.definition, made_for_kids:v.madeForKids,
        tags:(v.tags||[]).join('; '), topics:(v.topics||[]).join('; '),
        video_id:v.id, url:'https://youtube.com/watch?v='+v.id,
        thumbnail:thumbUrl(v,true), description:(v.desc||'').replace(/\s+/g,' ').slice(0,300) }));
    }
    case 'channels': return selectedChannelObjs().map(c=>{ const st=channelStats(c.id,S.range); const tr=channelTrend(c.id);
      return { channel:c.title, handle:c.handle, channel_id:c.id, subscribers:c.subs,
        trend_ratio:tr?tr.ratio:'', trend_recent_median:tr?tr.recent:'', trend_prior_median:tr?tr.before:'',
        lifetime_views:c.totalViews, video_count:c.videoCount, created:c.createdAt, country:c.country,
        age_months:st.ageMonths, views_per_month:st.viewsPerMonth, views_per_sub:st.viewsPerSub,
        videos_in_range:st.count, median_views:st.medViews, mean_views:st.meanViews, best_video_views:st.maxViews,
        uploads_per_month:st.cadence, median_duration_sec:st.medDuration, median_engagement_pct:st.medEngage,
        top3_view_share:+(st.top3Share*100).toFixed(1), shorts_share_pct:+(st.shortsShare*100).toFixed(1),
        last_scraped:c.lastScraped?new Date(c.lastScraped).toISOString():'never',
        url:'https://youtube.com/channel/'+c.id }; });
    case 'momentum': { const byId=Object.fromEntries(S.videos.map(v=>[v.id,v]));
      return S.snapshots.map(s=>({ date:s.date, video_id:s.videoId, title:byId[s.videoId]?.title||'',
        channel:byId[s.videoId]?.channelTitle||'', views:s.views, likes:s.likes, comments:s.comments })); }
    case 'trending': { const t=S.trending[S.trending.length-1]; if(!t || !Array.isArray(t.videos)) return [];
      // exports mirror exactly what the Trending view is showing
      let rows = t.videos.filter(v=>(CFG.trendShorts||!v.isShort) && passesDuration(v));
      const q = compileQuery(S.filters.q||'');
      if(!q.empty) rows = rows.filter(v=>q.test(v,false));
      return rows.map(v=>({ rank:v.rank, keyword_or_category:CATS[v.cat]||v.cat,
        title:v.title, channel:v.channelTitle, channel_id:v.channelId,
        views:v.views, likes:v.likes, comments:v.comments,
        engagement_pct:v.views?+((v.likes+v.comments)/v.views*100).toFixed(2):0,
        duration:dur(v.durationSec), duration_sec:v.durationSec, duration_min:+(v.durationSec/60).toFixed(1),
        is_short:v.isShort, published_at:v.publishedAt,
        published_date:new Date(v.publishedTs).toISOString().slice(0,10),
        age_days:Math.floor((Date.now()-v.publishedTs)/864e5),
        title_length:(v.title||'').length, tags:(v.tags||[]).join('; '),
        video_id:v.id, url:'https://youtube.com/watch?v='+v.id, thumbnail:thumbUrl(v,true) })); }

    case 'compare': { const sel=selectedChannelObjs(); const allv=enrichedInRange();
      return sel.map(c=>{ const g=allv.filter(v=>v.channelId===c.id); const t=channelTrend(c.id);
        const vals=g.map(v=>v.views), mu=mean(vals);

          outliers:g.filter(v=>v.outlier>=CFG.outlierThreshold).length,
          uploads_per_month:+(g.length/months).toFixed(1),
          median_engagement_pct:+median(g.map(v=>v.engage)).toFixed(2),
          median_like_rate_pct:+median(g.map(v=>v.likeRate)).toFixed(2),
          median_duration_sec:Math.round(median(g.map(v=>v.durationSec))),
          shorts_share_pct:g.length?+(g.filter(v=>v.isShort).length/g.length*100).toFixed(1):0,
          views_per_1k_subs:c.subs?+(median(vals)/c.subs*1000).toFixed(2):0,
          trend_ratio:t?t.ratio:'', consistency:(()=>{const cv=mu?Math.sqrt(vals.reduce((a,x)=>a+(x-mu)**2,0)/vals.length)/mu:0;
            return cv<0.8?'steady':cv<2?'mixed':'spiky';})(),
          best_title:best?best.title:'', best_outlier:best?best.outlier:'',
          best_url:best?'https://youtube.com/watch?v='+best.id:'' };}); }
    case 'topics': return topicStats(vids).slice(0,300).map(t=>({
      topic:t.topic, videos:t.count, channels_covering:t.coverage,
      median_outlier:t.medOutlier, max_outlier:t.maxOutlier, median_views:t.medViews,
      uploads_last_7d:t.recent, uploads_prior_3w:t.prior, momentum:t.momentum,
      days_since_last:t.daysOld, opportunity_score:t.opportunity,
      best_title:t.best.title, best_views:t.best.views, best_outlier:t.best.outlier,
      best_url:'https://youtube.com/watch?v='+t.best.id }));
    case 'thumbs': return applyQ(vids).sort((a,b)=>b.outlier-a.outlier).slice(0,120).map((v,i)=>({
      rank:i+1, outlier_score:v.outlier, views:v.views, title:v.title, channel:v.channelTitle,
      duration:dur(v.durationSec), is_short:v.isShort, published_at:v.publishedAt,
      thumbnail_maxres:thumbUrl(v,true), thumbnail_medium:thumbUrl(v),
      url:'https://youtube.com/watch?v='+v.id }));
    case 'swipe': return swipeVisible().map(r=>({
      title:r.title, channel:r.channelTitle, channel_id:r.channelId,
      category:r.cat||'', note:(r.note||'').replace(/\s+/g,' '),
      views:r.views, views_when_starred:r.savedViews, outlier_score:r.outlier,
      outlier_when_starred:r.savedOutlier,
      views_per_day:r.vpd, engagement_pct:r.engage, likes:r.likes, comments:r.comments,
      duration:dur(r.durationSec), duration_sec:r.durationSec, is_short:r.isShort,
      published_date:r.publishedTs? new Date(r.publishedTs).toISOString().slice(0,10):'',
      age_days:r.ageDays,
      starred_at:r.savedAt? new Date(r.savedAt).toISOString():'',
      still_cached:!r.stale,
      video_id:r.id, url:'https://youtube.com/watch?v='+r.id, thumbnail:r.thumbHi||r.thumb }));
    case 'analytics': { const out=[];
      durationBuckets(vids).forEach(b=>out.push({metric:'duration_band', label:b.label, videos:b.count, median_views:b.medViews, median_outlier:b.medOutlier, p90_views:b.p90}));
      const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      dows.forEach((d,i)=>{ const g=vids.filter(v=>new Date(v.publishedTs).getDay()===i);
        out.push({metric:'weekday', label:d, videos:g.length, median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)}); });
      nGrams(vids,2).forEach(g=>out.push({metric:'title_phrase', label:g.phrase, videos:g.inTop, median_views:'', median_outlier:'', lift:g.lift, in_rest:g.inRest}));
      // hour-of-day clock
      for(let h=0;h<24;h++){ const g=vids.filter(v=>v.pubHour===h); if(!g.length) continue;
        out.push({metric:'upload_hour', label:String(h).padStart(2,'0')+':00', videos:g.length,
          median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)}); }
      // title anatomy A/B
      [['tHasNumber','has_number'],['tHasQuestion','is_question'],['tHasExclaim','has_exclaim'],
       ['tHasParen','has_parenthetical'],['tHasColon','has_colon'],['tHasEmoji','has_emoji']].forEach(([k,lab])=>{
        const w=vids.filter(v=>v[k]), o=vids.filter(v=>!v[k]);
        if(w.length<3||o.length<3) return;
        out.push({metric:'title_feature', label:lab, videos:w.length,
          median_views:Math.round(median(w.map(v=>v.views))), median_outlier:+median(w.map(v=>v.outlier)).toFixed(2),
          lift:+(median(w.map(v=>v.outlier))/(median(o.map(v=>v.outlier))||1)).toFixed(2)});
      });
      // upload gap bands
      [[0,1,'0-1d'],[1,3,'1-3d'],[3,7,'3-7d'],[7,14,'7-14d'],[14,9999,'14d+']].forEach(([a,b,lab])=>{
        const g=vids.filter(v=>v.gapDays!=null&&v.gapDays>=a&&v.gapDays<b); if(!g.length) return;
        out.push({metric:'upload_gap', label:lab, videos:g.length,
          median_views:Math.round(median(g.map(v=>v.views))), median_outlier:+median(g.map(v=>v.outlier)).toFixed(2)});
      });
      // channel momentum
      selectedChannelObjs().forEach(c=>{ const t=channelTrend(c.id); if(!t) return;
        out.push({metric:'channel_trend', label:c.title, videos:t.n, median_views:t.recent,
          median_outlier:'', lift:t.ratio, in_rest:t.before}); });
      return out; }
  }
  return [];
