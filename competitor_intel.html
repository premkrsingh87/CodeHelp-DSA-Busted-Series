const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function doExport(kind, fmt){
  const rows = buildRows(kind);
  if(!rows.length){ toast('Nothing to export in this dataset yet','warn'); return; }
  const sc = selIds();
  const ch = (sc && sc.length===1 && ['feed','outliers','thumbs','topics'].includes(kind))
    ? S.channels.find(c=>c.id===sc[0]) : null;
  const scope = ch? '-'+slug(ch.title) : (sc && sc.length>1? `-${sc.length}channels` : '');
  const base = `signal-${kind}${scope}-${S.range==='all'?'lifetime':S.range+'d'}-${todayPT()}`;
  const T = {feed:'All videos', outliers:'Outliers', channels:'Channel summary', momentum:'Momentum snapshots',
    trending:'Trending snapshot', comments:'Comment demand', analytics:'Analytics rollups',
    swipe:'Swipe file'}[kind]||kind;
  const title = ch? `${T} — ${ch.title}` : T;
  if(fmt==='csv') dl(base+'.csv', toCSV(rows), 'text/csv');
  else if(fmt==='json') dl(base+'.json', JSON.stringify(rows,null,2), 'application/json');
  else if(fmt==='txt') dl(base+'.txt', toTXT(rows, title), 'text/plain');
  else if(fmt==='md') dl(base+'.md', toMD(rows, title), 'text/markdown');
  else if(fmt==='zip') dl(base+'.zip', makeZip([
    {name:base+'.csv', content:toCSV(rows)},
    {name:base+'.json', content:JSON.stringify(rows,null,2)},
    {name:base+'.txt', content:toTXT(rows,title)},
    {name:base+'.md', content:toMD(rows,title)}]));
  toast(`Exported ${nfull(rows.length)} rows${ch?` — ${ch.title} only`:''}`,'ok');
}
function exportZip(){
  const kinds=['feed','outliers','channels','momentum','trending','comments','analytics','thumbs','topics','compare'];
  const files=[];
  const stamp = `${S.range==='all'?'lifetime':S.range+'d'}-${todayPT()}`;
  kinds.forEach(k=>{ const rows=buildRows(k); if(!rows.length) return;
    files.push({name:`${k}/${k}.csv`, content:toCSV(rows)});
    files.push({name:`${k}/${k}.json`, content:JSON.stringify(rows,null,2)});
    files.push({name:`${k}/${k}.md`, content:toMD(rows,k)});
    files.push({name:`${k}/${k}.txt`, content:toTXT(rows,k)});
  });
  files.push({name:'briefing-ideas.txt', content:briefing('ideas')});
  files.push({name:'briefing-format.txt', content:briefing('format')});
  files.push({name:'briefing-gap.txt', content:briefing('gap')});
  files.push({name:'README.txt', content:
`Signal export — ${stamp}
Range: ${rangeLabel()}
Channels: ${S.channels.length}
Videos cached: ${S.videos.length}
Snapshots: ${S.snapshots.length}
Generated: ${new Date().toString()}

Each folder holds the same dataset in csv / json / md / txt.
briefing-*.txt are ready to paste into any AI chat.`});

function briefing(kind){

  const trend = S.trending[S.trending.length-1];
  const cm = S.comments?.data;
  const head = `RANGE: ${rangeLabel()}\nCHANNELS TRACKED: ${S.channels.length}\nVIDEOS IN RANGE: ${vids.length}\nGENERATED: ${new Date().toLocaleString()}\n`;
  const outBlock = hot.map(v=>`- "${v.title}" | ${v.channelTitle} | ${nfull(v.views)} views | ${v.outlier}x channel median | ${nf(v.vpd)}/day | ${dur(v.durationSec)} | ${v.ageDays}d old`).join('\n') || '(none)';

=== OUTLIER VIDEOS ===
${outBlock}

${durationBuckets(vids).map(b=>`${b.label}: ${b.count} videos, median ${nfull(b.medViews)} views, median outlier ${b.medOutlier}x`).join('\n')}

${nGrams(vids,2).slice(0,20).map(g=>`"${g.phrase}" — ${g.inTop} winners vs ${g.inRest} others, lift ${g.lift}x`).join('\n')}

  if(kind==='gap') return `${head}
=== EVERY VIDEO PUBLISHED IN THIS RANGE, BY CHANNEL ===
${selectedChannelObjs().map(c=>{ const g=vids.filter(v=>v.channelId===c.id).sort((a,b)=>b.views-a.views);
  return `\n## ${c.title} (${nf(c.subs)} subs, median ${nf(median(g.map(v=>v.views)))} views)\n`+

${CFG.titlePatterns}

=== SIGNAL 1: OUTLIER VIDEOS (beating their channel's median) ===
${outBlock}

Best duration band: ${(durationBuckets(vids).sort((a,b)=>b.medViews-a.medViews)[0]||{}).label||'—'}
Title phrases with highest lift: ${nGrams(vids,2).slice(0,10).map(g=>g.phrase).join(', ')||'—'}

TASK:
Return a JSON array of 20 objects:

/* One brief format for "here is a pile of videos I picked out", used by the

  const line = v => `- "${v.title}" | ${v.channelTitle||'—'} | ${nfull(v.views)} views | ${v.outlier}x channel median | ${dur(v.durationSec)}`

the target, not as a sample. Work out (1) what the titles have structurally in common —
promise, specificity, tension, length; (2) what the thumbnails are likely doing, inferred
from the titles and the numbers; (3) which of these formats is repeatable for me and which
depended on a one-off story; (4) ten concepts I could publish next that use the same
mechanics on different subject matter.${withNotes? ' Weigh MY NOTE lines heavily — that is why I saved each one.' : ''}
Follow these title patterns where they fit:
${CFG.titlePatterns}`;
}

/* ═══════════════════════════════════════════════════════════
   KEYBOARD CURSOR — walking a list without touching the mouse
   ───────────────────────────────────────────────────────────
   Everything in this app is a list you triage: a hundred uploads, forty
   outliers, a board of thumbnails. Triage has a shape — look, judge, act, next —
   and doing it with a mouse costs a round trip to a 23px button for every single
   decision. With a cursor it is j, f, j, j, x, g, j: hundreds of rows a minute,
   eyes never leaving the thumbnails.

   The cursor is an ID, not an index. Indices break the moment the list is
   re-sorted, re-filtered or re-paged underneath you — and every one of those
   happens constantly here. An id survives all three: if the row it points at is
   still on screen the cursor stays on it, and if it is gone the cursor lands on
   the nearest position instead of silently jumping to the top.

   Painting is a class toggle on one element, exactly like paintVsel() and for
   exactly the same reason: re-rendering to move a highlight would re-decode
   every thumbnail on screen. The ring itself is drawn with box-shadow, which
   occupies no layout, so moving down a 200-row feed triggers no reflow at all.
   ═══════════════════════════════════════════════════════════ */
/* shownVideos() is the single answer to "what is on screen, in order" — it is
   also the most expensive question in the file, because for most views it means
   filter, enrich, sort and slice the whole catalogue. It was previously asked
   once per bulk action; a keyboard cursor asks it on every keypress.

   So it is memoised with EXPLICIT invalidation rather than a computed key. The
   set of rows on screen changes only when something repaints them, and there are
   exactly five places that do. Hooking those is exact, costs nothing to check,
   and cannot go stale the way a hand-built cache key silently does when a new
   control is added. */
let _shownC = null;
function invalidateShown(){ _shownC = null; }
function shownRows(){
  if(_shownC) return _shownC;
  try{ _shownC = shownVideos() || []; }catch(e){ _shownC = []; }
  return _shownC;
}
function cursorIndex(){
  const rows = shownRows();
  if(!S.cursor) return -1;
  for(let i=0;i<rows.length;i++) if(rows[i].id===S.cursor) return i;
  return -1;
}
function cursorVideo(){
  if(!S.cursor) return null;
  const rows = shownRows();
  for(let i=0;i<rows.length;i++) if(rows[i].id===S.cursor) return rows[i];
  return findVid(S.cursor);
}
/* The element that should wear the ring. Every surface that renders a video
   emits videoActs(), so data-vsel is the one anchor guaranteed to be present —
   from there the ring goes on whichever box actually contains the row. */
const CUR_HOST = 'tr,.boardcard,.swipecard,.cmpcell';
function cursorHost(id){
  if(!id) return null;
  let el = null;
  try{ el = document.querySelector(`[data-vsel="${CSS.escape(id)}"]`); }catch(e){}
  return el? (el.closest(CUR_HOST) || el) : null;
}
function paintCursor(scroll){
  const prev = document.querySelectorAll('.kcur');
  for(const el of prev) el.classList.remove('kcur');
  const host = S.cursor? cursorHost(S.cursor) : null;
  if(host){
    host.classList.add('kcur');
    if(scroll){
      /* Only scroll when the row is genuinely off screen. scrollIntoView on
         every step would yank a row that is perfectly visible into the middle
         of the viewport, which makes walking a list feel like it is fighting
         you. The 72px lip clears the sticky table header. */
      const r = host.getBoundingClientRect();
      if(r.top < 72) window.scrollBy({top: r.top-88, behavior:'auto'});
      else if(r.bottom > innerHeight-8) window.scrollBy({top: r.bottom-innerHeight+56, behavior:'auto'});
    }
  }
  renderKbar();
}
function setCursor(id, scroll){ S.cursor = id||null; paintCursor(scroll!==false); }
function moveCursor(delta){
  const rows = shownRows();
  if(!rows.length){ toast('Nothing on screen to walk through','warn'); return; }
  let i = cursorIndex();
  if(i<0) i = delta>0? -1 : rows.length;
  const next = clamp(i+delta, 0, rows.length-1);
  setCursor(rows[next].id, true);
}
function cursorEdge(end){
  const rows = shownRows();
  if(!rows.length) return;
  setCursor(rows[end? rows.length-1 : 0].id, true);
}
/* Gmail's range-select, because picking eleven of fourteen thumbnails one click
   at a time is the single most tedious thing you can do in here. Shift+X ticks
   everything between the last anchor and the cursor. */
let _selAnchor = null;
function rangeSelect(){
  const rows = shownRows();
  const to = cursorIndex();
  if(to<0){ toast('Move the cursor with J / K first','warn'); return; }
  let from = _selAnchor!=null? rows.findIndex(r=>r.id===_selAnchor) : -1;
  if(from<0) from = to;
  const a = Math.min(from,to), b = Math.max(from,to);
  const n = addVsel(rows.slice(a,b+1).map(r=>r.id));
  _selAnchor = rows[to].id;
  toast(n? `${n} added — ${vselSet().size} selected` : 'Those were already selected', n?'ok':'info');
}
/* A one-line reminder that the keyboard is driving, and what the four keys you
   need right now are. It only appears once a cursor exists, so it never shows up
   for anyone using the mouse, and it lives in the fixed overlay lane so it can
   never reflow the grid underneath. */
function renderKbar(){
  const host = document.getElementById('kbar'); if(!host) return;
  if(!S.cursor){ if(host.firstChild) host.innerHTML=''; return; }
  const i = cursorIndex(), n = shownRows().length;
  const html = `<div class="kbar${vselSet().size?' low':''}">
    <b>${i>=0? i+1 : '—'}</b> / ${nfull(n)}
    <span class="kbd">J</span><span class="kbd">K</span> move
    <span class="kbd">F</span> star <span class="kbd">X</span> pick <span class="kbd">G</span> file
    <span class="kbd">↵</span> open <span class="kbd">?</span> all keys</div>`;
  if(host.innerHTML !== html) host.innerHTML = html;
}
/* The cursor acts on the row it is on; with nothing under it, the key falls
   through to the selection, then to nothing. That ordering is what makes the
   same keystroke read as "this one" when you are walking and "all of these" when
   you have ticked a pile. */
function cursorIds(){
  if(vselSet().size) return [...vselSet()];
  return S.cursor? [S.cursor] : [];
}
function needCursor(){
  if(S.cursor || vselSet().size) return true;
  toast('Press J to put the cursor on a row first','warn');
  return false;
}

/* ═══════════════════════════════════════════════════════════
   COMMAND PALETTE — one door to every feature
   ───────────────────────────────────────────────────────────
   The brief was that everything should have a shortcut. Forty single-key
   bindings is not a shortcut system, it is a memory test — and half of what you
   want to reach cannot have a key at all, because it is data: a specific
   channel, a swipe-file category, a date range, one of forty-four exports.

   So: a dozen keys for the things you do every minute, and one key that reaches
   everything else by name. Ctrl/⌘K, or a full stop. Type three letters of what
   you want, press Enter.

   The index is rebuilt only when the underlying data changes, the filter is a
   subsequence match with word-boundary bonuses (so "cmpch" finds "Compare
   Channels"), and only the visible forty rows are ever turned into HTML. The
   palette is not built on .modal deliberately: a palette that animates and
   re-centres as its list changes is a palette you wait for.
   ═══════════════════════════════════════════════════════════ */
let cmdOpen = false, _cmdSel = 0, _cmdRows = [], _cmdIdx = null, _cmdIdxKey = '';

function cmdIndexKey(){
  return [S.view, dataKey(), selSig(), S.range, _swipeCVer, STORE.profiles.length,
    S.channels.length, CFG.theme, CFG.density, CFG.textSize, CFG.includeShorts?1:0,
    CFG.feedView, CFG.swipeView, CFG.perPage, S.filters.boardSize||'', S.cursor||''].join('|');
}
function cmdIndex(){
  const k = cmdIndexKey();
  if(_cmdIdx && _cmdIdxKey===k) return _cmdIdx;
  _cmdIdx = buildCommands();
  _cmdIdxKey = k;
  return _cmdIdx;
}
function invalidateCommands(){ _cmdIdx = null; }

const EXPORT_SETS = [['feed','All videos in range'],['outliers','Outliers'],['channels','Channel summary'],
  ['momentum','Momentum snapshots'],['trending','Trending snapshot'],['comments','Comment demand'],
  ['analytics','Analytics rollups'],['compare','Channel comparison'],['topics','Topic opportunities'],
  ['thumbs','Thumbnail board'],['swipe','Swipe file']];

function buildCommands(){
  const out = [];
  const add = (g,l,i,run,s,k)=>out.push({g,l,i,run,s,k});
  const cur = cursorVideo();

  /* ── the row under the cursor, first, because it is what you are looking at ── */

/* Subsequence match with word-boundary bonuses. "cmpch" finds "Compare
   Channels", "expswipe" finds "Swipe file · CSV", and a plain word still ranks
   its exact match first. Scoring runs over the whole index on every keystroke —
   a few hundred short strings, well under a millisecond — and only the forty
   rows that survive are ever turned into HTML. */
function cmdScore(hay, q){
  const h = hay.toLowerCase();
  const exact = h.indexOf(q);
  if(exact===0) return 1000 - h.length*0.1;
  let qi=0, score=0, run=0, first=-1;
  for(let i=0;i<h.length && qi<q.length;i++){
    if(h.charCodeAt(i)===q.charCodeAt(qi)){
      if(first<0) first=i;
      const c = i? h.charCodeAt(i-1) : 32;
      const boundary = !((c>=97&&c<=122)||(c>=48&&c<=57));
      score += boundary? 12 : (run? 6 : 2);
      run++; qi++;
    } else run = 0;
  }
  if(qi<q.length) return -1;
  if(exact>0) score += 40;
  return score - h.length*0.08 - first*0.15;
}
function cmdMarks(label, q){
  if(!q) return esc(label);
  const h = label.toLowerCase();
  let qi=0, out='', open=false;
  for(let i=0;i<label.length;i++){
    const hit = qi<q.length && h.charCodeAt(i)===q.charCodeAt(qi);
    if(hit && !open){ out+='<b>'; open=true; }
    if(!hit && open){ out+='</b>'; open=false; }
    out += esc(label[i]);
    if(hit) qi++;
  }
  return out + (open?'</b>':'');
}
function cmdFilter(raw){
  const q = String(raw||'').toLowerCase().replace(/\s+/g,'');
  const items = cmdIndex();
  if(!q) return items.slice(0, 60);
  const scored = [];
  for(let i=0;i<items.length;i++){
    const it = items[i];
    let sc = cmdScore(it.l, q);
    if(sc<0){
      const alt = cmdScore(it.g+' '+it.l+' '+(it.s||''), q);
      if(alt<0) continue;
      sc = alt - 30;
    }
    scored.push({it, sc, i});
  }
  scored.sort((a,b)=> b.sc-a.sc || a.i-b.i);
  return scored.slice(0,60).map(x=>x.it);
}
function showPalette(prefill){
  cmdOpen = true; _cmdSel = 0;
  const host = document.getElementById('cmdk');
  host.innerHTML = `<div class="cmdk-bg" id="cmdkBg"><div class="cmdk">
    <div class="cmdk-in">${ic('cmd')}
      <input id="cmdkIn" placeholder="Type a command, a channel, a category, an export…"
        autocomplete="off" spellcheck="false" value="${esc(prefill||'')}">
      <span class="kbd">Esc</span></div>
    <div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-foot">
      <span><span class="kbd">↑</span><span class="kbd">↓</span> move</span>
      <span><span class="kbd">↵</span> run</span>
      <span><span class="kbd">Tab</span> fill</span>
      <span class="right">${nfull(cmdIndex().length)} commands</span>
    </div></div></div>`;
  renderPalette(prefill||'');
  const inp = document.getElementById('cmdkIn');
  inp.focus(); inp.select();
  inp.addEventListener('input', ()=>{ _cmdSel=0; renderPalette(inp.value); });
}
function closePalette(){
  cmdOpen = false;
  const host = document.getElementById('cmdk');
  if(host) host.innerHTML='';
}
function renderPalette(q){
  _cmdRows = cmdFilter(q);
  const list = document.getElementById('cmdkList'); if(!list) return;
  if(!_cmdRows.length){
    list.innerHTML = `<div class="cmdk-empty">Nothing matches “${esc(q)}”.<br>
      <span class="dim" style="font-size:10.5px">Try a channel name, a category, “export”, “sync” or “size”.</span></div>`;
    return;
  }
  const nq = String(q||'').toLowerCase().replace(/\s+/g,'');
  let html='', lastG='';
  _cmdRows.forEach((it,i)=>{
    if(it.g!==lastG){ html += `<div class="cmdk-grp">${esc(it.g)}</div>`; lastG=it.g; }
    html += `<button class="cmdk-row${i===_cmdSel?' on':''}" data-cmdrun="${i}">
      <span class="ci">${ic(it.i||'bolt')}</span>
      <span class="cl">${cmdMarks(it.l, nq)}</span>
      ${it.s? `<span class="cs">${esc(it.s)}</span>`:''}
      ${it.k? `<span class="kbd">${esc(it.k)}</span>`:''}</button>`;
  });
  list.innerHTML = html;
}
function movePalette(d){
  if(!_cmdRows.length) return;
  _cmdSel = clamp(_cmdSel+d, 0, _cmdRows.length-1);
  const rows = document.querySelectorAll('.cmdk-row');
  rows.forEach((r,i)=>r.classList.toggle('on', i===_cmdSel));
  const el = rows[_cmdSel];
  if(el) el.scrollIntoView({block:'nearest'});
}
function runPalette(i){
  const it = _cmdRows[i!=null? i : _cmdSel];
  if(!it) return;
  closePalette();
  try{ it.run(); }catch(e){ toast('That command failed: '+(e.message||e),'err'); }
}

   SMALL MOTIONS — the things the new keys actually do
   ═══════════════════════════════════════════════════════════ */
function stepRange(d){
  const keys = Object.keys(RANGES).concat('custom');
  const i = keys.indexOf(S.range);
  S.range = keys[clamp(i+d, 0, keys.length-1)];
  S.page={}; renderSideNav(); render();
}
function stepBoardSize(d){
  const order = BOARD_SIZES.map(x=>x[0]);
  const cur = (S.view==='calendar'? calSizeKey() : (S.filters.boardSize||BOARD_DEFAULT_SIZE));
  const next = order[clamp(order.indexOf(cur)+d, 0, order.length-1)];
  if(next===cur) return;
  if(S.view==='calendar'){ S.filters.calSize=next; repaintCalDay(); }
  else { S.filters.boardSize=next; if(S.view==='board') repaintBoard(); else renderContentOnly(); }
  toast(`Thumbnails · ${BOARD_SIZES.find(x=>x[0]===next)[1]}`);
}
/* Paging from the keyboard has to find whichever pager this view is using —
   the feed, the board, the swipe file and the calendar day panel all keep their
   own slot in S.page, and the key should move the one you are looking at. */
function pageKeyFor(){
  if(S.view==='swipe') return (CFG.swipeView||'notes')==='notes'? null : 'swipe';
  if(S.view==='calendar') return S.filters.calDay? 'calday' : null;
  if(TABLE_VIEWS[S.view]) return S.view;
  return null;
}
function stepPage(d){
  const key = pageKeyFor();
  if(!key){ toast('This view is not paged','info'); return; }
  const rows = (TABLE_VIEWS[key]? TABLE_VIEWS[key]().rows
    : key==='calday'? calDayVideos() : []);
  const per = CFG.perPage||50;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  const now = Math.min(Math.max(1, S.page[key]||1), pages);
  const next = clamp(now+d, 1, pages);
  if(next===now){ toast(d>0? 'Last page':'First page','info'); return; }
  S.page[key] = next;
  S.cursor = null;
  if(key==='calday') repaintCalDay();
  else if(!fastTableUpdate(key)) render();
  window.scrollTo(0,0);
  toast(`Page ${next} of ${pages}`);
}
function toggleFocus(){
  const on = document.documentElement.dataset.focus==='1';
  if(on) delete document.documentElement.dataset.focus;
  else document.documentElement.dataset.focus='1';
  invalidateCommands();
  if(!on) toast('Focus mode — press Z or Escape to bring the sidebar back');
}
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  if(innerWidth<=980){
    sb.classList.toggle('open');
    document.getElementById('scrim').classList.toggle('hide');
    return;
  }
  toggleFocus();
}
/* One key that puts a view back to neutral. Three separate controls have to be
   reset to un-hide a row you cannot find, and forgetting one of them is exactly
   how "my videos disappeared" happens. */
function resetViewFilters(){
  const had = (S.filters.q? 1:0) + (isFiltered()?1:0) + ((CFG.minViews||0)?1:0)
    + (S.filters.swipeCat!=null?1:0) + (S.filters.calDay?1:0);

  CFG.minViews=0; S.page={}; S.cursor=null; saveCfg();
  chPickOpen=false; renderSideNav(); render();
  toast(had? `Cleared ${had} filter${had===1?'':'s'} — showing everything again` : 'Nothing was filtered','ok');
}
function applyQuery(q){
  S.filters.q = q; S.page={}; S.cursor=null;
  document.getElementById('modals').innerHTML='';
  render();
  if(q) toast(`Filtered · ${q}`,'ok');

/* Export exactly what is on screen, in the order it is on screen — the rows the
   cursor is walking, not a dataset rebuilt from scratch that might be sorted
   differently. */
function shownExportRows(){
  return shownRows().map(v=>({
    title:v.title, channel:v.channelTitle, views:v.views, outlier_score:v.outlier,
    views_per_day:v.vpd, engagement_pct:v.engage, likes:v.likes, comments:v.comments,
    duration:dur(v.durationSec), duration_sec:v.durationSec, is_short:v.isShort,
    published_date:v.publishedTs? new Date(v.publishedTs).toISOString().slice(0,10):'',
    published_day:v.pubDay, published_time:v.pubTime, age_days:v.ageDays,
    starred:isStarred(v.id), category:qCat(v), rating:qRating(v)||'', note:(qNote(v)||'').replace(/\s+/g,' '),
    video_id:v.id, url:'https://youtube.com/watch?v='+v.id, thumbnail:v.thumbHi||thumbUrl(v,true) }));
}

function newCategory(){
  const name = prompt('Name the new category\n\n(e.g. "Hooks worth stealing", "Thumbnail formats", "To script")');
  if(!name || !name.trim()) return;
  const n = name.trim().slice(0,40);
  if(swipeCats().includes(n)){ toast('That category already exists','warn'); return; }
  pushSwipeUndo('new category');
  setSwipeCats([...swipeCats(), n]);
  invalidateCommands();
  if(S.view==='swipe') renderContentOnly();

/* ═══════════════════════════════════════════════════════════
   SWIPE FILE — capture, curation and pattern-finding
   ───────────────────────────────────────────────────────────
   Three things a swipe file needs once it grows past about thirty saves, none of
   which existed: a way in for things you did NOT find inside the app, a way to
   keep the numbers honest as they age, and a way to see what the pile is
   actually telling you. The rest — categories, notes, ratings, search — is
   organisation; this is what makes the organisation pay.
   ═══════════════════════════════════════════════════════════ */
/* You see the competitor's video in your own YouTube feed, on a phone, in a
   group chat. Until now the only way to get it in here was to hope it was in the
   cache. One videos.list call is one quota unit out of ten thousand, and it
   arrives carrying real statistics rather than a bare link. */

  box.addEventListener('input', upd);

function parseVideoIds(text){
  const out=[], seen=new Set();
  String(text||'').split(/[\s,;]+/).forEach(raw=>{
    const t = raw.trim(); if(!t) return;
    const m = t.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
    const id = m? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(t)? t : null);
    if(id && !seen.has(id)){ seen.add(id); out.push(id); }
  });
  return out;
}
async function addByUrl(){
  const box = document.getElementById('addUrls'); if(!box) return;
  const cat = (document.getElementById('addUrlCat')||{}).value || '';
  const ids = parseVideoIds(box.value);
  if(!ids.length){ toast('No YouTube video links or IDs found in that','warn'); return; }
  if(!CFG.ytKey){ toast('Add your YouTube API key in Settings first','err'); return; }
  const log = document.getElementById('addUrlLog');
  log.classList.remove('hide'); log.innerHTML = `<div>Fetching ${ids.length} video${ids.length===1?'':'s'}…</div>`;
  try{
    const vids = await fetchVideos(ids);
    if(!vids.length){ log.innerHTML += `<div class="e">YouTube returned nothing — the links may be private or deleted.</div>`; return; }
    /* Saved as a snapshot exactly like anything starred from the feed, so it
       behaves identically everywhere: it renders, sorts, exports and drops into
       a brief through the same code path. When the channel happens to be one you
       track, the live figures take over on the next sync with no migration. */
    const have = swipeSet();
    const fresh = vids.filter(v=>!have.has(v.id)).map(v=>{
      const e = swipeEntry({...v, outlier:0, channelTitle:v.channelTitle||'', thumbHi:v.thumbHi});
      if(cat) e.g = cat;
      return e;
    });
    if(!fresh.length){ log.innerHTML += `<div>All ${vids.length} were already in your swipe file.</div>`;
      toast('Already saved','info'); return; }
    if(cat && !swipeCats().includes(cat)) setSwipeCats([...swipeCats(), cat]);
    setSwipe([...fresh, ...swipeList()], `add ${fresh.length} by URL`);
    log.innerHTML += `<div>Saved ${fresh.length}${cat?` under “${esc(cat)}”`:''}.</div>`;
    document.getElementById('modals').innerHTML='';
    invalidateCommands();
    if(S.view==='swipe') renderContentOnly(); else paintAllStars();
    toast(`${fresh.length} saved to your swipe file`,'ok');
  }catch(e){ log.innerHTML += `<div class="e">✗ ${esc(e.message)}</div>`; toast(e.message,'err'); }
}
/* A saved entry keeps the numbers as they stood when it caught your eye, which
   is the right default — it is a record of a judgement. But once a video has
   been in the file for six months, "12K views" is a fact about last spring. This
   re-stamps every entry that is still in the cache with the current figures, so
   the saved copy of anything that later leaves the cache is a recent one rather
   than a stale one. */
function rebaseSwipe(){
  const live = _vidById();
  const list = swipeList();
  const touched = [];
  const next = list.map(e=>{
    const raw = live.get(e.id); if(!raw) return e;
    const v = enrich([raw])[0];
    if(e.v===v.views && e.o===v.outlier && e.t===v.title) return e;
    touched.push(e.id);
    return {...e, t:v.title, c:v.channelTitle||e.c, ci:v.channelId||e.ci,
      th:thumbUrl(v,true), v:+v.views||0, o:+v.outlier||0, du:+v.durationSec||0, s:v.isShort?1:0};
  });
  if(!touched.length){ toast('Every saved copy already matches the cache','info'); return; }
  setSwipe(next, `re-baseline ${touched.length}`);
  if(S.view==='swipe') renderContentOnly();
  toast(`Refreshed the saved copy of ${touched.length} video${touched.length===1?'':'s'}`,'ok');
}
/* Markdown, because that is what a swipe file gets pasted into: a doc, a wiki, a
   notes app, a chat with a collaborator. CSV is for spreadsheets and JSON is for
   machines; neither survives being read by a person. */
function swipeMarkdown(rows){
  const byCat = new Map();
  for(const r of rows){ const k=r.cat||'Uncategorised';
    let a=byCat.get(k); if(!a){ a=[]; byCat.set(k,a); } a.push(r); }
  const keys = [...byCat.keys()].sort((a,b)=> a==='Uncategorised'?1 : b==='Uncategorised'?-1 : a.localeCompare(b));
  let o = `# Swipe file — ${activeProfile().name}\n\n_${rows.length} saved video${rows.length===1?'':'s'} · exported ${new Date().toLocaleString()}_\n`;
  for(const k of keys){
    const list = byCat.get(k);
    o += `\n## ${k} (${list.length})\n\n`;
    for(const r of list){
      o += `### [${r.title.replace(/([\[\]])/g,'\\$1')}](https://youtube.com/watch?v=${r.id})\n`;
      o += `${r.channelTitle||'—'} · ${nfull(r.views)} views · ${r.outlier}× channel median · ${dur(r.durationSec)}`;
      if(r.publishedTs) o += ` · published ${new Date(r.publishedTs).toISOString().slice(0,10)}`;
      if(r.rating) o += ` · rated ${'●'.repeat(r.rating)}${'○'.repeat(3-r.rating)}`;
      o += `\n\n![thumbnail](${r.thumbHi||r.thumb})\n`;
      if((r.note||'').trim()) o += `\n> ${r.note.trim().replace(/\n/g,'\n> ')}\n`;
      o += '\n';
    }
  }
  return o;
}
function exportSwipeMd(){
  const rows = swipeVisible();
  if(!rows.length){ toast('Nothing in your swipe file yet','warn'); return; }
  dl(`signal-swipe-${slug(activeProfile().name)}-${todayPT()}.md`, swipeMarkdown(rows), 'text/markdown');
  toast(`Exported ${rows.length} saved videos as Markdown`,'ok');
}
/* Moving saves between profiles, which is otherwise impossible: a swipe file
   lives on the profile, and realising halfway through that a video belongs in a
   different niche is completely routine. Entries are self-contained snapshots,
   so this is a pure list move with nothing to re-fetch. */
function moveSwipeTo(ids, pid){
  const target = STORE.profiles.find(p=>p.id===pid);
  if(!target || !ids.length) return 0;
  if(!target.cfg) target.cfg = {...DEF_CFG};
  const set = new Set(ids);
  const moving = swipeList().filter(e=>set.has(e.id));
  if(!moving.length) return 0;
  const existing = Array.isArray(target.cfg.swipe)? target.cfg.swipe : [];
  const have = new Set(existing.map(e=>e.id));
  const add = moving.filter(e=>!have.has(e.id));
  target.cfg.swipe = [...add, ...existing];
  /* Categories travel with them, or the move quietly loses the filing. */
  const cats = new Set(Array.isArray(target.cfg.swipeCats)? target.cfg.swipeCats : []);
  add.forEach(e=>{ if(e.g) cats.add(e.g); });
  target.cfg.swipeCats = [...cats];
  setSwipe(swipeList().filter(e=>!set.has(e.id)), `move ${moving.length} to ${target.name}`);
  clearVsel();
  return add.length;
}

/* ─── What the pile is telling you ───────────────────────────
   A swipe file is a hand-built sample of exactly one thing: work you judged
   worth stealing from. That makes it the most interesting dataset in the app —
   and until now it was the only one with no analysis on it at all. Everything
   here reuses the machinery the Analytics view already has, run over your saves
   instead of over the niche, and every line is phrased as a comparison against
   the niche so a number means something. */
function swipeInsights(rows){
  const live = rows.filter(r=>!r.stale);
  if(rows.length<4) return '';
  const niche = enrichedInRange();
  const nmed = niche.length? median(niche.map(v=>v.outlier)) : 0;
  const cell = (k,v,s)=>`<div class="c"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  const med = a => a.length? median(a) : 0;
  const durs = rows.map(r=>r.durationSec).filter(Boolean);
  const outs = rows.map(r=>+r.outlier||0).filter(Boolean);
  const shorts = rows.filter(r=>r.isShort).length;
  const words = live.map(r=>(r.title||'').trim().split(/\s+/).filter(Boolean).length);
  const chars = rows.map(r=>(r.title||'').length);
  const hours = {}; live.forEach(r=>{ if(r.pubHour!=null) hours[r.pubHour]=(hours[r.pubHour]||0)+1; });
  const topHour = Object.entries(hours).sort((a,b)=>b[1]-a[1])[0];
  const days = {}; rows.forEach(r=>{ if(r.pubDay && r.pubDay!=='—') days[r.pubDay]=(days[r.pubDay]||0)+1; });
  const topDay = Object.entries(days).sort((a,b)=>b[1]-a[1])[0];
  const chans = new Map();
  rows.forEach(r=>{ const k=r.channelTitle||'—'; chans.set(k,(chans.get(k)||0)+1); });
  const topChans = [...chans.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  /* Title ingredients, measured the same way the Analytics view measures them,
     but asking a different question: not "what wins" — "what do I keep reaching
     for". The gap between those two is the useful part. */
  const feats = [['tHasNumber','a number'],['tHasQuestion','a question'],['tHasParen','a (parenthetical)'],
    ['tHasColon','a colon'],['tHasDash','a dash'],['tHasQuote','quote marks'],['tHasEmoji','an emoji']];
  const anat = feats.map(([k,l])=>{
    const n = live.filter(r=>titleAnatomy(r.title||'')[k]).length;
    const base = niche.filter(v=>v[k]).length / Math.max(1,niche.length);
    return {l, n, share: live.length? n/live.length : 0, base};
  }).filter(x=>x.n).sort((a,b)=>b.share-a.share);
  /* Phrases you have saved more than once. Two occurrences in a hand-picked pile
     of forty is a pattern; the same two in a scraped catalogue of nine thousand
     is noise, which is why this threshold is not the one nGrams() uses. */
  const grams = {};
  live.forEach(r=>{
    const w = (r.title||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/)
      .filter(x=>x && !STOP.has(x) && x.length>2);
    for(let i=0;i+2<=w.length;i++){ const g=w.slice(i,i+2).join(' '); grams[g]=(grams[g]||0)+1; }
  });
  const phrases = Object.entries(grams).filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,14);
  const cats = catCounts().m;
  const rated = rows.filter(r=>r.rating>0).length;

  return `<div class="panel" style="margin-bottom:14px">
    <div class="phead">${ic('wand')}What your saves have in common
      <span class="right row" style="gap:6px">
        <span class="dim" style="font-size:10px;font-weight:600">${nfull(rows.length)} saved${live.length!==rows.length?` · ${live.length} still cached`:''}</span>
        <button class="btn btn-sm btn-o" data-act="toggleSwipeStats" title="Hide this panel">${ic('x')}</button>
      </span></div>
    <div class="pad" style="display:flex;flex-direction:column;gap:14px">
      <div class="swstat">
        ${cell('Median outlier', outs.length? median(outs).toFixed(2)+'×' : '—',
          nmed? `niche median ${nmed.toFixed(2)}× — you save ${(median(outs)/(nmed||1)).toFixed(1)}× that` : '')}
        ${cell('Median length', durs.length? dur(Math.round(median(durs))) : '—',
          `${shorts} short${shorts===1?'':'s'} · ${rows.length-shorts} long-form`)}
        ${cell('Median views', nf(Math.round(med(rows.map(r=>r.views)))), `${nf(rows.reduce((a,r)=>a+(r.views||0),0))} combined`)}
        ${cell('Title length', words.length? Math.round(median(words))+' words' : '—',
          chars.length? `${Math.round(median(chars))} characters` : '')}
        ${cell('Channels', nfull(chans.size), topChans.length? `most from ${esc(topChans[0][0])}` : '')}
        ${cell('Filed', nfull(rows.filter(r=>r.cat).length), `${cats.size} categor${cats.size===1?'y':'ies'} · ${rated} rated`)}
      </div>
      <div class="grid2" style="gap:14px">
        <div>
          <div class="lbl">Ingredients you keep picking</div>
          ${anat.length? barList(anat.map(a=>({label:a.l, value:+(a.share*100).toFixed(0),
            sub:`${a.n} of ${live.length} saved · ${(a.base*100).toFixed(0)}% of the niche has it`})),
            {max:100, fmt:n=>n+'%'})
          : '<div class="dim" style="font-size:11px">Not enough cached titles yet.</div>'}
        </div>
        <div>
          <div class="lbl">Phrases in two or more of your saves</div>
          ${phrases.length? `<div class="row wrapf" style="gap:6px">${phrases.map(([g,c])=>
            `<button class="chip" data-qtry="&quot;${esc(g)}&quot;" title="Search the whole app for this phrase">${esc(g)} <b>×${c}</b></button>`).join('')}</div>`
          : '<div class="dim" style="font-size:11px">Nothing repeats yet — save a few more and the pattern shows up here.</div>'}
          ${topChans.length>1? `<div class="lbl" style="margin-top:14px">Who you steal from most</div>
            ${barList(topChans.map(([n,c])=>({label:n, value:c})), {fmt:nfull})}`:''}
          ${topHour||topDay? `<div class="dim" style="font-size:11px;line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">
            The work you keep tends to go out ${topDay?`on a <b style="color:var(--t1)">${esc(topDay[0])}</b>`:''}${topDay&&topHour?' around ':''}${
            topHour?`<b style="color:var(--t1)">${String(topHour[0]).padStart(2,'0')}:00</b>`:''} — your local time, matching the Analytics clock.</div>`:''}
        </div>
      </div>
    </div></div>`;
}

/* ═══════════════════════════════════════════════════════════
   YOUTUBE REFERENCE DATA — regions and categories, from the API
   ───────────────────────────────────────────────────────────
   The region and category lists were hard-coded: 28 countries out of roughly
   250, and 14 category ids out of 32. That is fine until you are the person
   whose country is not on the list, at which point the Trending view simply
   cannot be pointed at your market.

   Both endpoints cost one unit each and change about once a decade, so they are
   fetched once, cached in IndexedDB for a month and merged into the existing
   maps rather than replacing them — every existing lookup keeps working, the
   app still runs with no key and no network, and nothing waits on either call.
   ═══════════════════════════════════════════════════════════ */
const YT_META_TTL = 30*864e5;
let _ytMetaTried = false;
async function loadYtMeta(force){
  const cached = await idbGet('misc','yt_meta').catch(()=>null);
  /* Boot only ever READS. Two quota units is nothing, but spending anything at
     all without being asked is not this app's deal with you — everywhere else,
     a call happens because you pressed something. So the automatic path applies
     whatever is already cached and stops; the network is touched only when the
     button (or the palette entry) says so. */
  if(!force){
    if(cached) applyYtMeta(cached);
    return !!cached;
  }
  if(!CFG.ytKey){ toast('Add your YouTube API key in Settings first','err'); return false; }
  _ytMetaTried = true;
  const fresh = cached && cached.at && (Date.now()-cached.at < YT_META_TTL) && cached.region===CFG.region;
  if(fresh && !force){ applyYtMeta(cached); return true; }
  try{
    const [reg, cat] = await Promise.all([
      yt('i18nRegions',{part:'snippet',hl:'en'},1),
      yt('videoCategories',{part:'snippet',regionCode:CFG.region,hl:'en'},1),
    ]);
    const regions = {}; (reg.items||[]).forEach(r=>{ if(r.snippet) regions[r.snippet.gl] = r.snippet.name; });
    const cats = {};
    (cat.items||[]).forEach(c=>{ if(c.snippet && c.snippet.assignable!==false) cats[c.id] = c.snippet.title; });
    const rec = {k:'yt_meta', at:Date.now(), region:CFG.region, regions, cats};
    await idbPut('misc', rec);
    applyYtMeta(rec);
    if(force){
      toast(`Loaded ${Object.keys(regions).length} regions and ${Object.keys(cats).length} categories`,'ok');
      render();
    }
    return true;
  }catch(e){
    if(force) toast('Could not load reference data: '+e.message,'err');
    if(cached) applyYtMeta(cached);
    return false;
  }
}
/* Merged, not replaced. REGIONS and CATS keep every key they shipped with, so a
   snapshot taken before this existed still renders its region and category names
   even if the API later stops listing one of them. */
function applyYtMeta(rec){
  if(!rec) return;
  if(rec.regions) for(const k in rec.regions) REGIONS[k] = rec.regions[k];
  if(rec.cats) for(const k in rec.cats) CATS[k] = rec.cats[k];
  invalidateCommands();
}

/* ═══════════════════════════════════════════════════════════
   RELATED — who else tried this angle, and how did it go
   ───────────────────────────────────────────────────────────
   The breakdown dialog told you a video scored 6.2× and stopped there. The next
   question is always the same one: has anyone else in this niche made this, and
   did it work for them too? That is the difference between a number and a
   decision, and the whole catalogue needed to answer it was already in memory.

   Scored on shared capitalised entities (which is what extractTopics already
   pulls out, memoised per title) plus shared content words, normalised so a long
   title cannot dominate by sheer surface area. Memoised per video id, because
   the dialog is opened and closed far more often than the catalogue changes.
   ═══════════════════════════════════════════════════════════ */
const _relCache = new Map();
function relatedVideos(v, n){
  n = n||6;
  const ck = v.id+':'+dataKey();
  const hit = _relCache.get(v.id);
  if(hit && hit.k===ck) return hit.v.slice(0,n);
  const topics = new Set(extractTopics(v.title||'').map(t=>t.toLowerCase()));
  const words = new Set((v.title||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/)
    .filter(w=>w.length>3 && !STOP.has(w)));
  const scored = [];
  for(const raw of S.videos){
    if(raw.id===v.id) continue;
    const t = raw.title||'';
    let s = 0;
    if(topics.size){
      for(const x of extractTopics(t)) if(topics.has(x.toLowerCase())) s += 3;
    }
    if(words.size){
      const w = t.toLowerCase().replace(/[^a-z0-9\s']/g,' ').split(/\s+/);
      const seen = new Set();
      for(const x of w){ if(x.length>3 && !seen.has(x) && words.has(x)){ seen.add(x); s += 1; } }
    }
    if(s>=3) scored.push({raw, s: s/Math.sqrt(Math.max(4,(t.split(/\s+/).length))) });
  }
  scored.sort((a,b)=>b.s-a.s);
  const out = enrich(scored.slice(0,12).map(x=>x.raw));
  if(_relCache.size>200) _relCache.clear();
  _relCache.set(v.id, {k:ck, v:out});
  return out.slice(0,n);
}
function relatedPanel(v){
  const rel = relatedVideos(v, 6);
  if(!rel.length) return '';
  const med = median(rel.map(r=>r.outlier));
  return `<div>
    <div class="lbl">Who else tried this angle · ${rel.length} in your cache${
      med? ` · median ${med.toFixed(2)}×` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${rel.map(r=>{
        const oc = r.outlier>=5?'b-err':r.outlier>=CFG.outlierThreshold?'b-acc':r.outlier>=1.5?'b-ok':'b-grey';
        return `<button class="row" data-vopen="${esc(r.id)}" style="gap:9px;padding:7px;background:var(--panel2);
          border-radius:var(--r2);width:100%;text-align:left" title="${esc(r.title)} — open its breakdown">
          <img class="vthumb" style="width:88px;min-width:88px" loading="lazy" decoding="async" src="${esc(thumbUrl(r))}" data-vid="${r.id}" alt="">
          <span class="grow" style="min-width:0">
            <span class="c1" style="font-size:11.5px;font-weight:600;display:block">${esc(r.title)}</span>
            <span class="vmeta"><span class="badge ${oc}">${r.outlier}×</span>
              <span class="c1">${esc(r.channelTitle)}</span><span class="sep">·</span>
              <span>${FMT.dmy.format(new Date(r.publishedTs))}</span></span>
          </span>
          <b class="num" style="font-size:12px">${nf(r.views)}</b></button>`;}).join('')}
    </div>
    <div class="dim" style="font-size:10px;margin-top:7px">Matched on shared entities and content words across everything cached in this profile — not a YouTube recommendation.</div>
  </div>`;
}

document.addEventListener('input', e=>{
  // every registered settings field persists itself as you type
  // every settings field keeps its draft as you type; none of them apply it
  if(e.target.id && DRAFT_FIELDS[e.target.id]){ scheduleAutosave(e.target.id); }
  const nid = e.target.dataset.swipenote;
  if(nid!==undefined){
    e.target.classList.toggle('filled', !!e.target.value.trim());
    queueNote(nid, e.target.value);
    return;
  }
  if(e.target.dataset.search!==undefined){
    S.filters.q=e.target.value; S.page={}; S.cursor=null; invalidateShown();
    /* Tint the border the moment the query stops being a plain word search, so
       you can see an operator took effect before the list below has redrawn. */
    e.target.classList.toggle('qon', queryIsAdvanced());
    clearTimeout(window._st);
    window._st=setTimeout(()=>{
      const c=document.getElementById('content');
      const fn = VIEW_FN[S.view];
      /* Every view that offers the box now responds to it. The six listed here
         before were the ones with a fast single-panel redraw; the others showed
         a search box that quietly did nothing until you navigated away and back.
         VIEW_FN is the same router render() uses, so there is one definition of
         "draw this view" rather than two that can drift apart. */
      if(fn){ c.innerHTML=fn();
        invalidateShown(); paintCursor(false);
        // keep focus + caret in the box so typing isn't interrupted by the redraw
        const box=[...document.querySelectorAll('[data-search]')].pop();
        if(box && document.activeElement!==box){ const val=box.value; box.focus(); box.setSelectionRange(val.length,val.length); }
      }
    },200);
  }
});

/* Keyboard shortcuts. Ignored while typing so they never eat real input. */
/* Appended, never inserted: the number keys you already have in your fingers
   must keep pointing at the same views. */
const NAV_KEYS = ['dash','feed','outliers','momentum','trending','opps','compare','board','channels','analytics',
  'calendar','swipe'];
document.addEventListener('keydown', e=>{
  const el = document.activeElement;
  const typing = el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);

  /* ── the palette owns the keyboard while it is open ──
     It has to be first, and before the "is typing" bail-out, because its own
     input IS a text box: arrows and Enter belong to the list, not to the field. */
  if(cmdOpen){
    if(e.key==='Escape'){ e.preventDefault(); closePalette(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); movePalette(1); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); movePalette(-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); runPalette(); return; }
    if(e.key==='Tab'){                         // fill the box with the highlighted row
      e.preventDefault();
      const it=_cmdRows[_cmdSel]; const inp=document.getElementById('cmdkIn');
      if(it && inp){ inp.value = it.l.replace(/\s+·.*$/,''); _cmdSel=0; renderPalette(inp.value); }
      return; }
    if(e.key==='Home'){ e.preventDefault(); _cmdSel=0; movePalette(0); return; }
    return;
  }
  /* ⌘K / Ctrl+K, above the modifier bail-out below. Every other modifier
     combination is still left entirely to the browser. */
  if((e.metaKey||e.ctrlKey) && !e.altKey && (e.key==='k'||e.key==='K')){
    e.preventDefault(); showPalette(); return;
  }
  if(e.key==='Escape'){
    if(document.getElementById('modals').innerHTML){ document.getElementById('modals').innerHTML=''; return; }
    if(typing){ el.blur(); return; }
    if(vselSet().size){ clearVsel(); return; }
    /* Then the cursor, then focus mode: Escape unwinds one layer at a time, from
       the most transient thing on screen to the most persistent. */
    if(S.cursor){ setCursor(null); return; }
    if(document.documentElement.dataset.focus==='1'){ toggleFocus(); return; }
  }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;

  /* ── walking the list ──
     Arrows are hijacked only once a cursor exists, i.e. only after you asked for
     keyboard mode with J or K. Before that they scroll the page exactly as the
     browser intends, which is what someone reaching for them actually wants. */
  if(e.key==='ArrowDown' && S.cursor){ e.preventDefault(); moveCursor(1); return; }
  if(e.key==='ArrowUp'   && S.cursor){ e.preventDefault(); moveCursor(-1); return; }
  if(e.key==='Enter' && S.cursor){ e.preventDefault(); showVideo(S.cursor); return; }

  const k = e.key.length===1? e.key.toLowerCase() : e.key;
  const shift = e.shiftKey;

  /* Shift+digit rates the row under the cursor. Read off e.code rather than
     e.key so it means the same thing on a keyboard that puts different symbols
     above the numbers. */
  if(shift && /^Digit[1-3]$/.test(e.code||'')){
    if(!S.cursor){ toast('Press J to put the cursor on a row first','warn'); return; }
    e.preventDefault();
    const n = +e.code.slice(5);
    const got = setRating(S.cursor, n);
    if(S.view==='swipe') renderContentOnly(); else paintStar(S.cursor);
    toast(got? `Rated ${got}/3` : 'Rating cleared','ok');
    return;
  }
  if(shift){
    if(k==='j'){ e.preventDefault(); cursorEdge(true); return; }
    if(k==='k'){ e.preventDefault(); cursorEdge(false); return; }
    if(k==='x'){ e.preventDefault(); rangeSelect(); return; }
    if(k==='a'){ e.preventDefault(); clearVsel(); toast('Selection cleared'); return; }
    if(k==='e'){ e.preventDefault(); copyViewCsv(); return; }
    if(k==='s'){ e.preventDefault();
      const ids = shownRows().map(v=>v.id);
      if(!ids.length){ toast('Nothing on screen to star','warn'); return; }
      const n = starMany(ids);
      if(S.view==='swipe') renderContentOnly(); else paintAllStars();
      toast(n? `${n} saved to your swipe file` : 'All of these are already saved', n?'ok':'info');
      return; }
  }

  /* ── the original bindings, unchanged ── */
  if(k==='s'){ e.preventDefault(); syncAll(); return; }
  if(k==='d'){ e.preventDefault(); syncAll({deep:true}); return; }
  if(k==='t'){ e.preventDefault(); syncTrending(); return; }
  if(k==='c'){ e.preventDefault(); nav('calendar'); return; }
  if(k==='w'){ e.preventDefault(); nav('swipe'); return; }
  if(k==='a'){ e.preventDefault();
    const ids = shownRows().map(v=>v.id);
    if(ids.length){ const n=addVsel(ids); toast(n? `${n} added — ${vselSet().size} selected`:'Everything shown is already selected', n?'ok':'info'); }
    return; }
  if(k==='/'){ e.preventDefault();
    const box=[...document.querySelectorAll('[data-search]')].pop(); if(box){ box.focus(); box.select(); } return; }
  if(k==='?'){ e.preventDefault(); showShortcuts(); return; }
  if(k==='['||k===']'){ e.preventDefault(); stepRange(k===']'?1:-1); return; }

  /* ── everything added ── */
  if(k==='.'||k===':'){ e.preventDefault(); showPalette(); return; }
  if(k==='j'){ e.preventDefault(); moveCursor(1); return; }
  if(k==='k'){ e.preventDefault(); moveCursor(-1); return; }
  if(k==='h'){ e.preventDefault(); stepPage(-1); return; }
  if(k==='l'){ e.preventDefault(); stepPage(1); return; }
  if(k==='-'||k==='_'){ e.preventDefault(); stepBoardSize(-1); return; }
  if(k==='='||k==='+'){ e.preventDefault(); stepBoardSize(1); return; }
  if(k==='z'){ e.preventDefault(); toggleFocus(); return; }
  if(k==='\\'){ e.preventDefault(); toggleSidebar(); return; }
  if(k==='r'){ e.preventDefault(); resetViewFilters(); return; }
  if(k==='u'){ e.preventDefault(); undoSwipe(); return; }
  if(k==='i'){ e.preventDefault(); toggleChSel('__invert');
    toast(`${selCount()} of ${S.channels.length} channels selected`); return; }
  if(k==='e'){ e.preventDefault(); exportShown(); return; }
  if(k==='v'){ e.preventDefault();
    const rows = selectedVideos();
    showThumbCompare(rows.length? rows : shownRows().slice(0,6)); return; }
  if(k==='b'){ e.preventDefault();
    const rows = selectedVideos();
    if(!rows.length){ toast('Tick a few with X first','warn'); return; }
    copyTxt(videoBrief(rows, `SELECTED VIDEOS (${rows.length})`)); return; }
  if(k==='m'){ e.preventDefault();
    if(S.view==='swipe'){
      const order = SWIPE_VIEWS.map(x=>x[0]);
      CFG.swipeView = order[(order.indexOf(CFG.swipeView||'notes')+1)%order.length];
      S.page.swipe=1; saveCfg(); renderContentOnly();
      toast(`Swipe file · ${SWIPE_VIEWS.find(x=>x[0]===CFG.swipeView)[1]}`);
    } else {
      CFG.feedView = CFG.feedView==='thumbs'? 'rows':'thumbs';
      S.page.feed=1; saveCfg();
      if(S.view!=='feed') nav('feed'); else renderContentOnly();
      toast(`Feed · ${CFG.feedView==='thumbs'?'thumbnails':'rows'}`);
    }
    return; }
  /* The row under the cursor. Each of these falls back to the selection when
     there is one, so the same key reads as "this one" while you are walking and
     "all of these" once you have ticked a pile. */
  if(k==='f'){ e.preventDefault();
    if(!needCursor()) return;
    const ids = cursorIds();
    if(ids.length===1){ const on = starVideo(ids[0]);
      if(S.view==='swipe') renderContentOnly(); else paintStar(ids[0]);
      toast(on? 'Saved to your swipe file':'Removed from your swipe file', on?'ok':'info');
    } else {
      const n = starMany(ids);
      if(S.view==='swipe') renderContentOnly(); else paintAllStars();
      toast(n? `${n} saved to your swipe file`:'All of these are already saved', n?'ok':'info');
    }
    renderSelBar(); return; }
  if(k==='x'){ e.preventDefault(); if(!S.cursor){ toast('Press J to put the cursor on a row first','warn'); return; }
    toggleVsel(S.cursor); return; }
  if(k==='g'){ e.preventDefault(); if(!needCursor()) return; showCatPicker(cursorIds()); return; }
  if(k==='y'){ e.preventDefault(); if(!needCursor()) return;
    const ids = cursorIds();
    copyTxt(ids.map(id=>'https://youtube.com/watch?v='+id).join('\n'));
    return; }
  if(k==='o'){ e.preventDefault(); if(!S.cursor){ toast('Press J to put the cursor on a row first','warn'); return; }
    window.open('https://youtube.com/watch?v='+S.cursor,'_blank','noopener'); return; }
  if(k==='n'){ e.preventDefault();
    if(!S.cursor){ toast('Press J to put the cursor on a row first','warn'); return; }
    /* Writing a note needs the box that holds it. In the Swipe File the card is
       already on screen; anywhere else, starring it and opening the file is the
       shortest honest path to a place to type. */
    const ta = document.querySelector(`[data-swipenote="${CSS.escape(S.cursor)}"]`);
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      ta.scrollIntoView({block:'center'}); return; }
    const id = S.cursor;
    if(!isStarred(id)) starVideo(id);
    if((CFG.swipeView||'notes')!=='notes'){ CFG.swipeView='notes'; saveCfg(); }
    S.filters.swipeCat=null; S.filters.q=''; nav('swipe');
    setTimeout(()=>{ const t=document.querySelector(`[data-swipenote="${CSS.escape(id)}"]`);
      if(t){ t.focus(); t.scrollIntoView({block:'center'}); } }, 60);
    return; }
  if(/^[1-9]$/.test(k)){ const v=NAV_KEYS[+k-1]; if(v){ e.preventDefault(); nav(v); } return; }
  if(k==='0'){ e.preventDefault(); nav('settings'); return; }
});

/* ═══════════════════════════════════════════════════════════
   WHICH CHANNELS COUNT — one answer, used everywhere
   ───────────────────────────────────────────────────────────
   The list in Settings is the single source of truth for what is being tracked.
   Cached rows for a channel you have since removed stay on disk — deleting data
   behind your back is how people lose it — but they must not reach a single
   metric.

   They used to. The header read `CFG.channels.length` while the dashboard,
   the channel picker, every median and every outlier baseline read
   `S.channels`, which is whatever happens to be cached. Remove six channels
   from the list and you get a header saying "23 channels" above a dashboard
   saying "29 CHANNELS TRACKED", with six delisted channels' videos silently
   inside every total, every median and every baseline. Two independent answers
   to the same question, and the wrong one feeding the numbers.

   Now the split happens once, at load, and everything downstream reads the
   filtered arrays. The delisted rows are kept in S.staleChannels so they can be
   reported and cleaned up deliberately, never silently.
   ═══════════════════════════════════════════════════════════ */
/* Canonical keys, so matching is a set lookup instead of re-parsing every line
   for every channel. Same rules as before — id, handle, title, title without
   spaces — just resolved once. */
function listKeySet(lines){
  const s = new Set();
  for(const l of lines){ const k = canonCh(l); if(k) s.add(k); }
  return s;
}
function channelKeys(c){
  const out = [];
  if(c.id) out.push('id:'+c.id, 'h:'+String(c.id).toLowerCase());
  if(c.handle) out.push('h:'+String(c.handle).replace(/^@/,'').toLowerCase());
  if(c.title){
    const t = String(c.title).toLowerCase();
    out.push('h:'+t, 'h:'+t.replace(/\s+/g,''));
  }
  return out;
}
function channelMatchesKeys(c, keys){ return channelKeys(c).some(k=>keys.has(k)); }
/* Kept for callers that still work line-by-line (prune, sync logging). */
function channelMatchesList(c, lines){ return channelMatchesKeys(c, listKeySet(lines)); }
/* Cached data for channels you have removed is kept, but it is excluded from
   every number and said out loud. Silence here is what made the totals wrong:
   the rows kept counting while the list said otherwise. */
function staleNotice(){
  const n = (S.staleChannels||[]).length;
  if(!n) return '';
  const names = S.staleChannels.slice(0,4).map(c=>esc(c.title||c.id)).join(', ');
  return `<div class="row wrapf" style="gap:9px;padding:10px 12px;background:rgba(245,158,11,.12);border-radius:var(--r2);margin-bottom:11px">
    ${ic('warn')}<span class="grow" style="font-size:11.5px;min-width:200px">
      <b>${n} cached channel${n===1?'':'s'} no longer on your list</b> — ${names}${n>4?` and ${n-4} more`:''}.
      Their videos are excluded from every metric. The data is still on disk until you clear it.</span>
    <button class="btn btn-sm btn-o" data-act="pruneStale">${ic('trash')}Clear cached data</button>
  </div>`;
}
/* An empty list means "nothing configured yet", not "track nothing" — blanking
   the app because a textarea is momentarily empty is the failure mode this
   whole area is being hardened against. */
function splitByList(rows){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length) return {active:rows.slice(), stale:[]};
  const keys = listKeySet(lines);
  const active=[], stale=[];
  for(const c of rows) (channelMatchesKeys(c, keys)? active : stale).push(c);
  return {active, stale};
}
/* Lowering the depth setting used to do nothing — it only ever controlled how
   far a sync reached, never what was already cached, so the counts stayed at the
   old high-water mark. This trims each channel back to its newest N videos (and
   drops the snapshots belonging to the removed ones so nothing is orphaned). */
async function trimToDepth(){
  const want = CFG.scrapeDepth;
  const byCh = new Map();
  for(const v of S.videos){
    let a = byCh.get(v.channelId);
    if(!a){ a=[]; byCh.set(v.channelId,a); }
    a.push(v);
  }
  const doomed=[];
  byCh.forEach(list=>{
    if(list.length<=want) return;
    list.sort((a,b)=>b.publishedTs-a.publishedTs);   // keep the newest
    doomed.push(...list.slice(want));
  });
  if(!doomed.length) return 0;
  const gone = new Set(doomed.map(v=>v.id));
  await idbDelete(STORES.videos, doomed.map(v=>v._k));
  const snaps = (await idbByPid(STORES.snapshots, PID())).filter(s=>gone.has(s.videoId));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return doomed.length;
}
async function applyDepthChange(){
  const want = CFG.scrapeDepth;
  const over = (()=>{ const c={}; S.videos.forEach(v=>c[v.channelId]=(c[v.channelId]||0)+1);
    return Object.values(c).reduce((n,x)=>n+Math.max(0,x-want),0); })();
  if(over){
    if(!confirm(`Lowering the depth to ${nfull(want)} will delete ${nfull(over)} older cached video${over===1?'':'s'} and their snapshots.\n\nRaising it again later would need to re-fetch them (about ${Math.ceil(want/50)*2} quota units per channel).\n\nTrim now?`)){
      return false;   // leave the cache alone; the setting still applies to future syncs
    }
    const n = await trimToDepth();
    S.page={};
    toast(`Trimmed ${nfull(n)} videos — now keeping the newest ${nfull(want)} per channel`,'ok');
  }
  return true;
}
/* Deleting cached rows because a line vanished from a textarea is a very sharp
   tool, and it used to have no handle on it. Two guards now stand in front of it:
   an empty list never triggers a mass delete (an empty box is far more often a
   render slip or an unsaved edit than a real "drop everything" instruction), and
   a prune that would take out every channel at once has to be confirmed. The
   deliberate path — Settings → Wipe this profile's data — is still one click. */
async function pruneOrphans(opts={}){
  const lines = (CFG.channels||[]).filter(Boolean);
  if(!lines.length){
    if((S.allChannels||[]).length && !opts.force){
      console.warn('[signal] refusing to prune: channel list is empty but',
        (S.allChannels||[]).length, 'channels are cached');
      return 0;
    }
    return 0;
  }
  /* Re-derive rather than trusting a cached field: prune is destructive, and it
     must never act on a stale idea of what is delisted. refilterChannels() is
     the same single algorithm the rest of the app reads, so this stays one
     definition of "orphan" — just a freshly evaluated one. */
  refilterChannels();
  const orphans = S.staleChannels||[];
  if(!orphans.length) return 0;
  const total = (S.allChannels||[]).length;
  if(orphans.length === total && total > 1 && !opts.force && !opts.silent){
    if(!confirm(`This would drop ALL ${total} cached channels and their videos.\n\nThat usually means the list got cleared by accident. Continue?`)){
      return 0;
    }
  }
  const gone = new Set(orphans.map(c=>c.id));
  const pid = PID();
  const [allVids, allSnaps] = await Promise.all([
    idbByPid(STORES.videos, pid), idbByPid(STORES.snapshots, pid),
  ]);
  const vids  = allVids.filter(v=>gone.has(v.channelId));
  const snaps = allSnaps.filter(s=>gone.has(s.channelId));
  await idbDelete(STORES.channels, orphans.map(c=>c._k));
  if(vids.length)  await idbDelete(STORES.videos,  vids.map(v=>v._k));
  if(snaps.length) await idbDelete(STORES.snapshots, snaps.map(s=>s._k));
  await loadAll();
  return orphans.length;
}
/* ═══════════════════════════════════════════════════════════
   CHANNEL LIST — parsing, clipboard, undo
   ═══════════════════════════════════════════════════════════ */
/* People paste from spreadsheets, from a notes app, from another browser tab.
   That arrives as newlines, commas, tabs, semicolons, bare URLs with tracking
   junk, and duplicates. All of it is one list, so accept all of it. */
function splitChannelText(text){
  return String(text||'')
    .replace(/\r/g,'\n')
    .split(/[\n,;\t]+|\s{2,}/)
    .map(s=>s.trim())
    .map(s=>s.replace(/^[-*•>\d.)\]\s]+/,''))   // list bullets and "1. " prefixes
    .map(s=>s.replace(/[),.;]+$/,''))
    .filter(s=>s && !s.startsWith('#'));
}
/* Dedupe on what the line actually resolves to, so "@MrBeast",
   "youtube.com/@mrbeast" and "https://www.youtube.com/@mrbeast?sub=1" all
   collapse to one entry instead of costing three quota units a sync. */
function canonCh(line){
  const p = parseChLine(line);
  if(!p) return null;
  return p.type==='id' ? 'id:'+p.value : 'h:'+p.value.replace(/^@/,'').toLowerCase();
}
function normalizeChannelLines(text){
  const raw = Array.isArray(text)? text : splitChannelText(text);
  const out=[], seen=new Set();
  for(const line of raw){
    const t = String(line).trim(); if(!t) continue;
    const key = canonCh(t); if(!key) continue;
    if(seen.has(key)) continue;
    seen.add(key); out.push(t);
  }
  return out;
}
/* Light pass used by autosave while you are still typing: keeps your lines
   exactly as written (no dedupe, no reordering) so the caret never jumps. */
function loosenChannelLines(text){
  return String(text||'').split('\n').map(s=>s.trim()).filter(Boolean);
}

/* Undo ring for the channel list specifically — it is the one field where a
   mis-click costs a re-sync, so every destructive action drops a restore point. */
let chUndoStack = [];
function pushChUndo(label){
  chUndoStack.push({list:draftLines(), label, at:Date.now()});
  if(chUndoStack.length>12) chUndoStack.shift();
}
function undoChannels(){
  const prev = chUndoStack.pop();
  if(!prev){ toast('Nothing to undo','warn'); return; }
  setDraftLines(prev.list); render();
  toast(`Undone — box back to ${prev.list.length} channel${prev.list.length===1?'':'s'}`,'ok');
}

async function readClipboard(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const t = await navigator.clipboard.readText();
      if(typeof t === 'string') return t;
    }
  }catch(e){}
  return null;   // blocked, unsupported, or the user declined — fall back to the box
}
/* mode: 'add' merges into the existing list, 'replace' swaps it out. */
async function pasteChannels(mode){
  const text = await readClipboard();
  if(text===null || !text.trim()){ pasteFallbackModal(mode); return; }
  applyPastedChannels(text, mode);
}
function applyPastedChannels(text, mode){
  const incoming = normalizeChannelLines(text);
  if(!incoming.length){ toast('Nothing in the clipboard looked like a channel','warn'); return; }
  pushChUndo('paste');
  const before = draftLines().length;
  const merged = mode==='replace' ? incoming : normalizeChannelLines([...draftLines(), ...incoming]);
  setDraftLines(merged);
  const added = merged.length - (mode==='replace'? 0 : before);
  const dupes = incoming.length - (mode==='replace'? incoming.length : added);
  render();
  toast(mode==='replace'
    ? `List replaced with ${merged.length} channel${merged.length===1?'':'s'} — press Save changes to apply`
    : `Added ${added} channel${added===1?'':'s'}${dupes>0?` · ${dupes} duplicate${dupes===1?'':'s'} skipped`:''} — press Save changes to apply`, 'ok');
}
function pasteFallbackModal(mode){
  document.getElementById('modals').innerHTML = `
  <div class="mbg"><div class="modal" style="width:560px">
    <div class="mhead">${ic('copy')}<span class="grow">Paste channels</span>
      <button class="ib" data-close="1">${ic('x')}</button></div>
    <div class="mbody">
      <div class="muted" style="font-size:11.5px;line-height:1.65">
        This browser won't hand the clipboard over automatically. Click the box and press
        <span class="kbd">Ctrl</span>+<span class="kbd">V</span> (<span class="kbd">⌘V</span> on Mac), then Add.
        Newlines, commas, tabs and full URLs all work — duplicates are dropped for you.</div>
      <textarea class="field mono" id="pasteBox" rows="10" placeholder="@mrbeast&#10;UC_x5XG1OV2P6uZZ5FSM9Ttw&#10;https://youtube.com/@veritasium"></textarea>
      <div id="pasteCount" class="dim" style="font-size:10.5px">0 channels detected</div>
    </div>
    <div class="mfoot"><span class="grow"></span>
      <button class="btn btn-o" data-close="1">Cancel</button>
      <button class="btn btn-p" data-act="pasteBoxAdd" data-pastemode="${esc(mode)}">${ic('plus')}${mode==='replace'?'Replace list':'Add to list'}</button>
    </div></div></div>`;
  const box = document.getElementById('pasteBox');
  const cnt = document.getElementById('pasteCount');
  const upd = ()=>{ const n=normalizeChannelLines(box.value).length;
    cnt.textContent = `${n} channel${n===1?'':'s'} detected`; };
  box.addEventListener('input', upd);
